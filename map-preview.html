<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨迹回忆 · 原型 V3/V6 对比</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 16px;
  }
  h1 { color: #fff; font-size: 20px; font-weight: 600; }
  .sub { color: #888; font-size: 13px; }

  /* 世界切换按钮 */
  .world-switch { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .world-btn {
    padding: 8px 16px;
    border: 2px solid #fff3;
    border-radius: 20px;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .world-btn.active {
    background: #e8a4b8;
    border-color: #e8a4b8;
    color: #fff;
  }
  .world-btn.map-btn.active {
    background: #5ba8f5;
    border-color: #5ba8f5;
  }

  /* 地图容器 */
  .map-container {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 16/9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    background: #FFF8F0;
  }
  .map-container.v6 { background: #0f2644; }
  .map-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.5s;
  }

  /* 标记 Pin */
  .pin {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.2s;
  }
  .pin:hover { transform: translate(-50%, -100%) scale(1.2); z-index: 20; }
  .pin-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .pin-label {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .pin:hover .pin-label { opacity: 1; }

  /* 三色分类 */
  .pin.cat-blue .pin-dot { background: #4a90d9; }      /* 城市与机构 */
  .pin.cat-red .pin-dot { background: #e74c3c; }      /* 祁煜剧情点 */
  .pin.cat-purple .pin-dot { background: #9b59b6; }   /* 主线战斗与遗迹 */
  .pin.cat-mine .pin-dot { background: #f39c12; }     /* 你的世界 */

  /* V6 深蓝底图适配 —— 更亮的颜色 + 白色外圈 */
  .map-container.v6 .pin.cat-blue .pin-dot   { background: #5ba8f5; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(91,168,245,0.6); }
  .map-container.v6 .pin.cat-red .pin-dot    { background: #ff6b6b; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(255,107,107,0.6); }
  .map-container.v6 .pin.cat-purple .pin-dot { background: #c388ff; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(195,136,255,0.6); }
  .map-container.v6 .pin.cat-mine .pin-dot   { background: #ffd93d; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(255,217,61,0.6); }
  .map-container.v6 .pin-label { background: rgba(10,25,50,0.92); border: 1px solid rgba(255,255,255,0.2); color: #e8f0ff; }

  .pin.active .pin-dot {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 0 rgba(231,76,60,0.5); }
    50% { box-shadow: 0 4px 10px rgba(0,0,0,0.25), 0 0 0 8px rgba(231,76,60,0); }
  }

  /* 轨迹线 SVG */
  .trail-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .trail-line {
    stroke: #e74c3c;
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 4 4;
    stroke-linecap: round;
    filter: drop-shadow(0 1px 2px rgba(231,76,60,0.3));
    animation: dash 1.5s linear infinite;
  }
  /* V6 深蓝底图轨迹线 —— 白色发光 */
  .map-container.v6 .trail-line {
    stroke: #ffffff;
    stroke-width: 1.8;
    stroke-dasharray: 5 5;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8)) drop-shadow(0 0 8px rgba(100,180,255,0.6));
  }
  @keyframes dash {
    to { stroke-dashoffset: -22; }
  }

  /* 底部控件 */
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #2a2a4e;
    border-radius: 24px;
    padding: 8px 20px;
    color: #fff;
    width: fit-content;
  }
  .bottom-bar button {
    background: #3a3a5e;
    border: none;
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-bar button:hover { background: #4a4a6e; }
  .date-label { font-size: 15px; font-weight: 600; min-width: 120px; text-align: center; }

  .legend {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: #888;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* 行程列表 */
  .trip-list {
    width: 100%;
    max-width: 1000px;
    background: #2a2a4e;
    border-radius: 16px;
    padding: 16px;
    color: #fff;
  }
  .trip-list h3 { font-size: 14px; margin-bottom: 12px; color: #aaa; }
  .trip-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #3a3a5e;
  }
  .trip-item .time { color: #e8a4b8; font-size: 12px; min-width: 90px; }
  .trip-item .route { flex: 1; font-size: 13px; }
  .trip-item .route .mode { color: #888; font-size: 11px; margin-top: 2px; }

  /* V6 深蓝底图 —— 底部控件 & 行程列表 适配 */
  body.v6-mode .bottom-bar { background: #0f2644; }
  body.v6-mode .bottom-bar button { background: #1a365e; }
  body.v6-mode .bottom-bar button:hover { background: #2a466e; }
  body.v6-mode .trip-list { background: #0f2644; }
  body.v6-mode .trip-item { background: #1a365e; }
  body.v6-mode .trip-list h3 { color: #8fa8d0; }
  body.v6-mode .legend { color: #6b8bb5; }
  body.v6-mode .popup { background: #0f2644; }
  body.v6-mode .popup h4 { color: #e8f0ff; }
  body.v6-mode .popup p { color: #8fa8d0; }
  body.v6-mode .popup .cat-blue { background: rgba(91,168,245,0.15); color: #5ba8f5; }
  body.v6-mode .popup .cat-red { background: rgba(255,107,107,0.15); color: #ff6b6b; }
  body.v6-mode .popup .cat-purple { background: rgba(195,136,255,0.15); color: #c388ff; }
  .popup {
    position: absolute;
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 100;
    min-width: 160px;
    font-size: 13px;
    transform: translate(-50%, -110%);
    pointer-events: auto;
  }
  .popup h4 { color: #333; margin-bottom: 4px; font-size: 14px; }
  .popup .cat-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 10px;
    margin-bottom: 4px;
  }
  .popup .cat-blue { background: #e8f0fb; color: #4a90d9; }
  .popup .cat-red { background: #fde8e8; color: #e74c3c; }
  .popup .cat-purple { background: #f0e8f7; color: #9b59b6; }
  .popup p { color: #666; font-size: 12px; }
  .popup::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #fff;
    border-bottom: 0;
  }
</style>
</head>
<body>
  <h1>🗺️ 轨迹回忆 · V3 vs V6 对比</h1>
  <p class="sub">参考恋与深空游戏地图 — 三色分类 · 宽间距 · 跨底图版本切换</p>

  <div class="world-switch">
    <button class="world-btn active" data-world="qiyu"><i data-lucide="sparkles" style="width:14px;height:14px;"></i> 祁煜的世界</button>
    <button class="world-btn" data-world="mine"><i data-lucide="home" style="width:14px;height:14px;"></i> 我的世界</button>
    <button class="world-btn map-btn active" data-map="v3" title="浅色手绘风"><i data-lucide="map" style="width:14px;height:14px;"></i> V3 手绘风</button>
    <button class="world-btn map-btn" data-map="v6" title="深蓝3D建筑群"><i data-lucide="globe" style="width:14px;height:14px;"></i> V6 深蓝3D</button>
  </div>

  <div class="map-container" id="mapContainer">
    <img id="mapBg" class="map-bg" src="assets/map_qiyu_v3.jpg" alt="地图">
    <svg class="trail-svg" id="trailSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </div>

  <div class="bottom-bar">
    <button id="prevDay"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>
    <span class="date-label" id="dateLabel">5月23日 星期五</span>
    <button id="nextDay"><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
    <span class="legend">
      <span><span class="legend-dot" style="background:#4a90d9"></span>城市与机构</span>
      <span><span class="legend-dot" style="background:#e74c3c"></span>祁煜剧情点</span>
      <span><span class="legend-dot" style="background:#9b59b6"></span>主线战斗与遗迹</span>
    </span>
  </div>

  <div class="trip-list">
    <h3>📋 今日行程</h3>
    <div id="tripItems"></div>
  </div>

<script>
  // ===== 标记数据（V3 底图 —— 浅色手绘风，2560×1440）=====
  const PINS_QIYU_V3 = [
    { id: 'hongwan', name: '晴空中央湾区',   x: 47, y: 34, cat: 'blue', desc: '临空市核心湾区' },
    { id: 'hunter',  name: '猎人协会总部',   x: 55, y: 67, cat: 'blue', desc: '深空猎人协会总部' },
    { id: 'ever',    name: 'EVER集团大楼',   x: 68, y: 14, cat: 'blue', desc: '跨国集团总部' },
    { id: 'naokong', name: '脑机研究中心',   x: 21, y: 83, cat: 'blue', desc: '科研机构' },
    { id: 'chaoxi',  name: '潮汐屿',         x: 25, y: 80, cat: 'blue', desc: '小岛' },
    { id: 'akso',    name: 'AKSO医院',       x: 64, y: 18, cat: 'blue', desc: '私立医院' },
    { id: 'moart',   name: 'Mo Art Studio',  x: 19, y: 65, cat: 'blue', desc: '祁煜的海边画室' },
    { id: 'maoer',   name: '帽儿岛',         x: 10, y: 19, cat: 'red', desc: '祁煜幼时搁浅之地' },
    { id: 'baisha',  name: '白沙湾海区',     x: 62, y: 72, cat: 'red', desc: '临空市海湾' },
    { id: 'xiwai',   name: '西郊别墅区',     x: 38, y: 40, cat: 'red', desc: '西郊豪华别墅区' },
    { id: 'landong', name: '宝空大岛·蓝洞',  x: 16, y: 53, cat: 'red', desc: '大岛蓝洞景观' },
    { id: 'chaoxiqu',name: '潮汐区',         x: 18, y: 27, cat: 'purple', desc: '帽儿岛潮汐区' },
    { id: 'n109',    name: 'N-109禁区',      x: 88, y: 22, cat: 'purple', desc: '危险禁区' },
    { id: 'limori',  name: '利莫里亚遗迹',   x: 85, y: 72, cat: 'purple', desc: '古文明遗迹' },
    { id: 'deep',    name: '深空隧道',       x: 58, y: 68, cat: 'purple', desc: '2034年时空隧道' },
    { id: 'lingkong',name: '临空塔',         x: 54, y: 44, cat: 'purple', desc: '临空市地标' },
  ];

  // ===== 标记数据（V6 底图 —— 深蓝3D建筑群，2278×1280）=====
  // 坐标经精确测量对齐 V6 底图内置标记位置
  const PINS_QIYU_V6 = [
    // 蓝色：城市与机构
    { id: 'hongwan', name: '晴空中央湾区',   x: 68, y:  9, cat: 'blue', desc: '临空市核心湾区' },
    { id: 'hunter',  name: '猎人协会总部',   x: 67, y: 29, cat: 'blue', desc: '深空猎人协会总部' },
    { id: 'ever',    name: 'EVER集团大楼',   x: 84, y: 40, cat: 'blue', desc: '跨国集团总部' },
    { id: 'naokong', name: '脑机研究中心',   x: 30, y: 55, cat: 'blue', desc: '科研机构' },
    { id: 'chaoxi',  name: '潮汐屿',         x: 64, y: 72, cat: 'blue', desc: '小岛' },
    { id: 'akso',    name: 'AKSO医院',       x: 72, y: 12, cat: 'blue', desc: '私立医院' },
    { id: 'moart',   name: 'Mo Art Studio',  x: 25, y: 40, cat: 'blue', desc: '祁煜的海边画室' },
    // 珊瑚红：祁煜剧情点
    { id: 'maoer',   name: '帽儿岛',         x: 18, y: 27, cat: 'red', desc: '祁煜幼时搁浅之地' },
    { id: 'baisha',  name: '白沙湾海区',     x: 47, y: 67, cat: 'red', desc: '临空市海湾' },
    { id: 'xiwai',   name: '西郊别墅区',     x: 77, y: 47, cat: 'red', desc: '西郊豪华别墅区' },
    { id: 'landong', name: '宝空大岛·蓝洞',  x: 21, y: 83, cat: 'red', desc: '大岛蓝洞景观' },
    // 紫色：主线战斗与遗迹
    { id: 'chaoxiqu',name: '潮汐区',         x: 28, y: 33, cat: 'purple', desc: '帽儿岛潮汐区' },
    { id: 'n109',    name: 'N-109禁区',      x: 91, y: 53, cat: 'purple', desc: '危险禁区' },
    { id: 'limori',  name: '利莫里亚遗迹',   x: 73, y: 92, cat: 'purple', desc: '古文明遗迹' },
    { id: 'deep',    name: '深空隧道',       x: 55, y: 80, cat: 'purple', desc: '2034年时空隧道' },
    { id: 'lingkong',name: '临空塔',         x: 47, y: 24, cat: 'purple', desc: '临空市地标' },
    { id: 'qingkong',name: '晴空调环路',     x: 60, y: 50, cat: 'purple', desc: '晴空环路区域' },
  ];

  // 当前激活的 PIN 数据
  let PINS_QIYU = PINS_QIYU_V3;

  const PINS_MINE = [
    { id: 'home',   name: '家',       x: 30, y: 45, cat: 'mine', desc: '我的家' },
    { id: 'work',   name: '公司',     x: 60, y: 35, cat: 'mine', desc: '上班的地方' },
    { id: 'cafe',   name: '咖啡店',   x: 48, y: 58, cat: 'mine', desc: '常去的咖啡店' },
    { id: 'park',   name: '公园',     x: 72, y: 55, cat: 'mine', desc: '散步的公园' },
    { id: 'shop',   name: '商场',     x: 38, y: 72, cat: 'mine', desc: '购物商场' },
    { id: 'gym',    name: '健身房',   x: 55, y: 75, cat: 'mine', desc: '健身的地方' },
  ];

  // ===== 行程数据（匹配 PIN 名称）=====
  const TRIPS = {
    '5月23日': [
      { time: '18:01-18:28', from: '帽儿岛', to: 'EVER集团大楼', mode: '🚗 乘车 17.57km · 27分钟' },
      { time: '14:01-14:28', from: 'AKSO医院', to: '猎人协会总部', mode: '🚗 乘车 · 3km · 5分钟' },
      { time: '12:01-12:28', from: 'Mo Art Studio', to: '白沙湾海区', mode: '🚶 步行 · 海边散步' },
    ],
    '5月24日': [
      { time: '10:00-12:00', from: 'Mo Art Studio', to: '帽儿岛', mode: '⛴️ 乘船 · 环岛采风' },
      { time: '14:00-16:00', from: '帽儿岛', to: '西郊别墅区', mode: '🚗 乘车 · 拜访收藏家' },
    ],
    '5月25日': [
      { time: '09:00-11:00', from: '猎人协会总部', to: 'N-109禁区', mode: '🚗 乘车 · 任务出动' },
      { time: '14:00-16:00', from: 'N-109禁区', to: '利莫里亚遗迹', mode: '🚗 乘车 · 探索遗迹' },
    ],
    '5月26日': [
      { time: '10:00-12:00', from: '白沙湾海区', to: 'Mo Art Studio', mode: '🚶 步行 · 回画室' },
      { time: '15:00-17:00', from: 'Mo Art Studio', to: '深空隧道', mode: '🚗 乘车 · 调查异常' },
    ],
  };

  let currentWorld = 'qiyu';
  let currentDay = '5月23日';

  // ===== 渲染标记 =====
  function renderPins(world) {
    const container = document.getElementById('mapContainer');
    container.querySelectorAll('.pin').forEach(p => p.remove());

    const pins = world === 'qiyu' ? PINS_QIYU : PINS_MINE;
    const trips = TRIPS[currentDay] || [];
    const activePlaces = new Set();
    trips.forEach(t => { activePlaces.add(t.from); activePlaces.add(t.to); });

    pins.forEach(pin => {
      const el = document.createElement('div');
      el.className = `pin cat-${pin.cat}`;
      el.style.left = pin.x + '%';
      el.style.top = pin.y + '%';
      if (activePlaces.has(pin.name)) el.classList.add('active');
      el.innerHTML = `<div class="pin-dot"></div><div class="pin-label">${pin.name}</div>`;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showPopup(pin, el);
      });
      container.appendChild(el);
    });

    renderTrail(pins, trips);
  }

  // ===== 渲染轨迹线 =====
  function renderTrail(pins, trips) {
    const svg = document.getElementById('trailSvg');
    svg.innerHTML = '';
    if (trips.length === 0) return;

    const points = [];
    trips.forEach(t => {
      const fromPin = pins.find(p => p.name === t.from);
      if (fromPin && !points.some(pt => pt.x === fromPin.x && pt.y === fromPin.y)) {
        points.push({ x: fromPin.x, y: fromPin.y });
      }
      const toPin = pins.find(p => p.name === t.to);
      if (toPin && !points.some(pt => pt.x === toPin.x && pt.y === toPin.y)) {
        points.push({ x: toPin.x, y: toPin.y });
      }
    });

    if (points.length < 2) return;

    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
      d += ` L ${points[i].x} ${points[i].y}`;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'trail-line');
    svg.appendChild(path);
  }

  // ===== 行程列表 =====
  function renderTrips() {
    const container = document.getElementById('tripItems');
    const trips = TRIPS[currentDay] || [];
    if (trips.length === 0) {
      container.innerHTML = '<p style="color:#666;font-size:13px;">暂无行程记录</p>';
      return;
    }
    container.innerHTML = trips.map(t => `
      <div class="trip-item">
        <span class="time">${t.time}</span>
        <div class="route">
          <div><strong>${t.from}</strong> → <strong>${t.to}</strong></div>
          <div class="mode">${t.mode}</div>
        </div>
      </div>
    `).join('');
  }

  // ===== Popup =====
  function showPopup(pin, pinEl) {
    document.querySelectorAll('.popup').forEach(p => p.remove());

    const container = document.getElementById('mapContainer');
    const rect = pinEl.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    const catMap = { blue: '城市与机构', red: '祁煜剧情点', purple: '主线战斗与遗迹', mine: '我的地点' };
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.innerHTML = `
      <h4>${pin.name}</h4>
      <span class="cat-tag cat-${pin.cat}">${catMap[pin.cat] || '地点'}</span>
      <p>${pin.desc}</p>
    `;

    const left = rect.left - containerRect.left + rect.width / 2;
    const top = rect.top - containerRect.top - 8;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';

    container.appendChild(popup);
  }

  // ===== 世界/底图切换 =====
  let currentMap = 'v3';

  function applyMapVersion(mapVer) {
    currentMap = mapVer;
    const container = document.getElementById('mapContainer');
    const img = document.getElementById('mapBg');
    if (mapVer === 'v3') {
      img.src = 'assets/map_qiyu_v3.jpg';
      container.classList.remove('v6');
      document.body.classList.remove('v6-mode');
      PINS_QIYU = PINS_QIYU_V3;
    } else {
      img.src = 'assets/map_qiyu_v6.jpg';
      container.classList.add('v6');
      document.body.classList.add('v6-mode');
      PINS_QIYU = PINS_QIYU_V6;
    }
    renderPins(currentWorld);
  }

  document.querySelectorAll('.world-btn[data-world]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.world-btn[data-world]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentWorld = btn.dataset.world;
      renderPins(currentWorld);
    });
  });

  document.querySelectorAll('.world-btn[data-map]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.world-btn[data-map]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyMapVersion(btn.dataset.map);
    });
  });

  // ===== 日期切换 =====
  const days = Object.keys(TRIPS);
  let dayIdx = 0;
  document.getElementById('prevDay').addEventListener('click', () => {
    dayIdx = Math.max(0, dayIdx - 1);
    currentDay = days[dayIdx];
    document.getElementById('dateLabel').textContent = currentDay + ' 星期五';
    renderPins(currentWorld);
    renderTrips();
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    dayIdx = Math.min(days.length - 1, dayIdx + 1);
    currentDay = days[dayIdx];
    document.getElementById('dateLabel').textContent = currentDay + ' 星期五';
    renderPins(currentWorld);
    renderTrips();
  });

  // 点击空白关闭popup
  document.getElementById('mapContainer').addEventListener('click', () => {
    document.querySelectorAll('.popup').forEach(p => p.remove());
  });

  // ===== 初始化 =====
  applyMapVersion('v3');
  renderTrips();

  function initLucideIcons() {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  }
  initLucideIcons();
</script>
</body>
</html>
