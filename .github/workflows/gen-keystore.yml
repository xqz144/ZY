name: Generate Fixed Signing Keystore (one-off)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MengJiaoDev, OU=Personal, O=MengJiao, L=Shenzhen, ST=Guangdong, C=CN"
          base64 -w 0 debug.keystore > keystore.b64
          echo "generated: $(wc -c < keystore.b64) chars"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-keystore
          path: keystore.b64
          retention-days: 1
