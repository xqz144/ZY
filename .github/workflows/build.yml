name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK components
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: 🛠️ Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip -d /opt
          echo "/opt/gradle-8.10/bin" >> $GITHUB_PATH
          gradle --version | head -3

      - name: 🔧 Prepare build env
        run: |
          # 固定签名证书（来自仓库 Secret，保证每次构建签名一致 → 手机可覆盖安装）
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 密钥，无法生成可覆盖安装的 APK"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | tail -3

          # 移除本地代理配置
          sed -i '/systemProp\.http\.proxy/d; /systemProp\.https\.proxy/d; /systemProp\.nonProxyHosts/d' android/gradle.properties

      - name: 📦 Sync web assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rsync -a --delete \
            --exclude='android/' --exclude='apk/' --exclude='node_modules/' \
            --exclude='.git/' --exclude='.trae-html-share-packages/' \
            --exclude='*.zip' --exclude='push-fix.ps1' --exclude='mengjiao-v*.apk' \
            ./ android/app/src/main/assets/public/
          echo "Assets: $(find android/app/src/main/assets/public -type f | wc -l) files"

      - name: 🏗️ Build APK
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xms256m -Xmx1536m"

      - name: 🏷️ Package APK
        id: meta
        run: |
          VN=$(grep versionName android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          VC=$(grep versionCode android/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')
          APK="mengjiao-v${VN}-code${VC}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          SIZE=$(du -h "dist/$APK" | cut -f1)
          # 校验签名指纹，便于出问题时排查
          keytool -printcert -jarfile "dist/$APK" | grep -E "SHA256:|Owner:" | head -3
          echo "✅ $APK ($SIZE) — v${VN} code${VC}"
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "apk_name=$APK" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifact (7天)
        uses: actions/upload-artifact@v4
        with:
          name: mengjiao-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 7

      - name: 🏷️ Publish Release (永久下载链接)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: ʚ YU ɞ v${{ steps.meta.outputs.version_name }}
          body: |
            ## 📱 ʚ YU ɞ Android 安装包

            **版本**: v${{ steps.meta.outputs.version_name }} (code ${{ steps.meta.outputs.version_code }})
            **Commit**: ${{ github.sha }}

            ### 安装步骤
            1. 手机浏览器打开本页，下载 APK
            2. 允许「安装未知来源应用」
            3. 点击安装 → **覆盖安装不丢失数据**
          files: dist/*.apk
          update_existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
