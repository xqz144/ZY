<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦角传讯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../colors_and_type.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif']
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff0f4;
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 30% 18%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }
    .app-bg-fallback {
      background:
        radial-gradient(ellipse 520px 320px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 420px 260px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, #fdf6f8, #fff0f4);
    }

    .banner {
      position: relative;
      margin: 40px 16px 0;
      padding: 20px 20px 24px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(140deg, #f4a0bc, #e8749a);
      box-shadow: 0 8px 24px -8px hsl(343 72% 45% / 0.3);
    }
    @media (max-width: 479px) {
      .banner { margin-top: 16px; }
    }
    .banner-stars {
      position: absolute; inset: 0; pointer-events: none;
    }
    .banner-stars span {
      position: absolute; border-radius: 9999px;
      background: hsl(343 90% 98%);
      animation: twinkle 3.5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.65; transform: scale(1.1); }
    }

    .banner-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
    .avatar-circle {
      width: 56px; height: 56px; border-radius: 9999px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 1.5rem;
      background: radial-gradient(circle at 30% 25%, #ffeff3, #f4a0bc);
      outline: 3px solid hsl(343 90% 98% / 0.25);
      outline-offset: 1px;
      overflow: hidden;
    }
    .avatar-circle img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .banner-name { color: hsl(343 90% 99%); }
    .banner-sig { color: hsl(343 50% 94%); font-size: 12px; margin-top: 2px; }
    .banner-days {
      display: flex; align-items: baseline; gap: 4px;
      margin-top: 16px; position: relative; z-index: 1;
    }
    .banner-days-num {
      font-family: var(--font-serif);
      font-size: 2.5rem; font-weight: 700;
      color: hsl(343 90% 99%);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .banner-days-label { color: hsl(343 50% 92%); font-size: 13px; }

    .section-label {
      padding: 20px 24px 10px;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 4px;
      padding: 4px 16px 8px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .app-item:active { transform: scale(0.92); background: hsl(var(--accent) / 0.5); }
    .app-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: grid; place-items: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 12px -3px hsl(343 60% 35% / 0.2);
      transition: box-shadow 0.2s;
    }
    .app-item:active .app-icon { box-shadow: 0 2px 6px -2px hsl(343 60% 35% / 0.15); }
    .app-label {
      font-size: 11px;
      color: hsl(var(--foreground));
      text-align: center;
      line-height: 1.3;
    }

    .dock {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: auto 16px 12px;
      padding: 12px 16px;
      border-radius: 28px;
      background: hsl(343 60% 97% / 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid hsl(var(--border));
    }
    .dock-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; cursor: pointer;
      transition: transform 0.1s;
    }
    .dock-item:active { transform: scale(0.9); }
    .dock-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 10px -3px hsl(343 60% 35% / 0.18);
    }
    .dock-label { font-size: 10px; color: hsl(var(--muted-foreground)); }

    .home-indicator {
      display: flex; justify-content: center; padding: 6px 0 10px;
    }
    .home-indicator span {
      width: 130px; height: 4px; border-radius: 9999px;
      background: hsl(var(--foreground) / 0.25);
    }

    @keyframes appFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .app-item, .dock-item {
      animation: appFadeIn 0.4s cubic-bezier(0.3, 0, 0, 1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg app-bg-fallback" id="appBg">

      <div class="banner">
        <div class="banner-stars">
          <span style="top:12%;left:8%;width:3px;height:3px;animation-delay:0s"></span>
          <span style="top:20%;left:78%;width:2px;height:2px;animation-delay:0.6s"></span>
          <span style="top:35%;left:90%;width:3px;height:3px;animation-delay:1.2s"></span>
          <span style="top:60%;left:5%;width:2px;height:2px;animation-delay:1.8s"></span>
          <span style="top:75%;left:85%;width:3px;height:3px;animation-delay:0.9s"></span>
          <span style="top:85%;left:15%;width:2px;height:2px;animation-delay:2.4s"></span>
        </div>
        <div class="banner-row">
          <div class="avatar-circle" id="avatarEmoji">🌙</div>
          <div>
            <div class="banner-name font-medium" id="username">@my_profile</div>
            <div class="banner-sig italic" id="signature">今天也要加油呀 ✨</div>
          </div>
        </div>
        <div class="banner-days">
          <span class="banner-days-num" id="daysNum">769</span>
          <span class="banner-days-label">天 · 在一起</span>
        </div>
      </div>

      <div class="section-label">传讯</div>
      <div class="app-grid">
        <a href="cards-new.html" class="app-item" style="animation-delay:0.05s">
          <div class="app-icon" style="background:linear-gradient(145deg,#f4a0bc,#e8749a);">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🃏</span>
          </div>
          <span class="app-label">字卡传讯</span>
        </a>
        <a href="chat-new.html" class="app-item" style="animation-delay:0.1s">
          <div class="app-icon" style="background:linear-gradient(145deg,#f5acc6,#ec80a3);">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">💬</span>
          </div>
          <span class="app-label">梦角对话</span>
        </a>
        <a href="moments-new.html" class="app-item" style="animation-delay:0.12s">
          <div class="app-icon" style="background:linear-gradient(145deg,#f7b6ce,#f091b2);">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🌸</span>
          </div>
          <span class="app-label">朋友圈</span>
        </a>
        <a href="spark-new.html" class="app-item" style="animation-delay:0.15s">
          <div class="app-icon" style="background:linear-gradient(145deg,#f8b9ce,#f08eb0);">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🍖</span>
          </div>
          <span class="app-label">喂食</span>
        </a>
        <a href="history-new.html" class="app-item" style="animation-delay:0.2s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#fbc8d8,#f4a0bc);">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">📖</span>
          </div>
          <span class="app-label">传讯记录</span>
        </a>
      </div>

      <div class="section-label">日记</div>
      <div class="app-grid">
        <a href="diary-new.html" class="app-item" style="animation-delay:0.25s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#f6b3ca,#e88ca8);">📔</div>
          <span class="app-label">梦境日记</span>
        </a>
        <a href="anniversary-new.html" class="app-item" style="animation-delay:0.3s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#f8c2d4,#ed98b5);">⭐</div>
          <span class="app-label">纪念日</span>
        </a>
        <a href="music-new.html" class="app-item" style="animation-delay:0.35s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#f9cfdd,#f2aac3);">🎶</div>
          <span class="app-label">背景音乐</span>
        </a>
        <a href="wish-new.html" class="app-item" style="animation-delay:0.4s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#f7bcd0,#eb95b3);">🕯️</div>
          <span class="app-label">心愿</span>
        </a>
        <a href="spark-new.html" class="app-item" style="animation-delay:0.42s;">
          <div class="app-icon" style="background:linear-gradient(145deg,#ffb86b,#ff8a56);">🔥</div>
          <span class="app-label">小火人</span>
        </a>
      </div>

      <div class="dock">
        <a href="cards-new.html" class="dock-item" style="animation-delay:0.45s">
          <div class="dock-icon" style="background:linear-gradient(145deg,#f4a0bc,#e8749a);">🃏</div>
          <span class="dock-label">字卡</span>
        </a>
        <a href="chat-new.html" class="dock-item" style="animation-delay:0.5s">
          <div class="dock-icon" style="background:linear-gradient(145deg,#f5acc6,#ec80a3);">💬</div>
          <span class="dock-label">对话</span>
        </a>
        <a href="moments-new.html" class="dock-item" style="animation-delay:0.52s">
          <div class="dock-icon" style="background:linear-gradient(145deg,#f7b6ce,#f091b2);">🌸</div>
          <span class="dock-label">朋友圈</span>
        </a>
        <a href="spark-new.html" class="dock-item" style="animation-delay:0.55s">
          <div class="dock-icon" style="background:linear-gradient(145deg,#f8b9ce,#f08eb0);">🍖</div>
          <span class="dock-label">喂食</span>
        </a>
      </div>

      <div class="home-indicator">
        <span></span>
      </div>

    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var KEYS = {
        togetherDate: "mengjiao_together_date",
        signature: "mengjiao_signature",
        username: "mengjiao_username",
        avatarEmoji: "mengjiao_avatar_emoji",
        avatarImg: "mengjiao_avatar_img",
        bgImg: "mengjiao_bg_img"
      };

      var DEFAULTS = {
        signature: "今天也要加油呀 ✨",
        username: "@my_profile",
        avatarEmoji: "🌙"
      };

      function getItem(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v !== null && v !== "") return v;
        } catch (e) {}
        return fallback;
      }

      function calcDays(dateStr) {
        if (!dateStr) return 769;
        var start = new Date(dateStr + "T00:00:00");
        if (isNaN(start.getTime())) return 769;
        var now = new Date();
        now.setHours(0, 0, 0, 0);
        var days = Math.floor((now - start) / 86400000);
        return days < 0 ? 0 : days;
      }

      var savedDate = getItem(KEYS.togetherDate, "");
      document.getElementById("daysNum").textContent = savedDate ? String(calcDays(savedDate)) : "769";
      document.getElementById("signature").textContent = getItem(KEYS.signature, DEFAULTS.signature);
      document.getElementById("username").textContent = getItem(KEYS.username, DEFAULTS.username);

      var avatarEl = document.getElementById("avatarEmoji");
      var avatarImg = getItem(KEYS.avatarImg, "");
      if (avatarImg) {
        avatarEl.innerHTML = '<img src="' + avatarImg + '" alt="" />';
      } else {
        avatarEl.textContent = getItem(KEYS.avatarEmoji, DEFAULTS.avatarEmoji);
      }

      var bgImg = getItem(KEYS.bgImg, "");
      var appBg = document.getElementById("appBg");
      if (bgImg) {
        appBg.style.backgroundImage = 'url(' + bgImg + ')';
        appBg.classList.remove("app-bg-fallback");
      }

      document.body.addEventListener('touchmove', function(e) {
        if (e.target.closest('.app-bg')) return;
        e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
