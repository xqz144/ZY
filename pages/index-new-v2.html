    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

      function updateClock() {
        var now = new Date();
        var h = pad(now.getHours());
        var m = pad(now.getMinutes());
        var timeStr = h + ":" + m;

        document.getElementById("statusTime").textContent = timeStr;

        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var prevDays = new Date(year, month, 0).getDate();

        ["日", "一", "二", "三", "四", "五", "六"].forEach(function (d) {
          var el = document.createElement("div");
          el.className = "calendar-day-head";
          el.textContent = d;
          grid.appendChild(el);
        });

        for (var i = firstDay - 1; i >= 0; i--) {
          var el = document.createElement("div");
          el.className = "calendar-day other";
          el.textContent = prevDays - i;
          grid.appendChild(el);
        }
        for (var d = 1; d <= daysInMonth; d++) {
          var el = document.createElement("div");
          el.className = "calendar-day" + (d === today ? " today" : "");
          el.textContent = d;
          grid.appendChild(el);
        }
        var total = firstDay + daysInMonth;
        var nextDays = (7 - (total % 7)) % 7;
        for (var n = 1; n <= nextDays; n++) {
          var el = document.createElement("div");
          el.className = "calendar-day other";
          el.textContent = n;
          grid.appendChild(el);
        }
      }

      function calcDays(dateStr) {
        if (!dateStr) return 769;
        var start = new Date(dateStr + "T00:00:00");
        if (isNaN(start.getTime())) return 769;
        var now = new Date();
        now.setHours(0, 0, 0, 0);
        var days = Math.floor((now - start) / 86400000);
        return days < 0 ? 0 : days;
      }

      function setAvatar(el, imgUrl, fallbackIcon) {
        if (imgUrl) {
          el.innerHTML = '<img src="' + imgUrl + '" alt="" />';
        } else {
          el.innerHTML = '<i data-lucide="' + fallbackIcon + '"></i>';
        }
      }

      var tempAvatarImg = "";
      var tempDreamImg = "";
      var tempBgImg = "";

      function readFile(file, cb) {
        if (!file || !file.type.startsWith("image/")) return cb(null);
        var reader = new FileReader();
        reader.onload = function (e) { cb(e.target.result); };
        reader.readAsDataURL(file);
      }
      function setPreviewImg(el, src, fallbackHtml) {
        if (src) {
          el.innerHTML = '<img src="' + src + '" alt="" />';
        } else {
          el.innerHTML = fallbackHtml || '<i data-lucide="image" class="w-5 h-5"></i>';
        }
      }
      function setBgPreview(src) {
        var wrap = document.getElementById("previewBgImgWrap");
        var img = document.getElementById("previewBgImg");
        if (src) {
          img.src = src;
          wrap.classList.remove("hidden");
        } else {
          img.src = "";
          wrap.classList.add("hidden");
        }
      }

      function applySettings() {
        var savedDate = getItem(KEYS.togetherDate, "");
        document.getElementById("daysNum").textContent = savedDate ? String(calcDays(savedDate)) : "769";
        document.getElementById("signature").textContent = getItem(KEYS.signature, DEFAULTS.signature);
        var userName = getItem(KEYS.username, DEFAULTS.username);
        var dreamName = getItem(KEYS.dreamname, DEFAULTS.dreamname);
        document.getElementById("username").textContent = dreamName ? (userName + " & " + dreamName) : userName;
        document.getElementById("widgetTitle").textContent = getItem(KEYS.widgetTitle, DEFAULTS.widgetTitle);
        document.getElementById("widgetText").textContent = getItem(KEYS.widgetText, DEFAULTS.widgetText);
        document.getElementById("bubbleLeft").textContent = getItem(KEYS.bubbleLeft, DEFAULTS.bubbleLeft);
        document.getElementById("bubbleRight").textContent = getItem(KEYS.bubbleRight, DEFAULTS.bubbleRight);

        setAvatar(document.getElementById("avatarMe"), getItem(KEYS.avatarImg, ""), "moon");
        setAvatar(document.getElementById("avatarDream"), getItem(KEYS.dreamImg, ""), "star");

        var bgImg = getItem(KEYS.bgImg, "");
        var profileWidget = document.getElementById("profileWidget");
        if (bgImg) {
          profileWidget.style.backgroundImage = 'url(' + bgImg + ')';
          profileWidget.classList.add("has-bg-img");
        } else {
          profileWidget.style.backgroundImage = '';
          profileWidget.classList.remove("has-bg-img");
        }

        lucide.createIcons();
      }

      function fillForm() {
        document.getElementById("inputUsername").value = getItem(KEYS.username, DEFAULTS.username);
        document.getElementById("inputDreamname").value = getItem(KEYS.dreamname, DEFAULTS.dreamname);
        document.getElementById("inputSignature").value = getItem(KEYS.signature, DEFAULTS.signature);
        tempAvatarImg = getItem(KEYS.avatarImg, "");
        tempDreamImg = getItem(KEYS.dreamImg, "");
        tempBgImg = getItem(KEYS.bgImg, "");
        setPreviewImg(document.getElementById("previewAvatarImg"), tempAvatarImg, '<i data-lucide="moon" class="w-5 h-5"></i>');
        setPreviewImg(document.getElementById("previewDreamImg"), tempDreamImg, '<i data-lucide="star" class="w-5 h-5"></i>');
        setBgPreview(tempBgImg);
        document.getElementById("inputAvatarEmoji").value = getItem(KEYS.avatarEmoji, DEFAULTS.avatarEmoji);
        document.getElementById("inputTogetherDate").value = getItem(KEYS.togetherDate, "");
        document.getElementById("inputWidgetTitle").value = getItem(KEYS.widgetTitle, DEFAULTS.widgetTitle);
        document.getElementById("inputWidgetText").value = getItem(KEYS.widgetText, DEFAULTS.widgetText);
        document.getElementById("inputBubbleLeft").value = getItem(KEYS.bubbleLeft, DEFAULTS.bubbleLeft);
        document.getElementById("inputBubbleRight").value = getItem(KEYS.bubbleRight, DEFAULTS.bubbleRight);
        lucide.createIcons();
      }

      function saveForm() {
        setItem(KEYS.username, document.getElementById("inputUsername").value.trim() || DEFAULTS.username);
        setItem(KEYS.dreamname, document.getElementById("inputDreamname").value.trim() || DEFAULTS.dreamname);
        setItem(KEYS.signature, document.getElementById("inputSignature").value.trim() || DEFAULTS.signature);
        setItem(KEYS.avatarImg, tempAvatarImg);
        setItem(KEYS.dreamImg, tempDreamImg);
        setItem(KEYS.avatarEmoji, document.getElementById("inputAvatarEmoji").value.trim() || DEFAULTS.avatarEmoji);
        setItem(KEYS.togetherDate, document.getElementById("inputTogetherDate").value);
        setItem(KEYS.widgetTitle, document.getElementById("inputWidgetTitle").value.trim() || DEFAULTS.widgetTitle);
        setItem(KEYS.widgetText, document.getElementById("inputWidgetText").value.trim() || DEFAULTS.widgetText);
        setItem(KEYS.bgImg, tempBgImg);
        setItem(KEYS.bubbleLeft, document.getElementById("inputBubbleLeft").value.trim() || DEFAULTS.bubbleLeft);
        setItem(KEYS.bubbleRight, document.getElementById("inputBubbleRight").value.trim() || DEFAULTS.bubbleRight);
        applySettings();
        closeModal();
      }

      var modal = document.getElementById("settingsModal");
      function openModal() {
        fillForm();
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      }
      function closeModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      }

      document.getElementById("settingsBtn").addEventListener("click", openModal);
      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("click", closeModal);
      document.getElementById("saveSettings").addEventListener("click", saveForm);
      document.getElementById("moreBtn").addEventListener("click", openModal);

      // 头像/背景本地上传
      function bindImageUpload(btnId, inputId, onLoad) {
        document.getElementById(btnId).addEventListener("click", function () { document.getElementById(inputId).click(); });
        document.getElementById(inputId).addEventListener("change", function (e) {
          readFile(e.target.files[0], function (data) {
            if (data) onLoad(data);
          });
          e.target.value = "";
        });
      }
      bindImageUpload("btnAvatarImg", "inputAvatarImg", function (data) {
        tempAvatarImg = data;
        setPreviewImg(document.getElementById("previewAvatarImg"), data, '<i data-lucide="moon" class="w-5 h-5"></i>');
      });
      bindImageUpload("btnDreamImg", "inputDreamImg", function (data) {
        tempDreamImg = data;
        setPreviewImg(document.getElementById("previewDreamImg"), data, '<i data-lucide="star" class="w-5 h-5"></i>');
      });
      bindImageUpload("btnBgImg", "inputBgImg", function (data) {
        tempBgImg = data;
        setBgPreview(data);
      });
      document.getElementById("clearAvatarImg").addEventListener("click", function () {
        tempAvatarImg = "";
        setPreviewImg(document.getElementById("previewAvatarImg"), "", '<i data-lucide="moon" class="w-5 h-5"></i>');
        lucide.createIcons();
      });
      document.getElementById("clearDreamImg").addEventListener("click", function () {
        tempDreamImg = "";
        setPreviewImg(document.getElementById("previewDreamImg"), "", '<i data-lucide="star" class="w-5 h-5"></i>');
        lucide.createIcons();
      });
      document.getElementById("clearBgImg").addEventListener("click", function () {
        tempBgImg = "";
        setBgPreview("");
      });

      document.querySelectorAll(".app-item[data-delay], .dock-item[data-delay]").forEach(function (el) {
        el.style.setProperty("--delay", el.getAttribute("data-delay") + "s");
      });

      updateClock();
      renderCalendar();
      applySettings();
      setInterval(updateClock, 1000);

      lucide.createIcons();

      document.body.addEventListener("touchmove", function (e) {
        if (e.target.closest(".screen") || e.target.closest(".modal-panel")) return;
        e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
