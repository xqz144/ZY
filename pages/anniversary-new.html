    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --chat-bg: #fdfbfa;
}

.dark {
  --popover: 340 10% 16%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(var(--accent-color-rgb), 0.35); border-radius: 4px; }

    </style>

<script>
/* 从父窗口同步主题色/字体到 iframe 内（配合主站外观设置） */
(function () {
  try {
    var inIframe = false;
    try { inIframe = (window.top !== window.self); } catch (e) { inIframe = true; }
    function applyColorThemeFromParent() {
      try {
        var parentRoot = null;
        try { parentRoot = window.parent.document.documentElement; } catch (e) { parentRoot = null; }
        if (parentRoot) {
          var t = parentRoot.getAttribute('data-color-theme');
          if (t) document.documentElement.setAttribute('data-color-theme', t);
          var dt = parentRoot.getAttribute('data-theme');
          if (dt) document.documentElement.setAttribute('data-theme', dt);
          if (dt === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
          /* 同步字体变量（用户在外观设置里配置的自定义字体） */
          var fv = parentRoot.style.getPropertyValue('--font-family');
          if (fv) document.documentElement.style.setProperty('--font-family', fv);
          var mfv = parentRoot.style.getPropertyValue('--message-font-family');
          if (mfv) document.documentElement.style.setProperty('--message-font-family', mfv);
          var fs = parentRoot.style.getPropertyValue('--font-size');
          if (fs) document.documentElement.style.setProperty('--font-size', fs);
        }
      } catch (e) {}
    }
    applyColorThemeFromParent();
    if (inIframe) {
      window.addEventListener('message', function (ev) {
        var d = ev.data || {};
        if (d.type === 'theme:sync' || d.colorTheme || d.theme) {
          if (d.colorTheme) document.documentElement.setAttribute('data-color-theme', d.colorTheme);
          if (d.theme) {
            document.documentElement.setAttribute('data-theme', d.theme);
            if (d.theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
          }
          /* 同步字体 CSS 变量 */
          if (d.fontFamily) document.documentElement.style.setProperty('--font-family', d.fontFamily);
          if (d.messageFontFamily) document.documentElement.style.setProperty('--message-font-family', d.messageFontFamily);
          if (d.fontSize) document.documentElement.style.setProperty('--font-size', d.fontSize);
          applyColorThemeFromParent();
        }
      });
      setInterval(applyColorThemeFromParent, 2500);
    }
  } catch (e) {}
})();
</script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      letter-spacing: var(--tracking-normal);
    }

    .icon-18 { width: 18px; height: 18px; }
    .icon-20 { width: 20px; height: 20px; }

    /* ---- Phone frame ---- */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 44px;
        border: 10px solid var(--accent-color);
        box-shadow:
          0 25px 60px -15px rgba(var(--accent-color-rgb), 0.35),
          0 0 0 2px rgba(var(--accent-color-rgb), 0.55),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: rgba(var(--accent-color-rgb), 0.55);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ---- App background ---- */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--primary-bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      scrollbar-width: none;
    }
    .app-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 520px 320px at 15% 0%, rgba(var(--accent-color-rgb), 0.18), transparent 60%),
        radial-gradient(ellipse 460px 280px at 95% 8%, rgba(244, 160, 188, 0.14), transparent 55%),
        radial-gradient(ellipse 400px 260px at 80% 95%, rgba(255, 228, 236, 0.25), transparent 50%);
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* ---- Starlight ---- */
    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight span {
      position: absolute; border-radius: 9999px;
      background: rgba(var(--accent-color-rgb), 0.55);
      animation: twinkle 5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }

    /* ---- Floating hearts ---- */
    .floating-hearts { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floating-hearts span {
      position: absolute;
      font-size: 14px;
      opacity: 0.35;
      animation: floatHeart 6s ease-in-out infinite;
    }
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) rotate(-6deg); opacity: 0.25; }
      50% { transform: translateY(-14px) rotate(6deg); opacity: 0.5; }
    }

    /* ---- Top bar ---- */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: var(--accent-color);
      text-decoration: none;
      padding: 8px 10px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 56px;
      border-radius: 12px;
      transition: background-color 0.15s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .back-btn:active { opacity: 0.7; background: rgba(var(--accent-color-rgb), 0.12); }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
      line-height: 1.3;
    }
    .add-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px -3px rgba(232, 116, 154, 0.4);
      transition: transform 0.15s;
    }
    .add-btn:active { transform: scale(0.9); }

    /* ---- List ---- */
    .anni-list {
      flex: 1;
      padding: 8px 16px 28px;
      position: relative;
      z-index: 1;
    }

    /* ---- Anniversary card: cute calendar / frame ---- */
    .anni-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: #fff;
      border: 2px solid rgba(var(--accent-color-rgb), 0.18);
      border-radius: 24px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px -6px rgba(var(--accent-color-rgb), 0.18);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      animation: fadeUp 0.45s cubic-bezier(.3,0,0,1) both;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .anni-card::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1.5px dashed rgba(var(--accent-color-rgb), 0.22);
      border-radius: 18px;
      pointer-events: none;
    }
    .anni-card:hover { border-color: rgba(var(--accent-color-rgb), 0.45); }
    .anni-card:active { transform: scale(0.985); box-shadow: 0 3px 10px -4px rgba(var(--accent-color-rgb), 0.16); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .anni-card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .anni-emoji {
      width: 56px; height: 56px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: linear-gradient(135deg, #fff0f5, #fce4ec);
      border: 2px solid rgba(var(--accent-color-rgb), 0.35);
      flex-shrink: 0;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.8);
    }

    .anni-info { flex: 1; min-width: 0; }
    .anni-name {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .anni-date {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .anni-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anni-count {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      position: relative;
      z-index: 1;
      padding-top: 4px;
      border-top: 1.5px dashed rgba(var(--accent-color-rgb), 0.18);
    }
    .count-num {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-color), #e05a86);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .count-label {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .anni-heart {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 14px;
      opacity: 0.55;
      z-index: 2;
      animation: heartPulse 3s ease-in-out infinite;
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }

    .anni-del {
      position: absolute;
      top: 8px;
      right: 36px;
      width: 26px; height: 26px;
      border-radius: 8px;
      border: none;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s, color 0.15s, background-color 0.15s;
      z-index: 3;
    }
    .anni-del:active { opacity: 1; color: #e11d48; background: rgba(225, 29, 72, 0.1); }

    .status-pill {
      position: absolute;
      top: 12px;
      right: 64px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 2;
    }
    .status-pill.today { background: linear-gradient(135deg, #f4a0bc, #e8749a); color: #fff; }
    .status-pill.upcoming { background: rgba(var(--accent-color-rgb), 0.15); color: #d86a8d; }
    .status-pill.passed { background: rgba(160, 128, 144, 0.1); color: var(--text-secondary); }

    /* ---- Empty state ---- */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 28px;
      position: relative;

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_anniversaries";
      var BG_IMG_KEY = "mengjiao_bg_img";
      var EMOJI_OPTIONS = ["🌸", "💕", "⭐", "🎂", "🌙", "✨", "🎵", "🎁"];

      var anniList = document.getElementById("anniList");
      var emptyState = document.getElementById("emptyState");
      var sheetOverlay = document.getElementById("sheetOverlay");
      var sheetTitle = document.getElementById("sheetTitle");
      var sheetClose = document.getElementById("sheetClose");
      var sheetPanel = document.getElementById("sheetPanel");
      var nameInput = document.getElementById("nameInput");
      var dateInput = document.getElementById("dateInput");
      var descInput = document.getElementById("descInput");
      var bgInput = document.getElementById("bgInput");
      var emojiPicker = document.getElementById("emojiPicker");
      var saveBtn = document.getElementById("saveBtn");
      var addBtn = document.getElementById("addBtn");
      var toast = document.getElementById("toast");
      var appBg = document.getElementById("appBg");
      var toastTimer;

      var editingId = null;
      var selectedEmoji = "🌸";

      /* ---------- Utilities ---------- */

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      function getItem(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v !== null && v !== "") return v;
        } catch (e) {}
        return fallback;
      }

      function setItem(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {}
      }

      function getAnniversaries() {
        try {
          var v = localStorage.getItem(STORAGE_KEY);
          if (v) {
            var arr = JSON.parse(v);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }

      function saveAnniversaries(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } catch (e) {}
      }

      function toDateStr(d) {
        return d.getFullYear() + "-" +
          String(d.getMonth() + 1).padStart(2, "0") + "-" +
          String(d.getDate()).padStart(2, "0");
      }

      function formatDate(dateStr) {
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return dateStr;
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      function getMonthDay(dateStr) {
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return { month: "--", day: "--" };
        var months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        return {
          month: months[d.getMonth()],
          day: String(d.getDate()).padStart(2, "0")
        };
      }

      function calcAnniversaryDays(dateStr) {
        var date = new Date(dateStr + "T00:00:00");
        var now = new Date();
        now.setHours(0, 0, 0, 0);

        var thisYear = new Date(now.getFullYear(), date.getMonth(), date.getDate());
        var diff = Math.floor((thisYear - now) / 86400000);

        if (diff === 0) return { days: 0, status: "today" };
        if (diff > 0) return { days: diff, status: "upcoming" };
        return { days: Math.abs(diff), status: "passed" };
      }

      function sortValue(info) {
        if (info.status === "passed") {
          return { tier: 1, sub: 365 - info.days };
        }
        return { tier: 0, sub: info.days };
      }

      /* ---------- Background image ---------- */

      var tempBgImg = "";

      function readFile(file, cb) {
        if (!file || !file.type.startsWith("image/")) return cb(null);
        var reader = new FileReader();
        reader.onload = function (e) { cb(e.target.result); };
        reader.readAsDataURL(file);
      }
      function setBgPreview(src) {
        var wrap = document.getElementById("bgPreviewWrap");
        var img = document.getElementById("bgPreview");
        if (src) {
          img.src = src;
          wrap.classList.remove("hidden");
        } else {
          img.src = "";
          wrap.classList.add("hidden");
        }
      }

      function applyBackground() {
        var bgImg = getItem(BG_IMG_KEY, "");
        if (bgImg) {
          appBg.style.backgroundImage = 'url(' + bgImg + ')';
        } else {
          appBg.style.backgroundImage = "";
        }
      }

      /* ---------- Rendering ---------- */

      function renderList() {
        var data = getAnniversaries();

        if (data.length === 0) {
          anniList.innerHTML = "";
          anniList.style.display = "none";
          emptyState.style.display = "flex";
          return;
        }

        emptyState.style.display = "none";
        anniList.style.display = "block";

        var enriched = data.map(function (item) {
          var info = calcAnniversaryDays(item.date);
          return { item: item, info: info, sortKey: sortValue(info) };
        });

        enriched.sort(function (a, b) {
          if (a.sortKey.tier !== b.sortKey.tier) return a.sortKey.tier - b.sortKey.tier;
          return a.sortKey.sub - b.sortKey.sub;
        });

        anniList.innerHTML = enriched.map(function (entry, idx) {
          var item = entry.item;
          var info = entry.info;
          var delay = (idx * 0.06).toFixed(2);
          var cal = getMonthDay(item.date);

          var countText, countLabel, pillClass, pillText;
          if (info.status === "today") {
            countText = "0";
            countLabel = "就是今天";
            pillClass = "today";
            pillText = "今天";
          } else if (info.status === "upcoming") {
            countText = String(info.days);
            countLabel = "天后";
            pillClass = "upcoming";
            pillText = "还有";
          } else {
            countText = String(info.days);
            countLabel = "天前";
            pillClass = "passed";
            pillText = "已过";
          }

          var descHtml = item.description
            ? '<div class="anni-desc">' + escapeHtml(item.description) + '</div>'
            : '';

          return (
            '<article class="anni-card" data-id="' + escapeHtml(item.id) + '" style="animation-delay:' + delay + 's">' +
              '<span class="anni-heart">💗</span>' +
              '<span class="status-pill ' + pillClass + '">' + pillText + '</span>' +
              '<button type="button" class="anni-del" data-id="' + escapeHtml(item.id) + '" aria-label="删除">' +
                '<i data-lucide="trash-2" class="icon-18"></i>' +
              '</button>' +
              '<div class="anni-card-top">' +
                '<div class="anni-emoji">' + escapeHtml(item.emoji || '🌸') + '</div>' +
                '<div class="anni-info">' +
                  '<div class="anni-name">' + escapeHtml(item.name) + '</div>' +
                  '<div class="anni-date">' +
                    '<i data-lucide="calendar" class="icon-18" style="opacity:0.6"></i>' +
                    escapeHtml(formatDate(item.date)) +
                  '</div>' +
                  descHtml +
                '</div>' +
              '</div>' +
              '<div class="anni-count">' +
                '<span class="count-num">' + countText + '</span>' +
                '<span class="count-label">' + countLabel + '</span>' +
              '</div>' +
            '</article>'
          );
        }).join("");

        if (window.lucide) lucide.createIcons();
      }

      /* ---------- Sheet management ---------- */

      function openSheet(item) {
        if (item) {
          editingId = item.id;
          sheetTitle.textContent = "编辑纪念日";
          nameInput.value = item.name || "";
          dateInput.value = item.date || toDateStr(new Date());
          descInput.value = item.description || "";
          selectedEmoji = item.emoji || "🌸";
        } else {
          editingId = null;
          sheetTitle.textContent = "添加纪念日";
          nameInput.value = "";
          dateInput.value = toDateStr(new Date());
          descInput.value = "";
          selectedEmoji = "🌸";
        }
        tempBgImg = getItem(BG_IMG_KEY, "");
        setBgPreview(tempBgImg);
        updateEmojiSelection();
        sheetOverlay.classList.add("open");
        setTimeout(function () { nameInput.focus(); }, 300);
      }

      function closeSheet() {
        sheetOverlay.classList.remove("open");
        editingId = null;
      }

      function updateEmojiSelection() {
        var opts = emojiPicker.querySelectorAll(".emoji-opt");
        opts.forEach(function (opt) {
          if (opt.getAttribute("data-emoji") === selectedEmoji) {
            opt.classList.add("selected");
          } else {
            opt.classList.remove("selected");
          }
        });
      }

      /* ---------- Event handlers ---------- */

      addBtn.addEventListener("click", function () {
        openSheet(null);
      });

      sheetClose.addEventListener("click", closeSheet);

      sheetOverlay.addEventListener("click", function (e) {
        if (e.target === sheetOverlay) closeSheet();
      });

      emojiPicker.addEventListener("click", function (e) {
        var opt = e.target.closest(".emoji-opt");
        if (!opt) return;
        selectedEmoji = opt.getAttribute("data-emoji");
        updateEmojiSelection();
      });

      document.getElementById("btnBgImg").addEventListener("click", function () { bgInput.click(); });
      bgInput.addEventListener("change", function (e) {
        readFile(e.target.files[0], function (data) {
          if (!data) return;
          tempBgImg = data;
          setBgPreview(data);
        });
        e.target.value = "";
      });
      document.getElementById("clearBgImg").addEventListener("click", function () {
        tempBgImg = "";
        setBgPreview("");
      });

      saveBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var date = dateInput.value;
        var desc = descInput.value.trim();

        if (!name) {
          showToast("请输入纪念日名称");
          nameInput.focus();
          return;
        }
        if (!date) {
          showToast("请选择日期");
          dateInput.focus();
          return;
        }

        setItem(BG_IMG_KEY, tempBgImg);
        applyBackground();

        var data = getAnniversaries();

        if (editingId !== null) {
          for (var i = 0; i < data.length; i++) {
            if (String(data[i].id) === String(editingId)) {
              data[i].name = name;
              data[i].date = date;
              data[i].emoji = selectedEmoji;
              data[i].description = desc;
              break;
            }
          }
          showToast("已更新纪念日");
        } else {
          data.push({
            id: String(Date.now()),
            name: name,
            date: date,
            emoji: selectedEmoji,
            description: desc
          });
          showToast("已添加纪念日");
        }

        saveAnniversaries(data);
        closeSheet();
        renderList();
      });

      anniList.addEventListener("click", function (e) {
        var delBtn = e.target.closest(".anni-del");
        if (delBtn) {
          e.stopPropagation();
          var id = delBtn.getAttribute("data-id");
          var data = getAnniversaries();
          data = data.filter(function (item) {
            return String(item.id) !== String(id);
          });
          saveAnniversaries(data);
          renderList();
          showToast("已删除纪念日");
          return;
        }

        var card = e.target.closest(".anni-card");
        if (card) {
          var cardId = card.getAttribute("data-id");
          var data2 = getAnniversaries();
          var found = null;
          for (var j = 0; j < data2.length; j++) {
            if (String(data2[j].id) === String(cardId)) {
              found = data2[j];
              break;
            }
          }
          if (found) openSheet(found);
        }
      });

      sheetPanel.addEventListener("touchmove", function (e) {
        e.stopPropagation();
      }, { passive: true });

      /* ---------- Init ---------- */
      applyBackground();
      renderList();
      if (window.lucide) lucide.createIcons();
    })();
  </script>

  <!-- 返回按钮兼容父iframe内嵌SPA模式（postMessage）—— 所有指向主页的返回<a>统一替换；fallback为跳转回主页 -->
<script>
  (function () {
    var nameMap = {
      'diary-new':       'diary',
      'wish-new':        'wish',
      'spark-new':       'spark',
      'anniversary-new': 'anniversary',
      'music-new':       'music',
      'call-new':        'call',
      'history-new':     'history'
    };
    var fname = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
    var extKey = nameMap[fname] || fname;
    var FALLBACK_URL = '../index-zy.html';

    window.__extAppBack = function (ev) {
      try { ev && ev.preventDefault && ev.preventDefault(); } catch(e) {}
      var inIframe = false;
      try { inIframe = (window.top !== window.self); } catch(e) { inIframe = true; }
      if (inIframe) {
        try {
          window.top.postMessage({ type: 'extapp:back', key: extKey, ts: Date.now() }, '*');
          // 300ms 兜底：如果父窗没响应/加载出错，就跳回主页
          setTimeout(function(){
            try { location.replace(FALLBACK_URL); } catch(e){}
          }, 300);
          return false;
        } catch (e) {
          location.href = FALLBACK_URL;
          return false;
        }
      } else {
        location.href = FALLBACK_URL;
        return false;
      }
    };

    // 替换所有 <a href> 指向主页 的返回/后退 <a> 链接
    function patchBackLinks() {
      var patched = 0;
      var as = document.querySelectorAll('a[href]');
      for (var i=0; i<as.length; i++) {
        var a = as[i];
        var href = a.getAttribute('href') || '';
        // 匹配：index-zy.html 或 index-new-v2.html 或 index-new.html 或 home-app.html 或 home.html
        if (href && /(index-zy|index-new-v2|index-new|home-app|home)\.html/i.test(href)) {
          var txt = (a.textContent || '').trim();
          var cls = a.className || '';
          var ddi = a.getAttribute && a.getAttribute('data-dom-id') || '';
          var label = (a.getAttribute && a.getAttribute('aria-label')) || '';
          // 只有含有 "返回/back/home/后退"语义 或 本身就是 a.back-btn / a[data-dom-id~="back"] 才替换
          var lookslikeBack = /(back-btn|back|返回|home|后退|nav-back|back-home|back-nav|返回主页|返回首页|back-home|nav-back)/i.test(cls + ' ' + ddi + ' ' + label + ' ' + txt);
          if (lookslikeBack) {
            if (a.getAttribute('data-extapp-back-patched')) continue;
            a.setAttribute('data-extapp-back-patched', '1');
            a.setAttribute('data-href-backup', href);
            a.setAttribute('href', 'javascript:void(0)');
            (function(el){
              el.addEventListener('click', function(e){ return window.__extAppBack(e); });
            })(a);
            patched++;
          }
        }
      }
      return patched;
    }

    function runPatchLoop() {
      var r1 = patchBackLinks();
      setTimeout(function(){ patchBackLinks(); }, 500);
      setTimeout(function(){ patchBackLinks(); }, 1500);
      setTimeout(function(){ patchBackLinks(); }, 3000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runPatchLoop);
    } else {
      runPatchLoop();
    }

    // 支持父窗口调用iframe里的返回函数：父窗口可直接 frame.contentWindow.extAppBackDirect()
    window.extAppBackDirect = function() { return window.__extAppBack(); };
  })();
</script>
