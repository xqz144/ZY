<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>纪念日 · 梦角传讯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../colors_and_type.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif']
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      letter-spacing: var(--tracking-normal);
    }

    /* ---- Phone frame ---- */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 30% 18%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ---- App background ---- */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 420px 260px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* ---- Starlight ---- */
    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight span {
      position: absolute; border-radius: 9999px;
      background: hsl(343 72% 68% / 0.4);
      animation: twinkle 5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; transform: scale(0.7); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }

    /* ---- Top bar ---- */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: var(--accent-color);
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 56px;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .add-btn {
      width: 34px; height: 34px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px -3px rgba(232, 116, 154, 0.4);
      transition: transform 0.15s;
    }
    .add-btn:active { transform: scale(0.9); }

    /* ---- List ---- */
    .anni-list {
      flex: 1;
      padding: 8px 16px 24px;
      position: relative;
      z-index: 1;
    }

    .anni-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 1.5px solid rgba(232, 116, 154, 0.15);
      border-radius: 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
      animation: fadeUp 0.4s cubic-bezier(.3,0,0,1) both;
      position: relative;
      cursor: pointer;
    }
    .anni-card:hover { border-color: var(--accent-color); }
    .anni-card:active { background: #fff5f8; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .anni-emoji {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #ffe4ec, #f4a0bc);
      flex-shrink: 0;
    }

    .anni-info { flex: 1; min-width: 0; }
    .anni-name {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .anni-date {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .anni-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anni-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .days-badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .days-badge.upcoming { background: rgba(232, 116, 154, 0.15); color: var(--accent-color); }
    .days-badge.passed { background: rgba(160, 128, 144, 0.12); color: var(--text-secondary); }
    .days-badge.today { background: linear-gradient(135deg, #f4a0bc, #e8749a); color: #fff; }

    .anni-del {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px; height: 22px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0.5;
      transition: opacity 0.15s, color 0.15s, background-color 0.15s;
    }
    .anni-del:active { opacity: 1; color: #e11d48; background: rgba(225, 29, 72, 0.1); }

    /* ---- Empty state ---- */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      position: relative;
      z-index: 1;
    }
    .empty-icon {
      width: 80px; height: 80px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #ffe4ec, #f4a0bc);
      margin-bottom: 20px;
      opacity: 0.7;
      animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) both;
    }
    .empty-text {
      font-family: var(--font-serif);
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-line;
      animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) 0.1s both;
    }

    /* ---- Bottom sheet ---- */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: rgba(61, 32, 48, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }

    .sheet-panel {
      background: #fff;
      border-radius: 24px 24px 0 0;
      max-height: 85%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.3,0,0,1);
      padding: 8px 20px 28px;
      box-shadow: 0 -10px 40px -10px rgba(232, 116, 154, 0.2);
      scrollbar-width: none;
    }
    .sheet-panel::-webkit-scrollbar { display: none; }
    .sheet-overlay.open .sheet-panel { transform: translateY(0); }

    .sheet-handle {
      width: 40px; height: 4px;
      border-radius: 9999px;
      background: rgba(232, 116, 154, 0.25);
      margin: 4px auto 16px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .sheet-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .sheet-close {
      width: 30px; height: 30px;
      border-radius: 9999px;
      border: none;
      background: rgba(232, 116, 154, 0.1);
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background-color 0.15s, color 0.15s;
    }
    .sheet-close:active { background: rgba(232, 116, 154, 0.2); color: var(--accent-color); }

    .field-group { margin-bottom: 18px; }
    .field-label {
      display: block;
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff;
      color: var(--text-primary);
      font-size: 15px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
    }
    .field-input::placeholder { color: var(--text-secondary); }
    .field-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(232, 116, 154, 0.1);
    }
    .field-input[type="date"] {
      color: var(--text-primary);
    }

    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .emoji-opt {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid transparent;
      background: #fff5f8;
      font-size: 1.6rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
      padding: 0;
    }
    .emoji-opt:active { transform: scale(0.92); }
    .emoji-opt.selected {
      border-color: var(--accent-color);
      background: rgba(232, 116, 154, 0.12);
    }

    .save-btn {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 16px -4px rgba(232, 116, 154, 0.35);
      transition: transform 0.15s, filter 0.15s;
      margin-top: 4px;
    }
    .save-btn:active { transform: scale(0.97); }

    /* ---- Toast ---- */
    .toast {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-primary);
      color: #fff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
      white-space: nowrap;
      box-shadow: 0 8px 24px -8px rgba(232, 116, 154, 0.3);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---- Home indicator ---- */
    .home-indicator {
      display: flex;
      justify-content: center;
      padding: 6px 0 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .home-indicator span {
      width: 130px; height: 4px;
      border-radius: 9999px;
      background: hsl(var(--foreground) / 0.25);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg" id="appBg">

      <div class="starlight" aria-hidden="true">
        <span style="top:6%;left:10%;width:2px;height:2px;animation-delay:0s"></span>
        <span style="top:14%;left:80%;width:3px;height:3px;animation-delay:0.8s"></span>
        <span style="top:28%;left:88%;width:2px;height:2px;animation-delay:1.6s"></span>
        <span style="top:45%;left:6%;width:3px;height:3px;animation-delay:1.2s"></span>
        <span style="top:62%;left:90%;width:2px;height:2px;animation-delay:2s"></span>
        <span style="top:78%;left:15%;width:3px;height:3px;animation-delay:0.4s"></span>
        <span style="top:88%;left:65%;width:2px;height:2px;animation-delay:2.8s"></span>
      </div>

      <div class="top-bar">
        <a href="index-new.html" class="back-btn">← 返回</a>
        <span class="top-title">纪念日</span>
        <button type="button" class="add-btn" id="addBtn" aria-label="添加纪念日">+</button>
      </div>

      <div class="anni-list" id="anniList"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">⭐</div>
        <div class="empty-text">还没有纪念日
点击 + 添加你们的特殊日期</div>
      </div>

      <div class="home-indicator">
        <span></span>
      </div>

    </div>

    <!-- Bottom sheet -->
    <div class="sheet-overlay" id="sheetOverlay">
      <div class="sheet-panel" id="sheetPanel">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <span class="sheet-title" id="sheetTitle">添加纪念日</span>
          <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
        </div>

        <div class="field-group">
          <label class="field-label" for="nameInput">名称</label>
          <input type="text" id="nameInput" class="field-input" placeholder="纪念日名称…" maxlength="20" />
        </div>

        <div class="field-group">
          <label class="field-label" for="dateInput">日期</label>
          <input type="date" id="dateInput" class="field-input" />
        </div>

        <div class="field-group">
          <label class="field-label">图标</label>
          <div class="emoji-picker" id="emojiPicker">
            <button type="button" class="emoji-opt selected" data-emoji="🌸">🌸</button>
            <button type="button" class="emoji-opt" data-emoji="⭐">⭐</button>
            <button type="button" class="emoji-opt" data-emoji="💕">💕</button>
            <button type="button" class="emoji-opt" data-emoji="🎂">🎂</button>
            <button type="button" class="emoji-opt" data-emoji="🌙">🌙</button>
            <button type="button" class="emoji-opt" data-emoji="✨">✨</button>
            <button type="button" class="emoji-opt" data-emoji="🎵">🎵</button>
            <button type="button" class="emoji-opt" data-emoji="🎁">🎁</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="descInput">描述（可选）</label>
          <input type="text" id="descInput" class="field-input" placeholder="补充描述…" maxlength="50" />
        </div>

        <button type="button" class="save-btn" id="saveBtn">保存</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_anniversaries";
      var EMOJI_OPTIONS = ["🌸", "⭐", "💕", "🎂", "🌙", "✨", "🎵", "🎁"];

      var anniList = document.getElementById("anniList");
      var emptyState = document.getElementById("emptyState");
      var sheetOverlay = document.getElementById("sheetOverlay");
      var sheetTitle = document.getElementById("sheetTitle");
      var sheetClose = document.getElementById("sheetClose");
      var sheetPanel = document.getElementById("sheetPanel");
      var nameInput = document.getElementById("nameInput");
      var dateInput = document.getElementById("dateInput");
      var descInput = document.getElementById("descInput");
      var emojiPicker = document.getElementById("emojiPicker");
      var saveBtn = document.getElementById("saveBtn");
      var addBtn = document.getElementById("addBtn");
      var toast = document.getElementById("toast");
      var toastTimer;

      var editingId = null;
      var selectedEmoji = "🌸";

      /* ---------- Utilities ---------- */

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      function getAnniversaries() {
        try {
          var v = localStorage.getItem(STORAGE_KEY);
          if (v) {
            var arr = JSON.parse(v);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }

      function saveAnniversaries(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } catch (e) {}
      }

      function toDateStr(d) {
        return d.getFullYear() + "-" +
          String(d.getMonth() + 1).padStart(2, "0") + "-" +
          String(d.getDate()).padStart(2, "0");
      }

      function formatDate(dateStr) {
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return dateStr;
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      function calcAnniversaryDays(dateStr) {
        var date = new Date(dateStr + "T00:00:00");
        var now = new Date();
        now.setHours(0, 0, 0, 0);

        // This year's occurrence
        var thisYear = new Date(now.getFullYear(), date.getMonth(), date.getDate());

        var diff = Math.floor((thisYear - now) / 86400000);

        if (diff === 0) return { days: 0, status: "today" };
        if (diff > 0) return { days: diff, status: "upcoming" };

        // Past this year, check next year
        return { days: Math.abs(diff), status: "passed" };
      }

      /* Sort key: upcoming/today first (tier 0), passed after (tier 1).
         Within tier 0, sort by days ascending (today=0 first).
         Within tier 1, sort by next-year occurrence ascending (365-days). */
      function sortValue(info) {
        if (info.status === "passed") {
          return { tier: 1, sub: 365 - info.days };
        }
        return { tier: 0, sub: info.days };
      }

      /* ---------- Rendering ---------- */

      function renderList() {
        var data = getAnniversaries();

        if (data.length === 0) {
          anniList.innerHTML = "";
          anniList.style.display = "none";
          emptyState.style.display = "flex";
          return;
        }

        emptyState.style.display = "none";
        anniList.style.display = "block";

        // Attach computed info for sorting
        var enriched = data.map(function (item) {
          var info = calcAnniversaryDays(item.date);
          return { item: item, info: info, sortKey: sortValue(info) };
        });

        enriched.sort(function (a, b) {
          if (a.sortKey.tier !== b.sortKey.tier) return a.sortKey.tier - b.sortKey.tier;
          return a.sortKey.sub - b.sortKey.sub;
        });

        anniList.innerHTML = enriched.map(function (entry, idx) {
          var item = entry.item;
          var info = entry.info;
          var delay = (idx * 0.05).toFixed(2);

          var badgeText, badgeClass;
          if (info.status === "today") {
            badgeText = "🎉 今天！";
            badgeClass = "today";
          } else if (info.status === "upcoming") {
            badgeText = "还有 " + info.days + " 天";
            badgeClass = "upcoming";
          } else {
            badgeText = "已 " + info.days + " 天";
            badgeClass = "passed";
          }

          var descHtml = item.description
            ? '<div class="anni-desc">' + escapeHtml(item.description) + '</div>'
            : '';

          return (
            '<div class="anni-card" data-id="' + escapeHtml(item.id) + '" style="animation-delay:' + delay + 's">' +
              '<div class="anni-emoji">' + escapeHtml(item.emoji || '🌸') + '</div>' +
              '<div class="anni-info">' +
                '<div class="anni-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="anni-date">' + escapeHtml(formatDate(item.date)) + '</div>' +
                descHtml +
              '</div>' +
              '<div class="anni-right">' +
                '<span class="days-badge ' + badgeClass + '">' + badgeText + '</span>' +
              '</div>' +
              '<button type="button" class="anni-del" data-id="' + escapeHtml(item.id) + '" aria-label="删除">×</button>' +
            '</div>'
          );
        }).join("");
      }

      /* ---------- Sheet management ---------- */

      function openSheet(item) {
        if (item) {
          editingId = item.id;
          sheetTitle.textContent = "编辑纪念日";
          nameInput.value = item.name || "";
          dateInput.value = item.date || toDateStr(new Date());
          descInput.value = item.description || "";
          selectedEmoji = item.emoji || "🌸";
        } else {
          editingId = null;
          sheetTitle.textContent = "添加纪念日";
          nameInput.value = "";
          dateInput.value = toDateStr(new Date());
          descInput.value = "";
          selectedEmoji = "🌸";
        }
        updateEmojiSelection();
        sheetOverlay.classList.add("open");
        setTimeout(function () { nameInput.focus(); }, 300);
      }

      function closeSheet() {
        sheetOverlay.classList.remove("open");
        editingId = null;
      }

      function updateEmojiSelection() {
        var opts = emojiPicker.querySelectorAll(".emoji-opt");
        opts.forEach(function (opt) {
          if (opt.getAttribute("data-emoji") === selectedEmoji) {
            opt.classList.add("selected");
          } else {
            opt.classList.remove("selected");
          }
        });
      }

      /* ---------- Event handlers ---------- */

      addBtn.addEventListener("click", function () {
        openSheet(null);
      });

      sheetClose.addEventListener("click", closeSheet);

      sheetOverlay.addEventListener("click", function (e) {
        if (e.target === sheetOverlay) closeSheet();
      });

      emojiPicker.addEventListener("click", function (e) {
        var opt = e.target.closest(".emoji-opt");
        if (!opt) return;
        selectedEmoji = opt.getAttribute("data-emoji");
        updateEmojiSelection();
      });

      saveBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var date = dateInput.value;
        var desc = descInput.value.trim();

        if (!name) {
          showToast("请输入纪念日名称");
          nameInput.focus();
          return;
        }
        if (!date) {
          showToast("请选择日期");
          dateInput.focus();
          return;
        }

        var data = getAnniversaries();

        if (editingId !== null) {
          // Update existing
          for (var i = 0; i < data.length; i++) {
            if (String(data[i].id) === String(editingId)) {
              data[i].name = name;
              data[i].date = date;
              data[i].emoji = selectedEmoji;
              data[i].description = desc;
              break;
            }
          }
          showToast("已更新纪念日");
        } else {
          // Add new
          data.push({
            id: String(Date.now()),
            name: name,
            date: date,
            emoji: selectedEmoji,
            description: desc
          });
          showToast("已添加纪念日");
        }

        saveAnniversaries(data);
        closeSheet();
        renderList();
      });

      // Delegate clicks for card edit and delete
      anniList.addEventListener("click", function (e) {
        var delBtn = e.target.closest(".anni-del");
        if (delBtn) {
          e.stopPropagation();
          var id = delBtn.getAttribute("data-id");
          var data = getAnniversaries();
          data = data.filter(function (item) {
            return String(item.id) !== String(id);
          });
          saveAnniversaries(data);
          renderList();
          showToast("已删除纪念日");
          return;
        }

        var card = e.target.closest(".anni-card");
        if (card) {
          var cardId = card.getAttribute("data-id");
          var data2 = getAnniversaries();
          var found = null;
          for (var j = 0; j < data2.length; j++) {
            if (String(data2[j].id) === String(cardId)) {
              found = data2[j];
              break;
            }
          }
          if (found) openSheet(found);
        }
      });

      // Prevent body scroll when sheet is open
      sheetPanel.addEventListener("touchmove", function (e) {
        e.stopPropagation();
      }, { passive: true });

      // Initial render
      renderList();
    })();
  </script>
</body>
</html>
