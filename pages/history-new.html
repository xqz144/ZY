/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {

  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');

body {

}

::-webkit-scrollbar-thumb { background: rgba(var(--accent-color-rgb), 0.35); border-radius: 4px; }

    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>

<script>
/* 从父窗口同步主题色/字体到 iframe 内（配合主站外观设置） */
(function () {
  try {
    var inIframe = false;
    try { inIframe = (window.top !== window.self); } catch (e) { inIframe = true; }
    function applyColorThemeFromParent() {
      try {
        var parentRoot = null;
        try { parentRoot = window.parent.document.documentElement; } catch (e) { parentRoot = null; }
        if (parentRoot) {
          var t = parentRoot.getAttribute('data-color-theme');
          if (t) document.documentElement.setAttribute('data-color-theme', t);
          var dt = parentRoot.getAttribute('data-theme');
          if (dt) document.documentElement.setAttribute('data-theme', dt);
          if (dt === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
          /* 同步字体变量（用户在外观设置里配置的自定义字体） */
          var fv = parentRoot.style.getPropertyValue('--font-family');
          if (fv) document.documentElement.style.setProperty('--font-family', fv);
          var mfv = parentRoot.style.getPropertyValue('--message-font-family');
          if (mfv) document.documentElement.style.setProperty('--message-font-family', mfv);
          var fs = parentRoot.style.getPropertyValue('--font-size');
          if (fs) document.documentElement.style.setProperty('--font-size', fs);
        }
      } catch (e) {}
    }
    applyColorThemeFromParent();
    if (inIframe) {
      window.addEventListener('message', function (ev) {
        var d = ev.data || {};
        if (d.type === 'theme:sync' || d.colorTheme || d.theme) {
          if (d.colorTheme) document.documentElement.setAttribute('data-color-theme', d.colorTheme);
          if (d.theme) {
            document.documentElement.setAttribute('data-theme', d.theme);
            if (d.theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
          }
          /* 同步字体 CSS 变量 */
          if (d.fontFamily) document.documentElement.style.setProperty('--font-family', d.fontFamily);
          if (d.messageFontFamily) document.documentElement.style.setProperty('--message-font-family', d.messageFontFamily);
          if (d.fontSize) document.documentElement.style.setProperty('--font-size', d.fontSize);
          applyColorThemeFromParent();
        }
      });
      setInterval(applyColorThemeFromParent, 2500);
    }
  } catch (e) {}
})();
</script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: hsl(var(--foreground));
      letter-spacing: var(--tracking-normal);
    }

    /* ===== Phone frame ===== */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
    }
    @media (min-width: 480px) {
      .phone-frame {
        height: 860px;
        border-radius: 40px;
        border: 10px solid #e8ddd8;
        box-shadow: var(--shadow-xl), 0 0 0 4px hsl(var(--primary) / 0.12);
      }
      .phone-frame::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: #d8ccc8;
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ===== App background ===== */
    .app-bg {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 480px 280px at 15% 0%, hsl(var(--primary) / 0.14), transparent 60%),
        radial-gradient(ellipse 360px 220px at 95% 8%, hsl(var(--primary) / 0.10), transparent 55%),
        var(--primary-bg);
    }

    /* ===== Doodles ===== */
    .doodles { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; color: hsl(var(--primary) / 0.28); }
    .doodle { position: absolute; animation: float 5s ease-in-out infinite; }

    /* ===== Top bar ===== */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 15px;
      color: hsl(var(--primary));
      text-decoration: none;
      padding: 6px 10px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 56px;
      border-radius: 9999px;
      transition: background 0.15s;
    }
    .back-btn::before { content: '←'; margin-right: 2px; }
    .back-btn:active { background: hsl(var(--primary) / 0.12); }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: hsl(var(--foreground));
      text-align: center;
      flex: 1;
      margin: 0;
      text-wrap: balance;
      word-break: keep-all;
    }
    .clear-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: hsl(var(--destructive));
      background: hsl(var(--destructive) / 0.08);
      border: 1px solid hsl(var(--destructive) / 0.18);
      border-radius: 9999px;
      padding: 6px 14px;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 56px;
      font-family: var(--font-sans);
      font-weight: 500;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .clear-btn:active { background: hsl(var(--destructive) / 0.16); }
    .clear-btn.armed {
      background: hsl(var(--destructive));
      color: hsl(var(--destructive-foreground));
      border-color: transparent;
      box-shadow: 0 4px 12px -2px hsl(var(--destructive) / 0.35);
    }

    /* ===== Stats widgets ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 16px 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
    .stat-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: hsl(var(--card));
      border-radius: 20px;
      padding: 12px 6px;
      box-shadow: var(--shadow-sm);
      border: 1px solid hsl(var(--border));
      min-width: 0;
    }
    .stat-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--accent));
      color: hsl(var(--primary));
    }
    .stat-svg { width: 15px; height: 15px; }
    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: hsl(var(--foreground));
      line-height: 1;
      white-space: nowrap;
    }
    .stat-label {
      font-size: 11px;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
    }

    /* ===== Tab bar ===== */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 5px;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
      background: hsl(var(--muted));
      border-radius: 9999px;
      margin: 0 16px 14px;
      border: 1px solid hsl(var(--border));
    }
    .tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border-radius: 9999px;
      border: none;
      background: transparent;
      font-size: 14px;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      font-weight: 500;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      box-shadow: var(--shadow-sm);
    }
    .tab-btn:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }

    /* ===== Content area ===== */
    .content-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px 16px;
      scrollbar-width: none;
      position: relative;
      z-index: 1;
    }
    .content-area::-webkit-scrollbar { display: none; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ===== Timeline (card history) ===== */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      padding-left: 4px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: linear-gradient(to bottom, hsl(var(--primary) / 0.35), hsl(var(--primary) / 0.08));
      border-radius: 9999px;
    }
    .timeline-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.45s cubic-bezier(.3, 0, 0, 1) both;
    }
    .timeline-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--card));
      border: 2px solid hsl(var(--primary) / 0.35);
      box-shadow: var(--shadow-sm);
      color: hsl(var(--primary));
    }
    .timeline-dot svg { width: 18px; height: 18px; }
    .timeline-card {
      flex: 1;
      min-width: 0;
      background: hsl(var(--card));
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid hsl(var(--border));
    }
    .timeline-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: hsl(var(--primary));
      margin-bottom: 8px;
      background: hsl(var(--accent));
      padding: 3px 10px;
      border-radius: 9999px;
      width: fit-content;
      font-weight: 500;
      white-space: nowrap;
    }
    .timeline-date svg { width: 11px; height: 11px; }
    .timeline-text {
      font-size: 15px;
      line-height: 1.65;
      color: hsl(var(--foreground));
      margin: 0;
      word-break: break-word;
    }

    /* ===== Chat history ===== */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .date-sep {
      display: flex;
      justify-content: center;
      padding: 10px 0 2px;
    }
    .date-sep span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      background: hsl(var(--accent));
      padding: 3px 14px;
      border-radius: 9999px;
      white-space: nowrap;
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 100%;
      animation: msgFadeIn 0.3s cubic-bezier(.3, 0, 0, 1) both;
    }
    .msg-row.right { justify-content: flex-end; }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: hsl(var(--primary));
      background: hsl(var(--accent));
      border: 2px solid hsl(var(--card));
      overflow: hidden;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 76%;
    }
    .msg-row.right .msg-col { align-items: flex-end; }
    .message-sent,
    .message-received {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      color: hsl(var(--foreground));
      box-shadow: var(--shadow-sm);
    }
    .message-received { border-radius: 18px 18px 18px 4px; }
    .message-sent { border-radius: 18px 18px 4px 18px; background: hsl(var(--primary) / 0.14); }
    .msg-time {
      font-size: 11px;
      color: hsl(var(--muted-foreground));
      padding: 0 4px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ===== Empty state ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px 32px;
      color: hsl(var(--muted-foreground));
    }
    .empty-icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: hsl(var(--accent));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: hsl(var(--primary));
      margin-bottom: 16px;
    }
    .empty-icon svg { width: 38px; height: 38px; }
    .empty-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: hsl(var(--foreground));
      margin: 0 0 6px;
    }
    .empty-sub {
      font-size: 13px;
      margin: 0 0 18px;
      line-height: 1.6;
    }
    .empty-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 14px;
      color: hsl(var(--primary-foreground));
      text-decoration: none;
      background: hsl(var(--primary));
      padding: 9px 22px;
      border-radius: 9999px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s;
      white-space: nowrap;
    }
    .empty-link:active { transform: scale(0.96); }
    .empty-link svg { width: 14px; height: 14px; }

    /* ===== Toast ===== */
    .toast {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
      white-space: nowrap;
      max-width: 88%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Animations ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    lucide.createIcons();
  </script>

  <script>
    (function () {
      "use strict";

      var CARD_KEY = "mengjiao_card_history";
      var CHAT_KEY = "mengjiao_chat_messages";
      var DREAM_IMG_KEY = "mengjiao_dream_img";

      var cardPanel = document.getElementById("cardPanel");
      var chatPanel = document.getElementById("chatPanel");
      var contentArea = document.getElementById("contentArea");
      var clearBtn = document.getElementById("clearBtn");
      var toast = document.getElementById("toast");
      var tabBtns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
      var statCards = document.getElementById("statCards");
      var statChats = document.getElementById("statChats");
      var statDays = document.getElementById("statDays");

      var currentTab = "card";
      var toastTimer;
      var clearArmed = false;
      var clearTimer;

      /* ---- helpers ---- */
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function readJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return fallback;
      }

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" +
          String(d.getMonth() + 1).padStart(2, "0") + "-" +
          String(d.getDate()).padStart(2, "0");
      }

      function formatDateLabel(dateStr) {
        if (!dateStr) return "";
        var parts = String(dateStr).split("-");
        if (parts.length < 3) return escapeHtml(dateStr);
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        var d = parseInt(parts[2], 10);
        if (!y || !m || !d) return escapeHtml(dateStr);
        var now = new Date();
        if (y === now.getFullYear() && m === (now.getMonth() + 1) && d === now.getDate()) {
          return "今天";
        }
        if (y === now.getFullYear() && m === (now.getMonth() + 1) && d === now.getDate() - 1) {
          return "昨天";
        }
        return m + "月" + d + "日";
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
      }

      function avatarHtml() {
        var img = "";
        try { img = localStorage.getItem(DREAM_IMG_KEY) || ""; } catch (e) {}
        if (img) {
          return '<div class="msg-avatar" aria-hidden="true">' +
            '<img src="' + escapeHtml(img) + '" alt="" /></div>';
        }
        return '<div class="msg-avatar" aria-hidden="true">梦</div>';
      }

      /* ---- stats ---- */
      function updateStats() {
        var cards = readJSON(CARD_KEY, []);
        var chats = readJSON(CHAT_KEY, []);
        var dates = {};
        cards.forEach(function (item) { if (item.date) dates[item.date] = true; });
        chats.forEach(function (msg) { if (msg.date) dates[msg.date] = true; });
        statCards.textContent = String(cards.length);
        statChats.textContent = String(chats.length);
        statDays.textContent = String(Object.keys(dates).length);
      }

      /* ---- empty state ---- */
      function emptyState(title, sub, link, linkLabel, iconName) {
        return '<div class="empty-state">' +
          '<div class="empty-icon"><i data-lucide="' + iconName + '"></i></div>' +
          '<p class="empty-title">' + escapeHtml(title) + '</p>' +
          '<p class="empty-sub">' + escapeHtml(sub) + '</p>' +
          '<a href="' + escapeHtml(link) + '" class="empty-link">' + escapeHtml(linkLabel) + '<i data-lucide="arrow-right"></i></a>' +
        '</div>';
      }

      /* ---- render: card history (timeline) ---- */
      function renderCard() {
        var data = readJSON(CARD_KEY, []);
        updateStats();
        if (!data.length) {
          cardPanel.innerHTML = emptyState(
            "字卡记录为空", "去抽一张字卡，把梦角的寄语留下来吧", "cards-new.html", "去抽字卡", "sparkles");
          lucide.createIcons();
          return;
        }
        var html = '<div class="timeline">';
        data.forEach(function (item, i) {
          var delay = Math.min(i * 0.05, 0.45);
          var dateLabel = formatDateLabel(item.date || todayStr());
          var time = escapeHtml(item.time || "");
          var meta = dateLabel + (time ? (" · " + time) : "");
          html += '<article class="timeline-item" style="animation-delay:' + delay + 's">' +
            '<div class="timeline-dot" aria-hidden="true"><i data-lucide="sparkles"></i></div>' +
            '<div class="timeline-card">' +
              '<div class="timeline-date"><i data-lucide="calendar-heart"></i><span>' + meta + '</span></div>' +
              '<p class="timeline-text">' + escapeHtml(item.reply || "") + '</p>' +
            '</div>' +
          '</article>';
        });
        html += '</div>';
        cardPanel.innerHTML = html;
        lucide.createIcons();
      }

      /* ---- render: chat history ---- */
      function renderChat() {
        var data = readJSON(CHAT_KEY, []);
        updateStats();
        if (!data.length) {
          chatPanel.innerHTML = emptyState(
            "对话记录为空", "和梦角说说话，把每个温柔的瞬间都存下来", "chat-new.html", "去聊天", "message-circle-heart");
          lucide.createIcons();
          return;
        }
        var html = '<div class="chat-list">';
        var lastDate = null;
        data.forEach(function (msg) {
          var d = msg.date || todayStr();
          if (d !== lastDate) {
            html += '<div class="date-sep"><span>' + formatDateLabel(d) + '</span></div>';
            lastDate = d;
          }
          var isRight = msg.side === "right";
          html += '<div class="msg-row' + (isRight ? " right" : "") + '">';
          if (!isRight) html += avatarHtml();
          html += '<div class="msg-col">' +
            '<div class="' + (isRight ? "message-sent" : "message-received") + '">' +
              escapeHtml(msg.text || "") +
            '</div>' +
            '<span class="msg-time">' + escapeHtml(msg.time || "") + '</span>' +
          '</div></div>';
        });
        html += '</div>';
        chatPanel.innerHTML = html;
      }

      function render() {
        if (currentTab === "card") renderCard();
        else renderChat();
        contentArea.scrollTop = 0;
      }

      /* ---- tabs ---- */
      function switchTab(tab) {
        if (tab === currentTab) return;
        currentTab = tab;
        tabBtns.forEach(function (b) {
          var active = b.getAttribute("data-tab") === tab;
          b.classList.toggle("active", active);
          b.setAttribute("aria-selected", active ? "true" : "false");
        });
        cardPanel.classList.toggle("active", tab === "card");
        chatPanel.classList.toggle("active", tab === "chat");
        resetClear();
        render();
      }

      tabBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchTab(btn.getAttribute("data-tab"));
        });
      });

      /* ---- clear (inline two-step confirm) ---- */
      function resetClear() {
        clearArmed = false;
        clearBtn.textContent = "清空";
        clearBtn.classList.remove("armed");
        clearTimeout(clearTimer);
      }

      function doClear() {
        if (currentTab === "card") {
          try { localStorage.removeItem(CARD_KEY); } catch (e) {}
          renderCard();
          showToast("已清空字卡记录");
        } else {
          try { localStorage.removeItem(CHAT_KEY); } catch (e) {}
          renderChat();
          showToast("已清空对话记录");
        }
        updateStats();
        contentArea.scrollTop = 0;
      }

      clearBtn.addEventListener("click", function () {
        if (!clearArmed) {
          clearArmed = true;
          clearBtn.textContent = "确认清空";
          clearBtn.classList.add("armed");
          var msg = currentTab === "card"
            ? "确定要清空字卡记录吗？再次点击确认"
            : "确定要清空对话记录吗？再次点击确认";
          showToast(msg);
          clearTimeout(clearTimer);
          clearTimer = setTimeout(resetClear, 3000);
        } else {
          clearTimeout(clearTimer);
          resetClear();
          doClear();
        }
      });

      /* ---- init ---- */
      render();
    })();
  </script>

  <!-- 返回按钮兼容父iframe内嵌SPA模式（postMessage）—— 所有指向主页的返回<a>统一替换；fallback为跳转回主页 -->
<script>
  (function () {
    var nameMap = {
      'diary-new':       'diary',
      'wish-new':        'wish',
      'spark-new':       'spark',
      'anniversary-new': 'anniversary',
      'music-new':       'music',
      'call-new':        'call',
      'history-new':     'history'
    };
    var fname = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
    var extKey = nameMap[fname] || fname;
    var FALLBACK_URL = '../index-zy.html';

    window.__extAppBack = function (ev) {
      try { ev && ev.preventDefault && ev.preventDefault(); } catch(e) {}
      var inIframe = false;
      try { inIframe = (window.top !== window.self); } catch(e) { inIframe = true; }
      if (inIframe) {
        try {
          window.top.postMessage({ type: 'extapp:back', key: extKey, ts: Date.now() }, '*');
          // 300ms 兜底：如果父窗没响应/加载出错，就跳回主页
          setTimeout(function(){
            try { location.replace(FALLBACK_URL); } catch(e){}
          }, 300);
          return false;
        } catch (e) {
          location.href = FALLBACK_URL;
          return false;
        }
      } else {
        location.href = FALLBACK_URL;
        return false;
      }
    };

    // 替换所有 <a href> 指向主页 的返回/后退 <a> 链接
    function patchBackLinks() {
      var patched = 0;
      var as = document.querySelectorAll('a[href]');
      for (var i=0; i<as.length; i++) {
        var a = as[i];
        var href = a.getAttribute('href') || '';
        // 匹配：index-zy.html 或 index-new-v2.html 或 index-new.html 或 home-app.html 或 home.html
        if (href && /(index-zy|index-new-v2|index-new|home-app|home)\.html/i.test(href)) {
          var txt = (a.textContent || '').trim();
          var cls = a.className || '';
          var ddi = a.getAttribute && a.getAttribute('data-dom-id') || '';
          var label = (a.getAttribute && a.getAttribute('aria-label')) || '';
          // 只有含有 "返回/back/home/后退"语义 或 本身就是 a.back-btn / a[data-dom-id~="back"] 才替换
          var lookslikeBack = /(back-btn|back|返回|home|后退|nav-back|back-home|back-nav|返回主页|返回首页|back-home|nav-back)/i.test(cls + ' ' + ddi + ' ' + label + ' ' + txt);
          if (lookslikeBack) {
            if (a.getAttribute('data-extapp-back-patched')) continue;
            a.setAttribute('data-extapp-back-patched', '1');
            a.setAttribute('data-href-backup', href);
            a.setAttribute('href', 'javascript:void(0)');
            (function(el){
              el.addEventListener('click', function(e){ return window.__extAppBack(e); });
            })(a);
            patched++;
          }
        }
      }
      return patched;
    }

    function runPatchLoop() {
      var r1 = patchBackLinks();
      setTimeout(function(){ patchBackLinks(); }, 500);
      setTimeout(function(){ patchBackLinks(); }, 1500);
      setTimeout(function(){ patchBackLinks(); }, 3000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runPatchLoop);
    } else {
      runPatchLoop();
    }

    // 支持父窗口调用iframe里的返回函数：父窗口可直接 frame.contentWindow.extAppBackDirect()
    window.extAppBackDirect = function() { return window.__extAppBack(); };
  })();
</script>
