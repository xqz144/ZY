<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>家园装修</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fef8ef 0%, #f4ead9 100%);
      color: #5a4a42; user-select: none; touch-action: none;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ===== 顶栏 ===== */
    .topbar {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(210,190,170,0.3);
      z-index: 20;
    }
    .coins {
      display: flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg, #fff5d6, #ffe9a8);
      padding: 5px 12px; border-radius: 20px; font-size: 15px; font-weight: 700;
      color: #b8860b; box-shadow: 0 2px 6px rgba(200,160,50,0.15);
    }
    .room-name { flex: 1; text-align: center; font-size: 16px; font-weight: 600; color: #7a5c4a; }
    .topbtn {
      padding: 5px 12px; border: none; border-radius: 16px;
      background: #fff; color: #7a5c4a; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 6px rgba(160,130,100,0.12);
    }
    .topbtn:active { transform: scale(0.93); }
    .topbtn.zoom { width: 32px; padding: 5px 0; text-align: center; }

    /* ===== 房间视口 ===== */
    .room-area {
      flex: 1; overflow: hidden; position: relative;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(255,225,180,0.4), transparent 60%),
        linear-gradient(180deg, #fbf2df 0%, #f4e6c8 100%);
    }
    .room-stage {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-origin: 50% 50%;
    }
    .room-root {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-origin: 50% 50%;
    }

    /* ===== 等距房间（SVG 构建）===== */
    .house-svg {
      position: absolute;
      top: 50%; left: 50%;
      transform-origin: 0 0;
      overflow: visible;
      pointer-events: none;
    }
    .house-svg .floor  { pointer-events: auto; }
    .house-svg .wall   { pointer-events: none; }
    .house-svg .stair  { pointer-events: none; }

    /* ===== 家具层 ===== */
    .furniture-layer {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      transform-origin: 0 0;
      pointer-events: none;
    }
    .placed-item {
      position: absolute; pointer-events: auto; cursor: grab;
      transform-origin: 50% 95%;
      will-change: transform;
    }
    .placed-item img {
      width: 100%; height: 100%; object-fit: contain;
      display: block;
      pointer-events: none; -webkit-user-drag: none;
      filter: drop-shadow(0 6px 4px rgba(80,55,20,0.18));
    }
    .placed-item.selected {
      z-index: 999;
    }
    .placed-item.selected img {
      filter:
        drop-shadow(0 0 0 #6a3cff)
        drop-shadow(0 8px 6px rgba(154,126,255,0.45));
    }
    .placed-item.selected::after {
      content: '';
      position: absolute;
      left: 15%; right: 15%; bottom: -2px; height: 10px;
      background: rgba(154,126,255,0.25);
      border-radius: 50%;
      filter: blur(4px);
    }
    .placed-item.dragging { cursor: grabbing; opacity: 0.82; z-index: 1000; }
    .placed-item.placing-ghost { opacity: 0.55; pointer-events: none; }

    .furn-halo-ok, .furn-halo-bad {
      position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 60%);
      width: 80%; height: 18px; border-radius: 50%;
      filter: blur(6px); opacity: 0.75;
      pointer-events: none;
    }
    .furn-halo-ok  { background: rgba(120,220,130,0.7); }
    .furn-halo-bad { background: rgba(240,120,110,0.7); }

    /* ===== 选中操作栏 ===== */
    .action-bar {
      flex-shrink: 0; display: flex; gap: 10px; justify-content: center;
      padding: 8px 14px; background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px); border-top: 1px solid rgba(210,190,170,0.3);
      z-index: 20;
    }
    .action-bar button {
      padding: 8px 18px; border: none; border-radius: 18px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: transform 0.15s;
    }
    .action-bar button:active { transform: scale(0.92); }
    .btn-rotate  { background: linear-gradient(135deg, #c8b6ff, #9a7eff); color: #fff; }
    .btn-recycle { background: linear-gradient(135deg, #ffc8b6, #ff8a6a); color: #fff; }
    .btn-cancel  { background: #eee; color: #888; }

    /* ===== 底部面板 ===== */
    .bottom-panel {
      flex-shrink: 0; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); border-top: 1px solid rgba(210,190,170,0.3);
      max-height: 38vh; display: flex; flex-direction: column; z-index: 20;
    }
    .panel-tabs { display: flex; border-bottom: 2px solid rgba(210,190,170,0.2); }
    .panel-tab {
      flex: 1; padding: 10px; border: none; background: none;
      font-size: 14px; font-weight: 600; color: #aaa; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s;
    }
    .panel-tab.active { color: #9a7eff; border-bottom-color: #9a7eff; }

    .panel-content { flex: 1; overflow-y: auto; padding: 10px 12px; }

    /* 分类条 */
    .cat-bar { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
    .cat-chip {
      padding: 4px 12px; border-radius: 14px; font-size: 12px; white-space: nowrap;
      background: #f0e8da; color: #8a7a6a; cursor: pointer; transition: all 0.15s;
    }
    .cat-chip.active { background: #9a7eff; color: #fff; }

    /* 家具卡片网格 */
    .furniture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    .furniture-card {
      background: #fff; border-radius: 12px; padding: 8px; text-align: center;
      box-shadow: 0 2px 8px rgba(160,130,100,0.1); cursor: pointer;
      transition: transform 0.12s; border: 2px solid transparent;
    }
    .furniture-card:active { transform: scale(0.93); }
    .furniture-card.owned { border-color: #8ce08a; }
    .furniture-card.selected { border-color: #9a7eff; box-shadow: 0 0 0 2px rgba(154,126,255,0.2); }
    .furniture-card.cant-afford { opacity: 0.5; }
    .furniture-card .fc-img {
      width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #faf6f0 0%, #f3e8d4 100%);
      border-radius: 10px; margin-bottom: 4px; overflow: hidden;
    }
    .furniture-card .fc-img img { width: 86%; height: 86%; object-fit: contain; }
    .furniture-card .fc-name  { font-size: 12px; font-weight: 600; color: #5a4a42; }
    .furniture-card .fc-price { font-size: 11px; color: #c09020; font-weight: 600; }
    .furniture-card .fc-count { font-size: 11px; color: #4aa854; font-weight: 600; }
    .furniture-card .fc-size  { font-size: 10px; color: #aaa; }

    /* Toast */
    .toast {
      position: fixed; bottom: 42vh; left: 50%; transform: translateX(-50%);
      background: rgba(70,55,45,0.88); color: #fff; padding: 8px 18px;
      border-radius: 20px; font-size: 13px; z-index: 99999; pointer-events: none;
      opacity: 0; transition: opacity 0.25s, bottom 0.25s;
    }
    .toast.show { opacity: 1; bottom: calc(42vh + 10px); }

    /* 放置模式提示 */
    .place-hint {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
      background: rgba(154,126,255,0.92); color: #fff; padding: 6px 16px;
      border-radius: 16px; font-size: 13px; z-index: 50; pointer-events: none;
      box-shadow: 0 4px 12px rgba(154,126,255,0.25);
    }

    /* 空库存提示 */
    .empty-hint { text-align: center; padding: 30px 0; color: #bbb; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="coins">💰 <span id="coinCount">1000</span></div>
    <div class="room-name">我的小窝</div>
    <button class="topbtn zoom" id="zoomOut" title="缩小">−</button>
    <button class="topbtn zoom" id="zoomIn" title="放大">+</button>
  </div>

  <!-- 房间视口（支持缩放/平移） -->
  <div class="room-area" id="roomArea">
    <div class="room-stage" id="roomStage">
      <div class="room-root" id="roomRoot">
        <!-- SVG 房子 -->
        <svg class="house-svg" id="houseSvg"></svg>
        <!-- 家具层 -->
        <div class="furniture-layer" id="furnitureLayer"></div>
      </div>
    </div>
  </div>

  <!-- 选中操作栏 -->
  <div class="action-bar" id="actionBar" style="display:none;">
    <button class="btn-rotate"  id="btnRotate">🔄 旋转</button>
    <button class="btn-recycle" id="btnRecycle">♻️ 收回</button>
    <button class="btn-cancel"  id="btnCancel">✕ 取消</button>
  </div>

  <!-- 放置提示 -->
  <div class="place-hint" id="placeHint" style="display:none;">点击任意地板位置放置家具</div>

  <!-- 底部面板 -->
  <div class="bottom-panel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="shop">🛒 商店</button>
      <button class="panel-tab" data-tab="inventory">📦 库存</button>
    </div>
    <div class="panel-content" id="shopPanel">
      <div class="cat-bar" id="catBar"></div>
      <div class="furniture-grid" id="shopGrid"></div>
    </div>
    <div class="panel-content" id="inventoryPanel" style="display:none;">
      <div class="furniture-grid" id="invGrid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========================================================================
 * 家园装修 v2
 *   - 等距户型图（2层楼 + 楼梯 + 门 + 泳池 + 帐篷尖顶挂布）
 *   - 家具按 1×1 / 1×2 / 2×2 / 2×1 / 3×2 等“世界单位”自由摆放，取消网格强制对齐
 *   - 支持滚轮/双指缩放 + 拖拽平移 + 触摸手势
 *   - 家具去白底（drop-shadow + object-fit: contain）
 * ====================================================================== */

var STORAGE_KEY = 'leisureHomeDecor';

/* ---- 等距几何常量 ---- */
var ISO_UNIT = 34;               // 1 世界单位 = 等距 tile 的边长（像素，在 scale=1 下）
var ISO_W = ISO_UNIT * 2;        // 等距 tile 宽
var ISO_H = ISO_UNIT;            // 等距 tile 高
var FLOOR_H = 72;                // 一层楼的高度（墙高）
var STAIRS_H = FLOOR_H;          // 楼梯总高度
var STAIRS_W = ISO_UNIT * 3;     // 楼梯宽度（3 个 tile）

/* ---- 户型定义（世界坐标系统：col, row, floor） ----
 *   floor 0  = 一层（底层）
 *   floor 1  = 二层（上层）
 *   每一层是一个矩形地板区域，用 { x0, x1, y0, y1, floor } 表示矩形
 *   （x0/x1 是 col 范围，左闭右开；y0/y1 是 row 范围，左闭右开）
 */
var FLOORS = [
  // 一层（主入口 + 泳池旁露台 + 楼梯区）
  { x0: 0, x1: 9, y0: 0, y1: 7, floor: 0, color: '#f6e8d0', border: '#d6bf98' },
  // 二层（楼上大房间）
  { x0: 2, x1: 8, y0: 1, y1: 5, floor: 1, color: '#f3e3c8', border: '#cdb283' }
];
/* 泳池矩形（渲染成浅蓝色平台在一层右侧） */
var POOL = { x0: 9, x1: 12, y0: 3, y1: 6, floor: -0.35, color: '#b7e1f0', border: '#7eb9d1' };

/* 楼梯位置（从一层到二层）：方向沿 row 增加方向向上，终点(y=5)正好落在二层地板(y≤5)范围内 */
var STAIRS = { x0: 1, x1: 2, y0: 2, y1: 5, floor: 0, color: '#c9a279', edge: '#9d7a55' };

/* 墙壁颜色 */
var WALL_COLOR = {
  left:   '#e8c896',   /* 左墙（偏亮） */
  right:  '#c9a36e',   /* 右墙（偏暗，受光少） */
  back:   '#f2dab2',   /* 后墙（最亮，受光面） */
  edge:   '#9d7548',   /* 墙线 */
  leftDark: '#c4a374', /* 左墙暗部 */
  rightDark: '#a07e4e',/* 右墙暗部 */
  backDark: '#d8bc8e'  /* 后墙暗部 */
};

/* ---- 家具定义 ----
 *   每个家具 w/h 是等距 tile 单位（不是像素）
 *   displayScale 让图像显示时略小/大
 */
var FURNITURE = [
  /* —— 客厅 —— */
  { id: 'sofa',                 name: '奶油沙发',       img: '../assets/furniture/sofa.jpg',                 price: 200, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-retro-orange',    name: '复古橙色沙发',   img: '../assets/furniture/sofa-retro-orange.jpg',    price: 220, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-black-white',     name: '黑白现代沙发',   img: '../assets/furniture/sofa-black-white.jpg',     price: 240, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-blue-floral',     name: '蓝碎花沙发',     img: '../assets/furniture/sofa-blue-floral.jpg',     price: 230, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-country-green',   name: '乡村绿沙发',     img: '../assets/furniture/sofa-country-green.jpg',   price: 220, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-red-plaid',       name: '红格纹沙发',     img: '../assets/furniture/sofa-red-plaid.jpg',       price: 220, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-spring-festival', name: '新春喜庆沙发',   img: '../assets/furniture/sofa-spring-festival.jpg', price: 260, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  { id: 'sofa-sunken-wood',     name: '原木凹陷沙发',   img: '../assets/furniture/sofa-sunken-wood.jpg',     price: 250, w: 2, h: 1, cat: 'living', displayScale: 0.95 },
  /* —— 卧室 —— */
  { id: 'bed',                  name: '经典大床',       img: '../assets/furniture/bed.jpg',                  price: 300, w: 2, h: 2, cat: 'bedroom', displayScale: 1.00 },
  { id: 'bed-caramel',          name: '焦糖可可双人床', img: '../assets/furniture/bed-caramel.jpg',          price: 320, w: 2, h: 2, cat: 'bedroom', displayScale: 1.00 },
  { id: 'bed-orange-tatami',    name: '橙色榻榻米床',   img: '../assets/furniture/bed-orange-tatami.jpg',    price: 310, w: 2, h: 2, cat: 'bedroom', displayScale: 1.00 },
  /* —— 厨房/餐厅 —— */
  { id: 'table',                name: '经典餐桌',       img: '../assets/furniture/table.jpg',                price: 150, w: 2, h: 2, cat: 'kitchen', displayScale: 0.90 },
  { id: 'table-round-lace',     name: '蕾丝圆桌',       img: '../assets/furniture/table-round-lace.jpg',     price: 170, w: 2, h: 2, cat: 'kitchen', displayScale: 0.90 },
  { id: 'table-square-lace',    name: '蕾丝方桌',       img: '../assets/furniture/table-square-lace.jpg',    price: 165, w: 2, h: 2, cat: 'kitchen', displayScale: 0.90 },
  { id: 'chair',                name: '椅子',           img: '../assets/furniture/chair.jpg',                price: 60,  w: 1, h: 1, cat: 'kitchen', displayScale: 0.85 },
  /* —— 收纳 —— */
  { id: 'bookshelf',            name: '经典书架',       img: '../assets/furniture/bookshelf.jpg',            price: 180, w: 1, h: 2, cat: 'storage', displayScale: 1.00 },
  { id: 'cabinet-vintage-bookshelf', name: '复古书柜',   img: '../assets/furniture/cabinet-vintage-bookshelf.jpg', price: 200, w: 1, h: 2, cat: 'storage', displayScale: 1.00 },
  { id: 'cabinet-stereo-bookshelf',  name: '立体书柜',   img: '../assets/furniture/cabinet-stereo-bookshelf.jpg', price: 210, w: 1, h: 2, cat: 'storage', displayScale: 1.00 },
  { id: 'cabinet-butterfly-long',    name: '蝴蝶长柜',   img: '../assets/furniture/cabinet-butterfly-long.jpg',   price: 230, w: 3, h: 1, cat: 'storage', displayScale: 0.95 },
  { id: 'wardrobe-rattan',           name: '藤编衣柜',   img: '../assets/furniture/wardrobe-rattan.jpg',          price: 260, w: 2, h: 1, cat: 'storage', displayScale: 0.95 },
  { id: 'wardrobe-blue-double',      name: '蓝色双门衣柜', img: '../assets/furniture/wardrobe-blue-double.jpg',    price: 280, w: 2, h: 1, cat: 'storage', displayScale: 0.95 },
  { id: 'corner-cabinet-midcentury', name: '中世纪角柜', img: '../assets/furniture/corner-cabinet-midcentury.jpg', price: 190, w: 1, h: 1, cat: 'storage', displayScale: 0.90 },
  /* —— 装饰 —— */
  { id: 'rug',                  name: '大地毯',         img: '../assets/furniture/rug.jpg',                  price: 100, w: 3, h: 2, cat: 'decor',   displayScale: 1.00 },
  { id: 'plant',                name: '盆栽',           img: '../assets/furniture/plant.jpg',                price: 50,  w: 1, h: 1, cat: 'decor',   displayScale: 0.80 },
  { id: 'lamp',                 name: '台灯',           img: '../assets/furniture/lamp.jpg',                 price: 80,  w: 1, h: 1, cat: 'decor',   displayScale: 0.85 }
];

var CATEGORIES = [
  { id: 'all',     name: '全部' },
  { id: 'living',  name: '客厅' },
  { id: 'bedroom', name: '卧室' },
  { id: 'kitchen', name: '厨房' },
  { id: 'storage', name: '收纳' },
  { id: 'decor',   name: '装饰' }
];

var FURN_MAP = {};
FURNITURE.forEach(function(f) { FURN_MAP[f.id] = f; });

/* ---- 视口变换 ---- */
var view = { scale: 1.0, tx: 0, ty: 0, minS: 0.35, maxS: 2.5 };

/* ---- 状态 ---- */
var data = null;
var currentTab = 'shop';
var currentCat = 'all';
var placingFid = null;
var selectedUid = null;
var dragState = null;       /* 拖拽家具中 */
var panState = null;        /* 平移视口中 */
var pinchState = null;      /* 双指缩放中 */
var uidCounter = 0;
var previewUid = null;      /* 放置模式下跟随鼠标的幽灵家具 uid（临时） */

/* ========================================================================
 * 坐标系统工具
 * ====================================================================== */
/* 世界坐标 (col, row, floor) → 屏幕像素坐标 (x, y) 相对 stage 原点
 *   返回值是 { x, y }：SVG / div 定位时使用
 *   col/row 可以是小数（实现自由摆放）
 */
function worldToScreen(col, row, floor) {
  return {
    x: (col - row) * (ISO_W / 2),
    y: (col + row) * (ISO_H / 2) - (floor || 0) * FLOOR_H
  };
}
/* 从屏幕像素坐标（stage 相对）反推世界 col/row（floor 已知） */
function screenToWorld(px, py, floor) {
  var yOff = py + (floor || 0) * FLOOR_H;
  var a = px / (ISO_W / 2);
  var b = yOff / (ISO_H / 2);
  return {
    col: (a + b) / 2,
    row: (b - a) / 2
  };
}

/* 检查世界坐标（col,row,floor）是否在任意一块地板矩形内（允许小数，按中心点判断） */
function isInsideAnyFloor(col, row, floor, w, h) {
  /* 用家具 4 个角 + 中心都必须落在同层地板或泳池（泳池也能放） */
  var pts = [
    [col, row], [col + w, row], [col, row + h], [col + w, row + h],
    [col + w/2, row + h/2]
  ];
  for (var i = 0; i < pts.length; i++) {
    var c = pts[i][0], r = pts[i][1];
    var ok = false;
    for (var j = 0; j < FLOORS.length; j++) {
      var f = FLOORS[j];
      if (Math.abs(f.floor - floor) < 0.1 &&
          c >= f.x0 && c <= f.x1 && r >= f.y0 && r <= f.y1) { ok = true; break; }
    }
    if (!ok && POOL && Math.abs(POOL.floor - floor) < 0.1) {
      if (c >= POOL.x0 && c <= POOL.x1 && r >= POOL.y0 && r <= POOL.y1) ok = true;
    }
    if (!ok) return false;
  }
  return true;
}

/* 家具 AABB 碰撞检查（基于世界 col/row，同楼层比较） */
function aabbOverlap(a, sa, b, sb) {
  return a.col < b.col + sb.w && a.col + sa.w > b.col &&
         a.row < b.row + sb.h && a.row + sa.h > b.row;
}
function canPlaceAt(fid, col, row, floor, rotation, ignoreUid) {
  var f = FURN_MAP[fid];
  if (!f) return { ok: false, reason: '未知家具' };
  var sz = furnSize(f, rotation);
  /* 同层地板检查 */
  if (!isInsideAnyFloor(col, row, floor, sz.w, sz.h)) {
    return { ok: false, reason: '要放在地板上哦' };
  }
  /* 重叠检查 */
  for (var i = 0; i < data.placed.length; i++) {
    var p = data.placed[i];
    if (p.uid === ignoreUid) continue;
    if (Math.abs(p.floor - floor) > 0.1) continue;
    var pf = FURN_MAP[p.fid];
    if (!pf) continue;
    var psz = furnSize(pf, p.rotation);
    if (aabbOverlap({col:col,row:row}, sz, p, psz)) {
      return { ok: false, reason: '和别的家具重叠了' };
    }
  }
  return { ok: true };
}

function furnSize(f, rotation) {
  return (rotation % 180 === 0) ? { w: f.w, h: f.h } : { w: f.h, h: f.h };
}

/* 深度排序 y 值：用于家具绘制顺序
 *   先按 floor 分层，再按 col+row（等距“下方先绘制”，上方后绘制覆盖）
 */
function sortDepth(a, b) {
  if (Math.abs(a.floor - b.floor) > 0.01) return a.floor - b.floor;
  var za = a.col + a.row;
  var zb = b.col + b.row;
  return za - zb;
}

/* ========================================================================
 * 数据层
 * ====================================================================== */
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (typeof d.coins !== 'number') d.coins = 1000;
      if (!d.inventory) d.inventory = {};
      if (!Array.isArray(d.placed)) d.placed = [];
      /* v1 → v2 数据迁移：网格(col,row,floor) 的位置从 6×5 搬到新世界坐标（放到一层中央） */
      d.placed.forEach(function(p) {
        if (typeof p.floor !== 'number') p.floor = 0;
        if (typeof p.rotation !== 'number') p.rotation = 0;
      });
      return d;
    }
  } catch(e) {}
  return { coins: 1000, inventory: {}, placed: [] };
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

/* 图片透明化缓存 */
var _transparentImageCache = {};

/* 将JPG图片的白色背景转为透明
 * 使用Canvas处理：检测接近白色的像素，将其alpha设为0
 */
function makeImageTransparent(imgUrl, callback) {
  if (_transparentImageCache[imgUrl]) {
    callback(_transparentImageCache[imgUrl]);
    return;
  }
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    var canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var data = imageData.data;

    /* 检测白色背景并转为透明
     * 策略：找到图片边缘的平均颜色作为背景色，将相似颜色设为透明
     * 使用容差范围来处理抗锯齿边缘
     */
    var bgColor = sampleBackgroundColor(data, canvas.width, canvas.height);
    var tolerance = 35;  /* 颜色容差 */

    for (var i = 0; i < data.length; i += 4) {
      var r = data[i], g = data[i + 1], b = data[i + 2];
      var dist = colorDistance(r, g, b, bgColor.r, bgColor.g, bgColor.b);
      if (dist < tolerance) {
        /* 边缘过渡区域：根据距离调整透明度 */
        var alpha = Math.min(255, dist / tolerance * 255);
        data[i + 3] = alpha;
      }
    }

    ctx.putImageData(imageData, 0, 0);
    var resultUrl = canvas.toDataURL('image/png');
    _transparentImageCache[imgUrl] = resultUrl;
    callback(resultUrl);
  };
  img.onerror = function() {
    /* 加载失败则返回原图 */
    callback(imgUrl);
  };
  img.src = imgUrl;
}

/* 采样图片四角的平均颜色作为背景色 */
function sampleBackgroundColor(data, w, h) {
  var samples = [];
  var samplePoints = [
    [0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1],  /* 四角 */
    [Math.floor(w / 2), 0], [Math.floor(w / 2), h - 1],  /* 上下中 */
    [0, Math.floor(h / 2)], [w - 1, Math.floor(h / 2)]   /* 左右中 */
  ];
  for (var i = 0; i < samplePoints.length; i++) {
    var idx = (samplePoints[i][1] * w + samplePoints[i][0]) * 4;
    samples.push([data[idx], data[idx + 1], data[idx + 2]]);
  }
  var sumR = 0, sumG = 0, sumB = 0;
  for (var j = 0; j < samples.length; j++) {
    sumR += samples[j][0];
    sumG += samples[j][1];
    sumB += samples[j][2];
  }
  return { r: Math.round(sumR / samples.length), g: Math.round(sumG / samples.length), b: Math.round(sumB / samples.length) };
}

/* 计算两个RGB颜色的欧几里得距离 */
function colorDistance(r1, g1, b1, r2, g2, b2) {
  var dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt(dr * dr + dg * dg + db * db);
}

/* ========================================================================
 * SVG 房子渲染
 * ====================================================================== */
var HOUSE_BOUNDS = null;  // 存储房子的bounds用于坐标转换

function renderHouse() {
  var svg = document.getElementById('houseSvg');
  var g = [];

  /* 渐变定义：为每面墙创建从上到下的明暗渐变，增强立体感 */
  var defs =
    '<defs>' +
    /* 一层地板 tile —— 更细的网格，暖色调 */
    '  <pattern id="floor0Tile" width="' + ISO_W + '" height="' + ISO_H + '" patternUnits="userSpaceOnUse">' +
    '    <path d="M0,' + (ISO_H/2) + ' L' + (ISO_W/2) + ',0 L' + ISO_W + ',' + (ISO_H/2) + ' L' + (ISO_W/2) + ',' + ISO_H + ' Z" fill="#f5ead0" stroke="#dcc69a" stroke-width="0.6" opacity="0.7"/>' +
    '  </pattern>' +
    /* 二层地板 tile */
    '  <pattern id="floor1Tile" width="' + ISO_W + '" height="' + ISO_H + '" patternUnits="userSpaceOnUse">' +
    '    <path d="M0,' + (ISO_H/2) + ' L' + (ISO_W/2) + ',0 L' + ISO_W + ',' + (ISO_H/2) + ' L' + (ISO_W/2) + ',' + ISO_H + ' Z" fill="#f0e0c2" stroke="#cdb078" stroke-width="0.6" opacity="0.7"/>' +
    '  </pattern>' +
    /* 泳池 tile */
    '  <pattern id="poolTile" width="' + ISO_W + '" height="' + ISO_H + '" patternUnits="userSpaceOnUse">' +
    '    <path d="M0,' + (ISO_H/2) + ' L' + (ISO_W/2) + ',0 L' + ISO_W + ',' + (ISO_H/2) + ' L' + (ISO_W/2) + ',' + ISO_H + ' Z" fill="#b8deef" stroke="#7ab5d0" stroke-width="0.6"/>' +
    '    <path d="M' + (ISO_W*0.18) + ',' + (ISO_H*0.45) + ' q' + (ISO_W*0.1) + ',' + (-ISO_H*0.08) + ' ' + (ISO_W*0.2) + ',0 t' + (ISO_W*0.2) + ',0" stroke="#8fc2d9" stroke-width="0.8" fill="none" opacity="0.7"/>' +
    '  </pattern>' +
    /* 墙壁渐变：顶部亮、底部暗，模拟环境光 */
    '  <linearGradient id="wallBackGrad" x1="0" y1="0" x2="0" y2="1">' +
    '    <stop offset="0" stop-color="#f5dfb8"/><stop offset="0.5" stop-color="#eed2a4"/><stop offset="1" stop-color="#d8bc8e"/>' +
    '  </linearGradient>' +
    '  <linearGradient id="wallLeftGrad" x1="0" y1="0" x2="0" y2="1">' +
    '    <stop offset="0" stop-color="#ecca98"/><stop offset="0.5" stop-color="#dcba84"/><stop offset="1" stop-color="#c4a374"/>' +
    '  </linearGradient>' +
    '  <linearGradient id="wallRightGrad" x1="0" y1="0" x2="0" y2="1">' +
    '    <stop offset="0" stop-color="#d2aa78"/><stop offset="0.5" stop-color="#bf9760"/><stop offset="1" stop-color="#a07e4e"/>' +
    '  </linearGradient>' +
    /* 地板内阴影渐变（边缘暗、中心亮） */
    '  <radialGradient id="floorShadow0" cx="0.5" cy="0.4" r="0.7">' +
    '    <stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="0.7" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(80,50,10,0.18)"/>' +
    '  </radialGradient>' +
    '  <radialGradient id="floorShadow1" cx="0.5" cy="0.4" r="0.7">' +
    '    <stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="0.7" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(80,50,10,0.15)"/>' +
    '  </radialGradient>' +
    '</defs>';

  /* 计算整个房子 AABB（含泳池和上下层），用于 SVG viewBox */
  var bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  function addPoint(c, r, f) {
    var p = worldToScreen(c, r, f);
    if (p.x < bounds.minX) bounds.minX = p.x;
    if (p.x > bounds.maxX) bounds.maxX = p.x;
    if (p.y < bounds.minY) bounds.minY = p.y;
    if (p.y > bounds.maxY) bounds.maxY = p.y;
  }
  FLOORS.forEach(function(fl) {
    addPoint(fl.x0, fl.y0, fl.floor);
    addPoint(fl.x1, fl.y1, fl.floor);
    addPoint(fl.x0, fl.y1, fl.floor + 1);
    addPoint(fl.x1, fl.y0, fl.floor + 1);
  });
  if (POOL) {
    addPoint(POOL.x0, POOL.y0, POOL.floor);
    addPoint(POOL.x1, POOL.y1, POOL.floor);
  }
  var pad = 120;
  bounds.minX -= pad; bounds.minY -= pad * 1.2;
  bounds.maxX += pad; bounds.maxY += pad * 0.6;

  HOUSE_BOUNDS = bounds;  // 保存bounds用于坐标转换

  var vbW = bounds.maxX - bounds.minX;
  var vbH = bounds.maxY - bounds.minY;

  /* 设置SVG尺寸为viewBox尺寸，这样1个SVG单位=1个像素 */
  svg.setAttribute('width', vbW);
  svg.setAttribute('height', vbH);
  svg.setAttribute('viewBox', bounds.minX + ' ' + bounds.minY + ' ' + vbW + ' ' + vbH);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  /* --- 泳池（最底层） --- */
  if (POOL) g = g.concat(drawPlatform(POOL, 'poolTile', POOL.border, true));

  /* --- 一层地板 + 墙 --- */
  g = g.concat(drawPlatform(FLOORS[0], 'floor0Tile', FLOORS[0].border, true, true));
  g = g.concat(drawWalls(FLOORS[0], WALL_COLOR));

  /* --- 二层楼板在一层投下的投影（让两层感明显） --- */
  g = g.concat(drawSlabShadow(FLOORS[1]));

  /* --- 楼梯（在二层楼板之前画，保证楼梯在楼板下侧面上方） --- */
  g = g.concat(drawStairs(STAIRS));

  /* --- 二层：完整四周厚度楼板 + 墙 + 帐篷挂布 --- */
  g = g.concat(drawPlatform(FLOORS[1], 'floor1Tile', FLOORS[1].border, false, true));
  g = g.concat(drawWalls(FLOORS[1], WALL_COLOR));
  g = g.concat(drawCanopy(FLOORS[1]));  // 帐篷尖顶挂布

  /* --- 装饰：帐篷绳、旗杆小人（可选，美化） --- */
  g = g.concat(drawFlags(FLOORS[1]));
  g = g.concat(drawFenceAndLamp());

  svg.innerHTML = defs + g.join('');

  /* 调整SVG位置使其居中：将SVG原点（0,0）对齐到viewBox中心 */
  svg.style.transform = 'translate(-' + (vbW / 2) + 'px, -' + (vbH / 2) + 'px)';
}

/* 画一个平台地板 (平台的顶面四边形 + 侧面厚度)
 *   drawThickness: 是否画侧面厚度
 *   isGroundFloor:  true=一层（只画右+前两个外露侧面）
 *                   false=二层（画完整四周侧面，体现吊起来的楼板感）
 */
function drawPlatform(fl, tileRef, borderColor, drawThickness, isGroundFloor) {
  var out = [];
  var p1 = worldToScreen(fl.x0, fl.y0, fl.floor);  /* 后左 */
  var p2 = worldToScreen(fl.x1, fl.y0, fl.floor);  /* 后右 */
  var p3 = worldToScreen(fl.x1, fl.y1, fl.floor);  /* 前右 */
  var p4 = worldToScreen(fl.x0, fl.y1, fl.floor);  /* 前左 */
  var shadowRef = fl.floor === 0 ? 'floorShadow0' : 'floorShadow1';
  /* 顶面（填充 tile 图案） */
  out.push(
    '<path class="floor" data-floor="' + fl.floor + '" ' +
    'd="M' + p1.x + ',' + p1.y + ' L' + p2.x + ',' + p2.y +
    ' L' + p3.x + ',' + p3.y + ' L' + p4.x + ',' + p4.y + ' Z" ' +
    'fill="url(#' + tileRef + ')" stroke="' + borderColor + '" stroke-width="1.2" stroke-linejoin="round"/>'
  );
  /* 地板内阴影（增强立体感） */
  out.push(
    '<path d="M' + p1.x + ',' + p1.y + ' L' + p2.x + ',' + p2.y +
    ' L' + p3.x + ',' + p3.y + ' L' + p4.x + ',' + p4.y + ' Z" ' +
    'fill="url(#' + shadowRef + ')" pointer-events="none"/>'
  );
  /* 厚度侧条 */
  if (drawThickness) {
    var thick = isGroundFloor ? 10 : FLOOR_H * 0.5;  /* 二层楼板厚度更大，像一块真实的板 */
    /* 偏移函数：沿"向下"方向（投影方向）延伸 thick 像素 */
    function off(p) { return { x: p.x, y: p.y + thick }; }
    var p1d = off(p1), p2d = off(p2), p3d = off(p3), p4d = off(p4);

    if (isGroundFloor) {
      /* 一层：只画右、前 2 个外露侧 */
      out.push(
        '<path d="M' + p2.x + ',' + p2.y + ' L' + p3.x + ',' + p3.y +
        ' L' + p3d.x + ',' + p3d.y + ' L' + p2d.x + ',' + p2d.y + ' Z" ' +
        'fill="#c9a372" stroke="#9d7a55" stroke-width="0.8" opacity="0.92"/>'
      );
      out.push(
        '<path d="M' + p3.x + ',' + p3.y + ' L' + p4.x + ',' + p4.y +
        ' L' + p4d.x + ',' + p4d.y + ' L' + p3d.x + ',' + p3d.y + ' Z" ' +
        'fill="#b38d5a" stroke="#8d6a45" stroke-width="0.8" opacity="0.92"/>'
      );
    } else {
      /* 二层：画完整 4 个侧面，体现"楼板厚度"，就像真的抬起来了 */
      /* 后 (p1→p2 向下) —— 最亮 */
      out.push(
        '<path d="M' + p1.x + ',' + p1.y + ' L' + p2.x + ',' + p2.y +
        ' L' + p2d.x + ',' + p2d.y + ' L' + p1d.x + ',' + p1d.y + ' Z" ' +
        'fill="#caa679" stroke="#9d7a55" stroke-width="0.8" opacity="0.95"/>'
      );
      /* 右 (p2→p3 向下) —— 中等亮 */
      out.push(
        '<path d="M' + p2.x + ',' + p2.y + ' L' + p3.x + ',' + p3.y +
        ' L' + p3d.x + ',' + p3d.y + ' L' + p2d.x + ',' + p2d.y + ' Z" ' +
        'fill="#b6915f" stroke="#8c6a40" stroke-width="0.8" opacity="0.95"/>'
      );
      /* 前 (p3→p4 向下) —— 最暗 */
      out.push(
        '<path d="M' + p3.x + ',' + p3.y + ' L' + p4.x + ',' + p4.y +
        ' L' + p4d.x + ',' + p4d.y + ' L' + p3d.x + ',' + p3d.y + ' Z" ' +
        'fill="#9e7948" stroke="#7a5a30" stroke-width="0.8" opacity="0.95"/>'
      );
      /* 左 (p4→p1 向下) —— 中等暗 */
      out.push(
        '<path d="M' + p4.x + ',' + p4.y + ' L' + p1.x + ',' + p1.y +
        ' L' + p1d.x + ',' + p1d.y + ' L' + p4d.x + ',' + p4d.y + ' Z" ' +
        'fill="#ad8957" stroke="#8c6a40" stroke-width="0.8" opacity="0.95"/>'
      );
      /* 楼板底面边缘描一圈暗线，加强"板"的轮廓感 */
      out.push(
        '<path d="M' + p1d.x + ',' + p1d.y + ' L' + p2d.x + ',' + p2d.y +
        ' L' + p3d.x + ',' + p3d.y + ' L' + p4d.x + ',' + p4d.y + ' Z" ' +
        'fill="none" stroke="#7a5a30" stroke-width="0.8" opacity="0.6"/>'
      );
    }
  }
  return out;
}

/* 画二层楼板在一层地板上投下的投影阴影 —— 大幅增强两层的层次感 */
function drawSlabShadow(upperFloor) {
  var out = [];
  /* 阴影偏移：向屏幕右下方偏移，模拟光照方向 */
  var dx = 12, dy = 18;
  var p1 = worldToScreen(upperFloor.x0, upperFloor.y0, 0);
  var p2 = worldToScreen(upperFloor.x1, upperFloor.y0, 0);
  var p3 = worldToScreen(upperFloor.x1, upperFloor.y1, 0);
  var p4 = worldToScreen(upperFloor.x0, upperFloor.y1, 0);
  out.push(
    '<path d="M' + (p1.x + dx) + ',' + (p1.y + dy) +
    ' L' + (p2.x + dx) + ',' + (p2.y + dy) +
    ' L' + (p3.x + dx) + ',' + (p3.y + dy) +
    ' L' + (p4.x + dx) + ',' + (p4.y + dy) + ' Z" ' +
    'fill="rgba(50,30,10,0.35)" stroke="rgba(50,30,10,0.12)" stroke-width="1" ' +
    'filter="url(#floorShadow0)" opacity="0.7" pointer-events="none"/>'
  );
  return out;
}

/* 画三面墙（后墙 + 左墙 + 右墙）—— 使用渐变填充增强立体感 */
function drawWalls(fl, wc) {
  var out = [];
  /* 后墙： (x0,y0,floor) → (x1,y0,floor) → (x1,y0,floor+1) → (x0,y0,floor+1) */
  var b0 = worldToScreen(fl.x0, fl.y0, fl.floor);
  var b1 = worldToScreen(fl.x1, fl.y0, fl.floor);
  var t0 = worldToScreen(fl.x0, fl.y0, fl.floor + 1);
  var t1 = worldToScreen(fl.x1, fl.y0, fl.floor + 1);
  out.push(
    '<path class="wall" d="M' + b0.x + ',' + b0.y + ' L' + b1.x + ',' + b1.y +
    ' L' + t1.x + ',' + t1.y + ' L' + t0.x + ',' + t0.y + ' Z" ' +
    'fill="url(#wallBackGrad)" stroke="' + wc.edge + '" stroke-width="1.2"/>'
  );
  /* 左墙： (x0,y0,floor) → (x0,y1,floor) → (x0,y1,floor+1) → (x0,y0,floor+1) */
  var b2 = worldToScreen(fl.x0, fl.y1, fl.floor);
  var t2 = worldToScreen(fl.x0, fl.y1, fl.floor + 1);
  out.push(
    '<path class="wall" d="M' + b0.x + ',' + b0.y + ' L' + b2.x + ',' + b2.y +
    ' L' + t2.x + ',' + t2.y + ' L' + t0.x + ',' + t0.y + ' Z" ' +
    'fill="url(#wallLeftGrad)" stroke="' + wc.edge + '" stroke-width="1.2"/>'
  );
  /* 右墙： (x1,y0,floor) → (x1,y1,floor) → (x1,y1,floor+1) → (x1,y0,floor+1) */
  var b3 = worldToScreen(fl.x1, fl.y1, fl.floor);
  var t3 = worldToScreen(fl.x1, fl.y1, fl.floor + 1);
  out.push(
    '<path class="wall" d="M' + b1.x + ',' + b1.y + ' L' + b3.x + ',' + b3.y +
    ' L' + t3.x + ',' + t3.y + ' L' + t1.x + ',' + t1.y + ' Z" ' +
    'fill="url(#wallRightGrad)" stroke="' + wc.edge + '" stroke-width="1.2"/>'
  );
  /* 墙角高光线（在两面墙的交界处画亮线，增强棱角感） */
  var edgeColor = 'rgba(255,240,200,0.5)';
  out.push(
    '<line x1="' + b0.x + '" y1="' + b0.y + '" x2="' + t0.x + '" y2="' + t0.y + '" stroke="' + edgeColor + '" stroke-width="1.5" opacity="0.6"/>'
  );
  out.push(
    '<line x1="' + b1.x + '" y1="' + b1.y + '" x2="' + t1.x + '" y2="' + t1.y + '" stroke="' + edgeColor + '" stroke-width="1" opacity="0.4"/>'
  );
  out.push(
    '<line x1="' + t0.x + '" y1="' + t0.y + '" x2="' + t1.x + '" y2="' + t1.y + '" stroke="' + edgeColor + '" stroke-width="1.2" opacity="0.5"/>'
  );
  /* 墙脚阴影线（地板与墙交界处画暗线） */
  var shadowColor = 'rgba(80,50,10,0.25)';
  out.push(
    '<line x1="' + b0.x + '" y1="' + b0.y + '" x2="' + b1.x + '" y2="' + b1.y + '" stroke="' + shadowColor + '" stroke-width="2" opacity="0.5"/>'
  );
  out.push(
    '<line x1="' + b0.x + '" y1="' + b0.y + '" x2="' + b2.x + '" y2="' + b2.y + '" stroke="' + shadowColor + '" stroke-width="2" opacity="0.4"/>'
  );
  /* 门：在右墙上抠一个门洞（一层，右侧墙上 y 大的一侧） */
  if (fl.floor === 0) {
    var doorCx = (fl.x1 + fl.x1) / 2;       /* col = x1 */
    var doorCy = (fl.y0 + fl.y1) / 2;       /* row 中间 */
    var dA = worldToScreen(fl.x1, doorCy - 0.5, 0);
    var dB = worldToScreen(fl.x1, doorCy + 0.5, 0);
    var dAt = worldToScreen(fl.x1, doorCy - 0.5, 0.85);
    var dBt = worldToScreen(fl.x1, doorCy + 0.5, 0.85);
    /* 门洞（深棕色，带一点点台阶） */
    out.push(
      '<path d="M' + dA.x + ',' + dA.y + ' L' + dB.x + ',' + dB.y +
      ' L' + dBt.x + ',' + dBt.y + ' Q' + ((dBt.x + dAt.x)/2) + ',' + (dBt.y - 14) +
      ' ' + dAt.x + ',' + dAt.y + ' Z" fill="#6e4b2c" stroke="#4a3118" stroke-width="1.2"/>'
    );
    /* 门内亮 */
    out.push(
      '<path d="M' + (dA.x+1.5) + ',' + (dA.y+1.5) + ' L' + (dB.x-1.5) + ',' + (dB.y-1.5) +
      ' L' + (dBt.x-1.5) + ',' + (dBt.y-1.5) +
      ' Q' + ((dBt.x + dAt.x)/2) + ',' + (dBt.y - 18) +
      ' ' + (dAt.x+1.5) + ',' + (dAt.y-1.5) +
      ' Z" fill="#2d1a0a"/>'
    );
  }
  return out;
}

/* 画楼梯：从一层(f=0)爬3级台阶到二层(f=1)，顶端必须正好落在二层地板上
 * 关键：最后一级结束时 floor=1，且 col/row 位置位于二层地板范围内（即 FLOORS[1] 的 x、y 范围内）
 */
function drawStairs(s) {
  var out = [];
  var steps = 3;   /* 3级楼梯就够连接 f=0 到 f=1，视觉更真实 */
  var prevBot = null;

  for (var i = 0; i < steps; i++) {
    var t0 = i / steps;
    var t1 = (i + 1) / steps;
    /* 每一级沿 row 方向前进，同时 floor 升高 */
    var cy0 = s.y0 + (s.y1 - s.y0) * t0;
    var cy1 = s.y0 + (s.y1 - s.y0) * t1;
    var f0 = t0;
    var f1 = t1;
    var A = worldToScreen(s.x0, cy0, f0);   /* 左前 */
    var B = worldToScreen(s.x1, cy0, f0);   /* 右前 */
    var C = worldToScreen(s.x1, cy1, f1);   /* 右后 */
    var D = worldToScreen(s.x0, cy1, f1);   /* 左后 */

    /* 踏面 (top) —— 暖色亮面 */
    out.push(
      '<path class="stair" d="M' + A.x + ',' + A.y + ' L' + B.x + ',' + B.y +
      ' L' + C.x + ',' + C.y + ' L' + D.x + ',' + D.y + ' Z" ' +
      'fill="#d6ab7e" stroke="#8a6234" stroke-width="0.8"/>'
    );
    /* 踢面 (riser) —— 暗色（连接前一级底部到当前踏面前沿） */
    if (prevBot) {
      var pAi = prevBot.A, pBi = prevBot.B;
      var pAit = { x: pAi.x, y: A.y };
      var pBit = { x: pBi.x, y: B.y };
      out.push(
        '<path class="stair" d="M' + pAi.x + ',' + pAi.y +
        ' L' + pBi.x + ',' + pBi.y +
        ' L' + pBit.x + ',' + pBit.y +
        ' L' + pAit.x + ',' + pAit.y + ' Z" ' +
        'fill="#a87a4e" stroke="#8d6a45" stroke-width="0.6"/>'
      );
      out.push(
        '<path d="M' + pAit.x + ',' + pAit.y +
        ' L' + pBit.x + ',' + pBit.y +
        ' L' + B.x + ',' + B.y +
        ' L' + A.x + ',' + A.y + ' Z" ' +
        'fill="#bd8c5e" stroke="#8d6a45" stroke-width="0.6"/>'
      );
    } else {
      /* 第一级的"起步"踢面：从地板(f=-0.05)升到 A,B 的高度 */
      var Ai0 = worldToScreen(s.x0, cy0, -0.03);
      var Bi0 = worldToScreen(s.x1, cy0, -0.03);
      out.push(
        '<path d="M' + Ai0.x + ',' + Ai0.y +
        ' L' + Bi0.x + ',' + Bi0.y +
        ' L' + B.x + ',' + B.y +
        ' L' + A.x + ',' + A.y + ' Z" ' +
        'fill="#a87a4e" stroke="#8d6a45" stroke-width="0.6"/>'
      );
    }
    prevBot = { A: D, B: C };   /* 下一级的底部 = 当前级的踏面后沿 */
  }

  /* 楼梯顶部"小平台"：把最后一级后沿(D,C,f=1)无缝连接到二层地板的前边缘 */
  var lastD = worldToScreen(s.x0, s.y1, 1);   /* 最后一级踏面后左 */
  var lastC = worldToScreen(s.x1, s.y1, 1);   /* 最后一级踏面后右 */
  var slabFrontL = worldToScreen(FLOORS[1].x0, FLOORS[1].y0 + 0.01, 1);  /* 二层地板前左(向前探一点) */
  var slabFrontR = worldToScreen(FLOORS[1].x1, FLOORS[1].y0 + 0.01, 1);  /* 二层地板前右 */
  /* 连接：楼梯顶端后沿 → 二层地板前边缘，形成一个过渡小平台 */
  out.push(
    '<path class="stair" d="M' + lastD.x + ',' + lastD.y +
    ' L' + lastC.x + ',' + lastC.y +
    ' L' + slabFrontR.x + ',' + slabFrontR.y +
    ' L' + slabFrontL.x + ',' + slabFrontL.y + ' Z" ' +
    'fill="#cd9c6e" stroke="#8a6234" stroke-width="0.8"/>'
  );

  /* 楼梯两侧的侧挡板（斜边）：从起点一直连到顶层平台 */
  var s0_A = worldToScreen(s.x0, s.y0, -0.03);  /* 楼梯起点左前底 */
  var s0_B = worldToScreen(s.x1, s.y0, -0.03);  /* 楼梯起点右前底 */
  var sT_D = slabFrontL;                         /* 楼梯终点左后（二层地板前边缘左） */
  var sT_C = slabFrontR;                         /* 楼梯终点右后（二层地板前边缘右） */

  /* 左侧板 (s0_A → sT_D 向下延伸 8px 做厚度) */
  var s0_A_d = { x: s0_A.x, y: s0_A.y + 6 };
  var sT_D_d = { x: sT_D.x, y: sT_D.y + 6 };
  out.push(
    '<path d="M' + s0_A.x + ',' + s0_A.y +
    ' L' + s0_A_d.x + ',' + s0_A_d.y +
    ' L' + sT_D_d.x + ',' + sT_D_d.y +
    ' L' + sT_D.x + ',' + sT_D.y +
    ' Z" fill="#8e6334" stroke="#6a4620" stroke-width="0.6"/>'
  );
  /* 右侧板 */
  var s0_B_d = { x: s0_B.x, y: s0_B.y + 6 };
  var sT_C_d = { x: sT_C.x, y: sT_C.y + 6 };
  out.push(
    '<path d="M' + s0_B.x + ',' + s0_B.y +
    ' L' + s0_B_d.x + ',' + s0_B_d.y +
    ' L' + sT_C_d.x + ',' + sT_C_d.y +
    ' L' + sT_C.x + ',' + sT_C.y +
    ' Z" fill="#a67a44" stroke="#6a4620" stroke-width="0.6"/>'
  );
  return out;
}

/* 帐篷尖顶挂布（用户户型图顶部的金色帐篷装饰） */
function drawCanopy(fl) {
  var out = [];
  /* 从后墙顶部两个角，拉起一个帐篷尖顶（尖点在后墙中点上方） */
  var wallT0 = worldToScreen(fl.x0, fl.y0, fl.floor + 1);
  var wallT1 = worldToScreen(fl.x1, fl.y0, fl.floor + 1);
  var peak = worldToScreen((fl.x0 + fl.x1) / 2, fl.y0 - 1.2, fl.floor + 1.4);
  /* 帐篷布（半透明金色） */
  out.push(
    '<path d="M' + wallT0.x + ',' + wallT0.y +
    ' L' + peak.x + ',' + peak.y +
    ' L' + wallT1.x + ',' + wallT1.y + ' Z" ' +
    'fill="#e6c772" stroke="#a07c1f" stroke-width="1.2" fill-opacity="0.78"/>'
  );
  /* 挂布边缘的流苏锯齿 */
  var n = 14;
  for (var i = 0; i <= n; i++) {
    var t = i / n;
    /* 从 peak 到 wallT0/wallT1 的点 */
    function lerp(a, b, t){ return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
    var pL = lerp(peak, wallT0, t);
    var pR = lerp(peak, wallT1, t);
    if (i % 2 === 0) {
      out.push('<circle cx="' + pL.x + '" cy="' + pL.y + '" r="2.5" fill="#fff1b8" stroke="#b5891e" stroke-width="0.6"/>');
      out.push('<circle cx="' + pR.x + '" cy="' + pR.y + '" r="2.5" fill="#fff1b8" stroke="#b5891e" stroke-width="0.6"/>');
    }
  }
  /* 四角柱上的小金顶装饰（在左后/右后/左前/右前立柱顶端） */
  var posts = [
    worldToScreen(fl.x0, fl.y0, fl.floor + 1),
    worldToScreen(fl.x1, fl.y0, fl.floor + 1),
    worldToScreen(fl.x0, fl.y1, fl.floor + 1),
    worldToScreen(fl.x1, fl.y1, fl.floor + 1)
  ];
  posts.forEach(function(p) {
    out.push('<path d="M' + (p.x-5) + ',' + p.y +
      ' L' + (p.x+5) + ',' + p.y +
      ' L' + p.x + ',' + (p.y - 18) + ' Z" ' +
      'fill="#e8c364" stroke="#9a6e18" stroke-width="1"/>');
  });
  return out;
}

/* 二层前后悬挂的挂旗（用户图中帐篷顶上的黄色飘旗） */
function drawFlags(fl) {
  var out = [];
  var flags = [
    { c: fl.x0 + 1, r: fl.y0 - 0.3, f: fl.floor + 1.1 },
    { c: fl.x0 + 3, r: fl.y0 - 0.5, f: fl.floor + 1.3 },
    { c: fl.x1 - 3, r: fl.y0 - 0.5, f: fl.floor + 1.3 },
    { c: fl.x1 - 1, r: fl.y0 - 0.3, f: fl.floor + 1.1 }
  ];
  flags.forEach(function(flg) {
    var p = worldToScreen(flg.c, flg.r, flg.f);
    out.push(
      '<path d="M' + p.x + ',' + (p.y - 2) +
      ' L' + (p.x + 14) + ',' + (p.y + 8) +
      ' L' + p.x + ',' + (p.y + 18) + ' Z" ' +
      'fill="#f1d064" stroke="#9a6e18" stroke-width="0.8"/>'
    );
    out.push('<line x1="' + p.x + '" y1="' + (p.y - 24) + '" x2="' + p.x + '" y2="' + (p.y + 22) + '" stroke="#7a5820" stroke-width="1.2"/>');
  });
  return out;
}

/* 一层前侧外栏杆 + 右侧灯柱小人（美化） */
function drawFenceAndLamp() {
  var out = [];
  /* 简单的底部地面草坪（画在一层地板外） */
  var g1 = worldToScreen(FLOORS[0].x0 - 1.5, FLOORS[0].y1 + 0.8, -0.5);
  var g2 = worldToScreen(FLOORS[0].x1 + 3.5, FLOORS[0].y1 + 2.6, -0.5);
  out.push(
    '<path d="M' + g1.x + ',' + g1.y + ' L' + g2.x + ',' + g1.y +
    ' L' + g2.x + ',' + (g1.y + 200) + ' L' + g1.x + ',' + (g1.y + 200) +
    ' Z" fill="#d5e4b2" opacity="0.55"/>'
  );
  /* 右下灯柱 */
  var lp = worldToScreen(FLOORS[0].x1 + 2.2, FLOORS[0].y1 + 1.1, -0.1);
  out.push(
    '<rect x="' + (lp.x - 2.5) + '" y="' + (lp.y - 26) + '" width="5" height="26" fill="#c7a06a" stroke="#8a6633" stroke-width="0.8"/>'
  );
  out.push(
    '<path d="M' + (lp.x - 8) + ',' + (lp.y - 26) +
    ' L' + (lp.x + 8) + ',' + (lp.y - 26) +
    ' L' + (lp.x + 5) + ',' + (lp.y - 42) +
    ' L' + (lp.x - 5) + ',' + (lp.y - 42) + ' Z" ' +
    'fill="#ffe794" stroke="#b38d2a" stroke-width="1"/>'
  );
  return out;
}

/* ========================================================================
 * 家具渲染
 * ====================================================================== */
function getFurnitureTransform() {
  /* 获取furniture-layer需要的变换，使其与SVG对齐 */
  if (!HOUSE_BOUNDS) return '';
  var vbW = HOUSE_BOUNDS.maxX - HOUSE_BOUNDS.minX;
  var vbH = HOUSE_BOUNDS.maxY - HOUSE_BOUNDS.minY;
  /* SVG使用translate(-vbW/2, -vbH/2)居中，furniture-layer也需要同样的变换 */
  return 'translate(-' + (vbW / 2) + 'px, -' + (vbH / 2) + 'px)';
}

function worldToScreenWithOffset(col, row, floor) {
  /* 带bounds偏移的坐标转换，与SVG内部坐标对齐 */
  var p = worldToScreen(col, row, floor);
  if (HOUSE_BOUNDS) {
    p.x -= HOUSE_BOUNDS.minX;
    p.y -= HOUSE_BOUNDS.minY;
  }
  return p;
}

function renderFurniture() {
  var layer = document.getElementById('furnitureLayer');
  /* 设置furniture-layer的变换使其与SVG对齐 */
  layer.style.transform = getFurnitureTransform();
  layer.innerHTML = '';

  /* 先按深度排序 */
  var all = data.placed.slice();
  if (placingFid && previewUid != null) {
    /* 加个幽灵预览项 */
    all.push({ uid: previewUid, fid: placingFid, col: previewPos.col, row: previewPos.row, floor: previewPos.floor, rotation: 0, _ghost: true });
  }
  all.sort(sortDepth);

  all.forEach(function(p) {
    var f = FURN_MAP[p.fid];
    if (!f) return;
    var sz = furnSize(f, p.rotation || 0);
    var el = document.createElement('div');
    el.className = 'placed-item';
    if (p._ghost) el.classList.add('placing-ghost');
    if (p.uid === selectedUid) el.classList.add('selected');
    if (dragState && dragState.placed && dragState.placed.uid === p.uid) el.classList.add('dragging');

    /* 图像显示尺寸（像素） */
    var imgPx = Math.min(ISO_W * sz.w, ISO_H * sz.h * 2) * (f.displayScale || 1);
    el.style.width  = imgPx + 'px';
    el.style.height = imgPx * 1.0 + 'px';

    /* 定位：中心点在家具 (col+w/2, row+h/2) 的等距屏幕位置（带bounds偏移） */
    var center = worldToScreenWithOffset(p.col + sz.w / 2, p.row + sz.h / 2, p.floor);
    /* 让家具底部中心对齐这个点：translate(-50%, -90%) */
    el.style.transform =
      'translate(' + center.x + 'px, ' + center.y + 'px)' +
      ' translate(-50%, -90%)' +
      (p.rotation ? ' rotate(' + p.rotation + 'deg)' : '');

    el.dataset.uid = p.uid;
    var img = document.createElement('img');
    img.src = f.img;
    img.alt = f.name;
    /* 应用透明化处理（异步） */
    makeImageTransparent(f.img, function(transparentUrl) {
      if (img.src !== transparentUrl) {
        img.src = transparentUrl;
      }
    });
    el.appendChild(img);

    /* 放置预览：加 OK/Bad halo */
    if (p._ghost) {
      var chk = canPlaceAt(p.fid, p.col, p.row, p.floor, p.rotation || 0);
      var halo = document.createElement('div');
      halo.className = chk.ok ? 'furn-halo-ok' : 'furn-halo-bad';
      el.appendChild(halo);
      el.style.zIndex = chk.ok ? 500 : 500;
    }

    layer.appendChild(el);
    if (!p._ghost) bindItemDrag(el, p);
  });
}

/* ========================================================================
 * 视口缩放 / 平移
 * ====================================================================== */
function applyView() {
  var stage = document.getElementById('roomStage');
  /* roomStage 本来是 top:50% left:50% 定位；我们再叠加 translate + scale */
  stage.style.transform =
    'translate(' + view.tx + 'px, ' + view.ty + 'px) scale(' + view.scale + ')';
}

function zoomAt(factor, cx, cy) {
  /* cx,cy 是 room-area 内的相对像素点（缩放不动点） */
  var area = document.getElementById('roomArea');
  var rect = area.getBoundingClientRect();
  var sx = cx - rect.left - rect.width / 2;   /* 相对 stage 初始中心（未 applyView 前） */
  var sy = cy - rect.top - rect.height / 2;
  var oldScale = view.scale;
  var newScale = Math.max(view.minS, Math.min(view.maxS, oldScale * factor));
  if (Math.abs(newScale - oldScale) < 1e-3) return;
  /* 让 (sx, sy) 这个点在缩放前后在同一个屏幕位置：
   *   tx' + sx * newScale = tx + sx * oldScale
   */
  view.tx += sx * (oldScale - newScale);
  view.ty += sy * (oldScale - newScale);
  view.scale = newScale;
  applyView();
}

function fitView() {
  var area = document.getElementById('roomArea');
  var svg = document.getElementById('houseSvg');
  /* 让 svg viewBox 完整装进 area */
  var vb = svg.viewBox.baseVal;
  if (!vb || vb.width === 0) { view.scale = 1.0; view.tx = 0; view.ty = 0; applyView(); return; }
  var rect = area.getBoundingClientRect();
  var s = Math.min(rect.width / vb.width, rect.height / vb.height) * 0.95;
  view.scale = Math.max(view.minS, Math.min(view.maxS, s));
  view.tx = 0; view.ty = 0;
  applyView();
}

/* ========================================================================
 * 顶栏 / 商店 / 库存 / Tab 渲染
 * ====================================================================== */
function renderTopbar() {
  document.getElementById('coinCount').textContent = data.coins;
}

function renderShop() {
  var catBar = document.getElementById('catBar');
  catBar.innerHTML = '';
  CATEGORIES.forEach(function(cat) {
    var chip = document.createElement('div');
    chip.className = 'cat-chip' + (cat.id === currentCat ? ' active' : '');
    chip.textContent = cat.name;
    chip.onclick = function() { currentCat = cat.id; renderShop(); };
    catBar.appendChild(chip);
  });

  var grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  FURNITURE.forEach(function(f) {
    if (currentCat !== 'all' && f.cat !== currentCat) return;
    var card = document.createElement('div');
    card.className = 'furniture-card';
    if (data.coins < f.price) card.classList.add('cant-afford');
    card.innerHTML =
      '<div class="fc-img"><img src="' + getFurnitureImg(f.id) + '" alt="' + f.name + '"></div>' +
      '<div class="fc-name">' + f.name + '</div>' +
      '<div class="fc-price">💰' + f.price + '</div>' +
      '<div class="fc-size">' + f.w + '×' + f.h + '</div>';
    card.onclick = function() { buyFurniture(f.id); };
    grid.appendChild(card);
  });
}

function renderInventory() {
  var grid = document.getElementById('invGrid');
  grid.innerHTML = '';
  var hasAny = false;
  FURNITURE.forEach(function(f) {
    var count = data.inventory[f.id] || 0;
    if (count <= 0) return;
    hasAny = true;
    var card = document.createElement('div');
    card.className = 'furniture-card owned';
    if (placingFid === f.id) card.classList.add('selected');
    card.innerHTML =
      '<div class="fc-img"><img src="' + getFurnitureImg(f.id) + '" alt="' + f.name + '"></div>' +
      '<div class="fc-name">' + f.name + '</div>' +
      '<div class="fc-count">x' + count + '</div>' +
      '<div class="fc-size">' + f.w + '×' + f.h + '</div>';
    card.onclick = function() { startPlacing(f.id); };
    grid.appendChild(card);
  });
  if (!hasAny) {
    grid.innerHTML = '<div class="empty-hint">还没有家具哦<br>去商店买几个吧～</div>';
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.panel-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('shopPanel').style.display = tab === 'shop' ? '' : 'none';
  document.getElementById('inventoryPanel').style.display = tab === 'inventory' ? '' : 'none';
  if (tab === 'inventory') renderInventory();
}

function renderAll() {
  renderTopbar();
  renderHouse();
  renderFurniture();
  renderShop();
  renderInventory();
}

/* ========================================================================
 * 业务：购买 / 放置 / 选中 / 旋转 / 收回
 * ====================================================================== */
function buyFurniture(fid) {
  var f = FURN_MAP[fid];
  if (!f) return;
  if (data.coins < f.price) { toast('金币不足，差 ' + (f.price - data.coins) + ' 💰'); return; }
  data.coins -= f.price;
  data.inventory[fid] = (data.inventory[fid] || 0) + 1;
  saveData();
  toast('买入「' + f.name + '」💰-' + f.price);
  renderTopbar();
  renderShop();
  renderInventory();
  switchTab('inventory');
}

var previewPos = { col: 2, row: 2, floor: 0 };

function startPlacing(fid) {
  if (placingFid === fid) { cancelPlacing(); return; }
  placingFid = fid;
  selectedUid = null;
  previewUid = 'ghost_' + Date.now();
  document.getElementById('placeHint').style.display = 'block';
  document.getElementById('actionBar').style.display = 'none';
  renderInventory();
  renderFurniture();
}
function cancelPlacing() {
  placingFid = null;
  previewUid = null;
  document.getElementById('placeHint').style.display = 'none';
  renderInventory();
  renderFurniture();
}

/* 根据视口/屏幕坐标决定放到哪一层 + 世界 col/row */
function pickFloorAndWorld(clientX, clientY) {
  /* 先把 clientX/Y 转成 stage 相对坐标（去除视图变换） */
  var area = document.getElementById('roomArea');
  var rect = area.getBoundingClientRect();
  var sx = (clientX - rect.left - rect.width / 2 - view.tx) / view.scale;
  var sy = (clientY - rect.top  - rect.height / 2 - view.ty) / view.scale;

  /* 现在sx, sy是"stage"坐标，原点在视图中心
   * furniture-layer使用translate(-vbW/2, -vbH/2)
   * 所以要从stage坐标转到furniture-layer内部坐标，需要加上vbW/2, vbH/2
   * 然后再减去bounds偏移(minX, minY)得到SVG内部坐标
   * 最后通过screenToWorld转回世界坐标
   */
  if (HOUSE_BOUNDS) {
    var vbW = HOUSE_BOUNDS.maxX - HOUSE_BOUNDS.minX;
    var vbH = HOUSE_BOUNDS.maxY - HOUSE_BOUNDS.minY;
    /* 反向应用furniture-layer的变换 */
    var svgX = sx + vbW / 2;
    var svgY = sy + vbH / 2;
    /* 反向应用bounds偏移，得到worldToScreen输出的坐标 */
    var screenX = svgX + HOUSE_BOUNDS.minX;
    var screenY = svgY + HOUSE_BOUNDS.minY;
  } else {
    var screenX = sx;
    var screenY = sy;
  }

  /* 先投影到 floor=1 看是否落到二层地板；否则看 floor=0；否则用 floor=0 */
  var tryFloors = [1, 0, POOL ? POOL.floor : 0];
  for (var i = 0; i < tryFloors.length; i++) {
    var fl = tryFloors[i];
    var w = screenToWorld(screenX, screenY, fl);
    /* 判断是否在该层地板 */
    var inF = false;
    for (var j = 0; j < FLOORS.length; j++) {
      var ff = FLOORS[j];
      if (Math.abs(ff.floor - fl) < 0.1 &&
          w.col >= ff.x0 && w.col <= ff.x1 && w.row >= ff.y0 && w.row <= ff.y1) { inF = true; break; }
    }
    if (!inF && POOL && Math.abs(POOL.floor - fl) < 0.1) {
      if (w.col >= POOL.x0 && w.col <= POOL.x1 && w.row >= POOL.y0 && w.row <= POOL.y1) inF = true;
    }
    if (inF) return { col: w.col, row: w.row, floor: fl };
  }
  return { col: 0, row: 0, floor: 0, invalid: true };
}

function tryPlaceAt(clientX, clientY) {
  if (!placingFid) return;
  var w = pickFloorAndWorld(clientX, clientY);
  if (w.invalid) { toast('要放在房子里面哦'); return; }
  var f = FURN_MAP[placingFid];
  var sz = furnSize(f, 0);
  /* 对齐到 0.1 tile（既自由又稳定） */
  var col = Math.round((w.col - sz.w / 2) * 10) / 10;
  var row = Math.round((w.row - sz.h / 2) * 10) / 10;
  var chk = canPlaceAt(placingFid, col, row, w.floor, 0);
  if (!chk.ok) { toast(chk.reason); return; }
  var uid = ++uidCounter;
  data.placed.push({ uid: uid, fid: placingFid, col: col, row: row, floor: w.floor, rotation: 0 });
  data.inventory[placingFid]--;
  if (data.inventory[placingFid] <= 0) delete data.inventory[placingFid];
  saveData();
  toast('摆放成功！');
  if (data.inventory[placingFid]) {
    previewUid = 'ghost_' + Date.now();
    renderInventory();
    renderFurniture();
  } else {
    cancelPlacing();
    renderInventory();
    renderFurniture();
  }
}

function selectPlaced(uid) {
  if (selectedUid === uid) { deselect(); return; }
  selectedUid = uid;
  placingFid = null;
  previewUid = null;
  document.getElementById('placeHint').style.display = 'none';
  document.getElementById('actionBar').style.display = 'flex';
  renderFurniture();
  renderInventory();
}
function deselect() {
  selectedUid = null;
  document.getElementById('actionBar').style.display = 'none';
  renderFurniture();
}
function rotateSelected() {
  if (!selectedUid) return;
  var p = data.placed.find(function(p) { return p.uid === selectedUid; });
  if (!p) return;
  var newRot = (p.rotation + 90) % 360;
  var chk = canPlaceAt(p.fid, p.col, p.row, p.floor, newRot, selectedUid);
  if (!chk.ok) { toast(chk.reason); return; }
  p.rotation = newRot;
  saveData();
  renderFurniture();
}
function recycleSelected() {
  if (!selectedUid) return;
  var idx = data.placed.findIndex(function(p) { return p.uid === selectedUid; });
  if (idx < 0) return;
  var p = data.placed[idx];
  data.inventory[p.fid] = (data.inventory[p.fid] || 0) + 1;
  data.placed.splice(idx, 1);
  saveData();
  deselect();
  toast('已收回「' + FURN_MAP[p.fid].name + '」');
  renderAll();
}

/* ========================================================================
 * 家具拖拽（像素→世界）
 * ====================================================================== */
function screenToWorldWithOffset(sx, sy, floor) {
  /* 从stage坐标（已去除视图变换）转到世界坐标，考虑bounds偏移和furniture-layer变换 */
  if (HOUSE_BOUNDS) {
    var vbW = HOUSE_BOUNDS.maxX - HOUSE_BOUNDS.minX;
    var vbH = HOUSE_BOUNDS.maxY - HOUSE_BOUNDS.minY;
    /* 反向应用furniture-layer的变换 */
    var svgX = sx + vbW / 2;
    var svgY = sy + vbH / 2;
    /* 反向应用bounds偏移 */
    var screenX = svgX + HOUSE_BOUNDS.minX;
    var screenY = svgY + HOUSE_BOUNDS.minY;
    return screenToWorld(screenX, screenY, floor);
  } else {
    return screenToWorld(sx, sy, floor);
  }
}

function bindItemDrag(el, placed) {
  var startX, startY, origCol, origRow, moved;

  function onDown(e) {
    if (placingFid) return;
    e.preventDefault();
    e.stopPropagation();
    var pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    origCol = placed.col; origRow = placed.row;
    moved = false;
    selectPlaced(placed.uid);
    dragState = { el: el, placed: placed, startX: startX, startY: startY, origCol: origCol, origRow: origRow };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }
  function onMove(e) {
    if (!dragState) return;
    e.preventDefault();
    e.stopPropagation();
    var pt = e.touches ? e.touches[0] : e;
    var dx = pt.clientX - startX;
    var dy = pt.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    /* dx, dy 是屏幕像素 → 先 stage-local → 再反推世界 col/row 偏移 */
    var area = document.getElementById('roomArea');
    var rect = area.getBoundingClientRect();
    var sx0 = (startX - rect.left - rect.width/2 - view.tx) / view.scale;
    var sy0 = (startY - rect.top  - rect.height/2 - view.ty) / view.scale;
    var sx1 = sx0 + dx / view.scale;
    var sy1 = sy0 + dy / view.scale;
    var w0 = screenToWorldWithOffset(sx0, sy0, placed.floor);
    var w1 = screenToWorldWithOffset(sx1, sy1, placed.floor);
    var newCol = Math.round((origCol + (w1.col - w0.col)) * 10) / 10;
    var newRow = Math.round((origRow + (w1.row - w0.row)) * 10) / 10;
    placed.col = newCol;
    placed.row = newRow;
    renderFurniture();
  }
  function onUp(e) {
    if (!dragState) return;
    /* 如果位置不合法 → 弹回原位 */
    var chk = canPlaceAt(placed.fid, placed.col, placed.row, placed.floor, placed.rotation || 0, placed.uid);
    if (!chk.ok) {
      placed.col = origCol;
      placed.row = origRow;
      if (moved) toast(chk.reason);
    }
    saveData();
    renderFurniture();
    dragState = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
}

/* ========================================================================
 * 视口交互：缩放 / 平移 / 双指
 * ====================================================================== */
function bindViewport() {
  var area = document.getElementById('roomArea');

  /* 滚轮缩放（桌面端） */
  area.addEventListener('wheel', function(e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.12 : (1 / 1.12);
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  /* 鼠标中键或空白处拖拽平移 */
  area.addEventListener('mousedown', function(e) {
    /* 左键 + 没点到家具/SVG floor（或编辑未激活）时支持空白拖动 */
    var tgt = e.target;
    var dragPan = (e.button === 1);  /* 中键强制平移 */
    if (!dragPan && e.button === 0) {
      /* 点击在家具层上且没有选中家具 → 平移；点到家具层元素由家具自己处理（stopPropagation） */
      dragPan = (!placingFid);
    }
    if (!dragPan) return;
    panState = { sx: e.clientX, sy: e.clientY, tx: view.tx, ty: view.ty };
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!panState) return;
    view.tx = panState.tx + (e.clientX - panState.sx);
    view.ty = panState.ty + (e.clientY - panState.sy);
    applyView();
  });
  document.addEventListener('mouseup', function() { panState = null; });

  /* 触摸：单指=平移；双指=捏合缩放+平移；放置模式下单指点击/拖动预览 */
  area.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      panState = { sx: e.touches[0].clientX, sy: e.touches[0].clientY, tx: view.tx, ty: view.ty };
    } else if (e.touches.length === 2) {
      panState = null;
      var t0 = e.touches[0], t1 = e.touches[1];
      var cx = (t0.clientX + t1.clientX) / 2;
      var cy = (t0.clientY + t1.clientY) / 2;
      var dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
      pinchState = {
        cx: cx, cy: cy, dist: Math.sqrt(dx*dx + dy*dy),
        scale: view.scale, tx: view.tx, ty: view.ty
      };
    }
  }, { passive: false });

  area.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (pinchState && e.touches.length === 2) {
      var t0 = e.touches[0], t1 = e.touches[1];
      var cx = (t0.clientX + t1.clientX) / 2;
      var cy = (t0.clientY + t1.clientY) / 2;
      var dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var factor = dist / pinchState.dist;
      /* 先以 pinchState.cx/cy 为不动点做缩放到 pinchState.scale*factor */
      var area = document.getElementById('roomArea');
      var rect = area.getBoundingClientRect();
      var oldS = pinchState.scale;
      var newS = Math.max(view.minS, Math.min(view.maxS, oldS * factor));
      var sx = pinchState.cx - rect.left - rect.width/2;
      var sy = pinchState.cy - rect.top  - rect.height/2;
      var nTx = pinchState.tx + sx * (oldS - newS);
      var nTy = pinchState.ty + sy * (oldS - newS);
      /* 再加平移（双指中心的移动） */
      nTx += (cx - pinchState.cx);
      nTy += (cy - pinchState.cy);
      view.scale = newS; view.tx = nTx; view.ty = nTy;
      applyView();
    } else if (panState && e.touches.length === 1) {
      view.tx = panState.tx + (e.touches[0].clientX - panState.sx);
      view.ty = panState.ty + (e.touches[0].clientY - panState.sy);
      applyView();
    }
  }, { passive: false });

  area.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) pinchState = null;
    if (e.touches.length === 0) panState = null;
  });

  /* 点击空白区域 / SVG 地板：放置模式下放置家具；否则取消选中 */
  area.addEventListener('click', function(e) {
    var tgt = e.target;
    /* 点到家具或家具图片 → 家具自己的 click 会处理（stopPropagation 没有，但我们在绑定里只靠 mousedown/touchstart） */
    if (tgt.closest('.placed-item')) return;
    if (placingFid) {
      tryPlaceAt(e.clientX, e.clientY);
    } else if (selectedUid) {
      deselect();
    }
  });

  /* 桌面移动鼠标 → 更新放置预览位置 */
  area.addEventListener('mousemove', function(e) {
    if (!placingFid) return;
    var w = pickFloorAndWorld(e.clientX, e.clientY);
    if (w.invalid) return;
    var f = FURN_MAP[placingFid];
    var sz = furnSize(f, 0);
    previewPos.col = Math.round((w.col - sz.w/2) * 10) / 10;
    previewPos.row = Math.round((w.row - sz.h/2) * 10) / 10;
    previewPos.floor = w.floor;
    renderFurniture();
  });
}

/* ========================================================================
 * 初始化
 * ====================================================================== */
function init() {
  data = loadData();
  data.placed.forEach(function(p) { if (p.uid >= uidCounter) uidCounter = p.uid + 1; });

  /* 预加载家具图片并透明化 */
  FURNITURE.forEach(function(f) {
    makeImageTransparent(f.img, function() {
      /* 图片透明化完成后，重新渲染商店和库存 */
      renderShop();
      renderInventory();
    });
  });

  /* 初次渲染 */
  renderHouse();
  applyView();
  renderAll();
  fitView();

  bindViewport();

  document.querySelectorAll('.panel-tab').forEach(function(t) {
    t.onclick = function() { switchTab(t.dataset.tab); };
  });
  document.getElementById('btnRotate').onclick  = rotateSelected;
  document.getElementById('btnRecycle').onclick = recycleSelected;
  document.getElementById('btnCancel').onclick  = deselect;

  document.getElementById('zoomIn').onclick = function() {
    var rect = document.getElementById('roomArea').getBoundingClientRect();
    zoomAt(1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
  };
  document.getElementById('zoomOut').onclick = function() {
    var rect = document.getElementById('roomArea').getBoundingClientRect();
    zoomAt(1 / 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
  };

  /* 尺寸变化 → 重新 fit */
  window.addEventListener('resize', function() { fitView(); });
}

/* 获取透明化后的家具图片URL（如果已处理） */
function getFurnitureImg(fid) {
  var f = FURN_MAP[fid];
  if (!f) return '';
  if (_transparentImageCache[f.img]) {
    return _transparentImageCache[f.img];
  }
  return f.img;
}

init();
</script>
