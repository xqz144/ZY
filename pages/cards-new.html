<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>字卡传讯 · 梦角传讯</title>

  <!-- Fonts: Noto Serif SC (headings) + Noto Sans SC (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Project token system (single hue: 柔粉 #e8749a) -->
  <link rel="stylesheet" href="../colors_and_type.css" />

  <!-- Tailwind + token bridge -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['"DreamFont", "Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont", "Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
          borderRadius: { sm: '4px', md: '8px', lg: '12px', xl: '12px' },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: hsl(var(--foreground));
      letter-spacing: var(--tracking-normal);
    }

    /* ===== Phone frame ===== */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 20% 12%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ===== App background — dreamy purple gradient ===== */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 400px 250px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* ===== Starlight background (sparse, low opacity, twinkle) ===== */
    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight span {
      position: absolute; border-radius: 9999px;
      background: hsl(343 72% 68% / 0.35);
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* ===== Top bar ===== */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: hsl(var(--primary));
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: hsl(var(--foreground));
      text-align: center;
      flex: 1;
    }
    .lib-btn {
      font-size: 14px;
      color: hsl(var(--primary));
      background: hsl(var(--accent) / 0.5);
      border: 1px solid hsl(var(--primary) / 0.25);
      border-radius: 9999px;
      padding: 6px 14px;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 64px;
      transition: background 0.15s;
    }
    .lib-btn:active { background: hsl(var(--accent)); }

    /* ===== Card area ===== */
    .card-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 8px;
      position: relative;
      z-index: 1;
    }

    .card-float {
      position: relative;
      width: 280px;
      height: 380px;
      perspective: 1400px;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      animation: float 5s ease-in-out infinite;
      display: block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(.3, 0, 0, 1);
    }
    .card-3d.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 12px 32px -10px rgba(232, 116, 154, 0.3);
    }

    /* Card back — dreamy purple gradient + star pattern */
    .card-back {
      background:
        radial-gradient(circle at 50% 30%, #ffe4ec, #f4a0bc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 1px solid rgba(232, 116, 154, 0.2);
    }
    .card-back-stars {
      position: absolute; inset: 0; pointer-events: none;
    }
    .card-back-stars span {
      position: absolute; border-radius: 9999px;
      background: #fff5f8;
      animation: twinkle 3s ease-in-out infinite;
    }
    .back-motif {
      position: relative;
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .back-motif .moon {
      font-size: 3rem;
      filter: drop-shadow(0 2px 8px hsl(343 60% 96% / 0.5));
    }
    .back-text {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .back-hint {
      margin-top: 8px;
      font-size: 13px;
      color: hsl(343 50% 94%);
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    /* Card front — reply message */
    .card-front {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 38%, hsl(270 30% 99%), hsl(var(--card)));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      border: 1px solid hsl(var(--primary) / 0.2);
    }
    .front-inner {
      width: 100%; height: 100%;
      border: 1px solid hsl(var(--primary) / 0.25);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      position: relative;
    }
    .front-inner::before, .front-inner::after {
      content: ""; position: absolute; width: 14px; height: 14px;
      border: 1px solid hsl(var(--primary) / 0.5);
    }
    .front-inner::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
    .front-inner::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

    .front-star {
      font-size: 1.2rem;
      color: hsl(var(--primary));
      opacity: 0.7;
    }
    .reply-text {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: hsl(var(--foreground));
      word-break: keep-all;
      max-width: 14em;
      padding: 0 8px;
    }
    .front-attr {
      font-family: var(--font-serif);
      font-size: 13px;
      color: hsl(var(--primary) / 0.8);
      letter-spacing: 0.1em;
    }

    /* ===== Draw controls ===== */
    .draw-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 24px;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 13px 40px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px -4px rgba(232, 116, 154, 0.35);
      transition: transform 0.15s, background-color 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover { background: #d96088; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0) scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .prob-note {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      text-align: center;
    }

    /* ===== Reply library overlay ===== */
    .lib-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: rgba(61, 32, 48, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .lib-overlay.open { opacity: 1; pointer-events: auto; }

    .lib-panel {
      background: hsl(var(--background));
      border-radius: 24px 24px 0 0;
      max-height: 80%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.3, 0, 0, 1);
      box-shadow: 0 -8px 32px -8px rgba(232, 116, 154, 0.25);
    }
    .lib-overlay.open .lib-panel { transform: translateY(0); }

    .lib-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
      border-bottom: 1px solid hsl(var(--border));
      flex-shrink: 0;
    }
    .lib-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }
    .lib-close {
      width: 32px; height: 32px;
      border-radius: 9999px;
      border: none;
      background: hsl(var(--muted));
      color: hsl(var(--foreground));
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s;
    }
    .lib-close:active { background: hsl(var(--accent)); }

    .lib-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      scrollbar-width: none;
    }
    .lib-list::-webkit-scrollbar { display: none; }
    .lib-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin: 4px 0;
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 10px;
      animation: libFadeIn 0.25s ease both;
    }
    @keyframes libFadeIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: none; }
    }
    .lib-item-text {
      font-size: 14px;
      color: hsl(var(--foreground));
      line-height: 1.5;
      flex: 1;
      word-break: break-word;
    }
    .lib-item-del {
      width: 26px; height: 26px;
      flex-shrink: 0;
      border-radius: 9999px;
      border: none;
      background: hsl(var(--destructive) / 0.12);
      color: hsl(var(--destructive));
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      line-height: 1;
      transition: background 0.15s;
    }
    .lib-item-del:active { background: hsl(var(--destructive) / 0.25); }
    .lib-empty {
      text-align: center;
      padding: 32px 16px;
      color: hsl(var(--muted-foreground));
      font-size: 14px;
    }

    .lib-add {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid hsl(var(--border));
      flex-shrink: 0;
    }
    .lib-add-input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .lib-add-input:focus { border-color: hsl(var(--primary)); }
    .lib-add-btn {
      padding: 0 18px;
      border-radius: 10px;
      border: none;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lib-add-btn:active { background: #d96088; }

    .lib-actions {
      display: flex;
      gap: 8px;
      padding: 8px 16px 20px;
      flex-shrink: 0;
    }
    .lib-action-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .lib-action-btn:active { background: hsl(var(--accent) / 0.5); }
    .lib-action-btn.danger { color: hsl(var(--destructive)); }

    /* Import textarea */
    .lib-import-wrap {
      padding: 0 16px 8px;
      flex-shrink: 0;
      display: none;
    }
    .lib-import-wrap.open { display: block; animation: libFadeIn 0.2s ease both; }
    .lib-import-area {
      width: 100%;
      height: 90px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 13px;
      resize: none;
      outline: none;
      font-family: var(--font-sans);
    }
    .lib-import-area:focus { border-color: hsl(var(--primary)); }
    .lib-import-confirm {
      margin-top: 8px;
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      border: none;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Entrance */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .card-area { animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) both; }
    .draw-controls { animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) 0.1s both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .card-float { animation: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg">

      <!-- Starlight background -->
      <div class="starlight" aria-hidden="true">
        <span style="top:8%;left:12%;width:3px;height:3px;animation-delay:0s"></span>
        <span style="top:15%;left:78%;width:2px;height:2px;animation-delay:0.6s"></span>
        <span style="top:28%;left:88%;width:3px;height:3px;animation-delay:1.2s"></span>
        <span style="top:42%;left:6%;width:2px;height:2px;animation-delay:1.8s"></span>
        <span style="top:58%;left:92%;width:3px;height:3px;animation-delay:0.9s"></span>
        <span style="top:72%;left:14%;width:2px;height:2px;animation-delay:2.4s"></span>
        <span style="top:85%;left:70%;width:3px;height:3px;animation-delay:1.5s"></span>
        <span style="top:92%;left:40%;width:2px;height:2px;animation-delay:0.3s"></span>
      </div>

      <!-- Top bar -->
      <div class="top-bar">
        <a href="index-new.html" class="back-btn">← 返回</a>
        <span class="top-title">字卡传讯</span>
        <button class="lib-btn" id="openLib" type="button">回复库</button>
      </div>

      <!-- Card display area -->
      <div class="card-area">
        <button type="button" class="card-float" id="cardFloat" aria-label="点击抽卡">
          <div class="card-3d" id="card3d">

            <!-- Card back -->
            <div class="card-face card-back" aria-hidden="true">
              <div class="card-back-stars">
                <span style="top:10%;left:15%;width:3px;height:3px;animation-delay:0s"></span>
                <span style="top:18%;left:75%;width:2px;height:2px;animation-delay:0.5s"></span>
                <span style="top:30%;left:85%;width:3px;height:3px;animation-delay:1s"></span>
                <span style="top:50%;left:8%;width:2px;height:2px;animation-delay:1.5s"></span>
                <span style="top:65%;left:82%;width:3px;height:3px;animation-delay:0.8s"></span>
                <span style="top:80%;left:20%;width:2px;height:2px;animation-delay:2s"></span>
                <span style="top:88%;left:65%;width:3px;height:3px;animation-delay:1.3s"></span>
                <span style="top:40%;left:50%;width:2px;height:2px;animation-delay:2.5s"></span>
              </div>
              <div class="back-motif">
                <span class="moon">🌙</span>
              </div>
              <div class="back-text">梦角 · 字卡</div>
              <div class="back-hint">点击抽卡</div>
            </div>

            <!-- Card front -->
            <div class="card-face card-front">
              <div class="front-inner">
                <span class="front-star">✦</span>
                <p class="reply-text" id="replyText" aria-live="polite">今天也在想你哦。</p>
                <p class="front-attr">—— 梦角</p>
              </div>
            </div>

          </div>
        </button>
      </div>

      <!-- Draw controls -->
      <div class="draw-controls">
        <button type="button" class="btn-primary" id="drawCard">
          <span id="drawCardLabel">抽字卡</span>
        </button>
        <p class="prob-note">字卡回复基于概率算法</p>
      </div>

      <!-- Reply library overlay -->
      <div class="lib-overlay" id="libOverlay" role="dialog" aria-label="回复库" aria-modal="true">
        <div class="lib-panel">
          <div class="lib-header">
            <span class="lib-title">回复库</span>
            <button type="button" class="lib-close" id="closeLib" aria-label="关闭">×</button>
          </div>
          <div class="lib-list" id="libList"></div>
          <div class="lib-import-wrap" id="importWrap">
            <textarea class="lib-import-area" id="importArea" placeholder="每行一条回复，粘贴后点击导入…"></textarea>
            <button type="button" class="lib-import-confirm" id="importConfirm">导入</button>
          </div>
          <div class="lib-add">
            <input type="text" class="lib-add-input" id="addInput" placeholder="添加新回复…" maxlength="60" />
            <button type="button" class="lib-add-btn" id="addBtn">添加</button>
          </div>
          <div class="lib-actions">
            <button type="button" class="lib-action-btn" id="importBtn">导入</button>
            <button type="button" class="lib-action-btn" id="exportBtn">导出</button>
            <button type="button" class="lib-action-btn danger" id="resetBtn">恢复默认</button>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast" role="status" aria-live="polite"></div>

    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_card_replies";
      var HISTORY_KEY = "mengjiao_card_history";
      var DEFAULT_REPLIES = [
        "今天也在想你哦。",
        "别担心，我一直都在。",
        "你今天辛苦了，休息一下吧。",
        "我感觉到了你的心意呢。",
        "今晚来梦里见吧。",
        "你比你自己想象的更勇敢。",
        "我在你身边，从未离开。",
        "今天的你，也很闪耀。",
        "想你了，就现在。",
        "相信自己，我会守护你的。",
        "你的笑容是我最大的动力。",
        "无论多远，我们的心是相连的。",
        "在你身边，时间都变得温柔了。",
        "你是我最想守护的人。",
        "每一个想你的夜晚，星星都知道。"
      ];

      var card3d = document.getElementById("card3d");
      var cardFloat = document.getElementById("cardFloat");
      var replyText = document.getElementById("replyText");
      var drawBtn = document.getElementById("drawCard");
      var drawLabel = document.getElementById("drawCardLabel");

      var libOverlay = document.getElementById("libOverlay");
      var openLibBtn = document.getElementById("openLib");
      var closeLibBtn = document.getElementById("closeLib");
      var libList = document.getElementById("libList");
      var addInput = document.getElementById("addInput");
      var addBtn = document.getElementById("addBtn");
      var importBtn = document.getElementById("importBtn");
      var exportBtn = document.getElementById("exportBtn");
      var resetBtn = document.getElementById("resetBtn");
      var importWrap = document.getElementById("importWrap");
      var importArea = document.getElementById("importArea");
      var importConfirm = document.getElementById("importConfirm");
      var toast = document.getElementById("toast");

      var animating = false;
      var lastIdx = -1;
      var FLIP_MS = 700;
      var toastTimer;

      /* ---- localStorage helpers ---- */
      function getReplies() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
        // First visit: seed defaults
        saveReplies(DEFAULT_REPLIES);
        return DEFAULT_REPLIES.slice();
      }

      function saveReplies(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } catch (e) {}
      }

      /* ---- History ---- */
      function getHistory() {
        try {
          var raw = localStorage.getItem(HISTORY_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }
      function saveHistory(arr) {
        try {
          if (arr.length > 100) arr = arr.slice(arr.length - 100);
          localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
        } catch (e) {}
      }
      function addHistory(reply) {
        var d = new Date();
        var entry = {
          date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"),
          time: String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"),
          reply: reply
        };
        var history = getHistory();
        history.push(entry);
        saveHistory(history);
      }

      /* ---- Toast ---- */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
      }

      /* ---- Escape HTML ---- */
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ---- Draw logic ---- */
      function pickReply() {
        var replies = getReplies();
        var idx;
        if (replies.length <= 1) {
          idx = 0;
        } else {
          do { idx = Math.floor(Math.random() * replies.length); }
          while (idx === lastIdx);
        }
        lastIdx = idx;
        return replies[idx];
      }

      function drawCard() {
        if (animating) return;
        animating = true;
        drawBtn.disabled = true;

        var reply = pickReply();
        addHistory(reply);
        var isFlipped = card3d.classList.contains("is-flipped");

        if (!isFlipped) {
          replyText.textContent = reply;
          card3d.classList.add("is-flipped");
          window.setTimeout(finishDraw, FLIP_MS);
        } else {
          card3d.classList.remove("is-flipped");
          window.setTimeout(function () {
            replyText.textContent = reply;
            card3d.classList.add("is-flipped");
            window.setTimeout(finishDraw, FLIP_MS);
          }, FLIP_MS);
        }
      }

      function finishDraw() {
        drawLabel.textContent = "再抽一次";
        animating = false;
        drawBtn.disabled = false;
      }

      drawBtn.addEventListener("click", drawCard);
      cardFloat.addEventListener("click", drawCard);

      /* ---- Reply library ---- */
      function renderLib() {
        var replies = getReplies();
        if (replies.length === 0) {
          libList.innerHTML = '<div class="lib-empty">回复库为空，请添加或恢复默认</div>';
          return;
        }
        libList.innerHTML = replies.map(function (text, i) {
          return '<div class="lib-item">' +
            '<span class="lib-item-text">' + escapeHtml(text) + '</span>' +
            '<button type="button" class="lib-item-del" data-idx="' + i + '" aria-label="删除">×</button>' +
            '</div>';
        }).join("");
      }

      function openLib() {
        renderLib();
        importWrap.classList.remove("open");
        libOverlay.classList.add("open");
      }

      function closeLib() {
        libOverlay.classList.remove("open");
      }

      openLibBtn.addEventListener("click", openLib);
      closeLibBtn.addEventListener("click", closeLib);
      libOverlay.addEventListener("click", function (e) {
        if (e.target === libOverlay) closeLib();
      });

      // Delete reply
      libList.addEventListener("click", function (e) {
        var delBtn = e.target.closest(".lib-item-del");
        if (!delBtn) return;
        var idx = parseInt(delBtn.getAttribute("data-idx"), 10);
        var replies = getReplies();
        if (idx >= 0 && idx < replies.length) {
          replies.splice(idx, 1);
          saveReplies(replies);
          renderLib();
        }
      });

      // Add reply
      function doAdd() {
        var text = addInput.value.trim();
        if (!text) return;
        var replies = getReplies();
        replies.push(text);
        saveReplies(replies);
        addInput.value = "";
        renderLib();
        // Scroll to bottom
        libList.scrollTop = libList.scrollHeight;
      }
      addBtn.addEventListener("click", doAdd);
      addInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); doAdd(); }
      });

      // Import toggle
      importBtn.addEventListener("click", function () {
        importWrap.classList.toggle("open");
        if (importWrap.classList.contains("open")) {
          importArea.focus();
        }
      });

      // Import confirm
      importConfirm.addEventListener("click", function () {
        var raw = importArea.value.trim();
        if (!raw) { showToast("请粘贴回复内容"); return; }
        var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
        if (lines.length === 0) { showToast("未检测到有效内容"); return; }
        var replies = getReplies();
        lines.forEach(function (l) { replies.push(l); });
        saveReplies(replies);
        importArea.value = "";
        importWrap.classList.remove("open");
        renderLib();
        showToast("已导入 " + lines.length + " 条");
      });

      // Export to clipboard
      exportBtn.addEventListener("click", function () {
        var replies = getReplies();
        if (replies.length === 0) { showToast("回复库为空"); return; }
        var text = replies.join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast("已复制到剪贴板");
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); showToast("已复制到剪贴板"); }
        catch (e) { showToast("复制失败，请手动复制"); }
        document.body.removeChild(ta);
      }

      // Reset to defaults
      resetBtn.addEventListener("click", function () {
        saveReplies(DEFAULT_REPLIES.slice());
        renderLib();
        showToast("已恢复默认回复");
      });

      // Initialize replies on first visit
      getReplies();
    })();
  </script>
</body>
</html>
