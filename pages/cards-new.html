<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字卡传讯 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="app-shell">

    <!-- Hand-drawn decorations: soft stars and clouds -->
    <div class="deco-layer" aria-hidden="true">
      <span class="deco-star" style="top:6%;left:10%;width:3px;height:3px;animation-delay:0s"></span>
      <span class="deco-star" style="top:12%;left:82%;width:2px;height:2px;animation-delay:0.7s"></span>
      <span class="deco-star" style="top:22%;left:92%;width:3px;height:3px;animation-delay:1.4s"></span>
      <span class="deco-star" style="top:34%;left:6%;width:2px;height:2px;animation-delay:2.1s"></span>
      <span class="deco-star" style="top:48%;left:88%;width:3px;height:3px;animation-delay:0.9s"></span>
      <span class="deco-star" style="top:62%;left:12%;width:2px;height:2px;animation-delay:2.8s"></span>
      <span class="deco-star" style="top:76%;left:74%;width:3px;height:3px;animation-delay:1.8s"></span>
      <span class="deco-star" style="top:88%;left:42%;width:2px;height:2px;animation-delay:0.4s"></span>
      <svg class="deco-cloud cloud-1" viewBox="0 0 120 60" fill="currentColor"><path d="M25 50c-11 0-20-9-20-20 0-9 6-17 14-19 2-8 9-14 18-14 6 0 11 3 15 7 3-2 7-3 11-3 10 0 18 8 18 18 0 1 0 2-.1 3 7 2 12 9 12 17 0 10-8 18-18 18H25z"/></svg>
      <svg class="deco-cloud cloud-2" viewBox="0 0 120 60" fill="currentColor"><path d="M25 50c-11 0-20-9-20-20 0-9 6-17 14-19 2-8 9-14 18-14 6 0 11 3 15 7 3-2 7-3 11-3 10 0 18 8 18 18 0 1 0 2-.1 3 7 2 12 9 12 17 0 10-8 18-18 18H25z"/></svg>
    </div>

    <!-- Top bar -->
    <header class="top-bar">
      <a href="index-new-v2.html" class="back-btn" data-dom-id="nav-back">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
        <span>返回</span>
      </a>
      <h1 class="top-title">字卡传讯</h1>
      <button class="lib-btn" id="openLib" type="button" data-dom-id="open-library">
        <i data-lucide="library" class="w-4 h-4"></i>
        <span>回复库</span>
      </button>
    </header>

    <!-- Card display area -->
    <main class="card-area">
      <button type="button" class="card-float" id="cardFloat" aria-label="点击抽卡" data-dom-id="card-float">
        <div class="card-3d" id="card3d">

          <!-- Card back -->
          <div class="card-face card-back" aria-hidden="true">
            <div class="card-back-inner">
              <div class="back-ornament top-left"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
              <div class="back-ornament top-right"><i data-lucide="star" class="w-4 h-4"></i></div>
              <div class="back-ornament bottom-left"><i data-lucide="star" class="w-4 h-4"></i></div>
              <div class="back-ornament bottom-right"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
              <div class="back-motif">
                <i data-lucide="moon" class="w-12 h-12 moon-icon"></i>
              </div>
              <div class="back-text">梦角 · 字卡</div>
              <div class="back-hint">点击抽卡</div>
            </div>
          </div>

          <!-- Card front -->
          <div class="card-face card-front">
            <div class="front-inner">
              <i data-lucide="sparkles" class="w-5 h-5 front-star"></i>
              <p class="reply-text" id="replyText" aria-live="polite">今天也在想你哦。</p>
              <p class="front-attr">—— 梦角</p>
            </div>
          </div>

        </div>
      </button>
    </main>

    <!-- Draw controls -->
    <section class="draw-controls">
      <button type="button" class="btn-primary" id="drawCard" data-dom-id="draw-card">
        <i data-lucide="wand-2" class="w-5 h-5"></i>
        <span id="drawCardLabel">抽字卡</span>
      </button>
      <p class="prob-note">字卡回复基于概率算法</p>
    </section>

    <footer class="app-footer">梦角传讯</footer>

    <!-- Reply library overlay -->
    <div class="lib-overlay" id="libOverlay" role="dialog" aria-label="回复库" aria-modal="true" data-dom-id="library-overlay">
      <div class="lib-panel">
        <div class="lib-header">
          <span class="lib-title">回复库</span>
          <button type="button" class="lib-close" id="closeLib" aria-label="关闭" data-dom-id="close-library">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div class="lib-list" id="libList"></div>
        <div class="lib-import-wrap" id="importWrap">
          <textarea class="lib-import-area" id="importArea" placeholder="每行一条回复，粘贴后点击导入…"></textarea>
          <button type="button" class="lib-import-confirm" id="importConfirm" data-dom-id="library-import-confirm">导入</button>
        </div>
        <div class="lib-add">
          <input type="text" class="lib-add-input" id="addInput" placeholder="添加新回复…" maxlength="60" />
          <button type="button" class="lib-add-btn" id="addBtn" data-dom-id="library-add">添加</button>
        </div>
        <div class="lib-actions">
          <button type="button" class="lib-action-btn" id="importBtn" data-dom-id="library-import-toggle">导入</button>
          <button type="button" class="lib-action-btn" id="exportBtn" data-dom-id="library-export">导出</button>
          <button type="button" class="lib-action-btn danger" id="resetBtn" data-dom-id="library-reset">恢复默认</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Hidden textarea for fallback copy -->
    <textarea id="fallbackCopyArea" class="sr-only" aria-hidden="true"></textarea>
  </div>

  <style>
    /* ---- App shell ---- */
    .app-shell {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--background);
    }
    @media (min-width: 480px) {
      .app-shell {
        min-height: 800px;
        margin-top: 24px;
        margin-bottom: 24px;
        border-radius: 2.5rem;
        border: 10px solid var(--border-color);
        box-shadow: 0 20px 40px -12px hsl(var(--shadow-color) / .06);
      }
    }

    /* ---- Decorations ---- */
    .deco-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      color: hsl(var(--primary) / .22);
    }
    .deco-star {
      position: absolute;
      border-radius: 9999px;
      background: hsl(var(--primary) / .45);
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    .deco-cloud {
      position: absolute;
      width: 120px;
      height: 60px;
      opacity: 0.55;
    }
    .cloud-1 { top: 10%; right: -28px; transform: rotate(-8deg); }
    .cloud-2 { bottom: 18%; left: -24px; transform: rotate(6deg) scaleX(-1); }

    /* ---- Top bar ---- */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 48px 16px 12px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 20px; }
    }
    .back-btn, .lib-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 9999px;
      flex-shrink: 0;
      min-width: 64px;
      transition: transform 0.15s, background-color 0.15s;
      white-space: nowrap;
    }
    .back-btn {
      color: hsl(var(--primary));
      background: hsl(var(--accent));
      text-decoration: none;
    }
    .back-btn:active { transform: scale(0.96); }
    .lib-btn {
      color: hsl(var(--primary));
      background: hsl(var(--accent));
      border: 1px solid hsl(var(--primary) / .18);
      cursor: pointer;
    }
    .lib-btn:active { background: hsl(var(--primary) / .18); transform: scale(0.96); }
    .top-title {
      flex: 1;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: hsl(var(--foreground));
      text-align: center;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Card area ---- */
    .card-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 8px;
      position: relative;
      z-index: 1;
    }

    .card-float {
      position: relative;
      width: min(280px, 78vw);
      height: min(380px, 104vw);
      perspective: 1400px;
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      animation: float 5s ease-in-out infinite;
      display: block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card-3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(.3, 0, 0, 1);
    }
    .card-3d.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 14px 30px -12px hsl(var(--primary) / .12);
    }

    /* Card back — tarot / divination style */
    .card-back {
      background:
        radial-gradient(circle at 50% 30%, hsl(var(--primary) / .55) 0%, hsl(var(--accent)) 60%, hsl(var(--secondary)) 100%);
      border: 2px dashed hsl(var(--primary-foreground) / .18);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }
    .card-back-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border: 2px solid hsl(var(--primary-foreground) / .12);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
    }
    .back-ornament {
      position: absolute;
      color: hsl(var(--primary-foreground) / .35);
    }
    .back-ornament.top-left { top: 10px; left: 10px; transform: rotate(-12deg); }
    .back-ornament.top-right { top: 10px; right: 10px; transform: rotate(12deg); }
    .back-ornament.bottom-left { bottom: 10px; left: 10px; transform: rotate(12deg); }
    .back-ornament.bottom-right { bottom: 10px; right: 10px; transform: rotate(-12deg); }
    .back-motif {
      width: 84px;
      height: 84px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--card) / .55);
      border: 2px solid hsl(var(--primary-foreground) / .12);
    }
    .moon-icon { color: hsl(var(--primary-foreground) / .8); }
    .back-text {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      color: hsl(var(--primary-foreground));
      letter-spacing: 0.1em;
    }
    .back-hint {
      font-size: 13px;
      color: hsl(var(--primary-foreground) / .75);
      letter-spacing: 0.06em;
    }

    /* Card front — reply message */
    .card-front {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 40%, hsl(var(--primary) / .1) 0%, hsl(var(--card)) 55%);
      border: 1px solid hsl(var(--primary) / .22);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
    }
    .front-inner {
      width: 100%;
      height: 100%;
      border: 2px dashed hsl(var(--primary) / .35);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      position: relative;
    }
    .front-inner::before, .front-inner::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid hsl(var(--primary) / .45);
    }
    .front-inner::before { top: 10px; left: 10px; border-right: none; border-bottom: none; border-top-left-radius: 5px; }
    .front-inner::after { bottom: 10px; right: 10px; border-left: none; border-top: none; border-bottom-right-radius: 5px; }
    .front-star {
      color: hsl(var(--primary));
      opacity: 0.75;
    }
    .reply-text {
      font-family: var(--font-serif);
      font-size: clamp(18px, 6vw, 24px);
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: 0.02em;
      color: hsl(var(--foreground));
      word-break: keep-all;
      overflow-wrap: break-word;
      max-width: 13em;
      padding: 0 8px;
    }
    .front-attr {
      font-family: var(--font-serif);
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      letter-spacing: 0.12em;
    }

    /* ---- Draw controls ---- */
    .draw-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 32px;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 14px 44px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px -4px hsl(var(--primary) / .18);
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0) scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: none; }
    .prob-note {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      text-align: center;
    }

    /* ---- Reply library overlay ---- */
    .lib-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: hsl(var(--foreground) / .35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .lib-overlay.open { opacity: 1; pointer-events: auto; }

    .lib-panel {
      background: hsl(var(--background));
      border-radius: 28px 28px 0 0;
      max-height: 82%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.3, 0, 0, 1);
      box-shadow: 0 -8px 32px -8px hsl(var(--primary) / .22);
    }
    .lib-overlay.open .lib-panel { transform: translateY(0); }

    .lib-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
      border-bottom: 1px solid hsl(var(--border));
      flex-shrink: 0;
    }
    .lib-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }
    .lib-close {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      border: none;
      background: hsl(var(--muted));
      color: hsl(var(--foreground));
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s;
    }
    .lib-close:active { background: hsl(var(--accent)); }

    .lib-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      scrollbar-width: none;
    }
    .lib-list::-webkit-scrollbar { display: none; }
    .lib-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin: 6px 0;
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 14px;
      animation: libFadeIn 0.25s ease both;
    }
    @keyframes libFadeIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: none; }
    }
    .lib-item-text {
      font-size: 14px;
      color: hsl(var(--foreground));
      line-height: 1.55;
      flex: 1;
      min-width: 0;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lib-item-del {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 9999px;
      border: none;
      background: hsl(var(--destructive) / .12);
      color: hsl(var(--destructive));
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background-color 0.15s;
    }
    .lib-item-del:active { background: hsl(var(--destructive) / .25); }
    .lib-empty {
      text-align: center;
      padding: 32px 16px;
      color: hsl(var(--muted-foreground));
      font-size: 14px;
    }

    .lib-add {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid hsl(var(--border));
      flex-shrink: 0;
    }
    .lib-add-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .lib-add-input:focus { border-color: hsl(var(--primary)); }
    .lib-add-btn {
      padding: 0 18px;
      border-radius: 12px;
      border: none;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
      white-space: nowrap;
    }
    .lib-add-btn:active { filter: brightness(1.05); }

    .lib-actions {
      display: flex;
      gap: 8px;
      padding: 8px 16px 24px;
      flex-shrink: 0;
    }
    .lib-action-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .lib-action-btn:active { background: hsl(var(--accent)); }
    .lib-action-btn.danger { color: hsl(var(--destructive)); }

    /* Import textarea */
    .lib-import-wrap {
      padding: 0 16px 8px;
      flex-shrink: 0;
      display: none;
    }
    .lib-import-wrap.open { display: block; animation: libFadeIn 0.2s ease both; }
    .lib-import-area {
      width: 100%;
      height: 90px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-size: 13px;
      resize: none;
      outline: none;
      font-family: var(--font-sans);
    }
    .lib-import-area:focus { border-color: hsl(var(--primary)); }
    .lib-import-confirm {
      margin-top: 8px;
      width: 100%;
      padding: 9px;
      border-radius: 12px;
      border: none;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .lib-import-confirm:active { filter: brightness(1.05); }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 60;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Focus visibility */
    :focus-visible {
      outline: 2px solid hsl(var(--ring));
      outline-offset: 2px;
    }

    /* Accessibility helper */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-footer {
      text-align: center;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      padding: 0 16px 16px;
      flex-shrink: 0;
    }

    /* Entrance */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .card-area { animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) both; }
    .draw-controls { animation: fadeUp 0.5s cubic-bezier(.3,0,0,1) 0.1s both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .card-float { animation: none; }
    }
  </style>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_card_replies";
      var HISTORY_KEY = "mengjiao_card_history";
      var DEFAULT_REPLIES = [
        "今天也在想你哦。",
        "别担心，我一直都在。",
        "你今天辛苦了，休息一下吧。",
        "我感觉到了你的心意呢。",
        "今晚来梦里见吧。",
        "你比你自己想象的更勇敢。",
        "我在你身边，从未离开。",
        "今天的你，也很闪耀。",
        "想你了，就现在。",
        "相信自己，我会守护你的。",
        "你的笑容是我最大的动力。",
        "无论多远，我们的心是相连的。",
        "在你身边，时间都变得温柔了。",
        "你是我最想守护的人。",
        "每一个想你的夜晚，星星都知道。"
      ];

      var card3d = document.getElementById("card3d");
      var cardFloat = document.getElementById("cardFloat");
      var replyText = document.getElementById("replyText");
      var drawBtn = document.getElementById("drawCard");
      var drawLabel = document.getElementById("drawCardLabel");

      var libOverlay = document.getElementById("libOverlay");
      var openLibBtn = document.getElementById("openLib");
      var closeLibBtn = document.getElementById("closeLib");
      var libList = document.getElementById("libList");
      var addInput = document.getElementById("addInput");
      var addBtn = document.getElementById("addBtn");
      var importBtn = document.getElementById("importBtn");
      var exportBtn = document.getElementById("exportBtn");
      var resetBtn = document.getElementById("resetBtn");
      var importWrap = document.getElementById("importWrap");
      var importArea = document.getElementById("importArea");
      var importConfirm = document.getElementById("importConfirm");
      var toast = document.getElementById("toast");
      var fallbackCopyArea = document.getElementById("fallbackCopyArea");

      var animating = false;
      var lastIdx = -1;
      var FLIP_MS = 700;
      var toastTimer;

      /* ---- localStorage helpers ---- */
      function getReplies() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
        saveReplies(DEFAULT_REPLIES);
        return DEFAULT_REPLIES.slice();
      }

      function saveReplies(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } catch (e) {}
      }

      /* ---- History ---- */
      function getHistory() {
        try {
          var raw = localStorage.getItem(HISTORY_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }
      function saveHistory(arr) {
        try {
          if (arr.length > 100) arr = arr.slice(arr.length - 100);
          localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
        } catch (e) {}
      }
      function addHistory(reply) {
        var d = new Date();
        var entry = {
          date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"),
          time: String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"),
          reply: reply
        };
        var history = getHistory();
        history.push(entry);
        saveHistory(history);
      }

      /* ---- Toast ---- */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
      }

      /* ---- Escape HTML ---- */
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ---- Draw logic ---- */
      function pickReply() {
        var replies = getReplies();
        var idx;
        if (replies.length <= 1) {
          idx = 0;
        } else {
          do { idx = Math.floor(Math.random() * replies.length); }
          while (idx === lastIdx);
        }
        lastIdx = idx;
        return replies[idx];
      }

      function drawCard() {
        if (animating) return;
        animating = true;
        drawBtn.disabled = true;

        var reply = pickReply();
        addHistory(reply);

        /* 小火人互动埋点 */
        try { (function(){var K="mengjiao_spark";var D=JSON.parse(localStorage.getItem(K)||"{}");var T=new Date();var t=T.getFullYear()+"-"+String(T.getMonth()+1).padStart(2,"0")+"-"+String(T.getDate()).padStart(2,"0");D.daily=D.daily||{};D.daily[t]=D.daily[t]||{chat:0,cards:0,moments:0};if(D.daily[t].cards<3){D.daily[t].cards++;D.totalInteractions=(D.totalInteractions||0)+1;D.exp=(D.exp||0)+5;D.totalExp=(D.totalExp||0)+5;if(t!==D.lastActiveDate){if(D.lastActiveDate===yesterday())D.streak=(D.streak||0)+1;else D.streak=1;D.lastActiveDate=t;}else if(!D.streak)D.streak=1;var L=[{lv:1,need:50},{lv:2,need:150},{lv:3,need:350},{lv:4,need:700},{lv:5,need:1200},{lv:6,need:2000}];while(D.level<7&&D.exp>=L[D.level-1].need){D.exp-=L[D.level-1].need;D.level++;}localStorage.setItem(K,JSON.stringify(D));}function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
        })(); } catch (e) {}

        var isFlipped = card3d.classList.contains("is-flipped");

        if (!isFlipped) {
          replyText.textContent = reply;
          card3d.classList.add("is-flipped");
          window.setTimeout(finishDraw, FLIP_MS);
        } else {
          card3d.classList.remove("is-flipped");
          window.setTimeout(function () {
            replyText.textContent = reply;
            card3d.classList.add("is-flipped");
            window.setTimeout(finishDraw, FLIP_MS);
          }, FLIP_MS);
        }
      }

      function finishDraw() {
        drawLabel.textContent = "再抽一次";
        animating = false;
        drawBtn.disabled = false;
      }

      drawBtn.addEventListener("click", drawCard);
      cardFloat.addEventListener("click", drawCard);

      /* ---- Reply library ---- */
      function renderLib() {
        var replies = getReplies();
        if (replies.length === 0) {
          libList.innerHTML = '<div class="lib-empty">回复库为空，请添加或恢复默认</div>';
          return;
        }
        libList.innerHTML = replies.map(function (text, i) {
          return '<div class="lib-item">' +
            '<span class="lib-item-text">' + escapeHtml(text) + '</span>' +
            '<button type="button" class="lib-item-del" data-idx="' + i + '" aria-label="删除">×</button>' +
            '</div>';
        }).join("");
      }

      function openLib() {
        renderLib();
        importWrap.classList.remove("open");
        libOverlay.classList.add("open");
      }

      function closeLib() {
        libOverlay.classList.remove("open");
      }

      openLibBtn.addEventListener("click", openLib);
      closeLibBtn.addEventListener("click", closeLib);
      libOverlay.addEventListener("click", function (e) {
        if (e.target === libOverlay) closeLib();
      });

      // Delete reply
      libList.addEventListener("click", function (e) {
        var delBtn = e.target.closest(".lib-item-del");
        if (!delBtn) return;
        var idx = parseInt(delBtn.getAttribute("data-idx"), 10);
        var replies = getReplies();
        if (idx >= 0 && idx < replies.length) {
          replies.splice(idx, 1);
          saveReplies(replies);
          renderLib();
        }
      });

      // Add reply
      function doAdd() {
        var text = addInput.value.trim();
        if (!text) return;
        var replies = getReplies();
        replies.push(text);
        saveReplies(replies);
        addInput.value = "";
        renderLib();
        libList.scrollTop = libList.scrollHeight;
      }
      addBtn.addEventListener("click", doAdd);
      addInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); doAdd(); }
      });

      // Import toggle
      importBtn.addEventListener("click", function () {
        importWrap.classList.toggle("open");
        if (importWrap.classList.contains("open")) {
          importArea.focus();
        }
      });

      // Import confirm
      importConfirm.addEventListener("click", function () {
        var raw = importArea.value.trim();
        if (!raw) { showToast("请粘贴回复内容"); return; }
        var lines = raw.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
        if (lines.length === 0) { showToast("未检测到有效内容"); return; }
        var replies = getReplies();
        lines.forEach(function (l) { replies.push(l); });
        saveReplies(replies);
        importArea.value = "";
        importWrap.classList.remove("open");
        renderLib();
        showToast("已导入 " + lines.length + " 条");
      });

      // Export to clipboard
      exportBtn.addEventListener("click", function () {
        var replies = getReplies();
        if (replies.length === 0) { showToast("回复库为空"); return; }
        var text = replies.join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast("已复制到剪贴板");
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        fallbackCopyArea.value = text;
        fallbackCopyArea.select();
        try { document.execCommand("copy"); showToast("已复制到剪贴板"); }
        catch (e) { showToast("复制失败，请手动复制"); }
      }

      // Reset to defaults
      resetBtn.addEventListener("click", function () {
        saveReplies(DEFAULT_REPLIES.slice());
        renderLib();
        showToast("已恢复默认回复");
      });

      // Initialize replies on first visit
      getReplies();
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
