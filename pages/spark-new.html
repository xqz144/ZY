<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小火人 · 梦角传讯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../colors_and_type.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
          },
          fontFamily: {
            sans: ['"DreamFont", "Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont", "Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      letter-spacing: var(--tracking-normal);
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 20% 12%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    .app-bg {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 400px 250px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* Top bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 8px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) { .top-bar { padding-top: 16px; } }
    .back-btn {
      font-size: 15px;
      color: hsl(var(--primary));
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
    }
    .back-btn:active { opacity: 0.6; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .top-action {
      flex-shrink: 0;
      min-width: 64px;
      display: flex;
      justify-content: flex-end;
    }
    .feed-btn {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(232,116,154,0.25);
      background: rgba(255,255,255,0.5);
      color: var(--accent-color);
      font-weight: 500;
      cursor: pointer;
    }
    .feed-btn:active { transform: scale(0.94); }

    /* Scroll area */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 20px;
      scrollbar-width: none;
      position: relative;
      z-index: 1;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* Spark creature display */
    .creature-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 4px;
    }
    .creature-aura {
      position: absolute;
      top: 10px;
      width: 200px;
      height: 200px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(232,116,154,0.18), transparent 70%);
      animation: auraPulse 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.5; transform: scale(0.92); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }
    .creature-svg-wrap {
      position: relative;
      z-index: 1;
      animation: creatureBob 2.5s ease-in-out infinite;
    }
    @keyframes creatureBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .creature-svg-wrap.sleeping { animation: creatureSleep 3s ease-in-out infinite; }
    @keyframes creatureSleep {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(2px) rotate(2deg); }
    }

    .creature-name {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 4px;
    }
    .creature-status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 6px;
    }
    .status-badge.happy { background: rgba(255,180,80,0.15); color: #c98a1f; }
    .status-badge.calm { background: rgba(232,116,154,0.12); color: var(--accent-color); }
    .status-badge.hungry { background: rgba(200,140,60,0.12); color: #a07420; }
    .status-badge.weak { background: rgba(150,150,150,0.12); color: #888; }
    .status-badge.sleeping { background: rgba(100,120,200,0.12); color: #6878a8; }

    /* Level & exp */
    .level-bar {
      margin: 12px 18px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.58);
      border: 1px solid rgba(232,116,154,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .level-label {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-color);
    }
    .level-title { font-size: 12px; color: var(--text-secondary); }
    .exp-text { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .exp-track {
      height: 8px;
      border-radius: 9999px;
      background: rgba(232,116,154,0.12);
      overflow: hidden;
    }
    .exp-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #f4a0bc, #e8749a, #ff9a56);
      transition: width 0.6s cubic-bezier(0.3,0,0,1);
      box-shadow: 0 0 10px -2px rgba(232,116,154,0.5);
    }

    /* Vitals (fullness & mood) */
    .vitals-section {
      margin: 12px 18px 0;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(232,116,154,0.12);
    }
    .vital-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .vital-row + .vital-row { margin-top: 8px; margin-bottom: 4px; }
    .vital-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex; align-items: center; gap: 5px;
    }
    .vital-icon { font-size: 14px; }
    .vital-num { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .vital-track {
      height: 6px;
      border-radius: 9999px;
      background: rgba(232,116,154,0.1);
      overflow: hidden;
    }
    .vital-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.5s cubic-bezier(0.3,0,0,1);
    }
    .vital-fill.fullness { background: linear-gradient(90deg, #f4d03f, #e67e22); }
    .vital-fill.mood { background: linear-gradient(90deg, #f4a0bc, #e8749a); }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 18px 0;
    }
    .stat-card {
      padding: 12px 8px;
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(232,116,154,0.12);
      text-align: center;
    }
    .stat-icon { font-size: 18px; line-height: 1; margin-bottom: 4px; }
    .stat-num {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-label { font-size: 10.5px; color: var(--text-secondary); margin-top: 3px; }

    /* Today interactions */
    .today-section {
      margin: 12px 18px 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(232,116,154,0.12);
    }
    .today-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .today-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .today-left { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
    .today-left .emoji { font-size: 16px; }
    .today-count { font-size: 13px; font-weight: 600; color: var(--accent-color); font-variant-numeric: tabular-nums; }
    .today-count.done { color: #c98a1f; }
    .today-bar {
      flex: 1;
      height: 4px;
      border-radius: 9999px;
      background: rgba(232,116,154,0.1);
      margin: 0 10px;
      overflow: hidden;
      max-width: 80px;
    }
    .today-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #f4a0bc, #e8749a);
      transition: width 0.4s ease;
    }

    /* Milestones */
    .milestone-section {
      margin: 12px 18px 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(232,116,154,0.12);
    }
    .milestone-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .milestone-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .milestone-list::-webkit-scrollbar { display: none; }
    .milestone-item {
      flex-shrink: 0;
      width: 72px;
      text-align: center;
    }
    .milestone-circle {
      width: 48px; height: 48px;
      border-radius: 9999px;
      display: grid; place-items: center;
      font-size: 22px;
      margin: 0 auto 4px;
      border: 2px solid rgba(232,116,154,0.15);
      background: rgba(255,255,255,0.5);
      position: relative;
    }
    .milestone-item.unlocked .milestone-circle {
      border-color: #e8a83a;
      background: linear-gradient(135deg, #fff8e8, #ffe8c8);
      box-shadow: 0 2px 10px -3px rgba(255,180,80,0.35);
    }
    .milestone-item.unlocked .milestone-circle::after {
      content: '✓';
      position: absolute;
      top: -2px; right: -2px;
      width: 16px; height: 16px;
      border-radius: 9999px;
      background: #e8a83a;
      color: #fff;
      font-size: 10px;
      display: grid; place-items: center;
    }
    .milestone-label { font-size: 10px; color: var(--text-secondary); line-height: 1.3; }
    .milestone-item.unlocked .milestone-label { color: #c98a1f; font-weight: 600; }

    /* Makeup card */
    .makeup-section {
      margin: 12px 18px 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,248,232,0.7), rgba(255,232,200,0.6));
      border: 1px solid rgba(255,180,80,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .makeup-info { display: flex; align-items: center; gap: 10px; }
    .makeup-icon { font-size: 26px; }
    .makeup-text { font-size: 13px; color: #a07420; }
    .makeup-text b { font-family: var(--font-serif); font-size: 15px; }
    .makeup-btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255,180,80,0.3);
      background: #fff;
      color: #c98a1f;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .makeup-btn:active { transform: scale(0.94); }
    .makeup-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Interaction buttons */
    .action-section {
      margin: 14px 18px 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 4px;
      border-radius: 14px;
      border: 1px solid rgba(232,116,154,0.15);
      background: rgba(255,255,255,0.55);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:active { transform: scale(0.95); background: rgba(232,116,154,0.08); }
    .action-icon { font-size: 22px; }
    .action-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
    .action-exp { font-size: 10px; color: var(--accent-color); }

    /* Dresser modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(40,20,32,0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 20px 18px 26px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.3,0,0,1);
      z-index: 101;
      max-height: 85vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .modal-sheet::-webkit-scrollbar { display: none; }
    .modal-overlay.show .modal-sheet { transform: translateY(0); }
    .modal-handle {
      width: 42px; height: 4px;
      border-radius: 9999px;
      background: rgba(0,0,0,0.12);
      margin: 0 auto 16px;
    }
    .modal-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      text-align: center;
    }

    .feeder-preview {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
    }
    .feeder-preview img { transition: transform 0.2s ease; }
    .feeder-preview.eating img { animation: eatBounce 0.5s ease; }
    @keyframes eatBounce {
      0%, 100% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.08) translateY(-6px); }
      60% { transform: scale(0.96) translateY(2px); }
    }

    .feeder-hint {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 12px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .food-card {
      position: relative;
      border-radius: 16px;
      border: 1.5px solid rgba(232,116,154,0.12);
      background: rgba(255,255,255,0.6);
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .food-card:active { transform: scale(0.95); }
    .food-card.active {
      border-color: var(--accent-color);
      background: rgba(232,116,154,0.08);
    }
    .food-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .food-card.locked::after {
      content: '🔒';
      position: absolute;
      top: 6px; right: 6px;
      font-size: 10px;
    }
    .food-emoji { font-size: 28px; line-height: 1; margin-bottom: 4px; }
    .food-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .food-effect { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
    .food-stock {
      position: absolute;
      top: 6px; left: 6px;
      min-width: 18px; height: 18px;
      padding: 0 5px;
      border-radius: 9999px;
      background: var(--accent-color);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: grid; place-items: center;
    }

    .feeder-detail {
      background: rgba(255,248,232,0.6);
      border: 1px solid rgba(255,180,80,0.2);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .feeder-detail-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: #a07420;
      margin-bottom: 6px;
    }
    .feeder-detail-desc {
      font-size: 12px;
      color: #a07420;
      line-height: 1.5;
    }

    .feeder-actions {
      display: flex; gap: 10px;
      margin-top: 6px;
    }
    .feeder-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .feeder-btn:active { transform: scale(0.97); }
    .feeder-btn.secondary { background: rgba(232,116,154,0.1); color: var(--accent-color); }
    .feeder-btn.primary {
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      box-shadow: 0 4px 14px -4px rgba(232,116,154,0.45);
    }
    .feeder-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(61,32,48,0.88);
      color: #fff;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 9999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Level up effect */
    .levelup-overlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .levelup-overlay.show { display: flex; }
    .levelup-text {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,180,80,0.8), 0 2px 8px rgba(0,0,0,0.3);
      animation: levelupPop 1.5s ease-out forwards;
    }
    @keyframes levelupPop {
      0% { opacity: 0; transform: scale(0.5); }
      20% { opacity: 1; transform: scale(1.1); }
      40% { transform: scale(1); }
      80% { opacity: 1; transform: scale(1) translateY(-10px); }
      100% { opacity: 0; transform: scale(1) translateY(-30px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg" id="appBg">
      <div class="top-bar">
        <a href="index-new.html" class="back-btn">← 返回</a>
        <div class="top-title">小火人</div>
        <div class="top-action">
          <button class="feed-btn" id="feedBtn">喂食</button>
        </div>
      </div>

      <div class="scroll-area" id="scrollArea">
        <!-- Creature display -->
        <div class="creature-stage">
          <div class="creature-aura" id="creatureAura"></div>
          <div class="creature-svg-wrap" id="creatureWrap">
            <div id="creatureSvg"></div>
          </div>
          <div class="creature-name" id="creatureName">小火人</div>
          <div class="creature-status" id="creatureStatusText">和梦角一起成长中</div>
          <div class="status-badge happy" id="statusBadge">😊 开心</div>
        </div>

        <!-- Level & exp -->
        <div class="level-bar">
          <div class="level-row">
            <div>
              <span class="level-label" id="levelLabel">Lv.1</span>
              <span class="level-title" id="levelTitle">小火苗</span>
            </div>
            <span class="exp-text" id="expText">0 / 50</span>
          </div>
          <div class="exp-track">
            <div class="exp-fill" id="expFill" style="width:0%"></div>
          </div>
        </div>

  <script>
    (function () {
      "use strict";

      /* ========== Shared Spark Tracker (inline) ========== */
      var SPARK_KEY = "mengjiao_spark";

      var LEVELS = [
        { lv: 1, title: "小火苗", need: 50, flame: 0.6 },
        { lv: 2, title: "小火人", need: 150, flame: 0.8 },
        { lv: 3, title: "火精灵", need: 350, flame: 1.0 },
        { lv: 4, title: "烈焰使者", need: 700, flame: 1.2 },
        { lv: 5, title: "焰神", need: 1200, flame: 1.4 },
        { lv: 6, title: "传说之焰", need: 2000, flame: 1.6 },
        { lv: 7, title: "永恒之火", need: 999999, flame: 1.8 }
      ];

      var MILESTONES = [
        { days: 3, label: "3天", icon: "🌱" },
        { days: 7, label: "7天", icon: "🌿" },
        { days: 14, label: "14天", icon: "🔥" },
        { days: 30, label: "30天", icon: "⭐" },
        { days: 50, label: "50天", icon: "💫" },
        { days: 100, label: "100天", icon: "👑" }
      ];

      var HAIR_COLORS = [
        { id: "purple", color: "#6b5b94", unlock: 1 },
        { id: "pink", color: "#e8749a", unlock: 1 },
        { id: "coral", color: "#ff8a65", unlock: 1 },
        { id: "mint", color: "#7fd5b3", unlock: 2 },
        { id: "sky", color: "#7ec8e3", unlock: 3 },
        { id: "lavender", color: "#c5a3e3", unlock: 3 },
        { id: "rose", color: "#e8749a", unlock: 4 },
        { id: "honey", color: "#e8a83a", unlock: 5 }
      ];

      var OUTFIT_COLORS = [
        { id: "maroon", color: "#7a3a4a", unlock: 1 },
        { id: "navy", color: "#3a4a6a", unlock: 1 },
        { id: "white", color: "#e8e8f0", unlock: 1 },
        { id: "pink", color: "#e8749a", unlock: 2 },
        { id: "mint", color: "#7fd5b3", unlock: 3 },
        { id: "lavender", color: "#c5a3e3", unlock: 4 }
      ];

      var EAR_COLORS = [
        { id: "brown", color: "#8b6940", inner: "#f4a0b0", unlock: 1 },
        { id: "dark", color: "#4a4a4a", inner: "#f4a0b0", unlock: 1 },
        { id: "cream", color: "#e8d5b8", inner: "#f4a0b0", unlock: 2 },
        { id: "match", color: "", inner: "", unlock: 1 }
      ];

      var POSES = [
        { id: "idle", label: "待机", emoji: "🧍" },
        { id: "wave", label: "打招呼", emoji: "👋" },
        { id: "cheer", label: "开心", emoji: "🙌" },
        { id: "reach", label: "伸手", emoji: "🤲" },
        { id: "shy", label: "害羞", emoji: "😳" },
        { id: "sit", label: "坐下", emoji: "🪑" }
      ];

      var EYES = [
        { id: "round", emoji: "👀", unlock: 1 },
        { id: "sparkle", emoji: "✨", unlock: 1 },
        { id: "happy", emoji: "😄", unlock: 1 },
        { id: "sleepy", emoji: "😴", unlock: 2 },
        { id: "star", emoji: "🌟", unlock: 3 },
        { id: "heart", emoji: "❤️", unlock: 4 }
      ];

      var MOUTHS = [
        { id: "smile", emoji: "🙂", unlock: 1 },
        { id: "open", emoji: "😮", unlock: 1 },
        { id: "cat", emoji: "😺", unlock: 1 },
        { id: "neutral", emoji: "😐", unlock: 2 },
        { id: "tongue", emoji: "😝", unlock: 3 },
        { id: "whistle", emoji: "😙", unlock: 4 }
      ];

      var ACCESSORIES = [
        { id: "none", emoji: "🚫", unlock: 1 },
        { id: "halo", emoji: "😇", unlock: 3 },
        { id: "wings", emoji: "🦋", unlock: 4 },
        { id: "bow", emoji: "🎀", unlock: 2 },
        { id: "hat", emoji: "🎩", unlock: 3 },
        { id: "crown", emoji: "👑", unlock: 5 },
        { id: "headphone", emoji: "🎧", unlock: 2 },
        { id: "flower", emoji: "🌸", unlock: 1 }
      ];

      var DAILY_LIMITS = { chat: 10, cards: 3, moments: 2 };
      var EXP_PER = { chat: 3, cards: 5, moments: 8 };

      var FOODS = [
        { id: "star_cookie", name: "星星饼干", emoji: "⭐", exp: 3, fullness: 5, mood: 2, unlock: 1, desc: "咬一口会发出细碎星光，小火苗最爱的零嘴。" },
        { id: "pudding", name: "草莓布丁", emoji: "🍮", exp: 5, fullness: 8, mood: 3, unlock: 1, desc: "软软甜甜，吃完嘴角都会翘起来。" },
        { id: "honey_bread", name: "蜜糖面包", emoji: "🍞", exp: 6, fullness: 12, mood: 4, unlock: 2, desc: "淋了蜂蜜的温热面包，能让小火人暖一整天。" },
        { id: "berry_cake", name: "蓝莓蛋糕", emoji: "🫐", exp: 8, fullness: 10, mood: 5, unlock: 2, desc: "酸甜的蓝莓配上绵密奶油，是成长的小奖励。" },
        { id: "mooncake", name: "月光蛋糕", emoji: "🌙", exp: 12, fullness: 15, mood: 8, unlock: 3, desc: "只在梦里发光的蛋糕，吃完会偷偷笑。" },
        { id: "flame_skewer", name: "火焰烤串", emoji: "🍢", exp: 15, fullness: 18, mood: 10, unlock: 4, desc: "辣呼呼的能量串，火焰使者专属料理。" },
        { id: "rainbow_candy", name: "彩虹糖", emoji: "🌈", exp: 20, fullness: 25, mood: 15, unlock: 5, desc: "七种颜色七种心情，传说级甜品。" }
      ];
      var FOOD_DAILY_STOCK = 3;
      var FULLNESS_MAX = 100;
      var MOOD_MAX = 100;

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      function yesterdayStr() {
        var d = new Date(); d.setDate(d.getDate()-1);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      function monthKey() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      }

      function defaultData() {
        return {
          level: 1,
          exp: 0,
          totalExp: 0,
          streak: 0,
          lastActiveDate: "",
          totalInteractions: 0,
          makeupCards: 1,
          makeupMonth: monthKey(),
          milestones: [],
          avatar: { hairColor: "purple", outfitColor: "maroon", earColor: "brown", eyes: "round", mouth: "smile", accessory: "none", pose: "idle" },
          daily: {},
          fullness: 60,
          mood: 60,
          lastFed: "",
          foods: {}
        };
      }

      window.SparkTracker = {
        load: function () {
          try {
            var raw = localStorage.getItem(SPARK_KEY);
            if (raw) {
              var d = JSON.parse(raw);
              var def = defaultData();
              for (var k in def) { if (!(k in d)) d[k] = def[k]; }
              if (!d.avatar) d.avatar = def.avatar;
              if (typeof d.fullness !== "number") d.fullness = def.fullness;
              if (typeof d.mood !== "number") d.mood = def.mood;
              if (!d.foods) d.foods = {};
              /* 每日首次进入刷新食物库存 */
              var t = todayStr();
              if (d.lastFed !== t) {
                FOODS.forEach(function (f) {
                  if (d.level >= f.unlock) d.foods[f.id] = FOOD_DAILY_STOCK;
                });
                d.lastFed = t;
                localStorage.setItem(SPARK_KEY, JSON.stringify(d));
              }
              return d;
            }
          } catch (e) {}
          var fresh = defaultData();
          var t2 = todayStr();
          FOODS.forEach(function (f) {
            if (fresh.level >= f.unlock) fresh.foods[f.id] = FOOD_DAILY_STOCK;
          });
          fresh.lastFed = t2;
          return fresh;
        },
        save: function (d) {
          try { localStorage.setItem(SPARK_KEY, JSON.stringify(d)); } catch (e) {}
        },
        recordInteraction: function (type) {
          var d = this.load();
          var t = todayStr();
          if (!d.daily[t]) d.daily[t] = { chat: 0, cards: 0, moments: 0 };
          if (d.daily[t][type] >= DAILY_LIMITS[type]) return { gained: 0, leveledUp: false, level: d.level };
          d.daily[t][type]++;
          d.totalInteractions++;
          var gained = EXP_PER[type];
          d.exp += gained;
          d.totalExp += gained;
          if (t !== d.lastActiveDate) {
            if (d.lastActiveDate === yesterdayStr()) d.streak++;
            else if (d.lastActiveDate === t) { /* same day */ }
            else d.streak = 1;
            d.lastActiveDate = t;
          } else if (d.streak === 0) {
            d.streak = 1;
          }
          var leveledUp = false;
          while (d.level < LEVELS.length && d.exp >= LEVELS[d.level - 1].need) {
            d.exp -= LEVELS[d.level - 1].need;
            d.level++;
            leveledUp = true;
          }
          MILESTONES.forEach(function (m) {
            if (d.streak >= m.days && d.milestones.indexOf(m.days) === -1) {
              d.milestones.push(m.days);
            }
          });
          if (d.makeupMonth !== monthKey()) {
            d.makeupMonth = monthKey();
            d.makeupCards = 1;
          }
          this.save(d);
          return { gained: gained, leveledUp: leveledUp, level: d.level };
        },
        useMakeup: function () {
          var d = this.load();
          if (d.makeupCards <= 0) return false;
          var y = yesterdayStr();
          if (d.daily[y] && (d.daily[y].chat > 0 || d.daily[y].cards > 0 || d.daily[y].moments > 0)) return false;
          if (!d.daily[y]) d.daily[y] = { chat: 0, cards: 0, moments: 0 };
          d.daily[y].chat = 1;
          d.makeupCards--;
          if (d.lastActiveDate === y) {
            d.streak++;
          } else if (yesterdayStr() === y) {
            d.streak = Math.max(d.streak, 1);
            d.lastActiveDate = y;
          }
          MILESTONES.forEach(function (m) {
            if (d.streak >= m.days && d.milestones.indexOf(m.days) === -1) d.milestones.push(m.days);
          });
          this.save(d);
          return true;
        },
        feed: function (foodId) {
          var d = this.load();
          var food = FOODS.find(function(f){ return f.id === foodId; });
          if (!food) return { ok: false, reason: "food_not_found" };
          if (d.level < food.unlock) return { ok: false, reason: "locked" };
          if (!d.foods[foodId] || d.foods[foodId] <= 0) return { ok: false, reason: "no_stock" };
          if (d.fullness >= FULLNESS_MAX - 2) return { ok: false, reason: "full" };

          d.foods[foodId]--;
          d.fullness = Math.min(FULLNESS_MAX, d.fullness + food.fullness);
          d.mood = Math.min(MOOD_MAX, d.mood + food.mood);
          d.exp += food.exp;
          d.totalExp += food.exp;
          d.totalInteractions++;

          var leveledUp = false;
          while (d.level < LEVELS.length && d.exp >= LEVELS[d.level - 1].need) {
            d.exp -= LEVELS[d.level - 1].need;
            d.level++;
            leveledUp = true;
          }
          var t = todayStr();
          if (!d.daily[t]) d.daily[t] = { chat: 0, cards: 0, moments: 0 };
          if (t !== d.lastActiveDate) {
            if (d.lastActiveDate === yesterdayStr()) d.streak++;
            else d.streak = 1;
            d.lastActiveDate = t;
          }
          MILESTONES.forEach(function (m) {
            if (d.streak >= m.days && d.milestones.indexOf(m.days) === -1) d.milestones.push(m.days);
          });
          this.save(d);
          return { ok: true, food: food, leveledUp: leveledUp, level: d.level };
        },
        getState: function () {
          var d = this.load();
          var t = todayStr();
          var today = d.daily[t] || { chat: 0, cards: 0, moments: 0 };
          var lastActive = d.lastActiveDate;
          var state = "sleeping";
          if (lastActive === t && (today.chat > 0 || today.cards > 0 || today.moments > 0)) {
            state = "happy";
          } else if (lastActive === yesterdayStr()) {
            state = "calm";
          } else {
            var d2 = new Date(lastActive + "T00:00:00");
            var now = new Date();
            var diff = Math.round((now - d2) / 86400000);
            if (isNaN(diff)) diff = 99;
            if (diff <= 2) state = "hungry";
            else if (diff <= 3) state = "weak";
            else state = "sleeping";
          }
          return state;
        }
      };

      /* ========== SVG Chibi Cat Renderer ========== */
      function getHairColor(id) { return HAIR_COLORS.find(function(c){return c.id===id;}) || HAIR_COLORS[0]; }
      function getOutfitColor(id) { return OUTFIT_COLORS.find(function(c){return c.id===id;}) || OUTFIT_COLORS[0]; }
      function getEarColor(id, hairColor) {
        if (id === "match") return { color: hairColor, inner: lightenColor(hairColor, 30) };
        return EAR_COLORS.find(function(c){return c.id===id;}) || EAR_COLORS[0];
      }
      function getEyes(id) { return EYES.find(function(e){return e.id===id;}) || EYES[0]; }
      function getMouth(id) { return MOUTHS.find(function(m){return m.id===id;}) || MOUTHS[0]; }
      function getAccessory(id) { return ACCESSORIES.find(function(a){return a.id===id;}) || ACCESSORIES[0]; }

      function renderCreature(data, state, forcedPose) {
        var av = data.avatar;
        var hair = getHairColor(av.hairColor).color;
        var outfit = getOutfitColor(av.outfitColor).color;
        var ear = getEarColor(av.earColor || "brown", hair);
        var earColor = ear.color || hair;
        var earInner = ear.inner || lightenColor(hair, 30);
        var skin = "#ffe4d6";
        var isSleeping = state === "sleeping";
        var isWeak = state === "weak" || state === "sleeping";
        var bodyOpacity = isWeak ? 0.72 : 1;
        var pose = forcedPose || av.pose || "idle";
        if (isSleeping) pose = "sleep";

        var eyeSvg = renderEyes(av.eyes, isSleeping, pose);
        var mouthSvg = renderMouth(av.mouth, isSleeping, pose);
        var accSvg = renderAccessory(av.accessory, data.level);
        var armsSvg = renderArms(pose, outfit, skin);
        var bodySvg = renderBody(pose, outfit, skin, bodyOpacity);
        var legsSvg = renderLegs(pose, skin);

        return '<svg width="160" height="180" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" style="cursor:pointer;overflow:visible">' +
          '<defs>' +
            '<radialGradient id="hairGrad" cx="50%" cy="30%">' +
              '<stop offset="0%" stop-color="' + lightenColor(hair, 20) + '"/>' +
              '<stop offset="100%" stop-color="' + darkenColor(hair, 10) + '"/>' +
            '</radialGradient>' +
          '</defs>' +
          /* Shadow */
          '<ellipse cx="100" cy="205" rx="34" ry="5" fill="#000" opacity="0.08"/>' +
          /* Tail */
          renderTail(pose, earColor) +
          /* Body + Legs + Arms */
          bodySvg + legsSvg + armsSvg +
          /* Head group */
          '<g opacity="' + bodyOpacity + '">' +
            /* Unified hair crown - 统一发冠，所有头发从发旋生长 */
            '<path d="M 44 92 Q 36 64 44 44 Q 56 20 80 24 Q 94 14 112 18 Q 140 20 154 44 Q 162 64 156 92 Q 152 106 146 100 Q 138 110 128 102 Q 120 112 108 104 Q 100 108 92 104 Q 80 112 72 102 Q 62 110 54 100 Q 48 106 44 92 Z" fill="url(#hairGrad)"/>' +
            /* Crown shadow for depth */
            '<ellipse cx="100" cy="54" rx="48" ry="34" fill="' + darkenColor(hair, 22) + '" opacity="0.18"/>' +
            /* Head */
            '<circle cx="100" cy="82" r="40" fill="' + skin + '"/>' +
            /* Cat ears */
            '<path d="M 58 44 Q 46 16 68 22 Q 80 34 78 50 Z" fill="' + earColor + '"/>' +
            '<path d="M 142 44 Q 154 16 132 22 Q 120 34 122 50 Z" fill="' + earColor + '"/>' +
            '<path d="M 61 41 Q 52 22 66 24 Q 75 36 74 46 Z" fill="' + earInner + '" opacity="0.8"/>' +
            '<path d="M 139 41 Q 148 22 134 24 Q 125 36 126 46 Z" fill="' + earInner + '" opacity="0.8"/>' +
            /* Ahoge 呆毛 */
            '<path d="M 96 22 Q 88 6 102 4 Q 114 8 104 22 Z" fill="url(#hairGrad)"/>' +
            '<path d="M 98 20 Q 96 10 102 8" stroke="' + darkenColor(hair, 18) + '" stroke-width="1" fill="none" opacity="0.3"/>' +
            /* Middle-parted bangs - 中分刘海，从头顶向两侧分开有体积感 */
            /* 左半边 - 从中分线向左蓬松延伸，露出部分额头 */
            '<path d="M 100 30 Q 78 28 60 38 Q 44 50 46 74 Q 50 86 58 92 Q 54 74 62 64 Q 74 50 92 48 Q 96 40 100 30 Z" fill="url(#hairGrad)"/>' +
            '<path d="M 58 92 Q 50 70 60 52 Q 74 40 88 42 Q 82 56 76 72 Q 66 86 58 92 Z" fill="url(#hairGrad)"/>' +
            '<path d="M 50 86 Q 46 64 54 48 Q 64 38 72 42 Q 66 58 58 74 Q 52 84 50 86 Z" fill="url(#hairGrad)"/>' +
            /* 右半边 - 镜像 */
            '<path d="M 100 30 Q 122 28 140 38 Q 156 50 154 74 Q 150 86 142 92 Q 146 74 138 64 Q 126 50 108 48 Q 104 40 100 30 Z" fill="url(#hairGrad)"/>' +
            '<path d="M 142 92 Q 150 70 140 52 Q 126 40 112 42 Q 118 56 124 72 Q 134 86 142 92 Z" fill="url(#hairGrad)"/>' +

      function lightenColor(hex, amt) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
      }
      function darkenColor(hex, amt) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
      }

      function renderFoodGrid() {
        foodGrid.innerHTML = "";
        data = SparkTracker.load();
        FOODS.forEach(function (food) {
          var locked = data.level < food.unlock;
          var stock = data.foods[food.id] || 0;
          var card = document.createElement("div");
          card.className = "food-card" + (feederSelectedFood === food.id ? " active" : "") + (locked ? " locked" : "");
          card.innerHTML = '<div class="food-emoji">' + food.emoji + '</div><div class="food-name">' + food.name + '</div><div class="food-effect">+' + food.fullness + '饱 +' + food.mood + '心</div>' +
            (locked ? '' : '<div class="food-stock">' + stock + '</div>');
          if (locked) {
            card.title = "Lv." + food.unlock + " 解锁";
          } else if (stock <= 0) {
            card.title = "今日份已吃完啦";
          } else {
            card.addEventListener("click", function () {
              feederSelectedFood = food.id;
              feederHint.textContent = "选择了 " + food.name;
              feederDetail.style.display = "block";
              detailTitle.textContent = food.emoji + " " + food.name;
              detailDesc.textContent = food.desc + " （经验 +" + food.exp + "，饱食 +" + food.fullness + "，心情 +" + food.mood + "）";
              feedConfirm.disabled = false;
              renderFoodGrid();
            });
          }
          foodGrid.appendChild(card);
        });
      }

      function doFeed() {
        if (!feederSelectedFood) return;
        var result = SparkTracker.feed(feederSelectedFood);
        if (!result.ok) {
          if (result.reason === "full") toast("小火人已经吃饱啦，等消化一下再喂吧～");
          else if (result.reason === "no_stock") toast("今天这个食物没有库存了哦");
          else if (result.reason === "locked") toast("等级不够，还不能吃这个");
          else toast("喂食失败");
          renderFoodGrid();
          return;
        }
        var food = result.food;
        feederPreview.classList.add("eating");
        setTimeout(function(){ feederPreview.classList.remove("eating"); }, 550);
        toast("小火人吃掉了 " + food.name + "，心情变好了 ✨");
        if (result.leveledUp) {
          setTimeout(function(){ showLevelUp(result.level); }, 400);
        }
        feederSelectedFood = null;
        feederHint.textContent = "还想再喂点什么？";
        feederDetail.style.display = "none";
        feedConfirm.disabled = true;
        renderFoodGrid();
        render();
      }

      function showLevelUp(lv) {
        levelupText.textContent = "升级啦！Lv." + lv + " " + LEVELS[Math.min(lv - 1, LEVELS.length - 1)].title;
        levelupOverlay.classList.add("show");
        setTimeout(function(){ levelupOverlay.classList.remove("show"); }, 1600);
      }

      function useMakeup() {
        if (SparkTracker.useMakeup()) {
          toast("已补签昨天 🔥");
          render();
        } else {
          toast("无法补签（可能没有补签卡或昨天已有互动）");
        }
      }

      feedBtn.addEventListener("click", openFeeder);
      feedClose.addEventListener("click", closeFeeder);
      feedConfirm.addEventListener("click", doFeed);
      feedModal.addEventListener("click", function (e) { if (e.target === feedModal) closeFeeder(); });
      makeupBtn.addEventListener("click", useMakeup);

      /* Tap creature to cycle poses */
      creatureSvg.addEventListener("click", function () {
        var state = SparkTracker.getState();
        if (state === "sleeping") { toast("小火人沉睡中，快唤醒它吧 💤"); return; }
        var curIdx = POSES.findIndex(function(p){return p.id===data.avatar.pose;});
        if (curIdx === -1) curIdx = 0;
        var next = POSES[(curIdx + 1) % POSES.length];
        data.avatar.pose = next.id;
        SparkTracker.save(data);
        render();
        toast(next.emoji + " " + next.label);
      });

      render();

      /* Check for interaction gains from other pages (via URL param or storage event) */
      window.addEventListener("storage", function (e) {
        if (e.key === SPARK_KEY) render();
      });
    })();
  </script>
</body>
</html>
