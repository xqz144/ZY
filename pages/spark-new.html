<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小火人 · 梦角传讯</title>
    <link rel="stylesheet" href="../css/extapp-unified.css">
    <script>
    /* 从父窗口同步主题色/字体到 iframe 内（配合主站外观设置） */
    (function () {
        try {
            var inIframe = false;
            try { inIframe = (window.top !== window.self); } catch (e) { inIframe = true; }
            function applyColorThemeFromParent() {
                try {
                    var parentRoot = null;
                    try { parentRoot = window.parent.document.documentElement; } catch (e) { parentRoot = null; }
                    if (parentRoot) {
                        var t = parentRoot.getAttribute('data-color-theme');
                        if (t) document.documentElement.setAttribute('data-color-theme', t);
                        var dt = parentRoot.getAttribute('data-theme');
                        if (dt) document.documentElement.setAttribute('data-theme', dt);
                        if (dt === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
                        var fv = parentRoot.style.getPropertyValue('--font-family');
                        if (fv) document.documentElement.style.setProperty('--font-family', fv);
                        var mfv = parentRoot.style.getPropertyValue('--message-font-family');
                        if (mfv) document.documentElement.style.setProperty('--message-font-family', mfv);
                        var fs = parentRoot.style.getPropertyValue('--font-size');
                        if (fs) document.documentElement.style.setProperty('--font-size', fs);
                    }
                } catch (e) { console.warn('spark theme sync error', e); }
            }
            applyColorThemeFromParent();
            if (inIframe) {
                window.addEventListener('message', function (ev) {
                    var d = ev.data || {};
                    if (d.type === 'theme:sync' || d.colorTheme || d.theme) {
                        if (d.colorTheme) document.documentElement.setAttribute('data-color-theme', d.colorTheme);
                        if (d.theme) {
                            document.documentElement.setAttribute('data-theme', d.theme);
                            if (d.theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
                        }
                        if (d.fontFamily) document.documentElement.style.setProperty('--font-family', d.fontFamily);
                        if (d.messageFontFamily) document.documentElement.style.setProperty('--message-font-family', d.messageFontFamily);
                        if (d.fontSize) document.documentElement.style.setProperty('--font-size', d.fontSize);
                        applyColorThemeFromParent();
                    }
                });
                setInterval(applyColorThemeFromParent, 2500);
            }
        } catch (e) { console.warn('spark init error', e); }
    })();
    </script>
    <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
        margin: 0;
        font-family: var(--font-family);
        background: var(--primary-bg);
        color: var(--text-primary);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--accent-color-rgb), 0.35); border-radius: 4px; }

    .app-bg {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(ellipse 500px 300px at 20% 0%, rgba(var(--accent-color-rgb), 0.10), transparent 60%),
            radial-gradient(ellipse 400px 250px at 90% 10%, rgba(var(--accent-color-rgb), 0.08), transparent 55%),
            var(--primary-bg);
    }

    .scroll-area {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 32px;
        max-width: 520px;
        margin: 0 auto;
        width: 100%;
    }

    /* Creature */
    .creature-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0 4px;
    }
    .creature-frame {
        position: relative;
        width: 200px;
        height: 200px;
        border-radius: 9999px;
        border: 3px dashed rgba(var(--accent-color-rgb), 0.35);
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, rgba(var(--accent-color-rgb), 0.08), transparent 70%);
        box-shadow: inset 0 0 28px rgba(var(--accent-color-rgb), 0.06);
    }
    .creature-aura {
        position: absolute;
        top: 8px;
        width: 184px;
        height: 184px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(var(--accent-color-rgb), 0.14), transparent 70%);
        animation: auraPulse 3s ease-in-out infinite;
        pointer-events: none;
    }
    .frame-deco {
        position: absolute;
        font-size: 14px;
        opacity: 0.7;
        pointer-events: none;
    }
    .frame-deco.deco-1 { top: 18px; left: 24px; transform: rotate(-12deg); }
    .frame-deco.deco-2 { top: 24px; right: 28px; transform: rotate(8deg); }
    .frame-deco.deco-3 { bottom: 22px; right: 22px; transform: rotate(15deg); }
    .frame-deco.deco-4 { bottom: 30px; left: 28px; transform: rotate(-6deg); }
    @keyframes auraPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.92); }
        50% { opacity: 0.85; transform: scale(1.05); }
    }
    .creature-svg-wrap {
        position: relative;
        z-index: 1;
        animation: creatureBob 2.5s ease-in-out infinite;
    }
    .creature-svg-wrap.sleeping { animation: creatureSleep 3s ease-in-out infinite; }
    @keyframes creatureBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes creatureSleep {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(2px) rotate(2deg); }
    }
    @keyframes heartFloat {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
        50% { opacity: 0.8; transform: translate(-50%, -120%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
    }

    /* 宠物选择器 */
    .pet-selector {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .pet-selector-label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-right: 4px;
    }
    .pet-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 20px;
        background: var(--card-background);
        border: 2px solid var(--border-color);
        cursor: pointer;
        transition: all 0.25s ease;
        font-family: var(--font-family);
        font-size: 13px;
        color: var(--text-secondary);
        box-shadow: var(--shadow-2xs);
    }
    .pet-tab .pet-emoji {
        font-size: 16px;
    }
    .pet-tab.active {
        border-color: var(--accent-color, #b8a9c9);
        background: linear-gradient(145deg, rgba(var(--accent-color-rgb,184,169,201),0.15), rgba(var(--accent-color-rgb,184,169,201),0.05));
        color: var(--accent-color, #b8a9c9);
        font-weight: 600;
        box-shadow: 0 2px 12px rgba(var(--accent-color-rgb,184,169,0.25);
    }
    .pet-tab + .pet-tab {
        margin-left: 2px;
    }
    .creature-name {
        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 600;
        color: var(--text-primary);
        margin-top: 10px;
        cursor: pointer;
        display: inline-block;
        padding: 2px 10px;
        border-radius: 8px;
        transition: background 0.2s;
    }
    .creature-name:hover {
        background: rgba(var(--accent-color-rgb), 0.12);
    }
    .creature-name-edit-hint {
        font-size: 10px;
        color: var(--text-secondary);
        opacity: 0.6;
        margin-top: 2px;
    }
    .creature-status {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
    }
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 500;
        margin-top: 8px;
        background: rgba(var(--accent-color-rgb), 0.12);
        color: var(--accent-color);
        border: 1px solid rgba(var(--accent-color-rgb), 0.2);
    }

    /* Level & exp */
    .level-bar {
        margin-top: 14px;
        padding: 14px 16px;
        border-radius: var(--radius-lg);
        background: var(--card-background);
        border: 1px solid var(--border-color);
    }
    .level-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
    }
    .level-info { display: flex; align-items: baseline; gap: 6px; }
    .level-label {
        font-family: var(--font-serif);
        font-size: 16px;
        font-weight: 600;
        color: var(--accent-color);
    }
    .level-title { font-size: 12px; color: var(--text-secondary); }
    .exp-text { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .exp-track {
        height: 10px;
        border-radius: 9999px;
        background: rgba(var(--accent-color-rgb), 0.1);
        overflow: hidden;
    }
    .exp-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, var(--accent-color), rgba(var(--accent-color-rgb), 0.6));
        transition: width 0.6s cubic-bezier(0.3,0,0,1);
        box-shadow: 0 0 10px -2px rgba(var(--accent-color-rgb), 0.35);
    }

    /* Vitals */
    .vitals-section {
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: var(--radius-lg);
        background: var(--card-background);
        border: 1px solid var(--border-color);
    }
    .vital-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
    }
    .vital-row + .vital-row { margin-top: 10px; margin-bottom: 4px; }
    .vital-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex; align-items: center; gap: 6px;
    }
    .vital-icon { font-size: 15px; }
    .vital-num { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .vital-track {
        height: 8px;
        border-radius: 9999px;
        background: rgba(var(--accent-color-rgb), 0.08);
        overflow: hidden;
    }
    .vital-fill {
        height: 100%;
        border-radius: 9999px;
        transition: width 0.5s cubic-bezier(0.3,0,0,1);
    }
    .vital-fill.fullness { background: linear-gradient(90deg, var(--accent-color), rgba(var(--accent-color-rgb), 0.6)); }
    .vital-fill.mood { background: linear-gradient(90deg, rgba(var(--accent-color-rgb), 0.6), var(--accent-color)); }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
    }
    .stat-card {
        padding: 14px 6px;
        border-radius: var(--radius-md);
        background: var(--card-background);
        border: 1px solid var(--border-color);
        text-align: center;
        transition: transform 0.15s ease;
    }
    .stat-card:active { transform: scale(0.96); }
    .stat-icon { font-size: 20px; line-height: 1; margin-bottom: 5px; }
    .stat-num {
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 700;
        color: var(--accent-color);
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

    /* Today interactions */
    .today-section {
        margin-top: 12px;
        padding: 16px;
        border-radius: var(--radius-lg);
        background: var(--card-background);
        border: 1px solid var(--border-color);
    }
    .today-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 12px;
    }
    .today-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
    }
    .today-left { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
    .today-left .emoji { font-size: 17px; }
    .today-count { font-size: 13px; font-weight: 600; color: var(--accent-color); font-variant-numeric: tabular-nums; }
    .today-count.done { opacity: 0.85; }
    .today-bar {
        flex: 1;
        height: 5px;
        border-radius: 9999px;
        background: rgba(var(--accent-color-rgb), 0.08);
        margin: 0 12px;
        overflow: hidden;
        max-width: 100px;
    }
    .today-bar-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, var(--accent-color), rgba(var(--accent-color-rgb), 0.6));
        transition: width 0.4s ease;
    }

    /* Milestones */
    .milestone-section {
        margin-top: 12px;
        padding: 16px;
        border-radius: var(--radius-lg);
        background: var(--card-background);
        border: 1px solid var(--border-color);
    }
    .milestone-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 12px;
    }
    .milestone-list {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 2px;
    }
    .milestone-list::-webkit-scrollbar { display: none; }
    .milestone-item {
        flex-shrink: 0;
        width: 72px;
        text-align: center;
    }
    .milestone-circle {
        width: 52px; height: 52px;
        border-radius: 9999px;
        display: grid; place-items: center;
        font-size: 24px;
        margin: 0 auto 5px;
        border: 2px dashed rgba(var(--accent-color-rgb), 0.2);
        background: var(--card-background);
        position: relative;
        transition: transform 0.15s ease;
    }
    .milestone-item.unlocked .milestone-circle {
        border-style: solid;
        border-color: var(--accent-color);
        background: rgba(var(--accent-color-rgb), 0.12);
        box-shadow: 0 4px 12px -4px rgba(var(--accent-color-rgb), 0.25);
    }
    .milestone-item.unlocked .milestone-circle::after {
        content: '✓';
        position: absolute;
        top: -2px; right: -2px;
        width: 18px; height: 18px;
        border-radius: 9999px;
        background: var(--accent-color);
        color: #fff;
        font-size: 10px;
        display: grid; place-items: center;
        font-weight: 700;
    }
    .milestone-label { font-size: 10.5px; color: var(--text-secondary); line-height: 1.3; }
    .milestone-item.unlocked .milestone-label { color: var(--accent-color); font-weight: 600; }

    /* Makeup card */
    .makeup-section {
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: var(--radius-lg);
        background: var(--secondary-bg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .makeup-info { display: flex; align-items: center; gap: 10px; }
    .makeup-icon { font-size: 26px; }
    .makeup-text { font-size: 13px; color: var(--text-primary); }
    .makeup-text b { font-family: var(--font-serif); font-size: 15px; color: var(--accent-color); }
    .makeup-btn {
        font-size: 12px;
        padding: 7px 16px;
        border-radius: 9999px;
        border: 1px solid rgba(var(--accent-color-rgb), 0.3);
        background: var(--card-background);
        color: var(--accent-color);
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .makeup-btn:active { transform: scale(0.94); background: rgba(var(--accent-color-rgb), 0.12); }
    .makeup-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Quick actions */
    .action-section {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
    .action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 14px 4px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-color);
        background: var(--card-background);
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s ease;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn:active { transform: scale(0.95); }
    .action-icon {
        width: 46px;
        height: 46px;
        border-radius: 9999px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: rgba(var(--accent-color-rgb), 0.12);
        border: 2px dashed rgba(var(--accent-color-rgb), 0.2);
    }
    .action-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
    .action-exp { font-size: 10px; color: var(--text-secondary); }

    /* Feed button in top bar */
    .feed-btn {
        font-size: 13px;
        padding: 6px 16px;
        border-radius: 9999px;
        border: 1px solid rgba(var(--accent-color-rgb), 0.3);
        background: var(--card-background);
        color: var(--accent-color);
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease;
    }
    .feed-btn:active { transform: scale(0.94); }

    /* Modal */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        display: none;
        transition: opacity 0.25s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; display: block; }
    .modal-sheet {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        background: var(--card-background);
        border-radius: 32px 32px 0 0;
        padding: 20px 18px 28px;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.3,0,0,1);
        z-index: 101;
        max-height: 85vh;
        overflow-y: auto;
        scrollbar-width: none;
    }
    .modal-sheet::-webkit-scrollbar { display: none; }
    .modal-overlay.show .modal-sheet { transform: translateY(0); }
    .modal-handle {
        width: 44px; height: 4px;
        border-radius: 9999px;
        background: var(--border-color);
        margin: 0 auto 16px;
    }
    .modal-title {
        font-family: var(--font-serif);
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 16px;
        text-align: center;
    }

    .feeder-preview {
        display: flex;
        justify-content: center;
        margin-bottom: 12px;
        position: relative;
    }
    .feeder-preview img { transition: transform 0.2s ease; }
    .feeder-preview.eating img { animation: eatBounce 0.5s ease; }
    @keyframes eatBounce {
        0%, 100% { transform: scale(1) translateY(0); }
        30% { transform: scale(1.08) translateY(-6px); }
        60% { transform: scale(0.96) translateY(2px); }
    }

    .feeder-hint {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
        margin-bottom: 14px;
    }

    .food-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
    }
    .food-card {
        position: relative;
        border-radius: var(--radius-md);
        border: 2px dashed rgba(var(--accent-color-rgb), 0.2);
        background: var(--card-background);
        padding: 12px 6px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
        aspect-ratio: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .food-card:active { transform: scale(0.95); }
    .food-card.active {
        border-style: solid;
        border-color: var(--accent-color);
        background: rgba(var(--accent-color-rgb), 0.08);
    }
    .food-card.locked {
        opacity: 0.45;
        cursor: not-allowed;
    }
    .food-card.locked::after {
        content: '🔒';
        position: absolute;
        top: 8px; right: 8px;
        font-size: 11px;
    }
    .food-emoji { font-size: 32px; line-height: 1; margin-bottom: 5px; }
    .food-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .food-effect { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
    .food-stock {
        position: absolute;
        top: 8px; left: 8px;
        min-width: 20px; height: 20px;
        padding: 0 5px;
        border-radius: 9999px;
        background: var(--accent-color);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: grid; place-items: center;
    }

    .feeder-detail {
        background: var(--secondary-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 14px;
        margin-bottom: 16px;
    }
    .feeder-detail-title {
        font-family: var(--font-serif);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 6px;
    }
    .feeder-detail-desc {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    .feeder-actions {
        display: flex; gap: 12px;
        margin-top: 6px;
    }
    .feeder-btn {
        flex: 1;
        height: 46px;
        border-radius: var(--radius-sm);
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .feeder-btn:active { transform: scale(0.97); }
    .feeder-btn.secondary {
        background: rgba(var(--accent-color-rgb), 0.1);
        color: var(--accent-color);
    }
    .feeder-btn.primary {
        background: var(--accent-color);
        color: #fff;
        box-shadow: 0 4px 14px -4px rgba(var(--accent-color-rgb), 0.35);
    }
    .feeder-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Toast */
    .toast {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%) translateY(12px);
        background: var(--text-primary);
        color: var(--card-background);
        font-size: 13px;
        padding: 9px 20px;
        border-radius: 9999px;
        opacity: 0;
        pointer-events: none;

      ];

      /* 形态注册表 & 共享常量（统一走 SparkShared，本页只做薄封装） */
      var FORMS = SparkShared.FORMS;

      var DAILY_LIMITS = { chat: 10, moments: 2 };
      var EXP_PER = { chat: 3, moments: 8 };

      var FOODS = [
        { id: "star_cookie", name: "星星饼干", emoji: "⭐", exp: 3, fullness: 5, mood: 2, unlock: 1, desc: "咬一口会发出细碎星光，它最爱的零嘴。" },
        { id: "pudding", name: "草莓布丁", emoji: "🍮", exp: 5, fullness: 8, mood: 3, unlock: 1, desc: "软软甜甜，吃完嘴角都会翘起来。" },
        { id: "honey_bread", name: "蜜糖面包", emoji: "🍞", exp: 6, fullness: 12, mood: 4, unlock: 2, desc: "淋了蜂蜜的温热面包，能让它暖一整天。" },
        { id: "berry_cake", name: "蓝莓蛋糕", emoji: "🫐", exp: 8, fullness: 10, mood: 5, unlock: 2, desc: "酸甜的蓝莓配上绵密奶油，是成长的小奖励。" },
        { id: "mooncake", name: "月光蛋糕", emoji: "🌙", exp: 12, fullness: 15, mood: 8, unlock: 3, desc: "只在梦里发光的蛋糕，吃完会偷偷笑。" },
        { id: "flame_skewer", name: "火焰烤串", emoji: "🍢", exp: 15, fullness: 18, mood: 10, unlock: 4, desc: "辣呼呼的能量串，专属的能量料理。" },
        { id: "rainbow_candy", name: "彩虹糖", emoji: "🌈", exp: 20, fullness: 25, mood: 15, unlock: 5, desc: "七种颜色七种心情，传说级甜品。" }
      ];
      var FOOD_DAILY_STOCK = 3;
      var FULLNESS_MAX = 100;
      var MOOD_MAX = 100;

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      function yesterdayStr() {
        var d = new Date(); d.setDate(d.getDate()-1);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      function monthKey() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      }

      /**
       * SparkTracker（新版）：
       * 只有 1 只宠物，所有读写都通过 SparkShared 做统一的新/旧结构迁移。
       * 形态切换 form 与 改名 name 存在同一结构里，其它页面刷新即可同步。
       */
      window.SparkTracker = {
        load: function () {
          var data = SparkShared.load();
          var pd = data.pet;
          // 每日食物库存刷新
          var t = todayStr();
          if (pd.lastFed !== t) {
            FOODS.forEach(function (f) {
              if (pd.level >= f.unlock) pd.foods[f.id] = FOOD_DAILY_STOCK;
            });
            pd.lastFed = t;
            SparkShared.save(data);
          }
          this.updateVitals(pd, false);
          return data;
        },
        updateVitals: function (pd, autoSave) {
          var now = new Date();
          var last = pd.lastVitalUpdate ? new Date(pd.lastVitalUpdate) : now;
          if (isNaN(last.getTime())) last = now;
          var hours = Math.max(0, (now - last) / 3600000);
          var state = this.getState(pd);
          var fullnessDrop = hours * 2 + (state === "sleeping" ? hours * 1 : 0);
          var moodDrop = hours * 1;
          pd.fullness = Math.max(0, pd.fullness - fullnessDrop);
          pd.mood = Math.max(0, pd.mood - moodDrop);
          pd.lastVitalUpdate = now.toISOString();
          if (autoSave !== false) {
            var d = SparkShared.load();
            d.pet = pd;
            SparkShared.save(d);
          }
        },
        save: function (d) { SparkShared.save(d); },
        current: function (d) { return (d || this.load()).pet; },
        setName: function (name) {
          var n = SparkShared.setName(name);
          // 通知父窗口（如果存在）立即刷新相关文案
          try { window.parent && window.parent.postMessage({ type: "spark:update" }, "*"); } catch (e) {}
          return n;
        },
        /* 切形态 —— 同一个体，换外观 */
        switchForm: function (formId) {
          var ok = SparkShared.setForm(formId);
          if (ok) {
            try { window.parent && window.parent.postMessage({ type: "spark:update" }, "*"); } catch (e) {}
          }
          return ok;
        },
        recordInteraction: function (type) {
          var data = SparkShared.load();
          var pd = data.pet;
          var t = todayStr();
          if (!pd.daily[t]) pd.daily[t] = { chat: 0, moments: 0 };
          if (pd.daily[t][type] >= DAILY_LIMITS[type]) return { gained: 0, leveledUp: false, level: pd.level };
          pd.daily[t][type]++;
          pd.totalInteractions++;
          var gained = EXP_PER[type];
          pd.exp += gained;
          pd.totalExp += gained;
          pd.fullness = Math.min(FULLNESS_MAX, pd.fullness + 0.3);
          pd.mood = Math.min(MOOD_MAX, pd.mood + 0.5);
          if (t !== pd.lastActiveDate) {
            if (pd.lastActiveDate === yesterdayStr()) pd.streak++;
            else if (pd.lastActiveDate !== t) pd.streak = 1;
            pd.lastActiveDate = t;
          } else if (pd.streak === 0) {
            pd.streak = 1;
          }
          var leveledUp = this._levelUpIfNeeded(pd);
          this._checkMilestones(pd);
          if (pd.makeupMonth !== monthKey()) {
            pd.makeupMonth = monthKey();
            pd.makeupCards = 1;
          }
          SparkShared.save(data);
          try { window.parent && window.parent.postMessage({ type: "spark:update", leveledUp: leveledUp }, "*"); } catch (e) {}
          return { gained: gained, leveledUp: leveledUp, level: pd.level };
        },
        useMakeup: function () {
          var data = SparkShared.load();
          var pd = data.pet;
          if (pd.makeupCards <= 0) return false;
          var y = yesterdayStr();
          if (pd.daily[y] && (pd.daily[y].chat > 0 || pd.daily[y].moments > 0)) return false;
          if (!pd.daily[y]) pd.daily[y] = { chat: 0, moments: 0 };
          pd.daily[y].chat = 1;
          pd.makeupCards--;
          if (pd.lastActiveDate === y) {
            pd.streak++;
          } else if (yesterdayStr() === y) {
            pd.streak = Math.max(pd.streak, 1);
            pd.lastActiveDate = y;
          }
          this._checkMilestones(pd);
          SparkShared.save(data);
          return true;
        },
        feed: function (foodId) {
          var data = SparkShared.load();
          var pd = data.pet;
          var food = FOODS.find(function(f){ return f.id === foodId; });
          if (!food) return { ok: false, reason: "food_not_found" };
          if (pd.level < food.unlock) return { ok: false, reason: "locked" };
          if (!pd.foods[foodId] || pd.foods[foodId] <= 0) return { ok: false, reason: "no_stock" };
          if (pd.fullness >= FULLNESS_MAX - 2) return { ok: false, reason: "full" };

          pd.foods[foodId]--;
          pd.fullness = Math.min(FULLNESS_MAX, pd.fullness + food.fullness);
          pd.mood = Math.min(MOOD_MAX, pd.mood + food.mood);
          pd.exp += food.exp;
          pd.totalExp += food.exp;
          pd.totalInteractions++;
          var leveledUp = this._levelUpIfNeeded(pd);
          var t = todayStr();
          if (!pd.daily[t]) pd.daily[t] = { chat: 0, moments: 0 };
          if (t !== pd.lastActiveDate) {
            if (pd.lastActiveDate === yesterdayStr()) pd.streak++;
            else pd.streak = 1;
            pd.lastActiveDate = t;
          }
          this._checkMilestones(pd);
          SparkShared.save(data);
          try { window.parent && window.parent.postMessage({ type: "spark:update", leveledUp: leveledUp }, "*"); } catch (e) {}
          return { ok: true, food: food, leveledUp: leveledUp, level: pd.level };
        },
        pet: function () {
          var data = SparkShared.load();
          var pd = data.pet;
          if (pd.mood >= MOOD_MAX) return { ok: false, reason: "max_mood" };
          this.updateVitals(pd, false);
          pd.mood = Math.min(MOOD_MAX, pd.mood + 5);
          pd.exp += 1;
          pd.totalExp += 1;
          pd.totalInteractions++;
          var leveledUp = this._levelUpIfNeeded(pd);
          SparkShared.save(data);
          return { ok: true, moodAdded: 5, leveledUp: leveledUp, level: pd.level };
        },
        getState: function (petData) {
          var pd = petData || SparkShared.load().pet;
          var t = todayStr();
          var today = pd.daily[t] || { chat: 0, moments: 0 };
          var lastActive = pd.lastActiveDate;
          var state = "sleeping";
          if (lastActive === t && (today.chat > 0 || today.moments > 0)) {
            state = "happy";
          } else if (lastActive === yesterdayStr()) {
            state = "calm";
          } else {
            var d2 = new Date(lastActive + "T00:00:00");
            var now = new Date();
            var diff = Math.round((now - d2) / 86400000);
            if (isNaN(diff)) diff = 99;
            if (diff <= 2) state = "hungry";
            else if (diff <= 3) state = "weak";
            else state = "sleeping";
          }
          return state;
        },
        _levelUpIfNeeded: function (pd) {
          var leveledUp = false;
          while (pd.level < LEVELS.length && pd.exp >= LEVELS[pd.level - 1].need) {
            pd.exp -= LEVELS[pd.level - 1].need;
            pd.level++;
            leveledUp = true;
          }
          return leveledUp;
        },
        _checkMilestones: function (pd) {
          MILESTONES.forEach(function (m) {
            if (pd.streak >= m.days && pd.milestones.indexOf(m.days) === -1) {
              pd.milestones.push(m.days);
            }
          });
        }
      };

      /* ========== SVG Chibi Cat Renderer ========== */
      function getHairColor(id) { return HAIR_COLORS.find(function(c){return c.id===id;}) || HAIR_COLORS[0]; }
      function getOutfitColor(id) { return OUTFIT_COLORS.find(function(c){return c.id===id;}) || OUTFIT_COLORS[0]; }
      function getEarColor(id, hairColor) {
        if (id === "match") return { color: hairColor, inner: lightenColor(hairColor, 30) };
        return EAR_COLORS.find(function(c){return c.id===id;}) || EAR_COLORS[0];
      }
      function getEyes(id) { return EYES.find(function(e){return e.id===id;}) || EYES[0]; }
      function getMouth(id) { return MOUTHS.find(function(m){return m.id===id;}) || MOUTHS[0]; }
      function getAccessory(id) { return ACCESSORIES.find(function(a){return a.id===id;}) || ACCESSORIES[0]; }

      function renderCreature(data, state, forcedPose) {
        var av = data.avatar;
        var hair = getHairColor(av.hairColor).color;
        var outfit = getOutfitColor(av.outfitColor).color;
        var ear = getEarColor(av.earColor || "brown", hair);
        var earColor = ear.color || hair;
        var earInner = ear.inner || lightenColor(hair, 30);
        var skin = "#ffe4d6";
        var isSleeping = state === "sleeping";
        var isWeak = state === "weak" || state === "sleeping";
        var bodyOpacity = isWeak ? 0.72 : 1;

      function lightenColor(hex, amt) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
      }
      function darkenColor(hex, amt) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
      }

        statusBadge.className = "status-badge " + info.class;
        statusBadge.textContent = info.label;
        var poseObj = POSES.find(function(p){return p.id===pd.avatar.pose;}) || POSES[0];
        creatureStatusText.textContent = stateText + " · " + poseObj.emoji + poseObj.label;

        /* 更新光环颜色 */
        var aura = document.getElementById("creatureAura");
        if (aura) aura.style.background = 'radial-gradient(circle, ' + shared.auraColor + ' 0%, transparent 70%)';

        /* 等级经验 */
        var lv = LEVELS[Math.min(pd.level - 1, LEVELS.length - 1)];
        levelLabel.textContent = "Lv." + pd.level;
        levelTitle.textContent = lv.title;
        expText.textContent = pd.exp + " / " + lv.need;
        expFill.style.width = Math.min(100, (pd.exp / lv.need) * 100) + "%";

        streakNum.textContent = pd.streak;
        totalExpNum.textContent = pd.totalExp;
        totalInteractNum.textContent = pd.totalInteractions;

        var f = Math.max(0, Math.min(FULLNESS_MAX, pd.fullness || 0));
        var m = Math.max(0, Math.min(MOOD_MAX, pd.mood || 0));
        fullnessNum.textContent = Math.round(f) + "/" + FULLNESS_MAX;
        fullnessFill.style.width = f + "%";
        moodNum.textContent = Math.round(m) + "/" + MOOD_MAX;
        moodFill.style.width = m + "%";

        var t = todayStr();
        var today = pd.daily[t] || { chat: 0, moments: 0 };
        chatCount.textContent = today.chat + "/" + DAILY_LIMITS.chat;
        momentCount.textContent = today.moments + "/" + DAILY_LIMITS.moments;
        chatBar.style.width = Math.min(100, (today.chat / DAILY_LIMITS.chat) * 100) + "%";
        momentBar.style.width = Math.min(100, (today.moments / DAILY_LIMITS.moments) * 100) + "%";

        chatCount.className = "today-count" + (today.chat >= DAILY_LIMITS.chat ? " done" : "");
        momentCount.className = "today-count" + (today.moments >= DAILY_LIMITS.moments ? " done" : "");

        renderMilestones();
        makeupCount.textContent = pd.makeupCards;
        makeupBtn.disabled = pd.makeupCards <= 0;
      }

      function renderMilestones() {
        var pd = data.pet;
        milestoneList.innerHTML = "";
        MILESTONES.forEach(function (m) {
          var unlocked = pd.milestones.indexOf(m.days) !== -1;
          var item = document.createElement("div");
          item.className = "milestone-item" + (unlocked ? " unlocked" : "");
          item.innerHTML = '<div class="milestone-circle">' + m.icon + '</div><div class="milestone-label">' + m.label + '</div>';
          milestoneList.appendChild(item);
        });
      }

      /* Feeder */
      function openFeeder() {
        var shared = SparkShared.readPet('page');
        var name = shared.name;
        feederSelectedFood = null;
        feederHint.textContent = "选择食物喂给" + name + "吧～";
        document.querySelectorAll('#feedModal .modal-title').forEach(function(el){ el.textContent = '喂食' + name; });
        feederDetail.style.display = "none";
        feedConfirm.disabled = true;
        var previewImg = feederPreview.querySelector('img');
        if (previewImg) previewImg.src = shared.image;
        renderFoodGrid();
        feedModal.classList.add("show");
        feedModal.style.cssText = "display:block;opacity:1;pointer-events:auto;";
      }
      function closeFeeder() {
        feedModal.classList.remove("show");
        feedModal.style.cssText = "display:none;opacity:0;pointer-events:none;";
      }

      function renderFoodGrid() {
        foodGrid.innerHTML = "";
        data = SparkTracker.load();
        var pd = data.pet;
        FOODS.forEach(function (food) {
          var locked = pd.level < food.unlock;
          var stock = pd.foods[food.id] || 0;
          var card = document.createElement("div");
          card.className = "food-card" + (feederSelectedFood === food.id ? " active" : "") + (locked ? " locked" : "");
          card.innerHTML = '<div class="food-emoji">' + food.emoji + '</div><div class="food-name">' + food.name + '</div><div class="food-effect">+' + food.fullness + '饱 +' + food.mood + '心</div>' +
            (locked ? '' : '<div class="food-stock">' + stock + '</div>');
          if (locked) {
            card.title = "Lv." + food.unlock + " 解锁";
          } else if (stock <= 0) {
            card.title = "今日份已吃完啦";
          } else {
            card.addEventListener("click", function () {
              feederSelectedFood = food.id;
              feederHint.textContent = "选择了 " + food.name;
              feederDetail.style.display = "block";
              detailTitle.textContent = food.emoji + " " + food.name;
              detailDesc.textContent = food.desc + " （经验 +" + food.exp + "，饱食 +" + food.fullness + "，心情 +" + food.mood + "）";
              feedConfirm.disabled = false;
              renderFoodGrid();
            });
          }
          foodGrid.appendChild(card);
        });
      }

      function doFeed() {
        if (!feederSelectedFood) return;
        var result = SparkTracker.feed(feederSelectedFood);
        var name = SparkShared.readPet('page').name;
        if (!result.ok) {
          if (result.reason === "full") toast(name + "已经吃饱啦，等消化一下再喂吧～");
          else if (result.reason === "no_stock") toast("今天这个食物没有库存了哦");
          else if (result.reason === "locked") toast("等级不够，还不能吃这个");
          else toast("喂食失败");
          renderFoodGrid();
          return;
        }
        var food = result.food;
        feederPreview.classList.add("eating");
        setTimeout(function(){ feederPreview.classList.remove("eating"); }, 550);
        toast(name + "吃掉了 " + food.name + "，心情变好了 ✨");
        if (result.leveledUp) {
          setTimeout(function(){ showLevelUp(result.level); }, 400);
        }
        feederSelectedFood = null;
        feederHint.textContent = "还想再喂点什么？";
        feederDetail.style.display = "none";
        feedConfirm.disabled = true;
        renderFoodGrid();
        render();
      }

      function showLevelUp(lv) {
        levelupText.textContent = "升级啦！Lv." + lv + " " + LEVELS[Math.min(lv - 1, LEVELS.length - 1)].title;
        levelupOverlay.classList.add("show");
        setTimeout(function(){ levelupOverlay.classList.remove("show"); }, 1600);
      }

      function useMakeup() {
        if (SparkTracker.useMakeup()) {
          toast("已补签昨天 🔥");
          render();
        } else {
          toast("无法补签（可能没有补签卡或昨天已有互动）");
        }
      }

      feedBtn.addEventListener("click", openFeeder);
      feedClose.addEventListener("click", closeFeeder);
      feedConfirm.addEventListener("click", doFeed);
      feedModal.addEventListener("click", function (e) { if (e.target === feedModal) closeFeeder(); });
      makeupBtn.addEventListener("click", useMakeup);

      /* 点击名字 → 自定义取名（改完：SparkTracker.setName → SparkShared.setName → 其它页面刷新就同步） */
      creatureName.addEventListener("click", function () {
        var shared = SparkShared.readPet('page');
        var current = shared.name;
        var input = prompt("给它取个名字吧～（最多12字）", current);
        if (input === null) return;
        var trimmed = input.trim();
        if (!trimmed) { toast("名字不能为空哦"); return; }
        if (trimmed.length > 12) { toast("名字太长啦，最多12字"); trimmed = trimmed.slice(0, 12); }
        var finalName = SparkTracker.setName(trimmed);
        data = SparkTracker.load();
        renderFormSelector();
        render();
        toast("改名成功！现在叫「" + finalName + "」啦 ♡");
      });

      /* Tap creature to pet */
      creatureSvg.addEventListener("click", function (e) {
        var n = SparkShared.readPet('page').name;
        var state = SparkTracker.getState();
        if (state === "sleeping") { toast(n + "沉睡中，快唤醒它吧 💤"); return; }
        var result = SparkTracker.pet();
        if (!result.ok) { toast("心情已经满啦，" + n + "很开心 ♡"); return; }
        render();
        toast("你拍了拍" + n + "，心情 +" + result.moodAdded + " ♡");
        spawnHeart(e.clientX, e.clientY);
        if (result.leveledUp) {
          setTimeout(function(){ showLevelUp(result.level); }, 200);
        }
      });

      function spawnHeart(x, y) {
        var heart = document.createElement("div");
        heart.textContent = "♡";
        heart.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;font-size:20px;color:var(--accent-color);pointer-events:none;z-index:200;animation:heartFloat 1s ease-out forwards;";
        document.body.appendChild(heart);
        setTimeout(function(){ if (heart.parentNode) heart.parentNode.removeChild(heart); }, 1000);
      }

      render();

      // localStorage 变化（父窗口写数据时触发） -> 刷新
      window.addEventListener("storage", function (e) {
        if (e.key === SPARK_KEY) render();
      });

      // 父窗口 postMessage 通知 -> 刷新（更实时）
      window.addEventListener("message", function (ev) {
        var d = ev.data || {};
        if (d.type === "spark:update") {
          render();
          if (d.leveledUp) {
            var cur = SparkTracker.current();
            var lv = (cur && cur.level) ? cur.level : 1;
            setTimeout(function () {
              showLevelUp(lv);
            }, 300);
          }
        }
      });
    })();
  </script>

  <!-- 返回按钮兼容父iframe内嵌SPA模式（postMessage） -->
  <script>
    (function () {
      var nameMap = { 'spark-new': 'spark' };
      var fname = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
      var extKey = nameMap[fname] || fname;
      var FALLBACK_URL = '../index-zy.html';

      window.__extAppBack = function (ev) {
        try { ev && ev.preventDefault && ev.preventDefault(); } catch(e) {}
        var inIframe = false;
        try { inIframe = (window.top !== window.self); } catch(e) { inIframe = true; }
        if (inIframe) {
          try {
            window.top.postMessage({ type: 'extapp:back', key: extKey, ts: Date.now() }, '*');
            setTimeout(function(){ try { location.replace(FALLBACK_URL); } catch(e){} }, 300);
            return false;
          } catch (e) {
            location.href = FALLBACK_URL;
            return false;
          }
        } else {
          location.href = FALLBACK_URL;
          return false;
        }
      };

      function patchBackLinks() {
        var as = document.querySelectorAll('a[href]');
        for (var i=0; i<as.length; i++) {
          var a = as[i];
          var href = a.getAttribute('href') || '';
          if (href && /(index-zy|index-new-v2|index-new|home-app|home)\.html/i.test(href)) {
            var txt = (a.textContent || '').trim();
            var cls = a.className || '';
            var ddi = a.getAttribute && a.getAttribute('data-dom-id') || '';
            var label = (a.getAttribute && a.getAttribute('aria-label')) || '';
            var lookslikeBack = /(back-btn|back|返回|home|后退|nav-back|back-home|back-nav)/i.test(cls + ' ' + ddi + ' ' + label + ' ' + txt);
            if (lookslikeBack) {
              if (a.getAttribute('data-extapp-back-patched')) continue;
              a.setAttribute('data-extapp-back-patched', '1');
              a.setAttribute('href', 'javascript:void(0)');
              (function(el){
                el.addEventListener('click', function(e){ return window.__extAppBack(e); });
              })(a);
            }
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', patchBackLinks);
      } else {
        patchBackLinks();
      }
      setTimeout(patchBackLinks, 500);
      setTimeout(patchBackLinks, 1500);

      window.extAppBackDirect = function() { return window.__extAppBack(); };
    })();
  </script>
