<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>朋友圈 · 梦角传讯</title>

  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--secondary-bg);
      color: var(--text-primary);
    }

    #moments-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background:
        radial-gradient(ellipse 600px 360px at 20% 0%, hsl(343 80% 94% / 0.95), transparent 60%),
        radial-gradient(ellipse 480px 300px at 90% 10%, hsl(343 72% 92% / 0.8), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* 顶部 */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 12px;
      background: linear-gradient(135deg, #fff0f4 0%, #fde8ef 100%);
      border-bottom: 1px solid rgba(232, 116, 154, 0.2);
      box-shadow: 0 2px 12px rgba(232, 116, 154, 0.08);
      position: relative;
      z-index: 10;
    }
    @media (max-width: 479px) {
      #top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: var(--accent-color);
      text-decoration: none;
      padding: 6px 4px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 56px;
    }
    .top-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .post-trigger {
      flex-shrink: 0;
      min-width: 56px;
      text-align: right;
      font-size: 15px;
      color: var(--accent-color);
      font-weight: 600;
      background: none;
      border: none;
      padding: 6px 0;
      cursor: pointer;
    }

    /* 朋友圈流 */
    #stream {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px 24px;
      scrollbar-width: thin;
    }
    #stream::-webkit-scrollbar { width: 4px; }
    #stream::-webkit-scrollbar-track { background: transparent; }
    #stream::-webkit-scrollbar-thumb { background: rgba(232, 116, 154, 0.3); border-radius: 4px; }

    /* 封面 */
    .cover-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #ffdce8, #f8c0d4);
      box-shadow: 0 4px 16px rgba(232, 116, 154, 0.12);
    }
    .cover-img { width: 100%; height: 100%; object-fit: cover; }
    .cover-user {
      position: absolute;
      right: 12px;
      bottom: -22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cover-avatar {
      width: 64px; height: 64px;
      border-radius: 9999px;
      border: 3px solid #fff;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      box-shadow: 0 2px 10px rgba(232, 116, 154, 0.25);
      overflow: hidden;
      display: grid; place-items: center;
      font-size: 1.8rem;
    }
    .cover-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .cover-name {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
      margin-bottom: 24px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .empty-icon { font-size: 48px; opacity: 0.6; margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--accent-color); margin-bottom: 6px; }
    .empty-hint { font-size: 13px; }

    /* 动态卡片 */
    .moment-card {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      animation: cardIn 0.35s cubic-bezier(.3,0,0,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .moment-avatar {
      width: 40px; height: 40px;
      border-radius: 9999px;
      flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 1.25rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(232, 116, 154, 0.15);
      overflow: hidden;
    }
    .moment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .moment-body { flex: 1; min-width: 0; }
    .moment-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 2px;
    }
    .moment-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .moment-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      word-break: break-word;
      margin-bottom: 8px;
    }
    .moment-img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 10px;
      border: 1px solid rgba(232, 116, 154, 0.12);
      background: #fff;
    }

    /* 互动区 */
    .moment-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
      transition: color 0.15s;
    }
    .action-btn:active { color: var(--accent-color); }
    .action-btn.liked { color: var(--accent-color); }

    /* 评论区 */
    .comment-box {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.55;
    }
    .comment-line {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .comment-line:last-child { margin-bottom: 0; }
    .comment-author {
      font-weight: 600;
      color: var(--accent-color);
      flex-shrink: 0;
    }
    .comment-text { color: var(--text-primary); word-break: break-word; }

    /* 评论输入 */
    .comment-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .comment-input {
      flex: 1;
      height: 34px;
      padding: 0 12px;
      border-radius: 17px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .comment-input:focus { border-color: var(--accent-color); }
    .comment-send {
      width: 34px; height: 34px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: grid; place-items: center;
    }

    /* 继续/刷新 */
    .refresh-bar {
      display: flex;
      justify-content: center;
      padding: 6px 0 18px;
    }
    .refresh-btn {
      padding: 8px 22px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: rgba(255, 255, 255, 0.6);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .refresh-btn:active { transform: scale(0.96); background: rgba(232, 116, 154, 0.08); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 发布面板 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .post-panel {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 20px 16px 28px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-overlay.show .post-panel { transform: translateY(0); }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel-title { font-family: var(--font-serif); font-size: 17px; font-weight: 600; }
    .panel-close {
      width: 32px; height: 32px;
      border-radius: 9999px;
      border: none;
      background: rgba(232, 116, 154, 0.08);
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
    }
    .post-textarea {
      width: 100%;
      min-height: 100px;
      max-height: 180px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff8fa;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      resize: none;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .post-textarea:focus { border-color: var(--accent-color); }
    .post-img-preview {
      width: 100%;
      max-height: 180px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 12px;
      border: 1px solid rgba(232, 116, 154, 0.15);
      display: none;
    }
    .post-img-preview.show { display: block; }
    .post-tools {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .post-tool {
      padding: 8px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
    }
    .post-submit {
      width: 100%;
      height: 46px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .post-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 节奏提示 */
    .rhythm-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 0 8px;
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-primary);
      color: #fff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="moments-app">
    <header id="top-bar">
      <a href="index-new.html" class="back-btn">← 返回</a>
      <span class="top-title">朋友圈</span>
      <button class="post-trigger" id="openPost">发布</button>
    </header>

    <main id="stream">
      <div class="cover-wrap" id="coverWrap">
        <div class="cover-user">
          <span class="cover-name" id="coverName">我</span>
          <div class="cover-avatar" id="coverAvatar">🌙</div>
        </div>
      </div>

      <div class="rhythm-hint" id="rhythmHint"></div>

      <div id="momentsList"></div>

      <div class="refresh-bar" id="refreshBar" style="display:none;">
        <button class="refresh-btn" id="refreshBtn">✨ 看看梦角有没有更新</button>
      </div>
    </main>
  </div>

  <!-- 发布面板 -->
  <div class="modal-overlay" id="postModal">
    <div class="post-panel">
      <div class="panel-header">
        <span class="panel-title">发布朋友圈</span>
        <button class="panel-close" id="closePost">×</button>
      </div>
      <textarea class="post-textarea" id="postText" placeholder="分享此刻的心情…" maxlength="300"></textarea>
      <img class="post-img-preview" id="postImgPreview" alt="" />
      <div class="post-tools">
        <button class="post-tool" id="addImgBtn">🖼️ 添加配图</button>
        <button class="post-tool" id="clearImgBtn" style="display:none;">清除图片</button>
      </div>
      <input type="file" id="postImgInput" accept="image/*" class="hidden" style="display:none;" />
      <button class="post-submit" id="submitPost">发布</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      /* ========== 存储键 ========== */
      var KEYS = {
        posts: "mengjiao_moments_posts",
        cards: "mengjiao_moments_cards",
        rhythm: "mengjiao_moments_rhythm",
        username: "mengjiao_username",
        avatarImg: "mengjiao_avatar_img",
        dreamImg: "mengjiao_dream_img",
        bgImg: "mengjiao_bg_img",
        partnerName: "mengjiao_partner_name"
      };

      /* ========== 默认数据 ========== */
      var DEFAULT_CARDS = [
        { type: "text", text: "今天也在想你哦。" },
        { type: "text", text: "看到一朵很像你的云。" },
        { type: "text", text: "晚安，好梦。" },
        { type: "text", text: "你笑起来的时候，整个世界都亮了。" }
      ];
      var DEFAULT_RHYTHM = { minInterval: 60, maxInterval: 180, batchMin: 1, batchMax: 2 };
      var DEFAULT_CHAT_REPLIES = [
        "嗯嗯，我在听呢。", "我也这么觉得。", "抱抱你。", "看到你这条，心情变好了。",
        "好可爱呀。", "我在呢，一直都在。", "然后呢？", "真想陪在你身边。"
      ];

      /* ========== 工具函数 ========== */
      function getItem(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v !== null && v !== "") return v;
        } catch (e) {}
        return fallback;
      }
      function setJSON(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      }
      function getJSON(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v) {
            var parsed = JSON.parse(v);
            if (parsed !== null && typeof parsed === "object") return parsed;
          }
        } catch (e) {}
        return fallback;
      }
      function getArr(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v) {
            var parsed = JSON.parse(v);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return fallback ? fallback.slice() : [];
      }
      function setArr(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function nowStr() { return new Date().toISOString(); }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function formatTime(iso) {
        var d = new Date(iso);
        var now = new Date();
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return "刚刚";
        if (diff < 3600) return Math.floor(diff / 60) + "分钟前";
        if (diff < 86400) return Math.floor(diff / 3600) + "小时前";
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return m + "月" + day + "日 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      var toastTimer;
      function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1800);
      }

      /* ========== 读取配置 ========== */
      var username = getItem(KEYS.username, "我");
      var partnerName = getItem(KEYS.partnerName, "梦角");
      var myAvatar = getItem(KEYS.avatarImg, "");
      var dreamAvatar = getItem(KEYS.dreamImg, "");
      var bgImg = getItem(KEYS.bgImg, "");
      var cards = getArr(KEYS.cards, DEFAULT_CARDS);
      var rhythm = getJSON(KEYS.rhythm, DEFAULT_RHYTHM);
      var posts = getArr(KEYS.posts, []);
      var chatReplies = getArr("mengjiao_chat_replies", DEFAULT_CHAT_REPLIES);

      /* ========== 封面 ========== */
      var coverWrap = document.getElementById("coverWrap");
      if (bgImg) coverWrap.style.backgroundImage = "url(" + bgImg + ")";
      document.getElementById("coverName").textContent = username;
      var coverAvatar = document.getElementById("coverAvatar");
      if (myAvatar) coverAvatar.innerHTML = '<img src="' + myAvatar + '" alt="" />';
      else coverAvatar.textContent = "🌙";

      /* ========== 节奏提示 ========== */
      var rhythmHint = document.getElementById("rhythmHint");
      rhythmHint.textContent = "梦角大约每 " + rhythm.minInterval + "-" + rhythm.maxInterval + " 分钟来一次朋友圈";

      /* ========== 头像组件 ========== */
      function makeAvatar(isPartner) {
        var el = document.createElement("div");
        el.className = "moment-avatar";
        var src = isPartner ? dreamAvatar : myAvatar;
        var fallback = isPartner ? "梦" : "🌙";
        if (src) el.innerHTML = '<img src="' + src + '" alt="" />';
        else el.textContent = fallback;
        return el;
      }

      /* ========== 渲染单条动态 ========== */
      function renderMoment(post, container, prepend) {
        var card = document.createElement("div");
        card.className = "moment-card";
        card.dataset.id = post.id;
        var isPartner = post.author === "partner";

        card.appendChild(makeAvatar(isPartner));

        var body = document.createElement("div");
        body.className = "moment-body";

        var name = document.createElement("div");
        name.className = "moment-name";
        name.textContent = isPartner ? partnerName : username;
        body.appendChild(name);

        var time = document.createElement("div");
        time.className = "moment-time";
        time.textContent = formatTime(post.time);
        body.appendChild(time);

        var text = document.createElement("div");
        text.className = "moment-text";
        text.textContent = post.text;
        body.appendChild(text);

        if (post.image) {
          var img = document.createElement("img");
          img.className = "moment-img";
          img.src = post.image;
          img.alt = "";
          body.appendChild(img);
        }

        /* 点赞/评论按钮 */
        var actions = document.createElement("div");
        actions.className = "moment-actions";
        var liked = (post.likes || []).indexOf("me") !== -1;
        var likeBtn = document.createElement("button");
        likeBtn.className = "action-btn" + (liked ? " liked" : "");
        likeBtn.innerHTML = (liked ? "♥" : "♡") + " <span>" + (post.likes || []).length + "</span>";
        likeBtn.addEventListener("click", function () {
          toggleLike(post.id);
        });
        actions.appendChild(likeBtn);
        body.appendChild(actions);

        /* 评论区 */
        var commentBox = document.createElement("div");
        commentBox.className = "comment-box";
        var comments = post.comments || [];
        if (comments.length === 0) {
          commentBox.innerHTML = '<div class="comment-line" style="color:var(--text-secondary);">还没有评论，说点什么吧</div>';
        } else {
          commentBox.innerHTML = comments.map(function (c) {
            var name = c.author === "partner" ? partnerName : username;
            return '<div class="comment-line"><span class="comment-author">' + escapeHtml(name) + '：</span><span class="comment-text">' + escapeHtml(c.text) + '</span></div>';
          }).join("");
        }
        body.appendChild(commentBox);

        /* 评论输入 */
        var form = document.createElement("div");
        form.className = "comment-form";
        var input = document.createElement("input");
        input.type = "text";
        input.className = "comment-input";
        input.placeholder = "评论…";
        input.maxLength = 120;
        var send = document.createElement("button");
        send.className = "comment-send";
        send.innerHTML = "↵";
        send.addEventListener("click", function () {
          addComment(post.id, input.value);
          input.value = "";
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { send.click(); }
        });
        form.appendChild(input);
        form.appendChild(send);
        body.appendChild(form);

        card.appendChild(body);

        if (prepend && container.firstChild) {
          container.insertBefore(card, container.firstChild);
        } else {
          container.appendChild(card);
        }
      }

      /* ========== 渲染全部 ========== */
      function renderAll() {
        var list = document.getElementById("momentsList");
        list.innerHTML = "";
        if (posts.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="empty-icon">🌸</div><div class="empty-title">这里还空空如也</div><div class="empty-hint">发布第一条朋友圈，或等梦角来更新吧</div></div>';
          return;
        }
        // 按时间倒序
        var sorted = posts.slice().sort(function (a, b) { return new Date(b.time) - new Date(a.time); });
        sorted.forEach(function (p) { renderMoment(p, list, false); });
      }

      /* ========== 点赞 ========== */
      function toggleLike(id) {
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        post.likes = post.likes || [];
        var idx = post.likes.indexOf("me");
        if (idx === -1) post.likes.push("me");
        else post.likes.splice(idx, 1);
        setArr(KEYS.posts, posts);
        renderAll();
      }

      /* ========== 添加评论 ========== */
      function addComment(id, text) {
        text = (text || "").trim();
        if (!text) return;
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        post.comments = post.comments || [];
        post.comments.push({ author: "me", text: text, time: nowStr() });
        setArr(KEYS.posts, posts);
        renderAll();

        // 梦角回复（80% 概率）
        setTimeout(function () {
          if (Math.random() < 0.8) {
            replyComment(id);
          }
        }, randInt(1200, 2500));
      }

      function replyComment(id) {
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        // 从 chatReplies 随机，避免和最近一条重复
        var lastReply = "";
        var cs = post.comments || [];
        for (var i = cs.length - 1; i >= 0; i--) {
          if (cs[i].author === "partner") { lastReply = cs[i].text; break; }
        }
        var pool = chatReplies.length ? chatReplies : DEFAULT_CHAT_REPLIES;
        var text;
        for (var k = 0; k < 5; k++) {
          text = pick(pool);
          if (text !== lastReply) break;
        }
        post.comments.push({ author: "partner", text: text, time: nowStr() });
        setArr(KEYS.posts, posts);
        renderAll();
        showToast(partnerName + " 回复了你");
      }

      /* ========== 梦角发圈逻辑 ========== */
      function partnerShouldPost() {
        var lastKey = "mengjiao_moments_last_partner";
        var last = 0;
        try {
          var v = localStorage.getItem(lastKey);
          if (v) last = parseInt(v, 10) || 0;
        } catch (e) {}
        var now = Date.now();
        var intervalMin = Math.max(1, rhythm.minInterval || 60);
        var intervalMax = Math.max(intervalMin, rhythm.maxInterval || 180);
        var needed = intervalMin * 60 * 1000;
        return now - last >= needed;
      }
      function recordPartnerPost() {
        try { localStorage.setItem("mengjiao_moments_last_partner", String(Date.now())); } catch (e) {}
      }

      function generatePartnerPosts(force) {
        if (!force && !partnerShouldPost()) return 0;
        if (cards.length === 0) return 0;

        var batchMin = Math.max(1, rhythm.batchMin || 1);
        var batchMax = Math.max(batchMin, rhythm.batchMax || 2);
        var count = randInt(batchMin, batchMax);
        var added = 0;
        for (var i = 0; i < count; i++) {
          var card = pick(cards);
          var post = {
            id: Date.now() + i,
            author: "partner",
            text: card.text,
            image: card.image || "",
            time: new Date(Date.now() - i * randInt(30000, 120000)).toISOString(),
            likes: [],
            comments: []
          };
          posts.push(post);
          added++;
        }
        setArr(KEYS.posts, posts);
        recordPartnerPost();
        return added;
      }

      /* ========== 用户发布 ========== */
      var postModal = document.getElementById("postModal");
      var postText = document.getElementById("postText");
      var postImgPreview = document.getElementById("postImgPreview");
      var postImgInput = document.getElementById("postImgInput");
      var addImgBtn = document.getElementById("addImgBtn");
      var clearImgBtn = document.getElementById("clearImgBtn");
      var tempPostImg = "";

      document.getElementById("openPost").addEventListener("click", function () {
        postModal.classList.add("show");
        postText.focus();
      });
      document.getElementById("closePost").addEventListener("click", function () {
        postModal.classList.remove("show");
      });
      postModal.addEventListener("click", function (e) {
        if (e.target === postModal) postModal.classList.remove("show");
      });

      addImgBtn.addEventListener("click", function () { postImgInput.click(); });
      postImgInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return showToast("请选择图片");
        var reader = new FileReader();
        reader.onload = function (ev) {
          compressImage(ev.target.result, 1200, 0.85, function (small) {
            tempPostImg = small;
            postImgPreview.src = small;
            postImgPreview.classList.add("show");
            addImgBtn.style.display = "none";
            clearImgBtn.style.display = "inline-flex";
          });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      });
      clearImgBtn.addEventListener("click", function () {
        tempPostImg = "";
        postImgPreview.src = "";
        postImgPreview.classList.remove("show");
        addImgBtn.style.display = "inline-flex";
        clearImgBtn.style.display = "none";
      });

      document.getElementById("submitPost").addEventListener("click", function () {
        var text = postText.value.trim();
        if (!text && !tempPostImg) return showToast("写点什么或配张图吧");
        var post = {
          id: Date.now(),
          author: "me",
          text: text || "分享了一张图片",
          image: tempPostImg,
          time: nowStr(),
          likes: [],
          comments: []
        };
        posts.push(post);
        setArr(KEYS.posts, posts);
        postText.value = "";
        clearImgBtn.click();
        postModal.classList.remove("show");
        renderAll();
        showToast("发布成功");

        /* 小火人互动埋点 */
        try { (function(){var K="mengjiao_spark";var D=JSON.parse(localStorage.getItem(K)||"{}");var T=new Date();var t=T.getFullYear()+"-"+String(T.getMonth()+1).padStart(2,"0")+"-"+String(T.getDate()).padStart(2,"0");D.daily=D.daily||{};D.daily[t]=D.daily[t]||{chat:0,cards:0,moments:0};if(D.daily[t].moments<2){D.daily[t].moments++;D.totalInteractions=(D.totalInteractions||0)+1;D.exp=(D.exp||0)+8;D.totalExp=(D.totalExp||0)+8;if(t!==D.lastActiveDate){if(D.lastActiveDate===yesterday())D.streak=(D.streak||0)+1;else D.streak=1;D.lastActiveDate=t;}else if(!D.streak)D.streak=1;var L=[{lv:1,need:50},{lv:2,need:150},{lv:3,need:350},{lv:4,need:700},{lv:5,need:1200},{lv:6,need:2000}];while(D.level<7&&D.exp>=L[D.level-1].need){D.exp-=L[D.level-1].need;D.level++;}localStorage.setItem(K,JSON.stringify(D));}function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
        })(); } catch (e) {}
      });

      /* ========== 图片压缩 ========== */
      function compressImage(dataUrl, maxSize, quality, cb) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement("canvas");
          var w = img.width, h = img.height;
          if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
          else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function () { cb(dataUrl); };
        img.src = dataUrl;
      }

      /* ========== 刷新 ========== */
      document.getElementById("refreshBtn").addEventListener("click", function () {
        var added = generatePartnerPosts(true);
        renderAll();
        showToast(added ? partnerName + " 更新了 " + added + " 条朋友圈" : "梦角还没有更新");
      });

      /* ========== 初始化 ========== */
      generatePartnerPosts(false);
      renderAll();
      document.getElementById("refreshBar").style.display = "flex";
    })();
  </script>
</body>
</html>
