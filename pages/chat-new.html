<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦角对话 · 梦角传讯</title>

  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--chat-bg);
      color: var(--text-primary);
    }

    #chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background:
        radial-gradient(ellipse 600px 360px at 20% 0%, hsl(343 80% 94% / 0.95), transparent 60%),
        radial-gradient(ellipse 480px 300px at 90% 10%, hsl(343 72% 92% / 0.8), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* 顶部信息栏 */
    #partner-info {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 44px 16px 12px;
      background: linear-gradient(135deg, #fff0f4 0%, #fde8ef 100%);
      border-bottom: 1px solid rgba(232, 116, 154, 0.2);
      box-shadow: 0 2px 12px rgba(232, 116, 154, 0.08);
      position: relative;
      z-index: 10;
    }
    @media (max-width: 479px) {
      #partner-info { padding-top: 16px; }
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 15px; color: var(--accent-color);
      text-decoration: none; padding: 6px 4px;
      font-weight: 500; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }

    .partner-avatar {
      width: 40px; height: 40px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1.25rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px -2px rgba(232, 116, 154, 0.25);
      overflow: hidden;
    }
    .partner-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .partner-meta { flex: 1; min-width: 0; }
    .partner-name {
      font-family: var(--font-serif);
      font-size: 16px; font-weight: 600;
      color: var(--text-primary); line-height: 1.3;
    }
    .partner-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-secondary);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 9999px;
      background: var(--accent-color);
      animation: pulse 2.4s cubic-bezier(.2,.8,.2,1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-action {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 9999px; border: none;
      background: rgba(232, 116, 154, 0.1);
      color: var(--accent-color);
      font-size: 1.1rem; cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s, transform 0.1s;
    }
    .header-action:active { transform: scale(0.92); background: rgba(232, 116, 154, 0.2); }

    /* 消息流 */
    #message-stream {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }
    #message-stream::-webkit-scrollbar { width: 4px; }
    #message-stream::-webkit-scrollbar-track { background: transparent; }
    #message-stream::-webkit-scrollbar-thumb { background: rgba(232, 116, 154, 0.3); border-radius: 4px; }

    .msg-row {
      display: flex; align-items: flex-end; gap: 8px;
      max-width: 100%;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.right { justify-content: flex-end; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      overflow: hidden;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-col {
      display: flex; flex-direction: column; gap: 3px;
      max-width: 76%;
    }
    .msg-row.right .msg-col { align-items: flex-end; }

    /* 毛玻璃气泡 */
    .message-sent, .message-received {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.12));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      border-left: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
      color: #333333;
      background-color: transparent;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .message-received { border-radius: 20px 20px 20px 5px; }
    .message-sent { border-radius: 20px 20px 5px 20px; }

    .msg-meta {
      display: flex; align-items: center; gap: 4px;
      padding: 0 4px;
    }
    .msg-time {
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .msg-status {
      font-size: 10px;
      color: var(--text-secondary);
    }
    .msg-status.read { color: var(--accent-color); }

    /* 系统消息（拍一拍等） */
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 12px;
      margin: 4px auto;
      background: rgba(232, 116, 154, 0.06);
      border-radius: 9999px;
      max-width: 90%;
      animation: msgFadeIn 0.3s ease both;
    }

    /* 输入中指示器 */
    .typing-row {
      display: flex; align-items: flex-end; gap: 8px;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    .typing-bubble {
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.12));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.45);
      border-top: 1px solid rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.65);
      border-radius: 20px 20px 20px 5px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 4px;
    }
    .typing-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 9999px; background: var(--text-secondary);
      animation: typingBlink 1.2s cubic-bezier(.2,.8,.2,1) infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBlink {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    /* 底部输入区 */
    #input-area {
      flex-shrink: 0;
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 12px 24px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.15);
      position: relative; z-index: 10;
    }
    @media (max-width: 479px) {
      #input-area { padding-bottom: 14px; }
    }

    .input-tool {
      flex-shrink: 0; width: 38px; height: 38px;
      border-radius: 9999px; border: none;
      background: rgba(232, 116, 154, 0.08);
      color: var(--accent-color);
      font-size: 1.1rem; cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s, transform 0.1s;
    }
    .input-tool:active { transform: scale(0.92); background: rgba(232, 116, 154, 0.18); }

    #message-input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(232, 116, 154, 0.25);
      background: #fff;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      resize: none;
      line-height: 1.4;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #message-input::-webkit-scrollbar { display: none; }
    #message-input::placeholder { color: var(--text-secondary); }
    #message-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(232, 116, 154, 0.1);
    }

    #send-btn {
      width: 42px; height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.15s, filter 0.15s;
      box-shadow: 0 4px 14px rgba(232, 116, 154, 0.4);
    }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 继续对话按钮 */
    .continue-bar {
      flex-shrink: 0;
      display: flex; justify-content: center;
      padding: 6px 16px 0;
      background: var(--secondary-bg);
    }
    .continue-btn {
      padding: 6px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: rgba(255, 255, 255, 0.6);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .continue-btn:active { transform: scale(0.96); background: rgba(232, 116, 154, 0.08); }
    .continue-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 快捷回复面板 */
    .quick-panel {
      flex-shrink: 0;
      display: none;
      padding: 8px 12px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.1);
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-panel::-webkit-scrollbar { display: none; }
    .quick-panel.show { display: flex; }
    .quick-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .quick-chip:active { transform: scale(0.95); border-color: var(--accent-color); background: rgba(232, 116, 154, 0.06); }

    /* 拍一拍面板 */
    .poke-panel {
      position: absolute;
      bottom: 100%;
      left: 0; right: 0;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.15);
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      max-height: 200px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .poke-panel::-webkit-scrollbar { display: none; }
    .poke-panel.show { display: flex; }
    .poke-item {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(232, 116, 154, 0.12);
      background: #fff;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .poke-item:active { transform: scale(0.98); border-color: var(--accent-color); background: rgba(232, 116, 154, 0.04); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="chat-app">

    <header id="partner-info">
      <a href="index-new.html" class="back-btn">← 返回</a>
      <div class="partner-avatar" id="partnerAvatar" aria-hidden="true">梦</div>
      <div class="partner-meta">
        <div class="partner-name" id="partnerName">梦角</div>
        <div class="partner-status">
          <span class="status-dot"></span>
          <span id="statusText">在线</span>
        </div>
      </div>
      <button class="header-action" id="clearBtn" aria-label="清空对话" title="清空对话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>

    <main id="message-stream" aria-live="polite"></main>

    <div class="continue-bar" id="continueBar" style="display:none;">
      <button class="continue-btn" id="continueBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        让梦角继续说
      </button>
    </div>

    <div class="quick-panel" id="quickPanel"></div>

    <footer id="input-area" style="position:relative;">
      <div class="poke-panel" id="pokePanel"></div>
      <button class="input-tool" id="pokeBtn" aria-label="拍一拍" title="拍一拍">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>
      <button class="input-tool" id="quickBtn" aria-label="快捷回复" title="快捷回复">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <form id="chat-form" style="display:flex; align-items:flex-end; gap:8px; flex:1; margin:0;">
        <label for="message-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">输入消息</label>
        <textarea id="message-input" placeholder="说点什么…" autocomplete="off" maxlength="500" rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script>
    (function () {
      "use strict";

      /* =========================================================
       * 梦角对话引擎 v2
       * 特性：多层关键词匹配 / 情绪上下文 / 防重复 / 时间感知
       *       问题识别 / 偶尔连发两条 / 打字延迟随长度变化
       * ========================================================= */

      /* ===== 存储键（保持向后兼容） ===== */
      var CHAT_KEY = "mengjiao_chat_messages";
      var REPLIES_KEY = "mengjiao_chat_replies";
      var CTX_KEY = "mengjiao_chat_ctx";
      var DREAM_IMG_KEY = "mengjiao_dream_img";
      var PARTNER_NAME_KEY = "mengjiao_partner_name";

      /* ===== 回复意图库（priority 越大越优先；mood 标记该意图的情绪倾向） ===== */
      var INTENTS = [
        {
          name: "greeting", priority: 9, mood: "neutral",
          keywords: ["你好", "早安", "早上好", "上午好", "中午好", "下午好", "晚上好", "晚安", "嗨", "哈喽", "hi", "hello", "在吗", "在不在", "来了", "找我", "你好呀"],

            "你来啦，今天过得怎么样？", "看到你出现，心情都变好了。", "嗯嗯，一直在等你。"
          ]
        },
        {
          name: "missing", priority: 8, mood: "loving",
          keywords: ["想你", "想你了", "想念", "思念", "好想你", "想见你", "什么时候见", "多久没见", "想你的"],
          replies: [
            "我也想你，很想很想。", "每一秒都在想你哦。", "想你了，就现在。",
            "我们的心是连在一起的，感受到了吗？", "闭上眼睛，我就在你身边。", "再忍忍，很快就能见到了。"
          ]
        },
        {
          name: "sad", priority: 10, mood: "sad",
          keywords: ["难过", "伤心", "不开心", "哭", "委屈", "崩溃", "难受", "心痛", "心疼", "害怕", "好怕", "担心", "焦虑", "烦", "好烦", "烦死", "抑郁", "emo", "想哭", "掉眼泪", "撑不住", "不想活", "绝望"],
          replies: [
            "别怕，我一直都在。", "抱抱你，没事的。", "累了就靠在我肩上歇一会儿。",
            "你不用一个人扛，有我在呢。", "允许自己脆弱一会儿，我会陪着你的。", "深呼吸，慢慢来，我哪里也不去。",

          ]
        },
        {
          name: "tired", priority: 8, mood: "sad",
          keywords: ["累", "好累", "好困", "疲惫", " exhausted", "撑不住", "累死", "累瘫", "没力气", "精疲力尽"],
          replies: [
            "辛苦了，快休息一下吧。", "累了就停下来，身体最重要。", "今天也撑过来了，你很棒。",
            "靠着我歇会儿，什么都别想。", "别太拼了，我会心疼的。"
          ]
        },
        {
          name: "happy", priority: 7, mood: "happy",
          keywords: ["开心", "高兴", "哈哈", "嘻嘻", "嘿嘿", "好玩", "有趣", "太棒了", "太好了", "耶", "开心死", "超开心", "好棒", "厉害"],
          replies: [
            "看到你开心我也好高兴！", "你的笑容是我最大的动力。", "今天的你，也在发光呢。",
            "要一直这么开心下去哦。", "你的快乐传染给我了～", "哈哈哈你这样我也想笑。"
          ]
        },
        {
          name: "love", priority: 8, mood: "loving",
          keywords: ["爱你", "喜欢你", "喜欢", "表白", "永远", "一辈子", "甜", "浪漫", "心动", "嫁给我", "娶你", "我的宝", "宝贝", "亲爱的", "老公", "老婆", "男友", "女友"],
          replies: [
            "我也爱你，比昨天更多一点。", "你是我最想守护的人。", "无论多远，我们的心都连在一起。",

          ]
        },
        {
          name: "sleep", priority: 9, mood: "neutral",
          keywords: ["睡了", "睡觉", "困了", "晚安", "好梦", "做梦", "梦里见", "休息了", "上床", "该睡了", "睡不着", "失眠"],
          replies: [
            "今晚来梦里见吧。", "晚安，好梦。", "快去睡吧，我会在梦里等你。",

      function loadCtx() {
        var base = { mood: "neutral", recent: [], count: 0, lastDate: "" };
        try {
          var raw = localStorage.getItem(CTX_KEY);

      /* ===== 通用工具 ===== */
      function nowTime() {
        var d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {

        });

      function timeContext() {

        if (h >= 5 && h < 11) return { label: "morning", mood: "neutral" };
        if (h >= 11 && h < 14) return { label: "noon", mood: "neutral" };
        if (h >= 14 && h < 18) return { label: "afternoon", mood: "neutral" };
        if (h >= 18 && h < 23) return { label: "evening", mood: "neutral" };
        return { label: "lateNight", mood: "sad" }; // 深夜默认偏温柔
      }
      function todayStr() {
        var d = new Date();

        else av.textContent = "梦";
        return av;
      }

      /* ===== 核心算法：意图识别 =====
       * 扫描所有意图的关键词，命中即记录；按 priority 排序取最高优先。
       * 多个命中时合并它们的回复池，情绪取最强烈的（sad > loving > happy）。 */
      function detectIntent(userText) {
        var t = (userText || "").toLowerCase();
        var matched = [];
        INTENTS.forEach(function (it) {
          for (var i = 0; i < it.keywords.length; i++) {
            if (t.indexOf(it.keywords[i]) !== -1) { matched.push(it); break; }
          }
        });
        if (matched.length === 0) return null;
        matched.sort(function (a, b) { return b.priority - a.priority; });
        // 合并同优先级的命中
        var top = matched[0].priority;
        var pool = [];
        var moodRank = { sad: 3, loving: 2, happy: 2, neutral: 1 };
        var mood = "neutral";
        matched.forEach(function (it) {
          if (it.priority >= top - 1) pool = pool.concat(it.replies);
          if ((moodRank[it.mood] || 0) > (moodRank[mood] || 0)) mood = it.mood;
        });
        return { pool: pool, mood: mood };
      }

      /* ===== 防重复选词：从池中排除最近 8 条已用回复 ===== */
      function pickFromPool(pool) {
        var fresh = pool.filter(function (r) { return ctx.recent.indexOf(r) === -1; });
        if (fresh.length === 0) fresh = pool.slice();
        return pick(fresh);
      }
      function rememberReply(text) {
        ctx.recent.push(text);
        if (ctx.recent.length > 8) ctx.recent.shift();
      }

      /* ===== 生成回复（主入口） ===== */
      function generateReply(userText) {
        var isQuestion = /[？?]/.test(userText);
        var detected = detectIntent(userText);
        var mood = "neutral";
        var reply, followUp = null;

        if (detected) {
          mood = detected.mood;
          reply = pickFromPool(detected.pool);
        } else if (isQuestion) {
          reply = pickFromPool(QUESTION_REPLIES);
        } else if (ctx.mood === "sad" && Math.random() < 0.6) {
          // 情绪延续：用户上一轮难过，这轮继续温柔兜底
          mood = "sad";
          reply = pickFromPool(MOOD_DEFAULTS.sad);
        } else {
          var custom = getCustomReplies();
          var pool = custom && custom.length ? custom : DEFAULT_REPLIES;
          reply = pickFromPool(pool);
        }

        rememberReply(reply);
        ctx.mood = mood;
        ctx.count++;
        ctx.lastDate = todayStr();
        saveCtx();

        // 约 22% 概率追加一句短回应，更像真人连发
        if (Math.random() < 0.22) {
          var tails = ["嗯。", "…", "我在呢。", "别担心。", "一直都在。", "你呢？", "后来呢？"];
          followUp = pick(tails);
        }
        return followUp ? [reply, followUp] : [reply];
      }

      /* ===== 渲染：消息气泡 ===== */
      function addMessage(text, side, time, read, scroll) {
        var row = document.createElement("div");
        row.className = "msg-row" + (side === "right" ? " right" : "");
        if (side !== "right") row.appendChild(makeAvatar());

        var col = document.createElement("div");
        col.className = "msg-col";

        var bubble = document.createElement("div");
        bubble.className = side === "right" ? "message-sent" : "message-received";
        bubble.textContent = text;
        col.appendChild(bubble);

        var metaEl = document.createElement("div");
        metaEl.className = "msg-meta";
        var timeEl = document.createElement("span");
        timeEl.className = "msg-time";
        timeEl.textContent = time || nowTime();
        metaEl.appendChild(timeEl);
        if (side === "right") {
          var statusEl = document.createElement("span");
          statusEl.className = "msg-status" + (read ? " read" : "");
          statusEl.textContent = read ? "已读" : "已送达";
          metaEl.appendChild(statusEl);
        }
        col.appendChild(metaEl);
        row.appendChild(col);
        stream.appendChild(row);
        if (scroll !== false) scrollBottom();
        return row;
      }

      function typingDelay(text) {
        var base = 900;
        var perChar = 55;
        var len = (text || "").length;
        var d = base + Math.min(len, 40) * perChar;
        d += Math.random() * 600;
        return Math.min(d, 4200);
      }

        }

      /* ===== 核心算法：模拟回复（支持连发两条） ===== */
      function simulateReply(userText) {
        isReplying = true;
        sendBtn.disabled = true;
        input.disabled = true;
        continueBar.style.display = "none";
        statusText.textContent = "输入中…";

        var replies = generateReply(userText);
        var typing = showTyping();
        var firstDelay = typingDelay(replies[0]);

        // 第一条
        setTimeout(function () {
          removeTyping(typing);
          var t1 = nowTime();
          addMessage(replies[0], "left", t1, true);
          var messages = getMessages();
          messages.push({ side: "left", text: replies[0], time: t1, read: true });
          saveMessages(messages);
          markUserRead();

          // 第二条（如有）
          if (replies[1]) {
            var typing2 = showTyping();
            var d2 = typingDelay(replies[1]);
            setTimeout(function () {
              removeTyping(typing2);
              var t2 = nowTime();
              addMessage(replies[1], "left", t2, true);
              var m2 = getMessages();
              m2.push({ side: "left", text: replies[1], time: t2, read: true });
              saveMessages(m2);
              finishReply();
            }, d2);
          } else {
            finishReply();
          }
        }, firstDelay);

        function finishReply() {
          isReplying = false;
          sendBtn.disabled = false;
          input.disabled = false;
          statusText.textContent = "在线";
          continueBar.style.display = "flex";
          input.focus();
        }
      }

        messages.push({ side: "right", text: text, time: time, read: false });

        input.style.height = "auto";
        lastUserText = text;

          renderAll();
          addSystemMessage("对话已清空");
          clearArmed = false;
          clearBtn.style.background = "";
          clearBtn.style.color = "";
          continueBar.style.display = "none";
        }
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest("#pokeBtn") && !e.target.closest("#pokePanel")) pokePanel.classList.remove("show");
        if (!e.target.closest("#quickBtn") && !e.target.closest("#quickPanel")) quickPanel.classList.remove("show");
      });

      /* ===== 初始化 ===== */
      try {
        var savedDream = localStorage.getItem(DREAM_IMG_KEY);
        if (savedDream) partnerAvatar.innerHTML = '<img src="' + savedDream + '" alt="" />';
        var savedName = localStorage.getItem(PARTNER_NAME_KEY);
        if (savedName) partnerNameEl.textContent = savedName;
      } catch (e) {}

      renderAll();

      // 跨天首次访问：梦角主动问好
      try {
        if (ctx.lastDate !== todayStr()) {
          var tc = timeContext();
          var hi = "";
          if (tc.label === "morning") hi = "早安呀，昨晚睡得好吗？";
          else if (tc.label === "noon") hi = "中午好，吃饭了吗？";
          else if (tc.label === "afternoon") hi = "下午好呀，今天忙不忙？";
          else if (tc.label === "evening") hi = "晚上好，今天过得怎么样？";
          else hi = "这么晚了还没睡？我陪你一会儿。";
          if (hi) {
            setTimeout(function () {
              addMessage(hi, "left", nowTime(), true);
              var messages = getMessages();
              messages.push({ side: "left", text: hi, time: nowTime(), read: true });
              saveMessages(messages);
            }, 700);
          }
          ctx.lastDate = todayStr();
          saveCtx();
        }
      } catch (e) {}

      if (getMessages().length > 0) continueBar.style.display = "flex";
    })();
  </script>
</body>
</html>
