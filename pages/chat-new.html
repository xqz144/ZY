<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦角对话 · 梦角传讯</title>

  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--chat-bg);
      color: var(--text-primary);
    }

    #chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background:
        radial-gradient(ellipse 600px 360px at 20% 0%, hsl(343 80% 94% / 0.95), transparent 60%),
        radial-gradient(ellipse 480px 300px at 90% 10%, hsl(343 72% 92% / 0.8), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* 顶部信息栏 */
    #partner-info {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 44px 16px 12px;
      background: linear-gradient(135deg, #fff0f4 0%, #fde8ef 100%);
      border-bottom: 1px solid rgba(232, 116, 154, 0.2);
      box-shadow: 0 2px 12px rgba(232, 116, 154, 0.08);
      position: relative;
      z-index: 10;
    }
    @media (max-width: 479px) {
      #partner-info { padding-top: 16px; }
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 15px; color: var(--accent-color);
      text-decoration: none; padding: 6px 4px;
      font-weight: 500; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }

    .partner-avatar {
      width: 40px; height: 40px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1.25rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px -2px rgba(232, 116, 154, 0.25);
      overflow: hidden;
    }
    .partner-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .partner-meta { flex: 1; min-width: 0; }
    .partner-name {
      font-family: var(--font-serif);
      font-size: 16px; font-weight: 600;
      color: var(--text-primary); line-height: 1.3;
    }
    .partner-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-secondary);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 9999px;
      background: var(--accent-color);
      animation: pulse 2.4s cubic-bezier(.2,.8,.2,1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-action {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 9999px; border: none;
      background: rgba(232, 116, 154, 0.1);
      color: var(--accent-color);
      font-size: 1.1rem; cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s, transform 0.1s;
    }
    .header-action:active { transform: scale(0.92); background: rgba(232, 116, 154, 0.2); }

    /* 消息流 */
    #message-stream {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }
    #message-stream::-webkit-scrollbar { width: 4px; }
    #message-stream::-webkit-scrollbar-track { background: transparent; }
    #message-stream::-webkit-scrollbar-thumb { background: rgba(232, 116, 154, 0.3); border-radius: 4px; }

    /* 空状态 */
    .empty-state {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px;
      pointer-events: none; z-index: 1;
    }
    .empty-state-icon { position: relative; margin-bottom: 20px; }
    .empty-state-icon .heart { font-size: 52px; opacity: 0.55; color: var(--accent-color); }
    .empty-state-icon .chat-bubble {
      position: absolute; bottom: -6px; right: -10px;
      font-size: 26px; opacity: 0.65; color: var(--accent-color);
    }
    .empty-state-title {
      font-size: 15px; font-weight: 600;
      color: var(--accent-color); opacity: 0.9;
      letter-spacing: 1px;
    }
    .empty-state-hint {
      font-size: 12px; margin-top: 8px;
      opacity: 0.65; letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .msg-row {
      display: flex; align-items: flex-end; gap: 8px;
      max-width: 100%;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.right { justify-content: flex-end; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      overflow: hidden;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-col {
      display: flex; flex-direction: column; gap: 3px;
      max-width: 76%;
    }
    .msg-row.right .msg-col { align-items: flex-end; }

    /* 引用回复预览 */
    .reply-quote {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(232, 116, 154, 0.06);
      border-left: 2px solid rgba(232, 116, 154, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 毛玻璃气泡 */
    .message-sent, .message-received {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.12));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      border-left: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
      color: #333333;
      background-color: transparent;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .message-received { border-radius: 20px 20px 20px 5px; }
    .message-sent { border-radius: 20px 20px 5px 20px; }

    /* 纯表情/颜文字小气泡 */
    .message-emoji {
      font-size: 22px;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.12));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      line-height: 1.4;
    }

    .msg-meta {
      display: flex; align-items: center; gap: 4px;
      padding: 0 4px;
    }
    .msg-time {
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .msg-status {
      font-size: 10px;
      color: var(--text-secondary);
    }
    .msg-status.read { color: var(--accent-color); }

    /* 系统消息（拍一拍等） */
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 12px;
      margin: 4px auto;
      background: rgba(232, 116, 154, 0.06);
      border-radius: 9999px;
      max-width: 90%;
      animation: msgFadeIn 0.3s ease both;
    }

    /* 输入中指示器 */
    .typing-row {
      display: flex; align-items: flex-end; gap: 8px;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    .typing-bubble {
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.12));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.45);
      border-top: 1px solid rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.65);
      border-radius: 20px 20px 20px 5px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 4px;
    }
    .typing-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 9999px; background: var(--text-secondary);
      animation: typingBlink 1.2s cubic-bezier(.2,.8,.2,1) infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBlink {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    /* 底部输入区 */
    #input-area {
      flex-shrink: 0;
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 12px 24px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.15);
      position: relative; z-index: 10;
    }
    @media (max-width: 479px) {
      #input-area { padding-bottom: 14px; }
    }

    .input-tool {
      flex-shrink: 0; width: 38px; height: 38px;
      border-radius: 9999px; border: none;
      background: rgba(232, 116, 154, 0.08);
      color: var(--accent-color);
      font-size: 1.1rem; cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s, transform 0.1s;
    }
    .input-tool:active { transform: scale(0.92); background: rgba(232, 116, 154, 0.18); }

    #message-input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(232, 116, 154, 0.25);
      background: #fff;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      resize: none;
      line-height: 1.4;
      overflow-y: auto;
      scrollbar-width: none;
    }
    #message-input::-webkit-scrollbar { display: none; }
    #message-input::placeholder { color: var(--text-secondary); }
    #message-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(232, 116, 154, 0.1);
    }

    #send-btn {
      width: 42px; height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.15s, filter 0.15s;
      box-shadow: 0 4px 14px rgba(232, 116, 154, 0.4);
    }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 继续对话按钮 */
    .continue-bar {
      flex-shrink: 0;
      display: flex; justify-content: center;
      padding: 6px 16px 0;
      background: var(--secondary-bg);
    }
    .continue-btn {
      padding: 6px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: rgba(255, 255, 255, 0.6);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .continue-btn:active { transform: scale(0.96); background: rgba(232, 116, 154, 0.08); }
    .continue-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 快捷回复面板 */
    .quick-panel {
      flex-shrink: 0;
      display: none;
      padding: 8px 12px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.1);
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-panel::-webkit-scrollbar { display: none; }
    .quick-panel.show { display: flex; }
    .quick-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(232, 116, 154, 0.2);
      background: #fff;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .quick-chip:active { transform: scale(0.95); border-color: var(--accent-color); background: rgba(232, 116, 154, 0.06); }

    /* 拍一拍面板 */
    .poke-panel {
      position: absolute;
      bottom: 100%;
      left: 0; right: 0;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.15);
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      max-height: 200px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .poke-panel::-webkit-scrollbar { display: none; }
    .poke-panel.show { display: flex; }
    .poke-item {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(232, 116, 154, 0.12);
      background: #fff;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .poke-item:active { transform: scale(0.98); border-color: var(--accent-color); background: rgba(232, 116, 154, 0.04); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ===== 拖拽小精灵 ===== */
    #spark-companion {
      position: absolute;
      width: 64px;
      height: 72px;
      z-index: 20;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.2s ease;
      pointer-events: auto;
      filter: drop-shadow(0 4px 8px rgba(232,116,154,0.2));
    }
    #spark-companion:active { cursor: grabbing; transform: scale(1.08); }
    #spark-companion svg { width: 100%; height: 100%; pointer-events: none; }
    #spark-companion .companion-hint {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--text-secondary);
      white-space: nowrap;
      opacity: 0.5;
      pointer-events: none;
    }
    #spark-companion.dragging { transition: none; z-index: 30; }
    @keyframes companionBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    #spark-companion:not(.dragging) { animation: companionBob 2.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      #spark-companion { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="chat-app">
    <div id="spark-companion" aria-label="小精灵拖拽"></div>

    <header id="partner-info">
      <a href="index-new.html" class="back-btn">← 返回</a>
      <div class="partner-avatar" id="partnerAvatar" aria-hidden="true">梦</div>
      <div class="partner-meta">
        <div class="partner-name" id="partnerName">梦角</div>
        <div class="partner-status">
          <span class="status-dot"></span>
          <span id="statusText">在线</span>
        </div>
      </div>
      <button class="header-action" id="clearBtn" aria-label="清空对话" title="清空对话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>

    <main id="message-stream" aria-live="polite" style="position:relative;">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">
          <span class="heart">❤</span>
          <span class="chat-bubble">💬</span>
        </div>
        <p class="empty-state-title">✦ 我们的故事，始于此刻 ✦</p>
        <p class="empty-state-hint">说点什么，让对话开始吧</p>
      </div>
    </main>

    <div class="continue-bar" id="continueBar" style="display:none;">
      <button class="continue-btn" id="continueBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        让梦角继续说
      </button>
    </div>

    <div class="quick-panel" id="quickPanel"></div>

    <footer id="input-area" style="position:relative;">
      <div class="poke-panel" id="pokePanel"></div>
      <button class="input-tool" id="pokeBtn" aria-label="拍一拍" title="拍一拍">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>
      <button class="input-tool" id="quickBtn" aria-label="快捷回复" title="快捷回复">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <form id="chat-form" style="display:flex; align-items:flex-end; gap:8px; flex:1; margin:0;">
        <label for="message-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">输入消息</label>
        <textarea id="message-input" placeholder="说点什么…" autocomplete="off" maxlength="500" rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script>
    (function () {
      "use strict";

      /* =========================================================
       * 梦角对话引擎 v3 — 纯随机（参考 ZY 布局与功能）
       * 无关键词匹配，回复从池中随机抽取
       * 随机条数 / emoji混搭 / 颜文字混搭 / 对方反拍 / 引用回复
       * ========================================================= */

      /* ===== 存储键（向后兼容） ===== */
      var CHAT_KEY = "mengjiao_chat_messages";
      var REPLIES_KEY = "mengjiao_chat_replies";
      var VISIT_KEY = "mengjiao_chat_visit";
      var DREAM_IMG_KEY = "mengjiao_dream_img";
      var PARTNER_NAME_KEY = "mengjiao_partner_name";

      /* ===== 回复延迟（更快更流畅） ===== */
      var REPLY_DELAY_MIN = 700;
      var REPLY_DELAY_MAX = 2000;

      /* ===== 默认回复池（纯随机，无分类无关键词） ===== */
      var DEFAULT_REPLIES = [
        "你来了呀，我等你好一会儿了。",
        "嗯，我在呢。",
        "正好在想你，你就来了。",
        "今天过得怎么样？",
        "看到你出现，心情都变好了。",
        "我也想你，很想很想。",
        "每一秒都在想你哦。",
        "想你了，就现在。",
        "我们的心是连在一起的，感受到了吗？",
        "闭上眼睛，我就在你身边。",
        "别担心，我一直都在。",
        "抱抱你，没事的。",
        "累了就靠在我肩上歇一会儿。",
        "你不用一个人扛，有我在呢。",
        "允许自己脆弱一会儿，我会陪着你的。",
        "深呼吸，慢慢来，我哪里也不去。",

          var hi = timeGreeting();
          setTimeout(function () {
            addMessage({ text: hi, side: "left", time: nowTime(), read: true });
            var messages = getMessages();
            messages.push({ side: "left", text: hi, time: nowTime(), read: true });
            saveMessages(messages);
            continueBar.style.display = "flex";
          }, 800);
          try { localStorage.setItem(VISIT_KEY, today); } catch (e) {}
        }
      } catch (e) {}

      if (getMessages().length > 0) continueBar.style.display = "flex";

      /* ===== 拖拽小精灵 ===== */
      (function initCompanion() {
        var companion = document.getElementById("spark-companion");
        if (!companion) return;
        var SPARK_KEY = "mengjiao_spark";
        var POS_KEY = "mengjiao_companion_pos";

        function lighten(hex, amt) {
          var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
          r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
          return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
        }
        function darken(hex, amt) {
          var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
          r = Math.max(0, r-amt); g = Math.max(0, g-amt); b = Math.max(0, b-amt);
          return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
        }

        var HAIR_MAP = { purple:"#5a4a7a", pink:"#e8749a", coral:"#ff8a65", mint:"#7fd5b3", sky:"#7ec8e3", lavender:"#c5a3e3", rose:"#e8749a", honey:"#e8a83a" };
        var OUTFIT_MAP = { white:"#ede8e0", maroon:"#7a3a4a", navy:"#3a4a6a", pink:"#e8749a", mint:"#7fd5b3", lavender:"#c5a3e3" };
        var EAR_MAP = { brown:{c:"#8b6940",i:"#f4a0b0"}, dark:{c:"#4a4a4a",i:"#f4a0b0"}, cream:{c:"#e8d5b8",i:"#f4a0b0"} };

        function renderCompanionSVG(av) {
          /* 使用MMD模型渲染的角色PNG */
          return '<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;filter:brightness(1.12) saturate(1.15) contrast(1.05)">' +
            '<image href="character.png" x="0" y="0" width="512" height="512"/>' +
            '</svg>';
          var hair = HAIR_MAP[av.hairColor] || "#5a4a7a";
          var outfit = OUTFIT_MAP[av.outfitColor] || "#ede8e0";
          var earDef = av.earColor === "match" ? {c:hair, i:lighten(hair,30)} : (EAR_MAP[av.earColor] || EAR_MAP.brown);
          var skin = "#ffe4d6";
          var W = 13;
          var vest = "#a0a0ac";
          var vestDark = "#787880";
          return '<svg viewBox="-10 -10 220 220" xmlns="http://www.w3.org/2000/svg">' +
            '<defs>' +
              '<radialGradient id="cEyeGradL" cx="50%" cy="30%">' +
                '<stop offset="0%" stop-color="#ff9ec4"/>' +
                '<stop offset="50%" stop-color="#c4a0dc"/>' +
                '<stop offset="100%" stop-color="#7ec8e3"/>' +
              '</radialGradient>' +
              '<radialGradient id="cEyeGradR" cx="50%" cy="30%">' +
                '<stop offset="0%" stop-color="#ff9ec4"/>' +
                '<stop offset="50%" stop-color="#c4a0dc"/>' +
                '<stop offset="100%" stop-color="#7ec8e3"/>' +
              '</radialGradient>' +
              '<linearGradient id="cJacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">' +
                '<stop offset="0%" stop-color="' + lighten(outfit,8) + '"/>' +
                '<stop offset="100%" stop-color="' + darken(outfit,6) + '"/>' +
              '</linearGradient>' +
            '</defs>' +
            /* Shadow */
            '<ellipse cx="100" cy="205" rx="30" ry="4" fill="#000" opacity="0.08"/>' +
            /* Suit jacket - 西装外套 */
            '<path d="M 72 124 Q 72 118 100 118 Q 128 118 128 124 L 132 168 Q 132 176 100 176 Q 68 176 68 168 Z" fill="url(#cJacketGrad)"/>' +
            /* Jacket lapels - 翻领 */
            '<path d="M 82 124 Q 80 134 84 148 L 92 140 L 92 124 Z" fill="' + darken(outfit,8) + '"/>' +
            '<path d="M 118 124 Q 120 134 116 148 L 108 140 L 108 124 Z" fill="' + darken(outfit,8) + '"/>' +
            /* Vest - 灰色马甲 */
            '<path d="M 88 122 L 86 170 Q 86 174 100 174 Q 114 174 114 170 L 112 122 Z" fill="' + vest + '"/>' +
            /* Shirt collar */
            '<path d="M 90 120 L 100 134 L 110 120" fill="' + skin + '" stroke="' + darken(outfit,12) + '" stroke-width="1.5"/>' +
            /* Choker */
            '<rect x="90" y="116" width="20" height="4" rx="2" fill="' + darken(outfit,12) + '" opacity="0.4"/>' +
            /* Vest buttons */
            '<circle cx="100" cy="135" r="1.5" fill="' + vestDark + '"/>' +
            '<circle cx="100" cy="145" r="1.5" fill="' + vestDark + '"/>' +
            '<circle cx="100" cy="155" r="1.5" fill="' + vestDark + '"/>' +
            /* Neck filler */
            '<rect x="92" y="114" width="16" height="8" rx="4" fill="' + skin + '"/>' +
            /* Lower body */
            '<rect x="78" y="160" width="44" height="16" rx="6" fill="' + skin + '"/>' +
            /* Arms */
            '<path d="M 76 122 Q 58 140 45 159" stroke="' + outfit + '" stroke-width="' + W + '" fill="none" stroke-linecap="round"/>' +
            '<circle cx="45" cy="159" r="6" fill="' + skin + '"/>' +
            '<path d="M 124 122 Q 142 140 155 159" stroke="' + outfit + '" stroke-width="' + W + '" fill="none" stroke-linecap="round"/>' +
            '<circle cx="155" cy="159" r="6" fill="' + skin + '"/>' +
            /* Legs */
            '<path d="M 85 176 Q 84 185 84 190" stroke="' + skin + '" stroke-width="7" fill="none" stroke-linecap="round"/>' +
            '<path d="M 115 176 Q 116 185 116 190" stroke="' + skin + '" stroke-width="7" fill="none" stroke-linecap="round"/>' +
            '<ellipse cx="82" cy="191" rx="10" ry="6" fill="#8b5a5a"/>' +
            '<ellipse cx="118" cy="191" rx="10" ry="6" fill="#8b5a5a"/>' +
            '<path d="M 74 191 Q 82 195 90 191" stroke="#6a4040" stroke-width="1.2" fill="none" opacity="0.4"/>' +
            '<path d="M 110 191 Q 118 195 126 191" stroke="#6a4040" stroke-width="1.2" fill="none" opacity="0.4"/>' +
            /* Hair crown - 蓬松发冠 */
            '<path d="M 38 96 Q 26 64 36 38 Q 50 12 82 18 Q 96 6 118 12 Q 150 14 162 40 Q 172 64 166 96 Q 162 110 154 104 Q 144 116 132 106 Q 124 118 108 108 Q 100 112 92 108 Q 80 118 70 106 Q 58 116 46 104 Q 40 110 38 96 Z" fill="' + hair + '"/>' +
            '<ellipse cx="100" cy="52" rx="52" ry="36" fill="' + darken(hair,22) + '" opacity="0.18"/>' +
            /* Head */
            '<circle cx="100" cy="82" r="40" fill="' + skin + '"/>' +
            /* Ahoge 呆毛 - 带体积感 */
            '<path d="M 98 25 Q 82 14 88 -2 Q 94 -8 102 2" stroke="' + darken(hair,18) + '" stroke-width="5.5" fill="none" stroke-linecap="round"/>' +
            '<path d="M 98 25 Q 82 14 88 -2 Q 94 -8 102 2" stroke="' + hair + '" stroke-width="4" fill="none" stroke-linecap="round"/>' +
            '<path d="M 98 25 Q 82 14 88 -2 Q 94 -8 102 2" stroke="' + lighten(hair,36) + '" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>' +
            /* Bangs - 中分刘海 */
            '<path d="M 100 29 Q 93 35 89 49 Q 90 57 100 56 Q 110 57 111 49 Q 107 35 100 29 Z" fill="' + hair + '"/>' +
            '<path d="M 100 31 Q 95 37 93 46 Q 96 50 100 48 Q 104 50 107 46 Q 105 37 100 31 Z" fill="' + hair + '" opacity="0.96"/>' +
            '<path d="M 100 34 Q 97 39 96 44 Q 98 46 100 45 Q 102 46 104 44 Q 103 39 100 34 Z" fill="' + hair + '" opacity="0.88"/>' +
            '<path d="M 100 30 Q 84 30 69 39 Q 55 48 54 70 Q 55 82 62 90 Q 61 75 69 64 Q 79 51 94 49 Q 97 41 100 30 Z" fill="' + hair + '"/>' +
            '<path d="M 62 90 Q 56 71 65 55 Q 76 43 90 45 Q 84 58 78 73 Q 71 86 62 90 Z" fill="' + hair + '"/>' +
            '<path d="M 55 84 Q 51 66 60 51 Q 69 41 79 45 Q 73 59 65 74 Q 57 83 55 84 Z" fill="' + hair + '"/>' +
            '<path d="M 100 30 Q 116 30 131 39 Q 145 48 146 70 Q 145 82 138 90 Q 139 75 131 64 Q 121 51 106 49 Q 103 41 100 30 Z" fill="' + hair + '"/>' +
            '<path d="M 138 90 Q 144 71 135 55 Q 124 43 110 45 Q 116 58 122 73 Q 129 86 138 90 Z" fill="' + hair + '"/>' +
            '<path d="M 145 84 Q 149 66 140 51 Q 131 41 121 45 Q 127 59 135 74 Q 143 83 145 84 Z" fill="' + hair + '"/>' +
            '<path d="M 100 30 Q 99 38 100 46" stroke="' + darken(hair,24) + '" stroke-width="1" fill="none" opacity="0.14" stroke-linecap="round"/>' +
            /* Side hair - 蓬松鬓发 */
            '<path d="M 40 78 Q 30 94 32 110 Q 46 106 54 92 Z" fill="' + hair + '"/>' +
            '<path d="M 160 78 Q 170 94 168 110 Q 154 106 146 92 Z" fill="' + hair + '"/>' +
            /* Blush */
            '<ellipse cx="68" cy="94" rx="8" ry="5" fill="#ff8aa0" opacity="0.35"/>' +
            '<ellipse cx="132" cy="94" rx="8" ry="5" fill="#ff8aa0" opacity="0.35"/>' +
            /* Eyes - 粉蓝渐变大眼睛 */
            '<ellipse cx="82" cy="84" rx="8" ry="10" fill="#3a2535"/>' +
            '<ellipse cx="82" cy="84" rx="7" ry="9" fill="url(#cEyeGradL)"/>' +
            '<ellipse cx="82" cy="87" rx="5" ry="5" fill="#5a3a55" opacity="0.5"/>' +
            '<circle cx="83" cy="81" r="3" fill="#fff"/>' +
            '<circle cx="80" cy="86" r="1.5" fill="#fff" opacity="0.7"/>' +
            '<ellipse cx="118" cy="84" rx="8" ry="10" fill="#3a2535"/>' +
            '<ellipse cx="118" cy="84" rx="7" ry="9" fill="url(#cEyeGradR)"/>' +
            '<ellipse cx="118" cy="87" rx="5" ry="5" fill="#5a3a55" opacity="0.5"/>' +
            '<circle cx="119" cy="81" r="3" fill="#fff"/>' +
            '<circle cx="116" cy="86" r="1.5" fill="#fff" opacity="0.7"/>' +
            /* Mouth */
            '<path d="M 90 100 Q 100 106 110 100" stroke="#5a3040" stroke-width="2" fill="none" stroke-linecap="round"/>' +
            '</svg>';
        }

        function loadAvatar() {
          try {
            var raw = localStorage.getItem(SPARK_KEY);
            if (raw) {
              var d = JSON.parse(raw);
              if (d.avatar) return d.avatar;
            }
          } catch (e) {}
          return { hairColor:"purple", outfitColor:"white", earColor:"match", eyes:"round", mouth:"smile", accessory:"none", pose:"idle" };
        }

        function updateCompanion() {
          var av = loadAvatar();
          companion.innerHTML = renderCompanionSVG(av) + '<div class="companion-hint">拖拽我</div>';
        }

        /* Position restore */
        try {
          var pos = JSON.parse(localStorage.getItem(POS_KEY) || "{}");
          if (pos.x !== undefined) {
            companion.style.left = pos.x + "px";
            companion.style.top = pos.y + "px";
          } else {
            companion.style.right = "16px";
            companion.style.bottom = "80px";
          }
        } catch (e) {
          companion.style.right = "16px";
          companion.style.bottom = "80px";
        }

        updateCompanion();

        /* Drag logic */
        var dragging = false;
        var startX = 0, startY = 0, origLeft = 0, origTop = 0;

        function onPointerDown(e) {
          dragging = true;
          companion.classList.add("dragging");
          var rect = companion.getBoundingClientRect();
          var parentRect = companion.parentElement.getBoundingClientRect();
          origLeft = rect.left - parentRect.left;
          origTop = rect.top - parentRect.top;
          startX = e.clientX;
          startY = e.clientY;
          companion.style.left = origLeft + "px";
          companion.style.top = origTop + "px";
          companion.style.right = "auto";
          companion.style.bottom = "auto";
          e.preventDefault();
        }

        function onPointerMove(e) {
          if (!dragging) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          var newLeft = origLeft + dx;
          var newTop = origTop + dy;
          var parent = companion.parentElement;
          var maxLeft = parent.clientWidth - companion.offsetWidth;
          var maxTop = parent.clientHeight - companion.offsetHeight;
          newLeft = Math.max(0, Math.min(maxLeft, newLeft));
          newTop = Math.max(0, Math.min(maxTop, newTop));
          companion.style.left = newLeft + "px";
          companion.style.top = newTop + "px";
        }

        function onPointerUp() {
          if (!dragging) return;
          dragging = false;
          companion.classList.remove("dragging");
          try {
            localStorage.setItem(POS_KEY, JSON.stringify({
              x: parseInt(companion.style.left) || 0,
              y: parseInt(companion.style.top) || 0
            }));
          } catch (e) {}
        }

        companion.addEventListener("pointerdown", onPointerDown);
        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
        document.addEventListener("pointercancel", onPointerUp);

        /* Tap to cycle pose (quick interaction) */
        var tapStartT = 0, tapStartX = 0, tapStartY = 0;
        companion.addEventListener("pointerdown", function(e) {
          tapStartT = Date.now();
          tapStartX = e.clientX;
          tapStartY = e.clientY;
        });
        companion.addEventListener("pointerup", function(e) {
          if (Date.now() - tapStartT < 200 &&
              Math.abs(e.clientX - tapStartX) < 8 &&
              Math.abs(e.clientY - tapStartY) < 8) {
            /* It's a tap - cycle pose */
            try {
              var raw = localStorage.getItem(SPARK_KEY);
              var d = raw ? JSON.parse(raw) : {};
              d.avatar = d.avatar || {};
              var poses = ["idle","wave","cheer","reach","shy","sit"];
              var cur = poses.indexOf(d.avatar.pose || "idle");
              if (cur === -1) cur = 0;
              d.avatar.pose = poses[(cur + 1) % poses.length];
              localStorage.setItem(SPARK_KEY, JSON.stringify(d));
              updateCompanion();
            } catch (e) {}
          }
        });

        /* Listen for avatar changes from spark page */
        window.addEventListener("storage", function(e) {
          if (e.key === SPARK_KEY) updateCompanion();
        });
      })();
    })();
  </script>
