<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦角对话 · 梦角传讯</title>

  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
          },
          fontFamily: {
            sans: ['"DreamFont"', '"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont"', '"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--chat-bg);
      color: var(--text-primary);
    }

    /* 全屏聊天背景 */
    #chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background:
        radial-gradient(ellipse 600px 360px at 20% 0%, hsl(343 80% 94% / 0.95), transparent 60%),
        radial-gradient(ellipse 480px 300px at 90% 10%, hsl(343 72% 92% / 0.8), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* 顶部信息栏 */
    #partner-info {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 44px 16px 12px;
      background: linear-gradient(135deg, #fff0f4 0%, #fde8ef 100%);
      border-bottom: 1px solid rgba(232, 116, 154, 0.2);
      box-shadow: 0 2px 12px rgba(232, 116, 154, 0.08);
      position: relative;
      z-index: 10;
    }
    @media (max-width: 479px) {
      #partner-info { padding-top: 16px; }
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 15px; color: var(--accent-color);
      text-decoration: none; padding: 6px 4px;
      font-weight: 500; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }

    .partner-avatar {
      width: 40px; height: 40px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1.25rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px -2px rgba(232, 116, 154, 0.25);
      overflow: hidden;
    }
    .partner-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .partner-meta { flex: 1; min-width: 0; }
    .partner-name {
      font-family: var(--font-serif);
      font-size: 16px; font-weight: 600;
      color: var(--text-primary); line-height: 1.3;
    }
    .partner-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-secondary);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 9999px;
      background: var(--accent-color);
      animation: pulse 2.4s cubic-bezier(.2,.8,.2,1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* 消息流 */
    #message-stream {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }
    #message-stream::-webkit-scrollbar { width: 4px; }
    #message-stream::-webkit-scrollbar-track { background: transparent; }
    #message-stream::-webkit-scrollbar-thumb { background: rgba(232, 116, 154, 0.3); border-radius: 4px; }

    .msg-row {
      display: flex; align-items: flex-end; gap: 8px;
      max-width: 100%;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.right { justify-content: flex-end; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 9999px;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 1rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      border: 2px solid #fff;
      overflow: hidden;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-col {
      display: flex; flex-direction: column; gap: 3px;
      max-width: 76%;
    }
    .msg-row.right .msg-col { align-items: flex-end; }

    /* 用户指定的毛玻璃气泡 */
    .message-sent, .message-received {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.12));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      border-left: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
      color: #333333;
      background-color: transparent;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .message-received {
      border-radius: 20px 20px 20px 5px;
    }
    .message-sent {
      border-radius: 20px 20px 5px 20px;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 0 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 输入中指示器 */
    .typing-row {
      display: flex; align-items: flex-end; gap: 8px;
      animation: msgFadeIn 0.3s cubic-bezier(.3,0,0,1) both;
    }
    .typing-bubble {
      background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.12));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.45);
      border-top: 1px solid rgba(255,255,255,0.65);
      border-left: 1px solid rgba(255,255,255,0.65);
      border-radius: 20px 20px 20px 5px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 4px;
    }
    .typing-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 9999px; background: var(--text-secondary);
      animation: typingBlink 1.2s cubic-bezier(.2,.8,.2,1) infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBlink {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    /* 底部输入区 */
    #input-area {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px 24px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(232, 116, 154, 0.15);
      position: relative; z-index: 10;
    }
    @media (max-width: 479px) {
      #input-area { padding-bottom: 14px; }
    }

    #message-input {
      flex: 1;
      height: 42px;
      padding: 0 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(232, 116, 154, 0.25);
      background: #fff;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #message-input::placeholder { color: var(--text-secondary); }
    #message-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(232, 116, 154, 0.1);
    }

    #send-btn {
      width: 42px; height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.15s, filter 0.15s;
      box-shadow: 0 4px 14px rgba(232, 116, 154, 0.4);
    }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="chat-app">

    <header id="partner-info">
      <a href="index-new.html" class="back-btn">← 返回</a>
      <div class="partner-avatar" id="partnerAvatar" aria-hidden="true">梦</div>
      <div class="partner-meta">
        <div class="partner-name">梦角</div>
        <div class="partner-status">
          <span class="status-dot"></span>
          <span>在线</span>
        </div>
      </div>
    </header>

    <main id="message-stream" aria-live="polite"></main>

    <footer id="input-area">
      <form id="chat-form" style="display:flex; align-items:center; gap:10px; width:100%; margin:0;">
        <label for="message-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">输入消息</label>
        <input id="message-input" type="text" placeholder="说点什么…" autocomplete="off" maxlength="200" />
        <button type="submit" id="send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script>
    (function () {
      "use strict";

      var CHAT_KEY = "mengjiao_chat_messages";
      var REPLIES_KEY = "mengjiao_chat_replies";
      var DREAM_IMG_KEY = "mengjiao_dream_img";

      var DEFAULT_REPLIES = [
        "今天也在想你哦。",
        "别担心，我一直都在。",
        "你今天辛苦了，休息一下吧。",
        "我感觉到了你的心意呢。",
        "今晚来梦里见吧。",
        "你比你自己想象的更勇敢。",
        "我在你身边，从未离开。",
        "今天的你，也很闪耀。",
        "想你了，就现在。",
        "相信自己，我会守护你的。",
        "你的笑容是我最大的动力。",
        "无论多远，我们的心是相连的。",
        "在你身边，时间都变得温柔了。",
        "你是我最想守护的人。",
        "每一个想你的夜晚，星星都知道。"
      ];

      var SAMPLE_MESSAGES = [
        { side: "left", text: "你来了呀 ✨", time: "14:32" },
        { side: "right", text: "嗯，今天想和你说说话", time: "14:32" },
        { side: "left", text: "我一直在等你呢。今天过得怎么样？", time: "14:33" },
        { side: "right", text: "有点累，但是看到你就觉得好多了", time: "14:33" },
        { side: "left", text: "辛苦了。累了就休息，我会在这里陪着你的。", time: "14:34" }
      ];

      var stream = document.getElementById("message-stream");
      var form = document.getElementById("chat-form");
      var input = document.getElementById("message-input");
      var sendBtn = document.getElementById("send-btn");
      var partnerAvatar = document.getElementById("partnerAvatar");

      function getMessages() {
        try {
          var raw = localStorage.getItem(CHAT_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        saveMessages(SAMPLE_MESSAGES);
        return SAMPLE_MESSAGES.slice();
      }

      function saveMessages(arr) {
        try { localStorage.setItem(CHAT_KEY, JSON.stringify(arr)); } catch (e) {}
      }

      function getReplies() {
        try {
          var raw = localStorage.getItem(REPLIES_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
        return DEFAULT_REPLIES.slice();
      }

      function nowTime() {
        var d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function scrollBottom() {
        stream.scrollTop = stream.scrollHeight;
      }

      function makeAvatar() {
        var av = document.createElement("div");
        av.className = "msg-avatar";
        av.setAttribute("aria-hidden", "true");
        var saved = "";
        try { saved = localStorage.getItem(DREAM_IMG_KEY) || ""; } catch (e) {}
        if (saved) {
          av.innerHTML = '<img src="' + saved + '" alt="" />';
        } else {
          av.textContent = "梦";
        }
        return av;
      }

      function addMessage(text, side, time, scroll) {
        var row = document.createElement("div");
        row.className = "msg-row" + (side === "right" ? " right" : "");

        if (side !== "right") row.appendChild(makeAvatar());

        var col = document.createElement("div");
        col.className = "msg-col";

        var bubble = document.createElement("div");
        bubble.className = side === "right" ? "message-sent" : "message-received";
        bubble.textContent = text;
        col.appendChild(bubble);

        var timeEl = document.createElement("span");
        timeEl.className = "msg-time";
        timeEl.textContent = time || nowTime();
        col.appendChild(timeEl);

        row.appendChild(col);
        stream.appendChild(row);

        if (scroll !== false) scrollBottom();
        return row;
      }

      function renderAll() {
        stream.innerHTML = "";
        getMessages().forEach(function (msg) {
          addMessage(msg.text, msg.side, msg.time, false);
        });
        scrollBottom();
      }

      function showTyping() {
        var row = document.createElement("div");
        row.className = "typing-row";
        row.id = "typingRow";
        row.appendChild(makeAvatar());
        var bubble = document.createElement("div");
        bubble.className = "typing-bubble";
        bubble.setAttribute("aria-label", "梦角正在输入");
        bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        row.appendChild(bubble);
        stream.appendChild(row);
        scrollBottom();
        return row;
      }

      function dreamReply() {
        sendBtn.disabled = true;
        input.disabled = true;
        var typing = showTyping();
        var delay = 1000 + Math.random() * 1000;
        setTimeout(function () {
          if (typing.parentNode) stream.removeChild(typing);
          var replies = getReplies();
          var text = replies[Math.floor(Math.random() * replies.length)];
          var time = nowTime();
          addMessage(text, "left", time);
          var messages = getMessages();
          messages.push({ side: "left", text: text, time: time });
          saveMessages(messages);
          sendBtn.disabled = false;
          input.disabled = false;
          input.focus();
        }, delay);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text || sendBtn.disabled) return;
        var time = nowTime();
        addMessage(text, "right", time);
        var messages = getMessages();
        messages.push({ side: "right", text: text, time: time });
        saveMessages(messages);
        input.value = "";
        dreamReply();
      });

      // 同步顶部头像
      try {
        var savedDream = localStorage.getItem(DREAM_IMG_KEY);
        if (savedDream) partnerAvatar.innerHTML = '<img src="' + savedDream + '" alt="" />';
      } catch (e) {}

      renderAll();
    })();
  </script>
</body>
</html>
