      continueBtn.addEventListener("click", function () {
        if (isReplying) return;
        simulateReply();
      });

      pokeBtn.addEventListener("click", function () {
        pokePanel.classList.toggle("show");
        quickPanel.classList.remove("show");
        if (pokePanel.classList.contains("show") && !pokePanel.dataset.loaded) {
          pokePanel.innerHTML = getPokeOptions().map(function (p) {
            return '<div class="poke-item">' + escapeHtml(p) + '</div>';
          }).join("");
          pokePanel.dataset.loaded = "1";
          pokePanel.querySelectorAll(".poke-item").forEach(function (el) {
            el.addEventListener("click", function () {
              var pokeText = el.textContent;
              addSystemMessage("你" + pokeText);
              var messages = getMessages();
              messages.push({ side: "system", text: "你" + pokeText, time: nowTime(), read: true, id: "sys_" + Date.now(), ts: new Date().toISOString() });
              saveMessages(messages);
              pokePanel.classList.remove("show");
              simulateReply();
            });
          });
        }
      });

      quickBtn.addEventListener("click", function () {
        quickPanel.classList.toggle("show");
        pokePanel.classList.remove("show");
        if (quickPanel.classList.contains("show") && !quickPanel.dataset.loaded) {
          quickPanel.innerHTML = QUICK_REPLIES.map(function (q) {
            return '<div class="quick-chip">' + escapeHtml(q) + '</div>';
          }).join("");
          quickPanel.dataset.loaded = "1";
          quickPanel.querySelectorAll(".quick-chip").forEach(function (el) {
            el.addEventListener("click", function () {
              sendMessage(el.textContent);
              quickPanel.classList.remove("show");
            });
          });
        }
      });

      var clearArmed = false, clearTimer;
      clearBtn.addEventListener("click", function () {
        if (!clearArmed) {
          clearArmed = true;
          clearBtn.style.background = "rgba(225, 29, 72, 0.12)";
          clearBtn.style.color = "#e11d48";
          clearTimeout(clearTimer);
          clearTimer = setTimeout(function () {
            clearArmed = false;
            clearBtn.style.background = "";
            clearBtn.style.color = "";
          }, 3000);
        } else {
          saveMessages([]);
          renderAll();
          addSystemMessage("对话已清空");
          clearArmed = false;
          clearBtn.style.background = "";
          clearBtn.style.color = "";
          continueBar.style.display = "none";
        }
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest("#pokeBtn") && !e.target.closest("#pokePanel")) pokePanel.classList.remove("show");
        if (!e.target.closest("#quickBtn") && !e.target.closest("#quickPanel")) quickPanel.classList.remove("show");
        if (!e.target.closest("#msgContextMenu")) hideContextMenu();
      });

      stream.addEventListener("scroll", hideContextMenu, { passive: true });

      // 设置面板开关
      settingsBtn.addEventListener("click", openSettings);
      settingsClose.addEventListener("click", closeSettings);
      settingsModal.querySelector(".settings-backdrop").addEventListener("click", closeSettings);

      // 设置标签切换
      document.querySelectorAll(".settings-tab").forEach(function (tab) {
        tab.addEventListener("click", function () { switchSettingsTab(tab.dataset.tab); });
      });

      // 开关设置
      document.querySelectorAll(".setting-switch").forEach(function (input) {
        input.addEventListener("change", function () {
          updateSetting(input.dataset.key, input.checked);
          if (input.dataset.key === "autoSend") resetIdleTimer();
          if (input.dataset.key === "autoPoke") {
            if (input.checked) resetPokeTimer();
            else stopPokeTimer();
          }
        });
      });

      // 滑块设置
      document.querySelectorAll(".cs-slider").forEach(function (input) {
        input.addEventListener("input", function () {
          updateSliderLabel(input);
        });
        input.addEventListener("change", function () {
          var key = input.dataset.key;
          var val = parseInt(input.value, 10);
          if (key === "replyDelayMin" || key === "replyDelayMax") val = val * 1000;
          updateSetting(key, val);
          if (key === "autoSendInterval") resetIdleTimer();
          if (key === "autoPokeInterval") resetPokeTimer();
        });
      });

      // 选项按钮设置
      document.querySelectorAll(".cs-option-row").forEach(function (row) {
        row.querySelectorAll(".cs-option-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            updateSetting(row.dataset.key, btn.dataset.value);
            refreshSettingsUI();
          });
        });
      });

      // 昵称保存
      document.querySelectorAll(".cs-save-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var target = btn.dataset.save;
          if (target === "partnerName") {
            var val = document.getElementById("partnerNameInput").value.trim() || "梦角";
            updateSetting("partnerName", val);
          } else if (target === "myName") {
            var val = document.getElementById("myNameInput").value.trim() || "我";
            updateSetting("myName", val);
          }
          updateSettingsAvatars();
        });
      });

      // 拍一拍文案保存
      if (pokeMessagesInput) {
        pokeMessagesInput.addEventListener("change", function () {
          var lines = pokeMessagesInput.value.split(/\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
          updateSetting("customPokeMessages", lines);
          delete pokePanel.dataset.loaded;
        });
      }

      // 引用预览关闭
      quotePreviewClose.addEventListener("click", clearQuote);

      // 上下文菜单
      msgContextMenu.addEventListener("click", function (e) {
        var item = e.target.closest(".msg-context-item");
        if (item) onContextAction(item.dataset.action);
      });

      // 用户活动重置空闲计时
      ["keydown", "mousedown", "touchstart", "input"].forEach(function (evt) {
        document.addEventListener(evt, function () {
          lastActivity = Date.now();
          if (chatSettings.autoSend && !isReplying) resetIdleTimer();
          if (chatSettings.autoPoke && !isReplying) resetPokeTimer();
        }, { passive: true });
      });

      /* ===== 消息搜索 ===== */
      function openSearch() {
        searchModal.classList.add("show");
        searchModal.setAttribute("aria-hidden", "false");
        searchInput.value = "";
        searchResults.innerHTML = "";
        searchStats.textContent = "";
        searchClear.classList.add("hidden");
        if (window.lucide) lucide.createIcons();
        setTimeout(function () { searchInput.focus(); }, 100);
      }
      function closeSearch() {
        searchModal.classList.remove("show");
        searchModal.setAttribute("aria-hidden", "true");
      }
      function highlightText(text, query) {
        if (!query) return escapeHtml(text);
        var re = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
        return escapeHtml(text).replace(re, '<span class="search-highlight">$1</span>');
      }
      function doSearch(query) {
        query = (query || "").trim();
        searchResults.innerHTML = "";
        if (!query) {
          searchStats.textContent = "";
          searchClear.classList.add("hidden");
          return;
        }
        searchClear.classList.remove("hidden");
        var msgs = getMessages();
        var matches = [];
        msgs.forEach(function (m, idx) {
          if (m.side === "system") return;
          var searchText = m.type === "image" ? "[图片]" : (m.type === "voice" ? "[语音]" : (m.text || ""));
          if (searchText.toLowerCase().indexOf(query.toLowerCase()) !== -1) {
            matches.push({ msg: m, idx: idx, text: searchText });
          }
        });
        searchStats.textContent = "找到 " + matches.length + " 条结果";
        if (matches.length === 0) {
          searchResults.innerHTML = '<div class="px-2 py-6 text-center text-xs text-[var(--text-secondary)]">没有匹配的消息</div>';
          return;
        }
        matches.forEach(function (item) {
          var div = document.createElement("div");
          div.className = "search-result-item";
          var sideLabel = item.msg.side === "right" ? (chatSettings.myName || "我") : (chatSettings.partnerName || "梦角");
          var meta = document.createElement("div");
          meta.className = "search-result-meta";
          meta.textContent = sideLabel + " · " + (item.msg.time || "");
          var body = document.createElement("div");
          body.className = "search-result-text";
          body.innerHTML = highlightText(item.text, query);
          div.appendChild(meta);
          div.appendChild(body);
          div.addEventListener("click", function () {
            closeSearch();
            scrollToMessage(item.msg.id);
          });
          searchResults.appendChild(div);
        });
      }
      function scrollToMessage(msgId) {
        if (!msgId) return;
        var row = stream.querySelector('.msg-row[data-id="' + msgId + '"]');
        if (row) {
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          row.style.transition = "background 0.5s";
          row.style.background = "rgba(232,164,184,0.15)";
          setTimeout(function () { row.style.background = ""; }, 1200);
        }
      }

      /* ===== 聊天记录导入/导出 ===== */
      function exportChat() {
        var data = {
          version: 1,
          exportedAt: new Date().toISOString(),
          messages: getMessages()
        };
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "mengjiao-chat-" + todayStr() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
      function importChat(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          try {
            var data = JSON.parse(e.target.result);
            if (!data || !Array.isArray(data.messages)) throw new Error("格式错误");
            var valid = data.messages.filter(function (m) {
              return m && (m.side === "left" || m.side === "right" || m.side === "system") && (m.text || m.type === "image");
            });
            if (valid.length === 0) throw new Error("没有可导入的消息");
            saveMessages(valid);
            renderAll();
            addSystemMessage("已导入 " + valid.length + " 条记录");
            continueBar.style.display = "flex";
          } catch (err) {
            addSystemMessage("导入失败：" + err.message);
          }
        };
        reader.readAsText(file);
      }
      function updateStorageInfo() {
        if (!storageInfo || !window.MengjiaoImageUtils) return;
        var info = window.MengjiaoImageUtils.checkStorageLimit();
        storageInfo.textContent = window.MengjiaoImageUtils.formatSize(info.used) + " / " + window.MengjiaoImageUtils.DEFAULT_MAX_SIZE_MB + "MB";
      }

      /* ===== 表情包面板 ===== */
      function renderStickers() {
        var list = window.MengjiaoStickers ? window.MengjiaoStickers.getStickers() : [];
        stickerList.innerHTML = list.map(function (s) {
          return '<button type="button" class="sticker-item" data-sticker="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
        }).join("");
        stickerList.querySelectorAll(".sticker-item").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var sticker = btn.dataset.sticker;
            sendSticker(sticker);
            stickerPanel.classList.remove("show");
          });
        });
      }
      function sendSticker(sticker) {
        if (!sticker || isReplying) return;
        var time = nowTime();
        var msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
        var msgTs = new Date().toISOString();
        addMessage({ text: sticker, side: "right", time: time, read: false, id: msgId, isEmoji: true });
        var messages = getMessages();
        messages.push({ side: "right", text: sticker, time: time, read: false, id: msgId, isEmoji: true, ts: msgTs });
        saveMessages(messages);
        lastActivity = Date.now();
        resetIdleTimer();
        if (chatSettings.autoPoke) resetPokeTimer();
        simulateReply();
      }
      function manageStickers() {
        var input = prompt("添加新表情（emoji / 颜文字），或输入 reset 恢复默认：");
        if (input === null) return;
        input = input.trim();
        if (!input) return;
        if (input === "reset") {
          if (window.MengjiaoStickers) window.MengjiaoStickers.resetStickers();
        } else {
          if (window.MengjiaoStickers) window.MengjiaoStickers.addSticker(input);
        }
        renderStickers();
      }

      /* ===== 图片上传 ===== */
      function handleImageSelect(file) {
        if (!file) return;
        if (!window.MengjiaoImageUtils) {
          addSystemMessage("图片工具未加载");
          return;
        }
        var check = window.MengjiaoImageUtils.checkStorageLimit();
        if (!check.ok) {
          addSystemMessage(check.message);
          return;
        }
        window.MengjiaoImageUtils.compressImage(file, { maxWidth: 1200, maxHeight: 1600, quality: 0.8 }).then(function (dataUrl) {
          sendImageMessage(dataUrl);
        }).catch(function (err) {
          addSystemMessage("图片处理失败：" + (err && err.message ? err.message : "未知错误"));
        });
      }

      /* ===== 事件绑定：搜索 / 图片 / 表情 / 导入导出 ===== */
      searchBtn.addEventListener("click", openSearch);
      searchClose.addEventListener("click", closeSearch);
      searchModal.querySelector(".settings-backdrop").addEventListener("click", closeSearch);
      searchInput.addEventListener("input", function () { doSearch(searchInput.value); });
      searchClear.addEventListener("click", function () {
        searchInput.value = "";
        doSearch("");
        searchInput.focus();
      });

      imageBtn.addEventListener("click", function () { imageInput.click(); });
      imageInput.addEventListener("change", function () {
        handleImageSelect(imageInput.files[0]);
        imageInput.value = "";
      });

      voiceBtn.addEventListener("click", function () { openVoicePanel(); });
      voiceCancelBtn.addEventListener("click", cancelVoicePanel);
      voiceRecordBtn.addEventListener("mousedown", function (e) {
        e.preventDefault();
        startRecording();
      });
      voiceRecordBtn.addEventListener("mouseup", function () { stopRecording(); closeVoicePanel(); });
      voiceRecordBtn.addEventListener("mouseleave", function () { if (voiceRecorder) { stopRecording(); closeVoicePanel(); } });
      voiceRecordBtn.addEventListener("touchstart", function (e) {
        e.preventDefault();
        startRecording();
      }, { passive: false });
      voiceRecordBtn.addEventListener("touchend", function () { stopRecording(); closeVoicePanel(); });
      voiceRecordBtn.addEventListener("touchcancel", function () { if (voiceRecorder) { stopRecording(); closeVoicePanel(); } });
      document.addEventListener("click", function (e) {
        if (!e.target.closest("#voiceBtn") && !e.target.closest("#voicePanel") && voicePanel.classList.contains("show")) {
          closeVoicePanel();
        }
      });

      stickerBtn.addEventListener("click", function () {
        stickerPanel.classList.toggle("show");
        if (stickerPanel.classList.contains("show")) renderStickers();
      });
      stickerManageBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        manageStickers();
      });

      exportChatBtn.addEventListener("click", exportChat);
      importChatInput.addEventListener("change", function () {
        importChat(importChatInput.files[0]);
        importChatInput.value = "";
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest("#stickerBtn") && !e.target.closest("#stickerPanel")) stickerPanel.classList.remove("show");
      });

      imagePreviewModal.addEventListener("click", function () {
        imagePreviewModal.classList.remove("show");
        imagePreviewModal.setAttribute("aria-hidden", "true");
        imagePreviewImg.src = "";
      });

      /* ===== 初始化 ===== */
      chatSettings = loadSettings();

      try {
        var savedDream = localStorage.getItem(DREAM_IMG_KEY);
        if (savedDream) partnerAvatar.innerHTML = '<img src="' + savedDream + '" alt="" />';
        var savedName = localStorage.getItem(PARTNER_NAME_KEY);
        if (savedName) {
          partnerNameEl.textContent = savedName;
          chatSettings.partnerName = savedName;
        }
      } catch (e) {}

      renderAll();
      applySettings();
      if (chatSettings.autoSend) resetIdleTimer();
      if (chatSettings.autoPoke) resetPokeTimer();

      // 跨天首次访问：梦角主动问好
      try {
        var lastVisit = "";
        try { lastVisit = localStorage.getItem(VISIT_KEY) || ""; } catch (e) {}
        var today = todayStr();
        if (lastVisit !== today) {
          var hi = timeGreeting();
          setTimeout(function () {
            var hiId = "msg_" + Date.now();
            addMessage({ text: hi, side: "left", time: nowTime(), read: true, id: hiId });
            var messages = getMessages();
            messages.push({ side: "left", text: hi, time: nowTime(), read: true, id: hiId, ts: new Date().toISOString() });
            saveMessages(messages);
            continueBar.style.display = "flex";
          }, 800);
          try { localStorage.setItem(VISIT_KEY, today); } catch (e) {}
        }
      } catch (e) {}

      if (getMessages().length > 0) continueBar.style.display = "flex";

      /* ===== 初始同步按钮状态与输入区测量（参考 ZY 初始化） ===== */
      updateSendBtnState();
      updateComposerHeight();
      setTimeout(updateComposerHeight, 200);
      setTimeout(updateComposerHeight, 800);

      /* ===== 拖拽小精灵 ===== */
      (function initCompanion() {
        var companion = document.getElementById("spark-companion");
        if (!companion) return;
        var SPARK_KEY = "mengjiao_spark";
        var POS_KEY = "mengjiao_companion_pos";

        function updateCompanion() {
          companion.innerHTML = '<img src="../assets/character.png" alt="小火人" style="width:100%;height:100%;object-fit:contain;display:block;border-radius:12px;pointer-events:none;filter:brightness(1.12) saturate(1.15) contrast(1.05);">' + '<div class="companion-hint">拖拽我</div>';
        }

        /* Position restore */
        try {
          var pos = JSON.parse(localStorage.getItem(POS_KEY) || "{}");
          if (pos.x !== undefined) {
            companion.style.left = pos.x + "px";
            companion.style.top = pos.y + "px";
          } else {
            companion.style.right = "16px";
            companion.style.bottom = "80px";
          }
        } catch (e) {
          companion.style.right = "16px";
          companion.style.bottom = "80px";
        }

        updateCompanion();

        /* Drag logic */
        var dragging = false;
        var startX = 0, startY = 0, origLeft = 0, origTop = 0;

        function onPointerDown(e) {
          dragging = true;
          companion.classList.add("dragging");
          var rect = companion.getBoundingClientRect();
          var parentRect = companion.parentElement.getBoundingClientRect();
          origLeft = rect.left - parentRect.left;
          origTop = rect.top - parentRect.top;
          startX = e.clientX;
          startY = e.clientY;
          companion.style.left = origLeft + "px";
          companion.style.top = origTop + "px";
          companion.style.right = "auto";
          companion.style.bottom = "auto";
          e.preventDefault();
        }

        function onPointerMove(e) {
          if (!dragging) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          var newLeft = origLeft + dx;
          var newTop = origTop + dy;
          var parent = companion.parentElement;
          var maxLeft = parent.clientWidth - companion.offsetWidth;
          var maxTop = parent.clientHeight - companion.offsetHeight;
          newLeft = Math.max(0, Math.min(maxLeft, newLeft));
          newTop = Math.max(0, Math.min(maxTop, newTop));
          companion.style.left = newLeft + "px";
          companion.style.top = newTop + "px";
        }

        function onPointerUp() {
          if (!dragging) return;
          dragging = false;
          companion.classList.remove("dragging");
          try {
            localStorage.setItem(POS_KEY, JSON.stringify({
              x: parseInt(companion.style.left) || 0,
              y: parseInt(companion.style.top) || 0
            }));
          } catch (e) {}
        }

        companion.addEventListener("pointerdown", onPointerDown);
        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
        document.addEventListener("pointercancel", onPointerUp);

        /* Tap to cycle pose (quick interaction) */
        var tapStartT = 0, tapStartX = 0, tapStartY = 0;
        companion.addEventListener("pointerdown", function(e) {
          tapStartT = Date.now();
          tapStartX = e.clientX;
          tapStartY = e.clientY;
        });
        companion.addEventListener("pointerup", function(e) {
          if (Date.now() - tapStartT < 200 &&
              Math.abs(e.clientX - tapStartX) < 8 &&
              Math.abs(e.clientY - tapStartY) < 8) {
            try {
              var raw = localStorage.getItem(SPARK_KEY);
              var d = raw ? JSON.parse(raw) : {};
              d.avatar = d.avatar || {};
              var poses = ["idle","wave","cheer","reach","shy","sit"];
              var cur = poses.indexOf(d.avatar.pose || "idle");
              if (cur === -1) cur = 0;
              d.avatar.pose = poses[(cur + 1) % poses.length];
              localStorage.setItem(SPARK_KEY, JSON.stringify(d));
              updateCompanion();
            } catch (e) {}
          }
        });

        /* Listen for avatar changes from spark page */
        window.addEventListener("storage", function(e) {
          if (e.key === SPARK_KEY) updateCompanion();
        });
      })();
    })();
  </script>
</body>
