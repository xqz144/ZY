<html lang="zh-CN" class="light">

    <style id="theme-vars">
@font-face {

  font-weight: normal;
  font-style: normal;

}
:root {

  --muted-foreground: 340 10% 55%;
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --destructive: 0 70% 65%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --radius: 1.25rem;
  --tracking-normal: 0.02em;
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
}
body { font-family: var(--font-sans); letter-spacing: var(--tracking-normal); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
      [data-icon] {
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;

      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; }
      body {

        font-family: var(--font-sans); letter-spacing: var(--tracking-normal);

        .phone::before {
          content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
          width: 150px; height: 28px; background: hsl(343 22% 18%); border-radius: 0 0 18px 18px; z-index: 100;
        }
      }
      .app-bg {
        flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative;

      .app-bg::-webkit-scrollbar { display: none; }
      .top-bar {
        position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between;

      }
      @media (max-width: 479px) { .top-bar { padding-top: 16px; } }
      .back-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 2px;
        width: 36px; height: 36px; border-radius: 50%;
        background: rgba(var(--accent-color-rgb), 0.1); color: var(--accent-color);
        text-decoration: none; flex-shrink: 0; transition: transform 0.12s ease, background 0.15s ease;
      }
      .back-btn:active { transform: scale(0.94); background: rgba(var(--accent-color-rgb), 0.2); }
      .top-title {
        font-family: var(--font-serif); font-size: 18px; font-weight: 600;

      .content-area { position: relative; z-index: 1; padding: 0 16px 32px; flex: 1; min-height: 0; }

        box-shadow: 0 10px 30px -8px rgba(184, 164, 201, 0.4);
      }
      .announce-card.has-bg::before {
        content: ''; position: absolute; inset: 0; background-size: cover;
        background-position: center; background-repeat: no-repeat; z-index: 0;
      }
      .announce-card.has-bg::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.75) 100%);
        z-index: 0;
      }
      .announce-inner { position: relative; z-index: 1; }
      .ac-head {
        display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px;
      }
      .ac-date {
        background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
        padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600;
        display: inline-flex; align-items: center; gap: 5px;
      }
      .ac-weekday { font-size: 11px; opacity: 0.75; margin-left: 4px; }
      .ac-greet {
        font-family: var(--font-serif); font-size: 22px; font-weight: 700;
        display: flex; align-items: center; gap: 6px;
      }
      .ac-status-pill {
        display: inline-flex; align-items: center; gap: 5px;
        background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
        padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500;
      }
      .ac-body {
        background: rgba(255,255,255,0.78); backdrop-filter: blur(10px);
        border-radius: 18px; padding: 16px 14px; margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.6);
      }
      .ac-title {
        font-family: var(--font-serif); font-size: 18px; font-weight: 700;
        text-align: center; margin-bottom: 8px; line-height: 1.4;
      }
      .ac-note {
        font-size: 13px; color: #6b5a63; line-height: 1.7; text-align: center;
      }
      .ac-foot {
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      }
      .ac-chip {
        background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
        border-radius: 12px; padding: 10px 8px; text-align: center;
      }
      .ac-chip .chip-icon { color: #a8c98a; margin-bottom: 3px; }
      .ac-chip .chip-label { font-size: 10px; color: #8a7a82; margin-bottom: 2px; }
      .ac-chip .chip-val { font-size: 13px; font-weight: 600; color: #3d3238; }
      .ac-refresh {
        display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px;
        border-radius: 9999px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
        color: #6b5a63; font-size: 11px; border: none; cursor: pointer; font-family: inherit;

      .section-title {
        display: flex; align-items: center; gap: 6px;
        font-size: 14px; font-weight: 600; color: var(--text-primary);
        padding: 14px 4px 10px; font-family: var(--font-serif);
      }
      .section-title .line {
        flex: 1; height: 1px;
        background: linear-gradient(90deg, var(--border-color), transparent);
      }

      .card {
        background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--accent-color-rgb), 0.18);
        border-radius: 18px; padding: 14px; margin-bottom: 10px;
        box-shadow: 0 4px 12px -6px rgba(var(--accent-color-rgb), 0.18);
      }

      .list-header {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
      }
      .list-title {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 13px; font-weight: 600; color: var(--text-primary);
      }
      .list-count { font-size: 11px; color: var(--text-secondary); padding: 2px 8px; border-radius: 9999px; background: rgba(var(--accent-color-rgb),0.1); }
      .tool-btn {
        display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
        border-radius: 10px; border: 1px solid var(--border-color); background: #fff;

        transition: all 0.12s;

      .tool-btn:active { transform: scale(0.96); }
      .tool-btn.primary {
        background: linear-gradient(145deg, #a8d88a, #8fc76a); color: #fff; border-color: transparent;
      }

      .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
      .add-input {
        flex: 1; padding: 10px 12px; border-radius: 12px;
        border: 1px solid rgba(var(--accent-color-rgb), 0.22);
        background: rgba(var(--accent-color-rgb), 0.04); color: var(--text-primary);
        font-family: inherit; font-size: 13px; outline: none;
      }
      .add-input:focus {
        border-color: var(--accent-color); background: #fff;
        box-shadow: 0 0 0 3px rgba(var(--accent-color-rgb), 0.1);
      }
      .add-btn {
        padding: 10px 14px; border-radius: 12px; border: none;
        background: linear-gradient(145deg, hsl(343 70% 80%), hsl(343 60% 72%));
        color: #fff; font-size: 13px; font-weight: 500; font-family: inherit;
        cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
      }
      .add-btn:active { transform: scale(0.97); }

      .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .data-chip {
        display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px;
        border-radius: 9999px; background: rgba(var(--accent-color-rgb), 0.06);
        border: 1px solid rgba(var(--accent-color-rgb), 0.18); font-size: 12px;
        color: var(--text-primary);
      }
      .data-chip .status-icon { color: #a8c98a; }
      .chip-del {
        width: 16px; height: 16px; border-radius: 50%; border: none;
        background: rgba(148, 128, 138, 0.2); color: var(--text-secondary);
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
        font-size: 11px; line-height: 1;
      }
      .chip-del:active { background: hsl(var(--destructive) / 0.2); color: hsl(var(--destructive)); }

      .field-group { margin-bottom: 14px; }
      .field-label {
        font-size: 12px; font-weight: 500; color: var(--text-secondary);
        margin-bottom: 6px; display: block;
      }
      .input-field {
        width: 100%; border: 1px solid rgba(var(--accent-color-rgb), 0.22);
        border-radius: 14px; padding: 10px 12px; font-size: 13px;
        font-family: var(--font-sans); color: var(--text-primary);
        background: rgba(var(--accent-color-rgb), 0.04); outline: none; box-sizing: border-box;
      }
      .input-field:focus { border-color: var(--accent-color); background: #fff; box-shadow: 0 0 0 3px rgba(var(--accent-color-rgb), 0.1); }
      textarea.input-field { min-height: 80px; resize: vertical; line-height: 1.6; }
      .hint { font-size: 11px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; }

      .status-list { display: flex; flex-direction: column; gap: 6px; }
      .status-row {
        display: flex; align-items: center; gap: 8px; padding: 9px 10px;
        background: rgba(var(--accent-color-rgb), 0.04); border-radius: 12px;
      }
      .status-row .st-icon {
        width: 28px; height: 28px; border-radius: 10px;
        background: rgba(168, 201, 138, 0.2); color: #8fc76a;
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .status-row .st-label { flex: 1; font-size: 13px; color: var(--text-primary); }
      .status-row .st-status {
        font-size: 11px; padding: 3px 8px; border-radius: 9999px;
        background: rgba(168, 201, 138, 0.15); color: #6ea84f;
      }
      .status-row .actions { display: flex; gap: 4px; }
      .icon-btn-sm {
        width: 26px; height: 26px; border-radius: 8px; border: none;
        background: #fff; color: var(--text-secondary); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .icon-btn-sm:active { transform: scale(0.92); }
      .icon-btn-sm.danger { color: hsl(var(--destructive)); }

      .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .upload-btn {
        display: inline-flex; align-items: center; gap: 5px; padding: 10px 14px;
        border-radius: 12px; border: 1px dashed #a8c98a; background: rgba(168, 201, 138, 0.08);
        color: #6ea84f; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
        transition: transform 0.1s;
      }
      .upload-btn:active { transform: scale(0.97); }
      .bg-preview {
        width: 100%; height: 100px; border-radius: 14px; overflow: hidden; margin-top: 10px;
        border: 1px solid rgba(var(--accent-color-rgb), 0.15); position: relative;
      }
      .bg-preview img { width: 100%; height: 100%; object-fit: cover; }
      .bg-preview .placeholder {
        width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        color: var(--text-secondary); font-size: 12px;
        background: repeating-linear-gradient(45deg, rgba(var(--accent-color-rgb),0.05), rgba(var(--accent-color-rgb),0.05) 8px, transparent 8px, transparent 16px);
      }
      .remove-btn {
        padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color);
        background: #fff; color: var(--text-secondary); font-size: 12px; cursor: pointer;
        font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
      }

      .salt-box {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        background: rgba(var(--accent-color-rgb), 0.06); border-radius: 12px;
      }
      .salt-label { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
      .salt-val {
        flex: 1; font-family: ui-monospace, monospace; font-size: 12px;
        color: var(--text-primary); word-break: break-all;
      }
      .regen-btn {
        padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-color);
        background: #fff; color: var(--text-primary); font-size: 11px; cursor: pointer;
        font-family: inherit;
      }

      .sheet-overlay {
        position: absolute; inset: 0; z-index: 200;
        background: rgba(74,63,69,0.42); backdrop-filter: blur(4px);
        display: flex; flex-direction: column; justify-content: flex-end;
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      }
      .sheet-overlay.open { opacity: 1; pointer-events: auto; }
      .sheet-panel {
        background: rgba(255,255,255,0.98); border-radius: 28px 28px 0 0;
        max-height: 88%; display: flex; flex-direction: column;
        transform: translateY(100%); transition: transform 0.3s cubic-bezier(.3,0,0,1);
        overflow: hidden;
      }
      .sheet-overlay.open .sheet-panel { transform: translateY(0); }
      .sheet-handle {
        width: 40px; height: 4px; border-radius: 9999px;
        background: rgba(var(--accent-color-rgb), 0.25);
        margin: 10px auto 4px; flex-shrink: 0;
      }
      .sheet-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 20px 12px; flex-shrink: 0;
      }
      .sheet-title {
        font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--text-primary);
      }
      .sheet-close {
        width: 32px; height: 32px; border-radius: 9999px; border: none;
        background: rgba(var(--accent-color-rgb), 0.1); color: var(--text-secondary);
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      }
      .sheet-body {
        padding: 4px 20px 26px; overflow-y: auto; scrollbar-width: none; flex: 1;
      }
      .sheet-body::-webkit-scrollbar { display: none; }
      .save-btn {
        width: 100%; padding: 13px; border: none; border-radius: 16px;
        background: linear-gradient(145deg, #a8d88a, #8fc76a);
        color: #fff; font-size: 15px; font-weight: 600; font-family: var(--font-sans);
        cursor: pointer; margin-top: 6px; box-shadow: 0 6px 16px -4px rgba(143, 199, 106, 0.45);
      }
      .save-btn:active { transform: scale(0.98); }

      .toast {
        position: absolute; bottom: 100px; left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(74,63,69,0.9); backdrop-filter: blur(8px);
        color: #fff; padding: 10px 22px; border-radius: 9999px;
        font-size: 13px; z-index: 300; opacity: 0; pointer-events: none;
        transition: all 0.25s ease; white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .confirm-overlay {
        position: absolute; inset: 0; z-index: 250;
        background: rgba(74,63,69,0.42); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.2s ease; padding: 32px;
      }
      .confirm-overlay.open { opacity: 1; pointer-events: auto; }
      .confirm-box {
        background: rgba(255,255,255,0.98); border-radius: 22px;
        padding: 24px 24px 18px; width: 100%; max-width: 320px;
        text-align: center; transform: scale(0.9); transition: transform 0.2s ease;
      }
      .confirm-overlay.open .confirm-box { transform: scale(1); }
      .confirm-text {
        font-size: 15px; color: var(--text-primary); line-height: 1.6; margin-bottom: 20px;
      }
      .confirm-actions { display: flex; gap: 12px; }
      .confirm-btn {
        flex: 1; padding: 11px 10px; border: none; border-radius: 14px;
        font-size: 14px; font-weight: 500; font-family: var(--font-sans);
        cursor: pointer; transition: transform 0.1s;
      }
      .confirm-btn:active { transform: scale(0.97); }
      .confirm-cancel { background: rgba(var(--accent-color-rgb), 0.1); color: var(--text-secondary); }
      .confirm-ok { background: linear-gradient(145deg, hsl(0 70% 72%), hsl(0 60% 62%)); color: #fff; }

      .home-indicator {
        position: absolute; bottom: 7px; left: 0; right: 0;
        display: flex; justify-content: center; pointer-events: none; z-index: 5;
      }
      .home-indicator span {
        width: 130px; height: 4px; border-radius: 9999px; background: rgba(74,63,69,0.14);
      }
    </style>
</head>

  <div class="phone">
    <main class="app-bg" id="appBg">
      <div class="top-bar">
        <a href="../index-zy.html" class="back-btn" aria-label="返回">

  function getUserSalt() {
    var s = localStorage.getItem(K.SALT);

  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0);
  }
  function getDailySeed() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate() + "|" + getUserSalt();
  }
  function seededRand(seedStr) {
    var h = hashStr(seedStr);
    var a = h % 2147483647;
    return function() {
      a = (a * 16807) % 2147483647;
      return (a - 1) / 2147483646;
    };
  }
  function pickSeeded(arr, rand) {
    return arr[Math.floor(rand() * arr.length)];
  }

  function pad2(n) { return n < 10 ? "0"+n : ""+n; }

  function buildAnnouncement() {
    var seed = state.overrideSeed || getDailySeed();
    var rand = seededRand(seed);
    var now = new Date();
    var h = now.getHours();
    var greetingEmoji = "🌞";
    var greetingText = "早安呀";
    if (h >= 11 && h < 13) { greetingEmoji = "🍱"; greetingText = "午安呀"; }
    else if (h >= 13 && h < 17) { greetingEmoji = "☕"; greetingText = "下午好呀"; }
    else if (h >= 17 && h < 20) { greetingEmoji = "🌇"; greetingText = "傍晚好"; }
    else if (h >= 20 || h < 5) { greetingEmoji = "🌙"; greetingText = "晚安呀"; }
    else if (h >= 5 && h < 9) { greetingEmoji = "🌅"; greetingText = "早安呀"; }

    var custom = getCustomData();
    var titles = (custom.titles && custom.titles.length) ? custom.titles : DEFAULT_TITLES;
    var notes = (custom.notes && custom.notes.length) ? custom.notes : DEFAULT_NOTES;
    var statusPool = getStatusPool();

    var todayMD = pad2(now.getMonth()+1) + "-" + pad2(now.getDate());
    var matchedFest = FESTIVALS.find(function(f){ return f.date === todayMD; });
    var title = custom.title && custom.title.trim() ? custom.title.trim() : pickSeeded(titles, rand);
    var note = custom.note && custom.note.trim() ? custom.note.trim() : pickSeeded(notes, rand);
    if (matchedFest && rand() > 0.25) {
      title = "今天是" + matchedFest.label;
      note = matchedFest.note;
    }
    var weather = pickSeeded(WEATHERS, rand);
    var status = pickSeeded(statusPool, rand);
    var weekCN = ["周日","周一","周二","周三","周四","周五","周六"][now.getDay()];

    return {
      date: (now.getMonth()+1) + "月" + now.getDate() + "日",
      weekday: weekCN,
      greetEmoji: greetingEmoji,
      greetText: greetingText,
      title: title,
      note: note,
      weather: weather,
      status: status
    };
  }

  function bindEvents() {
    var reroll = document.getElementById("rerollBtn");
    if (reroll) reroll.onclick = function() {
      state.overrideSeed = getDailySeed() + "|" + Math.random().toString(36).slice(2, 8);
      renderAll();
      showToast("已换一条");
    };
    var atb = document.getElementById("addTitleBtn");
    var at = document.getElementById("addTitle");
    if (atb) atb.onclick = function() {
      var v = at.value.trim();
      if (!v) { showToast("请输入内容"); return; }
      var c = getCustomData();
      if (!c.titles) c.titles = [];
      c.titles.push(v);
      saveCustomData(c);
      at.value = "";
      renderAll();
      showToast("已添加");
    };
    if (at) at.addEventListener("keydown", function(e) { if (e.key === "Enter") atb.click(); });
    document.querySelectorAll('[data-del-title]').forEach(function(b) {
      b.onclick = function() {
        var i = parseInt(b.dataset.delTitle, 10);
        openConfirm("删除这条标题？", function() {
          var c = getCustomData();
          if (c.titles) c.titles.splice(i, 1);
          saveCustomData(c);
          renderAll();
          showToast("已删除");
        });
      };
    });
    var stb = document.getElementById("saveTitleBtn");
    if (stb) stb.onclick = function() {
      var c = getCustomData();
      c.title = document.getElementById("fixTitle").value.trim();
      saveCustomData(c);
      showToast("已保存");
      renderAll();
    };

    var anb = document.getElementById("addNoteBtn");
    var an = document.getElementById("addNote");
    if (anb) anb.onclick = function() {
      var v = an.value.trim();
      if (!v) { showToast("请输入内容"); return; }
      var c = getCustomData();
      if (!c.notes) c.notes = [];
      c.notes.push(v);
      saveCustomData(c);
      an.value = "";
      renderAll();
      showToast("已添加");
    };
    if (an) an.addEventListener("keydown", function(e) { if (e.key === "Enter") anb.click(); });
    document.querySelectorAll('[data-del-note]').forEach(function(b) {
      b.onclick = function() {
        var i = parseInt(b.dataset.delNote, 10);
        openConfirm("删除这条备注？", function() {
          var c = getCustomData();
          if (c.notes) c.notes.splice(i, 1);
          saveCustomData(c);
          renderAll();
          showToast("已删除");
        });
      };
    });
    var snb = document.getElementById("saveNoteBtn");
    if (snb) snb.onclick = function() {
      var c = getCustomData();
      c.note = document.getElementById("fixNote").value.trim();
      saveCustomData(c);
      showToast("已保存");
      renderAll();
    };

    var asb = document.getElementById("addStatusBtn");
    if (asb) asb.onclick = function() { openStatusEdit(null); };
    document.querySelectorAll('[data-edit-status]').forEach(function(b) {
      b.onclick = function() { openStatusEdit(parseInt(b.dataset.editStatus, 10)); };
    });
    document.querySelectorAll('[data-del-status]').forEach(function(b) {
      b.onclick = function() {
        var i = parseInt(b.dataset.delStatus, 10);
        openConfirm("删除这条状态？", function() {
          var a = getStatusPool();
          a.splice(i, 1);
          saveStatusPool(a);
          renderAll();
          showToast("已删除");
        });
      };
    });
    var rsb = document.getElementById("resetStatusBtn");
    if (rsb) rsb.onclick = function() {
      openConfirm("恢复默认状态池？自定义的状态将被清除", function() {
        saveStatusPool(DEFAULT_STATUSES.slice());
        renderAll();
        showToast("已恢复默认");
      });
    };

    var bgU = document.getElementById("bgUploadBtn");
    if (bgU) bgU.onclick = function() { document.getElementById("bgInput").click(); };
    var bgR = document.getElementById("bgRemoveBtn");
    if (bgR) bgR.onclick = function() {
      saveHeaderBg("");
      renderAll();
      showToast("已移除");
    };
    var rs = document.getElementById("regenSalt");
    if (rs) rs.onclick = function() {
      regenSalt();
      state.overrideSeed = null;
      document.getElementById("saltVal").textContent = getUserSalt();
      renderAll();
      showToast("盐已重新生成");
    };
  }

  function openStatusEdit(idx) {
    var pool = getStatusPool();
    var s = (idx != null) ? pool[idx] : { status:"", label:"", icon:"heart" };
    state.editingStatusIdx = idx;
    var icons = ["heart","briefcase","moon","utensils","laptop","footprints","book-open","music","tv","bath","bed","shopping-bag","chef-hat","dumbbell","graduation-cap","car","coffee","gamepad-2","camera","flower-2","film","plane","sparkles","shirt","cup-soda","stars","palette","pencil","message-circle","zap"];
    var html = '<div class="field-group"><label class="field-label">状态 Key（英文）</label><input type="text" class="input-field" id="stStatus" value="'+esc(s.status)+'" placeholder="例如 online" /></div>';
    html += '<div class="field-group"><label class="field-label">显示标签</label><input type="text" class="input-field" id="stLabel" value="'+esc(s.label)+'" placeholder="例如 在线 · 想你中" /></div>';
    html += '<div class="field-group"><label class="field-label">选择图标（点击）</label><div style="display:flex;flex-wrap:wrap;gap:6px;" id="iconPicker">';
    icons.forEach(function(ic) {
      html += '<button type="button" class="icon-btn-sm '+(s.icon===ic?'status-icon-selected':'')+'" data-icon-pick="'+esc(ic)+'" style="width:34px;height:34px;background:'+(s.icon===ic?'rgba(168,201,138,0.2)':'rgba(var(--accent-color-rgb),0.08)')+';color:'+(s.icon===ic?'#6ea84f':'var(--text-secondary)')+';"><i data-lucide="'+esc(ic)+'" class="w-4 h-4"></i></button>';
    });
    html += '</div><input type="hidden" id="stIcon" value="'+esc(s.icon)+'" /></div>';
    html += '<button class="save-btn" id="saveBtnInner"><i data-lucide="check" class="w-4 h-4" style="margin-right:6px;"></i><span>'+(idx!=null?"保存修改":"新增状态")+'</span></button>';
    openSheet(idx != null ? "编辑状态" : "新增状态", html, function() {
      var status = document.getElementById("stStatus").value.trim();
      var label = document.getElementById("stLabel").value.trim();
      var icon = document.getElementById("stIcon").value.trim() || "heart";
      if (!status || !label) { showToast("请完整填写"); return; }
      var a = getStatusPool();
      if (state.editingStatusIdx != null) {
        a[state.editingStatusIdx] = { status: status, label: label, icon: icon };
      } else {
        a.push({ status: status, label: label, icon: icon });
      }
      saveStatusPool(a);
      state.editingStatusIdx = null;
      closeSheet();
      renderAll();
      showToast("已保存");
    });
    setTimeout(function() {
      document.querySelectorAll('[data-icon-pick]').forEach(function(b) {
        b.onclick = function() {
          var ic = b.dataset.iconPick;
          document.getElementById("stIcon").value = ic;
          document.querySelectorAll('[data-icon-pick]').forEach(function(x) {
            x.style.background = "rgba(var(--accent-color-rgb),0.08)";
            x.style.color = "var(--text-secondary)";
            x.classList.remove("status-icon-selected");
          });
          b.style.background = "rgba(168,201,138,0.2)";
          b.style.color = "#6ea84f";
          b.classList.add("status-icon-selected");
        };
      });
      if (window.lucide) lucide.createIcons();
    }, 50);
  }

  function handleBgFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxW = 900;
        var scale = 1;
        if (img.width > maxW) scale = maxW / img.width;
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, c.width, c.height);
        try {
          var dataUrl = c.toDataURL("image/jpeg", 0.82);
          saveHeaderBg(dataUrl);
          renderAll();
          showToast("背景图已保存");
        } catch(err) { showToast("处理失败"); }
      };
      img.onerror = function() { showToast("加载失败"); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  document.getElementById("sheetOverlay").addEventListener("click", function(e) {
    if (e.target === document.getElementById("sheetOverlay")) closeSheet();
  });
  document.getElementById("confirmOk").addEventListener("click", function() {
    var cb = state.confirmCb;
    closeConfirm();
    if (typeof cb === "function") cb();
  });
  document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
  document.getElementById("confirmOverlay").addEventListener("click", function(e) {
    if (e.target === document.getElementById("confirmOverlay")) closeConfirm();
  });
  document.getElementById("bgInput").addEventListener("change", function(e) {
    if (e.target.files && e.target.files[0]) handleBgFile(e.target.files[0]);
    e.target.value = "";
  });

  renderAll();
})();
lucide.createIcons();
</script>
</body>
</html>
