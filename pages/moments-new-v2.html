<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
      .cover-doodle svg,
      .cover-doodle-icon { width: 14px; height: 14px; }

      .cover-avatar-fallback,
      .cover-avatar-fallback svg { width: 1.6rem; height: 1.6rem; color: var(--accent-color); }

      .moment-avatar-fallback,
      .moment-avatar-fallback svg { width: 1.1rem; height: 1.1rem; color: var(--accent-color); }

      .like-icon,
      .like-icon svg { width: 14px; height: 14px; stroke-width: 2; fill: none; }
      .like-icon--filled,
      .action-btn.liked .like-icon,
      .action-btn.liked .like-icon svg { fill: currentColor; }

      .comment-send-icon,
      .comment-send-icon svg { width: 16px; height: 16px; }

      .empty-icon { display: inline-flex; align-items: center; justify-content: center; }
      .empty-icon svg { width: 48px; height: 48px; }
    </style>
</head>
<body>
  <div id="moments-app">
    <header id="top-bar">
      <a href="../index-zy.html" class="back-btn" data-dom-id="nav-back">
        <i data-lucide="chevron-left" class="back-icon"></i>
        <span>返回</span>
      </a>
      <span class="top-title">朋友圈</span>
      <button class="post-trigger" id="openPost" data-dom-id="btn-post">发布</button>
    </header>

    <main id="stream">
      <section class="cover-section">
        <div class="cover-frame" id="coverWrap">
          <div class="cover-frame-inner" id="coverInner">
            <div class="cover-doodle cover-doodle--tl" aria-hidden="true"><i data-lucide="sparkle" class="cover-doodle-icon"></i></div>
            <div class="cover-doodle cover-doodle--tr" aria-hidden="true"><i data-lucide="cloud" class="cover-doodle-icon"></i></div>
            <div class="cover-doodle cover-doodle--bl" aria-hidden="true"><i data-lucide="heart" class="cover-doodle-icon"></i></div>
            <div class="cover-doodle cover-doodle--br" aria-hidden="true"><i data-lucide="flower-2" class="cover-doodle-icon"></i></div>
          </div>
          <button class="cover-upload" id="coverUploadBtn" data-dom-id="btn-cover-upload" aria-label="更换封面">
            <i data-lucide="camera" class="cover-upload-icon"></i>
          </button>
          <input type="file" id="coverInput" accept="image/*" class="hidden" />
          <div class="cover-user">
            <span class="cover-name" id="coverName">我</span>
            <div class="cover-avatar-wrap">
              <div class="cover-avatar" id="coverAvatar"><i data-lucide="moon" class="cover-avatar-fallback"></i></div>
            </div>
          </div>
        </div>
      </section>

      <div class="rhythm-hint" id="rhythmHint"></div>

      <section class="moments-section" id="momentsList"></section>

      <div class="refresh-bar" id="refreshBar" style="display:none;">
        <button class="refresh-btn" id="refreshBtn" data-dom-id="btn-refresh">
          <i data-lucide="sparkles" class="refresh-icon"></i>
          <span>看看梦角有没有更新</span>
        </button>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="postModal">
    <div class="post-panel">
      <div class="panel-header">
        <span class="panel-title">发布朋友圈</span>
        <button class="panel-close" id="closePost" data-dom-id="btn-close-post" aria-label="关闭">
          <i data-lucide="x" class="panel-close-icon"></i>
        </button>
      </div>
      <textarea class="post-textarea" id="postText" placeholder="分享此刻的心情…" maxlength="300"></textarea>
      <img class="post-img-preview" id="postImgPreview" alt="" />
      <div class="post-tools">
        <button class="post-tool" id="addImgBtn" data-dom-id="btn-add-img">
          <i data-lucide="image-plus" class="post-tool-icon"></i>
          <span>添加配图</span>
        </button>
        <button class="post-tool" id="clearImgBtn" style="display:none;" data-dom-id="btn-clear-img">
          <i data-lucide="trash-2" class="post-tool-icon"></i>
          <span>清除图片</span>
        </button>
      </div>
      <input type="file" id="postImgInput" accept="image/*" class="hidden" />
      <button class="post-submit" id="submitPost" data-dom-id="btn-submit-post">发布</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <style type="text/tailwindcss">
    @layer base {
      * { -webkit-tap-highlight-color: transparent; }
      html { -webkit-font-smoothing: antialiased; }
      body {
        font-family: var(--font-sans);
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--secondary-bg);
        color: var(--text-primary);
      }
    }

    @layer components {
      :focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        border-radius: inherit;
      }

      #moments-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        background:
          radial-gradient(ellipse 600px 360px at 20% 0%, hsl(343 70% 94% / 0.9), transparent 60%),
          radial-gradient(ellipse 480px 300px at 90% 10%, hsl(343 60% 92% / 0.75), transparent 55%),
          linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      }

      #top-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 44px 16px 12px;
        background: linear-gradient(135deg, hsl(343 70% 96%), hsl(343 60% 94%));
        border-bottom: 1px dashed var(--border-color);
        box-shadow: var(--shadow-sm);
        position: relative;
        z-index: 10;
      }

      @media (max-width: 479px) {
        #top-bar { padding-top: 16px; }
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 15px;
        color: var(--accent-color);
        text-decoration: none;
        padding: 6px 4px;
        font-weight: 500;
        flex-shrink: 0;
        min-width: 56px;
        transition: transform 0.15s ease;
      }
      .back-btn:active { transform: translateX(-2px); }
      .back-icon { width: 18px; height: 18px; }

      .top-title {
        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 600;
        color: var(--text-primary);
        text-align: center;
        flex: 1;
        letter-spacing: 0.04em;
      }

      .post-trigger {
        flex-shrink: 0;
        min-width: 56px;
        text-align: right;
        font-size: 15px;
        color: var(--accent-color);
        font-weight: 600;
        background: none;
        border: none;
        padding: 6px 0;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .post-trigger:active { transform: scale(0.95); }

      #stream {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px 14px 24px;
        scrollbar-width: thin;
      }
      #stream::-webkit-scrollbar { width: 4px; }
      #stream::-webkit-scrollbar-track { background: transparent; }
      #stream::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

      .cover-section { margin-bottom: 24px; }

      .cover-frame {
        position: relative;
        width: 100%;
        padding: 8px;
        border-radius: 24px;
        background: linear-gradient(135deg, var(--accent-color), hsl(343 65% 82%));
        box-shadow: var(--shadow-md);
      }

      .cover-frame-inner {
        position: relative;
        width: 100%;
        height: 160px;
        border-radius: 18px;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 30%, hsl(343 60% 95% / 0.9), transparent 40%),
          radial-gradient(circle at 80% 70%, hsl(343 55% 92% / 0.8), transparent 45%),
          linear-gradient(135deg, hsl(343 70% 94%), hsl(343 60% 90%));
        border: 2px dashed hsl(0 0% 100% / 0.7);
      }
      .cover-frame-inner.has-image {
        background-size: cover;
        background-position: center;
      }

      .cover-doodle {
        position: absolute;
        font-size: 14px;
        color: hsl(0 0% 100% / 0.75);
        pointer-events: none;
        text-shadow: 0 1px 2px hsl(343 40% 55% / 0.15);
      }
      .cover-doodle--tl { top: 10px; left: 12px; transform: rotate(-12deg); }
      .cover-doodle--tr { top: 12px; right: 14px; transform: rotate(8deg); }
      .cover-doodle--bl { bottom: 10px; left: 14px; transform: rotate(6deg); }
      .cover-doodle--br { bottom: 12px; right: 12px; transform: rotate(-8deg); }

      .cover-upload {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        border: none;
        background: hsl(0 0% 100% / 0.85);
        color: var(--accent-color);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(4px);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .cover-upload:active { transform: scale(0.92); background: hsl(0 0% 100% / 0.95); }
      .cover-upload-icon { width: 16px; height: 16px; }

      .cover-user {
        position: absolute;
        right: 16px;
        bottom: -20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .cover-name {
        font-family: var(--font-serif);
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 1px 3px hsl(343 40% 45% / 0.25);
        margin-bottom: 22px;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cover-avatar-wrap {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        padding: 4px;
        background: conic-gradient(from 0deg, var(--accent-color), hsl(343 70% 88%), var(--accent-color));
        box-shadow: var(--shadow-md);
      }

      .cover-avatar {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(135deg, hsl(343 70% 95%), hsl(343 60% 88%));
        display: grid;
        place-items: center;
        font-size: 1.8rem;
        overflow: hidden;
        border: 2px dashed hsl(0 0% 100% / 0.8);
      }
      .cover-avatar img { width: 100%; height: 100%; object-fit: cover; }

      .rhythm-hint {
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        padding: 4px 0 12px;
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-secondary);
      }
      .empty-icon { font-size: 48px; opacity: 0.6; margin-bottom: 12px; }
      .empty-title { font-size: 15px; font-weight: 600; color: var(--accent-color); margin-bottom: 6px; }
      .empty-hint { font-size: 13px; }

      .moment-card {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
        padding: 14px;
        border-radius: 20px;
        background: hsl(0 0% 100% / 0.92);
        box-shadow: var(--shadow-sm);
        border: 1px dashed var(--border-color);
        animation: cardIn 0.35s cubic-bezier(.3,0,0,1) both;
        backdrop-filter: blur(4px);
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .moment-avatar-wrap {
        width: 46px;
        height: 46px;
        border-radius: 9999px;
        padding: 3px;
        background: conic-gradient(from 45deg, var(--accent-color), hsl(343 70% 90%), var(--accent-color));
        flex-shrink: 0;
      }

      .moment-avatar {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        display: grid;
        place-items: center;
        font-size: 1.25rem;
        background: linear-gradient(135deg, hsl(343 70% 95%), hsl(343 60% 88%));
        border: 2px dashed hsl(0 0% 100% / 0.8);
        overflow: hidden;
      }
      .moment-avatar img { width: 100%; height: 100%; object-fit: cover; }

      .moment-body { flex: 1; min-width: 0; }
      .moment-name {
        font-family: var(--font-serif);
        font-size: 15px;
        font-weight: 600;
        color: var(--accent-color);
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .moment-time {
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .moment-text {
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-primary);
        word-break: break-word;
        margin-bottom: 10px;
      }
      .moment-img {
        max-width: 100%;
        max-height: 240px;
        border-radius: 14px;
        object-fit: cover;
        margin-bottom: 12px;
        border: 2px dashed var(--border-color);
        background: hsl(0 0% 100%);
      }

      .moment-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 10px;
      }
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--text-secondary);
        background: none;
        border: none;
        padding: 4px 0;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease, transform 0.15s ease;
      }
      .action-btn:active { color: var(--accent-color); transform: scale(0.95); }
      .action-btn.liked { color: var(--accent-color); }

      .comment-box {
        background: hsl(343 40% 96% / 0.7);
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.55;
        border: 1px dashed hsl(343 45% 78% / 0.2);
      }
      .comment-line {
        display: flex;
        gap: 6px;
        margin-bottom: 4px;
        color: var(--text-primary);
      }
      .comment-line:last-child { margin-bottom: 0; }
      .comment-author {
        font-weight: 600;
        color: var(--accent-color);
        flex-shrink: 0;
      }
      .comment-text { color: var(--text-primary); word-break: break-word; }

      .comment-form {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .comment-input {
        flex: 1;
        height: 36px;
        padding: 0 14px;
        border-radius: 18px;
        border: 1px dashed var(--border-color);
        background: hsl(0 0% 100%);
        color: var(--text-primary);
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .comment-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px hsl(343 55% 78% / 0.15); }
      .comment-send {
        width: 36px; height: 36px;
        border-radius: 9999px;
        border: none;
        background: linear-gradient(135deg, var(--accent-color), hsl(343 65% 72%));
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s ease;
      }
      .comment-send:active { transform: scale(0.92); }

      .refresh-bar {
        display: flex;
        justify-content: center;
        padding: 6px 0 18px;
      }
      .refresh-btn {
        padding: 10px 24px;
        border-radius: 9999px;
        border: 1px dashed var(--border-color);
        background: hsl(0 0% 100% / 0.75);
        color: var(--accent-color);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .refresh-btn:active { transform: scale(0.96); background: hsl(343 55% 78% / 0.1); }
      .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .refresh-icon { width: 14px; height: 14px; }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: hsl(340 12% 18% / 0.35);
        backdrop-filter: blur(3px);
        z-index: 100;
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .modal-overlay.show { display: flex; }
      .post-panel {
        width: 100%;
        max-width: 480px;
        background: hsl(0 0% 100%);
        border-radius: 28px 28px 0 0;
        padding: 20px 16px 28px;
        transform: translateY(100%);
        transition: transform 0.25s ease;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: var(--shadow-xl);
      }
      .modal-overlay.show .post-panel { transform: translateY(0); }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .panel-title { font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--text-primary); }
      .panel-close {
        width: 32px; height: 32px;
        border-radius: 9999px;
        border: none;
        background: hsl(343 55% 78% / 0.1);
        color: var(--text-secondary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;
      }
      .panel-close:active { background: hsl(343 55% 78% / 0.18); }
      .panel-close-icon { width: 18px; height: 18px; }

      .post-textarea {
        width: 100%;
        min-height: 100px;
        max-height: 180px;
        padding: 12px;
        border-radius: 16px;
        border: 1px dashed var(--border-color);
        background: hsl(343 40% 97%);
        color: var(--text-primary);
        font-size: 14px;
        font-family: var(--font-sans);
        resize: none;
        outline: none;
        box-sizing: border-box;
        margin-bottom: 12px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .post-textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px hsl(343 55% 78% / 0.12); }
      .post-img-preview {
        width: 100%;
        max-height: 180px;
        border-radius: 14px;
        object-fit: cover;
        margin-bottom: 12px;
        border: 2px dashed var(--border-color);
        display: none;
      }
      .post-img-preview.show { display: block; }
      .post-tools {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .post-tool {
        padding: 8px 14px;
        border-radius: 9999px;
        border: 1px dashed var(--border-color);
        background: hsl(0 0% 100%);
        color: var(--text-primary);
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .post-tool:active { background: hsl(343 40% 96%); transform: scale(0.96); }
      .post-tool-icon { width: 15px; height: 15px; }
      .post-submit {
        width: 100%;
        height: 48px;
        border-radius: 9999px;
        border: none;
        background: linear-gradient(135deg, var(--accent-color), hsl(343 65% 72%));
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s ease;
      }
      .post-submit:active { transform: scale(0.98); }
      .post-submit:disabled { opacity: 0.5; cursor: not-allowed; }

      .toast {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--text-primary);
        color: #fff;
        padding: 10px 24px;
        border-radius: 9999px;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
        z-index: 300;
        white-space: nowrap;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .hidden { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    }
  </style>

  <script>lucide.createIcons();</script>
  <script>
    (function () {
      "use strict";

      var KEYS = {
        posts: "mengjiao_moments_posts",
        cards: "mengjiao_moments_cards",
        rhythm: "mengjiao_moments_rhythm",
        username: "mengjiao_username",
        avatarImg: "mengjiao_avatar_img",
        dreamImg: "mengjiao_dream_img",
        bgImg: "mengjiao_bg_img",
        partnerName: "mengjiao_partner_name"
      };

      var DEFAULT_CARDS = [
        { type: "text", text: "今天也在想你哦。" },
        { type: "text", text: "看到一朵很像你的云。" },
        { type: "text", text: "晚安，好梦。" },
        { type: "text", text: "你笑起来的时候，整个世界都亮了。" }
      ];
      var DEFAULT_RHYTHM = { minInterval: 60, maxInterval: 180, batchMin: 1, batchMax: 2 };
      var DEFAULT_CHAT_REPLIES = [
        "嗯嗯，我在听呢。", "我也这么觉得。", "抱抱你。", "看到你这条，心情变好了。",
        "好可爱呀。", "我在呢，一直都在。", "然后呢？", "真想陪在你身边。"
      ];

      function getItem(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v !== null && v !== "") return v;
        } catch (e) {}
        return fallback;
      }
      function setJSON(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      }
      function getJSON(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v) {
            var parsed = JSON.parse(v);
            if (parsed !== null && typeof parsed === "object") return parsed;
          }
        } catch (e) {}
        return fallback;
      }
      function getArr(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v) {
            var parsed = JSON.parse(v);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return fallback ? fallback.slice() : [];
      }
      function setArr(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function nowStr() { return new Date().toISOString(); }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function formatTime(iso) {
        var d = new Date(iso);
        var now = new Date();
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return "刚刚";
        if (diff < 3600) return Math.floor(diff / 60) + "分钟前";
        if (diff < 86400) return Math.floor(diff / 3600) + "小时前";
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return m + "月" + day + "日 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      var toastTimer;
      function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1800);
      }

      var username = getItem(KEYS.username, "我");
      var partnerName = getItem(KEYS.partnerName, "梦角");
      var myAvatar = getItem(KEYS.avatarImg, "");
      var dreamAvatar = getItem(KEYS.dreamImg, "");
      var bgImg = getItem(KEYS.bgImg, "");
      var cards = getArr(KEYS.cards, DEFAULT_CARDS);
      var rhythm = getJSON(KEYS.rhythm, DEFAULT_RHYTHM);
      var posts = getArr(KEYS.posts, []);
      var chatReplies = getArr("mengjiao_chat_replies", DEFAULT_CHAT_REPLIES);

      var coverInner = document.getElementById("coverInner");
      if (bgImg) {
        coverInner.style.backgroundImage = "url(" + bgImg + ")";
        coverInner.classList.add("has-image");
      }
      document.getElementById("coverName").textContent = username;
      var coverAvatar = document.getElementById("coverAvatar");
      if (myAvatar) coverAvatar.innerHTML = '<img src="' + myAvatar + '" alt="" />';
      else coverAvatar.innerHTML = '<i data-lucide="moon" class="cover-avatar-fallback"></i>';
      lucide.createIcons();

      document.getElementById("coverUploadBtn").addEventListener("click", function () {
        document.getElementById("coverInput").click();
      });
      document.getElementById("coverInput").addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return showToast("请选择图片");
        var reader = new FileReader();
        reader.onload = function (ev) {
          compressImage(ev.target.result, 1200, 0.85, function (small) {
            try { localStorage.setItem(KEYS.bgImg, small); } catch (e) {}
            coverInner.style.backgroundImage = "url(" + small + ")";
            coverInner.classList.add("has-image");
            showToast("封面已更新");
          });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      });

      var rhythmHint = document.getElementById("rhythmHint");
      rhythmHint.textContent = "梦角大约每 " + rhythm.minInterval + "-" + rhythm.maxInterval + " 分钟来一次朋友圈";

      function makeAvatar(isPartner) {
        var wrap = document.createElement("div");
        wrap.className = "moment-avatar-wrap";
        var el = document.createElement("div");
        el.className = "moment-avatar";
        var src = isPartner ? dreamAvatar : myAvatar;
        var fallbackIcon = isPartner ? "user" : "moon";
        if (src) el.innerHTML = '<img src="' + src + '" alt="" />';
        else el.innerHTML = '<i data-lucide="' + fallbackIcon + '" class="moment-avatar-fallback"></i>';
        wrap.appendChild(el);
        return wrap;
      }

      function renderMoment(post, container, prepend) {
        var card = document.createElement("article");
        card.className = "moment-card";
        card.dataset.id = post.id;
        var isPartner = post.author === "partner";

        card.appendChild(makeAvatar(isPartner));

        var body = document.createElement("div");
        body.className = "moment-body";

        var name = document.createElement("div");
        name.className = "moment-name";
        name.textContent = isPartner ? partnerName : username;
        body.appendChild(name);

        var time = document.createElement("div");
        time.className = "moment-time";
        time.textContent = formatTime(post.time);
        body.appendChild(time);

        var text = document.createElement("div");
        text.className = "moment-text";
        text.textContent = post.text;
        body.appendChild(text);

        if (post.image) {
          var img = document.createElement("img");
          img.className = "moment-img";
          img.src = post.image;
          img.alt = "";
          body.appendChild(img);
        }

        var actions = document.createElement("div");
        actions.className = "moment-actions";
        var liked = (post.likes || []).indexOf("me") !== -1;
        var likeBtn = document.createElement("button");
        likeBtn.className = "action-btn" + (liked ? " liked" : "");
        var likeIconClass = liked ? "like-icon like-icon--filled" : "like-icon";
        likeBtn.innerHTML = '<i data-lucide="heart" class="' + likeIconClass + '"></i> <span>' + (post.likes || []).length + '</span>';
        likeBtn.addEventListener("click", function () {
          toggleLike(post.id);
        });
        actions.appendChild(likeBtn);
        body.appendChild(actions);

        var commentBox = document.createElement("div");
        commentBox.className = "comment-box";
        var comments = post.comments || [];
        if (comments.length === 0) {
          commentBox.innerHTML = '<div class="comment-line" style="color:var(--text-secondary);">还没有评论，说点什么吧</div>';
        } else {
          commentBox.innerHTML = comments.map(function (c) {
            var name = c.author === "partner" ? partnerName : username;
            return '<div class="comment-line"><span class="comment-author">' + escapeHtml(name) + '：</span><span class="comment-text">' + escapeHtml(c.text) + '</span></div>';
          }).join("");
        }
        body.appendChild(commentBox);

        var form = document.createElement("div");
        form.className = "comment-form";
        var input = document.createElement("input");
        input.type = "text";
        input.className = "comment-input";
        input.placeholder = "评论…";
        input.maxLength = 120;
        var send = document.createElement("button");
        send.className = "comment-send";
        send.innerHTML = '<i data-lucide="send" class="comment-send-icon"></i>';
        send.addEventListener("click", function () {
          addComment(post.id, input.value);
          input.value = "";
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { send.click(); }
        });
        form.appendChild(input);
        form.appendChild(send);
        body.appendChild(form);

        card.appendChild(body);

        if (prepend && container.firstChild) {
          container.insertBefore(card, container.firstChild);
        } else {
          container.appendChild(card);
        }
      }

      function renderAll() {
        var list = document.getElementById("momentsList");
        list.innerHTML = "";
        if (posts.length === 0) {
          list.innerHTML = '<div class="empty-state"><i data-lucide="sparkles" class="empty-icon"></i><div class="empty-title">这里还空空如也</div><div class="empty-hint">发布第一条朋友圈，或等梦角来更新吧</div></div>';
          lucide.createIcons();
          return;
        }
        var sorted = posts.slice().sort(function (a, b) { return new Date(b.time) - new Date(a.time); });
        sorted.forEach(function (p) { renderMoment(p, list, false); });
        lucide.createIcons();
      }

      function toggleLike(id) {
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        post.likes = post.likes || [];
        var idx = post.likes.indexOf("me");
        if (idx === -1) post.likes.push("me");
        else post.likes.splice(idx, 1);
        setArr(KEYS.posts, posts);
        renderAll();
      }

      function addComment(id, text) {
        text = (text || "").trim();
        if (!text) return;
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        post.comments = post.comments || [];
        post.comments.push({ author: "me", text: text, time: nowStr() });
        setArr(KEYS.posts, posts);
        renderAll();

        setTimeout(function () {
          if (Math.random() < 0.8) {
            replyComment(id);
          }
        }, randInt(1200, 2500));
      }

      function replyComment(id) {
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) return;
        var lastReply = "";
        var cs = post.comments || [];
        for (var i = cs.length - 1; i >= 0; i--) {
          if (cs[i].author === "partner") { lastReply = cs[i].text; break; }
        }
        var pool = chatReplies.length ? chatReplies : DEFAULT_CHAT_REPLIES;
        var text;
        for (var k = 0; k < 5; k++) {
          text = pick(pool);
          if (text !== lastReply) break;
        }
        post.comments.push({ author: "partner", text: text, time: nowStr() });
        setArr(KEYS.posts, posts);
        renderAll();
        showToast(partnerName + " 回复了你");
      }

      function partnerShouldPost() {
        var lastKey = "mengjiao_moments_last_partner";
        var last = 0;
        try {
          var v = localStorage.getItem(lastKey);
          if (v) last = parseInt(v, 10) || 0;
        } catch (e) {}
        var now = Date.now();
        var intervalMin = Math.max(1, rhythm.minInterval || 60);
        var intervalMax = Math.max(intervalMin, rhythm.maxInterval || 180);
        var needed = intervalMin * 60 * 1000;
        return now - last >= needed;
      }
      function recordPartnerPost() {
        try { localStorage.setItem("mengjiao_moments_last_partner", String(Date.now())); } catch (e) {}
      }

      function generatePartnerPosts(force) {
        if (!force && !partnerShouldPost()) return 0;
        if (cards.length === 0) return 0;

        var batchMin = Math.max(1, rhythm.batchMin || 1);
        var batchMax = Math.max(batchMin, rhythm.batchMax || 2);
        var count = randInt(batchMin, batchMax);
        var added = 0;
        for (var i = 0; i < count; i++) {
          var card = pick(cards);
          var post = {
            id: Date.now() + i,
            author: "partner",
            text: card.text,
            image: card.image || "",
            time: new Date(Date.now() - i * randInt(30000, 120000)).toISOString(),
            likes: [],
            comments: []
          };
          posts.push(post);
          added++;
        }
        setArr(KEYS.posts, posts);
        recordPartnerPost();
        return added;
      }

      var postModal = document.getElementById("postModal");
      var postText = document.getElementById("postText");
      var postImgPreview = document.getElementById("postImgPreview");
      var postImgInput = document.getElementById("postImgInput");
      var addImgBtn = document.getElementById("addImgBtn");
      var clearImgBtn = document.getElementById("clearImgBtn");
      var tempPostImg = "";

      document.getElementById("openPost").addEventListener("click", function () {
        postModal.classList.add("show");
        postText.focus();
      });
      document.getElementById("closePost").addEventListener("click", function () {
        postModal.classList.remove("show");
      });
      postModal.addEventListener("click", function (e) {
        if (e.target === postModal) postModal.classList.remove("show");
      });

      addImgBtn.addEventListener("click", function () { postImgInput.click(); });
      postImgInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return showToast("请选择图片");
        var reader = new FileReader();
        reader.onload = function (ev) {
          compressImage(ev.target.result, 1200, 0.85, function (small) {
            tempPostImg = small;
            postImgPreview.src = small;
            postImgPreview.classList.add("show");
            addImgBtn.style.display = "none";
            clearImgBtn.style.display = "inline-flex";
          });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      });
      clearImgBtn.addEventListener("click", function () {
        tempPostImg = "";
        postImgPreview.src = "";
        postImgPreview.classList.remove("show");
        addImgBtn.style.display = "inline-flex";
        clearImgBtn.style.display = "none";
      });

      document.getElementById("submitPost").addEventListener("click", function () {
        var text = postText.value.trim();
        if (!text && !tempPostImg) return showToast("写点什么或配张图吧");
        var post = {
          id: Date.now(),
          author: "me",
          text: text || "分享了一张图片",
          image: tempPostImg,
          time: nowStr(),
          likes: [],
          comments: []
        };
        posts.push(post);
        setArr(KEYS.posts, posts);
        postText.value = "";
        clearImgBtn.click();
        postModal.classList.remove("show");
        renderAll();
        showToast("发布成功");

        try { (function(){var K="mengjiao_spark";var D=JSON.parse(localStorage.getItem(K)||"{}");var T=new Date();var t=T.getFullYear()+"-"+String(T.getMonth()+1).padStart(2,"0")+"-"+String(T.getDate()).padStart(2,"0");D.daily=D.daily||{};D.daily[t]=D.daily[t]||{chat:0,cards:0,moments:0};if(D.daily[t].moments<2){D.daily[t].moments++;D.totalInteractions=(D.totalInteractions||0)+1;D.exp=(D.exp||0)+8;D.totalExp=(D.totalExp||0)+8;if(t!==D.lastActiveDate){if(D.lastActiveDate===yesterday())D.streak=(D.streak||0)+1;else D.streak=1;D.lastActiveDate=t;}else if(!D.streak)D.streak=1;var L=[{lv:1,need:50},{lv:2,need:150},{lv:3,need:350},{lv:4,need:700},{lv:5,need:1200},{lv:6,need:2000}];while(D.level<7&&D.exp>=L[D.level-1].need){D.exp-=L[D.level-1].need;D.level++;}localStorage.setItem(K,JSON.stringify(D));}function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
        })(); } catch (e) {}
      });

      function compressImage(dataUrl, maxSize, quality, cb) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement("canvas");
          var w = img.width, h = img.height;
          if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
          else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function () { cb(dataUrl); };
        img.src = dataUrl;
      }

      document.getElementById("refreshBtn").addEventListener("click", function () {
        var added = generatePartnerPosts(true);
        renderAll();
        showToast(added ? partnerName + " 更新了 " + added + " 条朋友圈" : "梦角还没有更新");
      });

      generatePartnerPosts(false);
      renderAll();
      document.getElementById("refreshBar").style.display = "flex";
    })();
  </script>
