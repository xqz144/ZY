<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦角传讯</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Project token system -->
  <link rel="stylesheet" href="../colors_and_type.css" />

  <!-- Tailwind + token bridge -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['"DreamFont", "Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont", "Noto Serif SC"', 'ui-serif', 'Georgia', 'serif']
          },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
    }

    /* Phone frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 20% 12%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* App background — dreamy purple gradient with starlight */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 400px 250px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 6px;
      font-size: 13px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    /* Personal banner */
    .banner {
      position: relative;
      margin: 8px 16px 0;
      padding: 20px 20px 24px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(140deg, hsl(343 46% 48%), hsl(343 52% 36%));
      box-shadow: 0 8px 24px -8px hsl(343 40% 35% / 0.3);
    }
    .banner-stars {
      position: absolute; inset: 0; pointer-events: none;
    }
    .banner-stars span {
      position: absolute; border-radius: 9999px;
      background: #fff5f8;
      animation: twinkle 3.5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.65; transform: scale(1.1); }
    }

    .banner-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
    .avatar-circle {
      width: 56px; height: 56px; border-radius: 9999px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 1.5rem;
      background: radial-gradient(circle at 30% 25%, #ffe4ec, #f4a0bc);
      outline: 3px solid rgba(255, 240, 244, 0.25);
      outline-offset: 1px;
    }
    .banner-name { color: #ffffff; }
    .banner-sig { color: hsl(343 50% 92%); font-size: 12px; margin-top: 2px; }
    .banner-days {
      display: flex; align-items: baseline; gap: 4px;
      margin-top: 16px; position: relative; z-index: 1;
    }
    .banner-days-num {
      font-family: var(--font-serif);
      font-size: 2.5rem; font-weight: 700;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .banner-days-label { color: hsl(343 50% 90%); font-size: 13px; }

    /* Section label */
    .section-label {
      padding: 20px 24px 10px;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    /* App icon grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 4px;
      padding: 4px 16px 8px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .app-item:active { transform: scale(0.92); background: hsl(var(--accent) / 0.4); }
    .app-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: grid; place-items: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 12px -3px rgba(232, 116, 154, 0.2);
      transition: box-shadow 0.2s;
    }
    .app-item:active .app-icon { box-shadow: 0 2px 6px -2px rgba(232, 116, 154, 0.15); }
    .app-label {
      font-size: 11px;
      color: hsl(var(--foreground));
      text-align: center;
      line-height: 1.3;
    }

    /* Dock */
    .dock {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: auto 16px 12px;
      padding: 12px 16px;
      border-radius: 28px;
      background: rgba(255, 240, 244, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid hsl(var(--border));
    }
    .dock-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; cursor: pointer;
      transition: transform 0.1s;
    }
    .dock-item:active { transform: scale(0.9); }
    .dock-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 10px -3px rgba(232, 116, 154, 0.18);
    }
    .dock-label { font-size: 10px; color: hsl(var(--muted-foreground)); }

    /* Home indicator */
    .home-indicator {
      display: flex; justify-content: center; padding: 6px 0 10px;
    }
    .home-indicator span {
      width: 130px; height: 4px; border-radius: 9999px;
      background: hsl(var(--foreground) / 0.25);
    }

    /* Entrance animation */
    @keyframes appFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .app-item, .dock-item {
      animation: appFadeIn 0.4s cubic-bezier(0.3, 0, 0, 1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg">

      <!-- Status bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <span>5G</span>
          <span>●</span>
          <span>85%</span>
        </div>
      </div>

      <!-- Personal banner -->
      <div class="banner">
        <div class="banner-stars">
          <span style="top:12%;left:8%;width:3px;height:3px;animation-delay:0s"></span>
          <span style="top:20%;left:78%;width:2px;height:2px;animation-delay:0.6s"></span>
          <span style="top:35%;left:90%;width:3px;height:3px;animation-delay:1.2s"></span>
          <span style="top:60%;left:5%;width:2px;height:2px;animation-delay:1.8s"></span>
          <span style="top:75%;left:85%;width:3px;height:3px;animation-delay:0.9s"></span>
          <span style="top:85%;left:15%;width:2px;height:2px;animation-delay:2.4s"></span>
        </div>
        <div class="banner-row">
          <div class="avatar-circle">🌙</div>
          <div>
            <div class="banner-name font-medium">@my_profile</div>
            <div class="banner-sig italic">今天也要加油呀 ✨</div>
          </div>
        </div>
        <div class="banner-days">
          <span class="banner-days-num">769</span>
          <span class="banner-days-label">天 · 在一起</span>
        </div>
      </div>

      <!-- Section: 传讯 -->
      <div class="section-label">传讯</div>
      <div class="app-grid">
        <a href="cards-new.html" class="app-item" style="animation-delay:0.05s">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 65% 72%),hsl(343 55% 58%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🃏</span>
          </div>
          <span class="app-label">字卡传讯</span>
        </a>
        <a href="chat-new.html" class="app-item" style="animation-delay:0.1s">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 60% 74%),hsl(343 50% 60%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">💬</span>
          </div>
          <span class="app-label">梦角对话</span>
        </a>
        <a href="customize-new.html" class="app-item" style="animation-delay:0.15s">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 55% 76%),hsl(343 45% 62%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🎨</span>
          </div>
          <span class="app-label">自定义</span>
        </a>
        <div class="app-item" style="animation-delay:0.2s;opacity:0.55;">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 50% 80%),hsl(343 40% 66%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">📖</span>
          </div>
          <span class="app-label">传讯记录</span>
        </div>
      </div>

      <!-- Section: 日记 -->
      <div class="section-label">日记</div>
      <div class="app-grid">
        <div class="app-item" style="animation-delay:0.25s;opacity:0.55;">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 60% 75%),hsl(343 50% 62%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">📔</span>
          </div>
          <span class="app-label">梦境日记</span>
        </div>
        <div class="app-item" style="animation-delay:0.3s;opacity:0.55;">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 55% 78%),hsl(343 45% 64%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">⭐</span>
          </div>
          <span class="app-label">纪念日</span>
        </div>
        <div class="app-item" style="animation-delay:0.35s;opacity:0.55;">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 50% 80%),hsl(343 40% 66%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🎶</span>
          </div>
          <span class="app-label">背景音乐</span>
        </div>
        <div class="app-item" style="animation-delay:0.4s;opacity:0.55;">
          <div class="app-icon" style="background:linear-gradient(145deg,hsl(343 58% 76%),hsl(343 48% 63%));">
            <span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));">🕯️</span>
          </div>
          <span class="app-label">心愿</span>
        </div>
      </div>

      <!-- Dock -->
      <div class="dock">
        <a href="cards-new.html" class="dock-item" style="animation-delay:0.45s">
          <div class="dock-icon" style="background:linear-gradient(145deg,hsl(343 65% 72%),hsl(343 55% 58%));">🃏</div>
          <span class="dock-label">字卡</span>
        </a>
        <a href="chat-new.html" class="dock-item" style="animation-delay:0.5s">
          <div class="dock-icon" style="background:linear-gradient(145deg,hsl(343 60% 74%),hsl(343 50% 60%));">💬</div>
          <span class="dock-label">对话</span>
        </a>
        <a href="customize-new.html" class="dock-item" style="animation-delay:0.55s">
          <div class="dock-icon" style="background:linear-gradient(145deg,hsl(343 55% 76%),hsl(343 45% 62%));">🎨</div>
          <span class="dock-label">自定义</span>
        </a>
      </div>

      <!-- Home indicator -->
      <div class="home-indicator">
        <span></span>
      </div>

    </div>
  </div>

  <script>
    // Prevent pull-to-refresh interfering with app feel
    document.body.addEventListener('touchmove', function(e) {
      if (e.target.closest('.app-bg')) return;
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
