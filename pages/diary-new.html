<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梦境日记 · 梦角传讯</title>

  <!-- Fonts: Noto Serif SC (headings) + Noto Sans SC (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Project token system (single hue: 柔粉 #e8749a) -->
  <link rel="stylesheet" href="../colors_and_type.css" />

  <!-- Tailwind + token bridge -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            sans: ['"DreamFont", "Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"DreamFont", "Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
          },
          borderRadius: { sm: '4px', md: '8px', lg: '12px', xl: '12px' },
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      letter-spacing: var(--tracking-normal);
    }

    /* ===== Phone frame ===== */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 20% 12%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ===== App background — dreamy pink gradient ===== */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 400px 250px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* ===== Starlight background (sparse, low opacity, twinkle) ===== */
    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight span {
      position: absolute; border-radius: 9999px;
      background: hsl(343 72% 68% / 0.4);
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* ===== Top bar ===== */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 8px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: var(--accent-color);
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .back-btn:active { transform: scale(0.97); opacity: 0.7; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .top-spacer { min-width: 64px; flex-shrink: 0; }

    .page-subtitle {
      position: relative; z-index: 1;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 24px 4px;
      flex-shrink: 0;
    }

    /* ===== Diary list ===== */
    .diary-list {
      position: relative;
      z-index: 1;
      padding: 10px 16px 110px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .diary-card {
      position: relative;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(var(--accent-color-rgb), 0.15);
      border-radius: 18px;
      padding: 15px 16px 14px;
      box-shadow: 0 6px 18px -8px rgba(var(--accent-color-rgb), 0.18);
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.45s cubic-bezier(0.3, 0, 0, 1) forwards;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .diary-card:active {
      transform: scale(0.97);
      box-shadow: 0 3px 10px -6px rgba(var(--accent-color-rgb), 0.18);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-del {
      position: absolute;
      top: 10px; right: 10px;
      width: 26px; height: 26px;
      border-radius: 9999px;
      border: none;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1;
      display: grid; place-items: center;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      z-index: 2;
    }
    .card-del:active { transform: scale(0.97); background: rgba(var(--accent-color-rgb), 0.28); }

    .card-head { display: flex; align-items: flex-start; gap: 10px; padding-right: 30px; }
    .card-mood { font-size: 28px; line-height: 1.1; flex-shrink: 0; }
    .card-head-text { flex: 1; min-width: 0; }
    .card-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-date {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .card-body { display: flex; gap: 12px; margin-top: 10px; align-items: flex-end; }
    .card-content {
      flex: 1;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-thumb {
      width: 60px; height: 60px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 8px -2px rgba(var(--accent-color-rgb), 0.25);
    }

    /* ===== Empty state ===== */
    .empty-state {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 32px;
      gap: 16px;
    }
    .empty-emoji { font-size: 64px; line-height: 1; opacity: 0.9; animation: floatSlow 4s ease-in-out infinite; }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .empty-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
      white-space: pre-line;
    }

    /* ===== Floating add button ===== */
    .fab {
      position: absolute;
      bottom: 26px; right: 20px;
      width: 56px; height: 56px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(145deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      display: grid; place-items: center;
      box-shadow: 0 8px 20px -4px rgba(var(--accent-color-rgb), 0.5);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .fab:active { transform: scale(0.97); box-shadow: 0 4px 12px -4px rgba(var(--accent-color-rgb), 0.4); }

    /* ===== Home indicator ===== */
    .home-indicator {
      position: absolute;
      bottom: 7px; left: 0; right: 0;
      display: flex; justify-content: center;
      pointer-events: none;
      z-index: 5;
    }
    .home-indicator span {
      width: 130px; height: 4px; border-radius: 9999px;
      background: rgba(61, 32, 48, 0.16);
    }

    /* ===== Bottom sheet ===== */
    .sheet-overlay {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(61, 32, 48, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet-panel {
      background: #fff;
      border-radius: 24px 24px 0 0;
      max-height: 85%; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(.3,0,0,1);
      overflow: hidden;
    }
    .sheet-overlay.open .sheet-panel { transform: translateY(0); }

    .sheet-handle {
      width: 40px; height: 4px; border-radius: 9999px;
      background: rgba(var(--accent-color-rgb), 0.25);
      margin: 10px auto 4px;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 20px 12px;
      flex-shrink: 0;
    }
    .sheet-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .sheet-close {
      width: 30px; height: 30px;
      border-radius: 9999px;
      border: none;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      display: grid; place-items: center;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .sheet-close:active { transform: scale(0.97); background: rgba(var(--accent-color-rgb), 0.22); }

    .sheet-body {
      padding: 4px 20px 26px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    .sheet-body::-webkit-scrollbar { display: none; }

    .field-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: block;
    }
    .field-group { margin-bottom: 18px; }

    .input-field {
      width: 100%;
      border: 1px solid rgba(var(--accent-color-rgb), 0.2);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: rgba(var(--accent-color-rgb), 0.03);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      box-sizing: border-box;
    }
    .input-field:focus {
      border-color: var(--accent-color);
      background: #fff;
    }
    .input-field::placeholder { color: var(--text-secondary); opacity: 0.7; }

    textarea.input-field {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }
    input[type="date"].input-field { color: var(--text-primary); }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }
    .mood-btn {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 12px;
      background: rgba(var(--accent-color-rgb), 0.06);
      font-size: 22px;
      line-height: 1;
      display: grid; place-items: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }
    .mood-btn:active { transform: scale(0.97); }
    .mood-btn.selected {
      border-color: var(--accent-color);
      background: rgba(var(--accent-color-rgb), 0.12);
    }

    .img-upload-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .img-upload-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(var(--accent-color-rgb), 0.4);
      background: rgba(var(--accent-color-rgb), 0.04);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .img-upload-btn:active { transform: scale(0.97); background: rgba(var(--accent-color-rgb), 0.1); }

    .img-preview-wrap {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px -2px rgba(var(--accent-color-rgb), 0.25);
    }
    .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .img-remove {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px;
      border-radius: 9999px;
      border: none;
      background: rgba(61, 32, 48, 0.6);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      display: grid; place-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .img-remove:active { transform: scale(0.97); }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(145deg, #f4a0bc, #e8749a);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 6px 16px -4px rgba(var(--accent-color-rgb), 0.45);
      transition: transform 0.1s, box-shadow 0.12s;
    }
    .save-btn:active { transform: scale(0.97); box-shadow: 0 3px 10px -4px rgba(var(--accent-color-rgb), 0.4); }

    /* ===== Toast ===== */
    .toast {
      position: absolute;
      bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(61, 32, 48, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 13px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Confirm dialog ===== */
    .confirm-overlay {
      position: absolute; inset: 0; z-index: 250;
      background: rgba(61, 32, 48, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      padding: 32px;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: auto; }
    .confirm-box {
      background: #fff;
      border-radius: 18px;
      padding: 24px 24px 18px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.2s;
    }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-text {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .confirm-actions { display: flex; gap: 12px; }
    .confirm-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .confirm-btn:active { transform: scale(0.97); }
    .confirm-cancel {
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
    }
    .confirm-ok {
      background: linear-gradient(145deg, #f4a0bc, #e8749a);
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .diary-card { opacity: 1; transform: none; }
      .empty-emoji { animation: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bg" id="appBg">
      <!-- Starlight -->
      <div class="starlight">
        <span style="top:6%;left:12%;width:3px;height:3px;animation-delay:0s"></span>
        <span style="top:10%;left:80%;width:2px;height:2px;animation-delay:0.8s"></span>
        <span style="top:18%;left:55%;width:3px;height:3px;animation-delay:1.4s"></span>
        <span style="top:30%;left:8%;width:2px;height:2px;animation-delay:2.1s"></span>
        <span style="top:42%;left:90%;width:3px;height:3px;animation-delay:0.5s"></span>
        <span style="top:60%;left:18%;width:2px;height:2px;animation-delay:1.7s"></span>
        <span style="top:72%;left:70%;width:3px;height:3px;animation-delay:2.6s"></span>
        <span style="top:85%;left:40%;width:2px;height:2px;animation-delay:1.1s"></span>
      </div>

      <!-- Top bar -->
      <div class="top-bar">
        <a href="index-new.html" class="back-btn">← 返回</a>
        <div class="top-title">梦境日记</div>
        <div class="top-spacer"></div>
      </div>
      <div class="page-subtitle">记录每一个温柔的梦 ✨</div>

      <!-- Diary list / empty state -->
      <div id="listContainer" class="diary-list" style="display:none;"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-emoji">📔</div>
        <div class="empty-text">还没有梦境日记
点击下方按钮写下第一篇吧</div>
      </div>
    </div>

    <!-- Floating add button -->
    <button class="fab" id="fab" aria-label="添加日记">+</button>

    <!-- Home indicator -->
    <div class="home-indicator"><span></span></div>

    <!-- Bottom sheet (add / edit) -->
    <div class="sheet-overlay" id="sheetOverlay">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title" id="sheetTitle">写梦境日记</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
        </div>
        <div class="sheet-body">
          <div class="field-group">
            <label class="field-label">日期</label>
            <input type="date" class="input-field" id="fDate" />
          </div>
          <div class="field-group">
            <label class="field-label">标题</label>
            <input type="text" class="input-field" id="fTitle" maxlength="30" placeholder="给这个梦起个名字…" />
          </div>
          <div class="field-group">
            <label class="field-label">心情</label>
            <div class="mood-grid" id="moodGrid"></div>
          </div>
          <div class="field-group">
            <label class="field-label">梦境内容</label>
            <textarea class="input-field" id="fContent" maxlength="500" placeholder="写下梦境的内容…"></textarea>
          </div>
          <div class="field-group">
            <label class="field-label">图片（可选）</label>
            <div class="img-upload-area" id="imgArea">
              <button type="button" class="img-upload-btn" id="imgUploadBtn">📷 添加图片</button>
              <input type="file" id="imgInput" accept="image/*" style="display:none;" />
            </div>
          </div>
          <button class="save-btn" id="saveBtn">保存日记</button>
        </div>
      </div>
    </div>

    <!-- Confirm dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box">
        <div class="confirm-text">确定删除这篇日记吗？</div>
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" id="confirmCancel">取消</button>
          <button class="confirm-btn confirm-ok" id="confirmOk">删除</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_dream_diary";
      var MOODS = ["😴", "🌸", "⭐", "🌙", "💫", "🌧️", "✨", "🎵"];

      var state = {
        entries: [],
        editingId: null,
        selectedMood: "🌸",
        currentImage: null,
        pendingDeleteId: null
      };

      // ---- DOM refs ----
      var listContainer = document.getElementById("listContainer");
      var emptyState = document.getElementById("emptyState");
      var fab = document.getElementById("fab");
      var sheetOverlay = document.getElementById("sheetOverlay");
      var sheetClose = document.getElementById("sheetClose");
      var sheetTitle = document.getElementById("sheetTitle");
      var fDate = document.getElementById("fDate");
      var fTitle = document.getElementById("fTitle");
      var fContent = document.getElementById("fContent");
      var moodGrid = document.getElementById("moodGrid");
      var imgArea = document.getElementById("imgArea");
      var imgUploadBtn = document.getElementById("imgUploadBtn");
      var imgInput = document.getElementById("imgInput");
      var saveBtn = document.getElementById("saveBtn");
      var toast = document.getElementById("toast");
      var confirmOverlay = document.getElementById("confirmOverlay");
      var confirmOk = document.getElementById("confirmOk");
      var confirmCancel = document.getElementById("confirmCancel");

      // ---- Storage ----
      function loadEntries() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }
      function saveEntries(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
          return true;
        } catch (e) {
          showToast("存储已满，请删除旧日记");
          return false;
        }
      }

      // ---- Date helpers ----
      function todayStr() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function formatDate(dateStr) {
        if (!dateStr) return "";
        var parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        var d = parseInt(parts[2], 10);
        var nowY = new Date().getFullYear();
        if (y === nowY) return m + "月" + d + "日";
        return y + "年" + m + "月" + d + "日";
      }

      // ---- Toast ----
      var toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      // ---- Render list ----
      function renderList() {
        // sort by date descending; same date => newer id first
        state.entries.sort(function (a, b) {
          if (a.date === b.date) return (Number(b.id) || 0) - (Number(a.id) || 0);
          return a.date < b.date ? 1 : -1;
        });

        if (state.entries.length === 0) {
          listContainer.style.display = "none";
          emptyState.style.display = "flex";
          return;
        }
        emptyState.style.display = "none";
        listContainer.style.display = "flex";
        listContainer.innerHTML = "";

        state.entries.forEach(function (entry, idx) {
          var card = document.createElement("div");
          card.className = "diary-card";
          card.style.animationDelay = (idx * 0.06) + "s";

          var head = document.createElement("div");
          head.className = "card-head";

          var mood = document.createElement("div");
          mood.className = "card-mood";
          mood.textContent = entry.mood || "🌙";

          var headText = document.createElement("div");
          headText.className = "card-head-text";

          var title = document.createElement("div");
          title.className = "card-title";
          title.textContent = entry.title || "无题";

          var dateEl = document.createElement("div");
          dateEl.className = "card-date";
          dateEl.textContent = formatDate(entry.date);

          headText.appendChild(title);
          headText.appendChild(dateEl);
          head.appendChild(mood);
          head.appendChild(headText);

          var del = document.createElement("button");
          del.className = "card-del";
          del.textContent = "×";
          del.setAttribute("aria-label", "删除");

          var body = document.createElement("div");
          body.className = "card-body";

          var content = document.createElement("div");
          content.className = "card-content";
          content.textContent = entry.content || "";

          body.appendChild(content);

          if (entry.image) {
            var thumb = document.createElement("img");
            thumb.className = "card-thumb";
            thumb.src = entry.image;
            thumb.alt = "";
            body.appendChild(thumb);
          }

          card.appendChild(head);
          card.appendChild(del);
          card.appendChild(body);

          // tap card -> open edit mode
          card.addEventListener("click", function (e) {
            if (e.target === del || del.contains(e.target)) return;
            openSheet(entry);
          });
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            askDelete(entry.id);
          });

          listContainer.appendChild(card);
        });
      }

      // ---- Mood picker ----
      function buildMoodGrid() {
        moodGrid.innerHTML = "";
        MOODS.forEach(function (m) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mood-btn";
          btn.textContent = m;
          btn.dataset.mood = m;
          btn.addEventListener("click", function () {
            state.selectedMood = m;
            updateMoodSelection();
          });
          moodGrid.appendChild(btn);
        });
      }
      function updateMoodSelection() {
        var btns = moodGrid.querySelectorAll(".mood-btn");
        btns.forEach(function (b) {
          if (b.dataset.mood === state.selectedMood) b.classList.add("selected");
          else b.classList.remove("selected");
        });
      }

      // ---- Sheet ----
      function openSheet(entry) {
        if (entry) {
          state.editingId = entry.id;
          state.selectedMood = entry.mood || "🌸";
          state.currentImage = entry.image || null;
          fDate.value = entry.date || todayStr();
          fTitle.value = entry.title || "";
          fContent.value = entry.content || "";
          sheetTitle.textContent = "编辑日记";
        } else {
          state.editingId = null;
          state.selectedMood = "🌸";
          state.currentImage = null;
          fDate.value = todayStr();
          fTitle.value = "";
          fContent.value = "";
          sheetTitle.textContent = "写梦境日记";
        }
        updateMoodSelection();
        renderImgArea();
        sheetOverlay.classList.add("open");
      }
      function closeSheet() {
        sheetOverlay.classList.remove("open");
      }

      function renderImgArea() {
        var prev = imgArea.querySelector(".img-preview-wrap");
        if (prev) prev.remove();

        if (state.currentImage) {
          var wrap = document.createElement("div");
          wrap.className = "img-preview-wrap";
          var img = document.createElement("img");
          img.src = state.currentImage;
          img.alt = "";
          var rm = document.createElement("button");
          rm.className = "img-remove";
          rm.textContent = "×";
          rm.setAttribute("aria-label", "移除图片");
          rm.addEventListener("click", function () {
            state.currentImage = null;
            renderImgArea();
          });
          wrap.appendChild(img);
          wrap.appendChild(rm);
          imgArea.appendChild(wrap);
          imgUploadBtn.style.display = "none";
        } else {
          imgUploadBtn.style.display = "inline-flex";
        }
      }

      // ---- Image handling (compress via canvas) ----
      function handleImageFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            var maxW = 900;
            var scale = 1;
            if (img.width > maxW) scale = maxW / img.width;
            var canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            try {
              var dataUrl = canvas.toDataURL("image/jpeg", 0.8);
              state.currentImage = dataUrl;
              renderImgArea();
            } catch (err) {
              showToast("图片处理失败");
            }
          };
          img.onerror = function () { showToast("图片加载失败"); };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ---- Save ----
      function saveEntry() {
        var title = fTitle.value.trim();
        var content = fContent.value.trim();
        var date = fDate.value || todayStr();

        if (!title && !content) {
          showToast("请填写标题或内容");
          return;
        }

        var isEdit = !!state.editingId;

        if (isEdit) {
          for (var i = 0; i < state.entries.length; i++) {
            if (String(state.entries[i].id) === String(state.editingId)) {
              state.entries[i].date = date;
              state.entries[i].title = title;
              state.entries[i].mood = state.selectedMood;
              state.entries[i].content = content;
              state.entries[i].image = state.currentImage;
              break;
            }
          }
        } else {
          state.entries.push({
            id: Date.now(),
            date: date,
            title: title,
            mood: state.selectedMood,
            content: content,
            image: state.currentImage
          });
        }

        if (!saveEntries(state.entries)) return;
        renderList();
        closeSheet();
        showToast(isEdit ? "已保存" : "已保存");
      }

      // ---- Delete ----
      function askDelete(id) {
        state.pendingDeleteId = id;
        confirmOverlay.classList.add("open");
      }
      function doDelete() {
        if (state.pendingDeleteId == null) return;
        state.entries = state.entries.filter(function (e) {
          return String(e.id) !== String(state.pendingDeleteId);
        });
        saveEntries(state.entries);
        state.pendingDeleteId = null;
        confirmOverlay.classList.remove("open");
        renderList();
        showToast("已删除");
      }

      // ---- Events ----
      fab.addEventListener("click", function () { openSheet(null); });
      sheetClose.addEventListener("click", closeSheet);
      sheetOverlay.addEventListener("click", function (e) {
        if (e.target === sheetOverlay) closeSheet();
      });
      saveBtn.addEventListener("click", saveEntry);
      imgUploadBtn.addEventListener("click", function () { imgInput.click(); });
      imgInput.addEventListener("change", function () {
        if (imgInput.files && imgInput.files[0]) {
          handleImageFile(imgInput.files[0]);
          imgInput.value = "";
        }
      });
      confirmOk.addEventListener("click", doDelete);
      confirmCancel.addEventListener("click", function () {
        state.pendingDeleteId = null;
        confirmOverlay.classList.remove("open");
      });
      confirmOverlay.addEventListener("click", function (e) {
        if (e.target === confirmOverlay) {
          state.pendingDeleteId = null;
          confirmOverlay.classList.remove("open");
        }
      });

      // prevent background scroll when sheet / confirm open
      document.addEventListener("touchmove", function (e) {
        var inSheetBody = e.target.closest && e.target.closest(".sheet-body");
        if (sheetOverlay.classList.contains("open") && !inSheetBody) {
          e.preventDefault();
        }
      }, { passive: false });

      // ---- Init ----
      buildMoodGrid();
      state.entries = loadEntries();
      renderList();
    })();
  </script>
</body>
</html>
