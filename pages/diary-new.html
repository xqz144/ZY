<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境日记 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      letter-spacing: var(--tracking-normal);
    }

    /* ===== Phone frame ===== */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 24% 24%);
        box-shadow: 0 25px 60px -15px hsl(343 40% 35% / 0.28), 0 0 0 2px hsl(343 18% 14%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 22% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    /* ===== App background — soft sketch paper ===== */
    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 520px 320px at 18% 2%, hsl(343 60% 92% / 0.7), transparent 60%),
        radial-gradient(ellipse 420px 260px at 92% 8%, hsl(343 55% 90% / 0.55), transparent 55%),
        radial-gradient(ellipse 300px 200px at 70% 100%, hsl(343 50% 92% / 0.5), transparent 50%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    /* ===== Hand-drawn decorations ===== */
    .deco-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .deco-star {
      position: absolute;
      color: var(--accent-color);
      opacity: 0.35;
      animation: floatStar 5s ease-in-out infinite;
    }
    .deco-heart {
      position: absolute;
      color: var(--accent-color);
      opacity: 0.25;
      animation: floatHeart 6s ease-in-out infinite;
    }
    .deco-sparkle {
      position: absolute;
      color: var(--accent-color);
      opacity: 0.3;
      animation: sparkle 4s ease-in-out infinite;
    }
    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(12deg); }
    }
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }

    /* ===== Top bar ===== */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--accent-color);
      text-decoration: none;
      flex-shrink: 0;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(var(--accent-color-rgb), 0.2); }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
      line-height: 1.2;
    }
    .top-spacer { width: 36px; flex-shrink: 0; }

    .page-subtitle {
      position: relative; z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 24px 8px;
      flex-shrink: 0;
    }

    /* ===== Diary list ===== */
    .diary-list {
      position: relative;
      z-index: 1;
      padding: 10px 16px 110px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .diary-card {
      position: relative;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(var(--accent-color-rgb), 0.18);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 5px 16px -6px rgba(var(--accent-color-rgb), 0.18);
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.45s cubic-bezier(0.3, 0, 0, 1) forwards;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .diary-card:nth-child(odd) { transform: translateY(14px) rotate(-0.6deg); }
    .diary-card:nth-child(even) { transform: translateY(14px) rotate(0.6deg); }
    .diary-card:active {
      transform: scale(0.98) rotate(0deg);
      box-shadow: 0 3px 10px -5px rgba(var(--accent-color-rgb), 0.16);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .card-tape {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 64px;
      height: 20px;
      background: rgba(var(--accent-color-rgb), 0.22);
      border-radius: 4px;
      opacity: 0.9;
      pointer-events: none;
    }
    .card-del {
      position: absolute;
      top: 10px; right: 10px;
      width: 28px; height: 28px;
      border-radius: 9999px;
      border: none;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease;
      z-index: 2;
    }
    .card-del:active { transform: scale(0.94); background: rgba(var(--accent-color-rgb), 0.25); color: var(--text-primary); }

    .card-head { display: flex; align-items: flex-start; gap: 10px; padding-right: 34px; }
    .card-mood { font-size: 28px; line-height: 1.1; flex-shrink: 0; }
    .card-head-text { flex: 1; min-width: 0; }
    .card-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .card-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(var(--accent-color-rgb), 0.1);
      padding: 3px 8px;
      border-radius: 9999px;
      white-space: nowrap;
    }
    .card-body { display: flex; gap: 12px; margin-top: 10px; align-items: flex-end; }
    .card-content {
      flex: 1;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-thumb {
      width: 60px; height: 60px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 8px -2px rgba(var(--accent-color-rgb), 0.25);
    }
    .card-stars {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      color: var(--accent-color);
      opacity: 0.55;
    }

    /* ===== Empty state ===== */
    .empty-state {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 32px;
      gap: 16px;
    }
    .empty-illustration {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(var(--accent-color-rgb), 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .empty-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .empty-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-line;
    }

    /* ===== Floating add button ===== */
    .fab {
      position: absolute;
      bottom: 26px; right: 20px;
      width: 58px; height: 58px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: linear-gradient(145deg, hsl(343 70% 80%), hsl(343 60% 72%));
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px -5px rgba(var(--accent-color-rgb), 0.55);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .fab:active { transform: scale(0.94); box-shadow: 0 4px 12px -4px rgba(var(--accent-color-rgb), 0.45); }
    .fab::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px dashed rgba(var(--accent-color-rgb), 0.35);
      animation: rotateSlow 20s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateSlow {
      to { transform: rotate(360deg); }
    }

    /* ===== Home indicator ===== */
    .home-indicator {
      position: absolute;
      bottom: 7px; left: 0; right: 0;
      display: flex; justify-content: center;
      pointer-events: none;
      z-index: 5;
    }
    .home-indicator span {
      width: 130px; height: 4px; border-radius: 9999px;
      background: rgba(74, 63, 69, 0.14);
    }

    /* ===== Bottom sheet ===== */
    .sheet-overlay {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(74, 63, 69, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet-panel {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 28px 28px 0 0;
      max-height: 85%; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(.3,0,0,1);
      overflow: hidden;
    }
    .sheet-overlay.open .sheet-panel { transform: translateY(0); }

    .sheet-handle {
      width: 40px; height: 4px; border-radius: 9999px;
      background: rgba(var(--accent-color-rgb), 0.25);
      margin: 10px auto 4px;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 20px 12px;
      flex-shrink: 0;
    }
    .sheet-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .sheet-close {
      width: 32px; height: 32px;
      border-radius: 9999px;
      border: none;
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .sheet-close:active { transform: scale(0.94); background: rgba(var(--accent-color-rgb), 0.22); }

    .sheet-body {
      padding: 4px 20px 26px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    .sheet-body::-webkit-scrollbar { display: none; }

    .field-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: block;
    }
    .field-group { margin-bottom: 18px; }

    .input-field {
      width: 100%;
      border: 1px solid rgba(var(--accent-color-rgb), 0.22);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: rgba(var(--accent-color-rgb), 0.04);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-sizing: border-box;
    }
    .input-field:focus {
      border-color: var(--accent-color);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(var(--accent-color-rgb), 0.1);
    }
    .input-field::placeholder { color: var(--text-secondary); opacity: 0.7; }

    textarea.input-field {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }
    input[type="date"].input-field { color: var(--text-primary); }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }
    .mood-btn {
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 12px;
      background: rgba(var(--accent-color-rgb), 0.06);
      font-size: 22px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .mood-btn:active { transform: scale(0.94); }
    .mood-btn.selected {
      border-color: var(--accent-color);
      background: rgba(var(--accent-color-rgb), 0.14);
    }

    .img-upload-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .img-upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(var(--accent-color-rgb), 0.45);
      background: rgba(var(--accent-color-rgb), 0.04);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .img-upload-btn:active { transform: scale(0.97); background: rgba(var(--accent-color-rgb), 0.1); }

    .img-preview-wrap {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px -2px rgba(var(--accent-color-rgb), 0.25);
    }
    .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .img-remove {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px;
      border-radius: 9999px;
      border: none;
      background: rgba(74, 63, 69, 0.65);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .img-remove:active { transform: scale(0.94); }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(145deg, hsl(343 70% 80%), hsl(343 60% 72%));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 6px 16px -4px rgba(var(--accent-color-rgb), 0.45);
      transition: transform 0.1s ease, box-shadow 0.12s ease;
    }
    .save-btn:active { transform: scale(0.98); box-shadow: 0 3px 10px -4px rgba(var(--accent-color-rgb), 0.4); }

    /* ===== Toast ===== */
    .toast {
      position: absolute;
      bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(74, 63, 69, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 13px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Confirm dialog ===== */
    .confirm-overlay {
      position: absolute; inset: 0; z-index: 250;
      background: rgba(74, 63, 69, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
      padding: 32px;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: auto; }
    .confirm-box {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 22px;
      padding: 24px 24px 18px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(var(--accent-color-rgb), 0.12);
      color: var(--accent-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .confirm-text {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .confirm-actions { display: flex; gap: 12px; }
    .confirm-btn {
      flex: 1;
      padding: 11px 10px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .confirm-btn:active { transform: scale(0.97); }
    .confirm-cancel {
      background: rgba(var(--accent-color-rgb), 0.1);
      color: var(--text-secondary);
    }
    .confirm-ok {
      background: linear-gradient(145deg, hsl(343 70% 80%), hsl(343 60% 72%));
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .diary-card { opacity: 1; transform: none; }
      .empty-illustration { animation: none; }
      .fab::before { animation: none; }
    }
  </style>

  <div class="phone">
    <main class="app-bg" id="appBg">

        <i data-lucide="sparkles" class="deco-sparkle" style="top:18%;left:56%;width:16px;height:16px;animation-delay:1.4s"></i>
        <i data-lucide="star" class="deco-star" style="top:32%;left:8%;width:10px;height:10px;animation-delay:2.1s"></i>
        <i data-lucide="heart" class="deco-heart" style="top:44%;left:90%;width:14px;height:14px;animation-delay:0.5s"></i>
        <i data-lucide="sparkles" class="deco-sparkle" style="top:62%;left:18%;width:12px;height:12px;animation-delay:1.7s"></i>
        <i data-lucide="star" class="deco-star" style="top:74%;left:72%;width:14px;height:14px;animation-delay:2.6s"></i>

      <!-- Top bar -->
      <div class="top-bar">

        <div class="top-title">梦境日记</div>

      <!-- Diary list / empty state -->

    <!-- Floating add button -->

    <!-- Home indicator -->
    <div class="home-indicator"><span></span></div>

    <!-- Bottom sheet (add / edit) -->
    <div class="sheet-overlay" id="sheetOverlay">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title" id="sheetTitle">写梦境日记</div>
          <button class="sheet-close" id="sheetClose" aria-label="关闭">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="sheet-body">
          <div class="field-group">
            <label class="field-label">日期</label>
            <input type="date" class="input-field" id="fDate" />
          </div>
          <div class="field-group">
            <label class="field-label">标题</label>
            <input type="text" class="input-field" id="fTitle" maxlength="30" placeholder="给这个梦起个名字…" />
          </div>
          <div class="field-group">
            <label class="field-label">心情</label>
            <div class="mood-grid" id="moodGrid"></div>
          </div>
          <div class="field-group">
            <label class="field-label">梦境内容</label>
            <textarea class="input-field" id="fContent" maxlength="500" placeholder="写下梦境的内容…"></textarea>
          </div>
          <div class="field-group">
            <label class="field-label">图片（可选）</label>
            <div class="img-upload-area" id="imgArea">
              <button type="button" class="img-upload-btn" id="imgUploadBtn">
                <i data-lucide="image-plus" class="w-4 h-4"></i>
                <span>添加图片</span>
              </button>
              <input type="file" id="imgInput" accept="image/*" style="display:none;" />
            </div>
          </div>
          <button class="save-btn" id="saveBtn">保存日记</button>
        </div>
      </div>

    <!-- Confirm dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box">
        <div class="confirm-icon">
          <i data-lucide="trash-2" class="w-6 h-6"></i>
        </div>
        <div class="confirm-text">确定删除这篇日记吗？</div>
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" id="confirmCancel">取消</button>
          <button class="confirm-btn confirm-ok" id="confirmOk">删除</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "mengjiao_dream_diary";
      var MOODS = ["😴", "🌸", "⭐", "🌙", "💫", "🌧️", "✨", "🎵"];

      var state = {
        entries: [],
        editingId: null,
        selectedMood: "🌸",
        currentImage: null,
        pendingDeleteId: null
      };

      // ---- DOM refs ----
      var listContainer = document.getElementById("listContainer");
      var emptyState = document.getElementById("emptyState");
      var fab = document.getElementById("fab");
      var sheetOverlay = document.getElementById("sheetOverlay");
      var sheetClose = document.getElementById("sheetClose");
      var sheetTitle = document.getElementById("sheetTitle");
      var fDate = document.getElementById("fDate");
      var fTitle = document.getElementById("fTitle");
      var fContent = document.getElementById("fContent");
      var moodGrid = document.getElementById("moodGrid");
      var imgArea = document.getElementById("imgArea");
      var imgUploadBtn = document.getElementById("imgUploadBtn");
      var imgInput = document.getElementById("imgInput");
      var saveBtn = document.getElementById("saveBtn");
      var toast = document.getElementById("toast");
      var confirmOverlay = document.getElementById("confirmOverlay");
      var confirmOk = document.getElementById("confirmOk");
      var confirmCancel = document.getElementById("confirmCancel");

      // ---- Storage ----
      function loadEntries() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr)) return arr;
          }
        } catch (e) {}
        return [];
      }
      function saveEntries(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
          return true;
        } catch (e) {
          showToast("存储已满，请删除旧日记");
          return false;
        }
      }

      // ---- Date helpers ----
      function todayStr() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function formatDate(dateStr) {
        if (!dateStr) return "";
        var parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        var d = parseInt(parts[2], 10);
        var nowY = new Date().getFullYear();
        if (y === nowY) return m + "月" + d + "日";
        return y + "年" + m + "月" + d + "日";
      }

      // ---- Toast ----
      var toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      // ---- Render list ----
      function renderList() {
        // sort by date descending; same date => newer id first
        state.entries.sort(function (a, b) {
          if (a.date === b.date) return (Number(b.id) || 0) - (Number(a.id) || 0);
          return a.date < b.date ? 1 : -1;
        });

        if (state.entries.length === 0) {
          listContainer.style.display = "none";
          emptyState.style.display = "flex";
          return;
        }
        emptyState.style.display = "none";
        listContainer.style.display = "flex";
        listContainer.innerHTML = "";

        state.entries.forEach(function (entry, idx) {
          var card = document.createElement("div");
          card.className = "diary-card";
          card.style.animationDelay = (idx * 0.06) + "s";

          var tape = document.createElement("div");
          tape.className = "card-tape";
          card.appendChild(tape);

          var head = document.createElement("div");
          head.className = "card-head";

          var mood = document.createElement("div");
          mood.className = "card-mood";
          mood.textContent = entry.mood || "🌙";

          var headText = document.createElement("div");
          headText.className = "card-head-text";

          var title = document.createElement("div");
          title.className = "card-title";
          title.textContent = entry.title || "无题";

          var meta = document.createElement("div");
          meta.className = "card-meta";

          var dateEl = document.createElement("div");
          dateEl.className = "card-date";
          dateEl.innerHTML = '<i data-lucide="calendar-heart" class="w-3 h-3"></i><span>' + formatDate(entry.date) + '</span>';

          meta.appendChild(dateEl);
          headText.appendChild(title);
          headText.appendChild(meta);
          head.appendChild(mood);
          head.appendChild(headText);

          var del = document.createElement("button");
          del.className = "card-del";
          del.setAttribute("aria-label", "删除");
          del.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';

          var body = document.createElement("div");
          body.className = "card-body";

          var content = document.createElement("div");
          content.className = "card-content";
          content.textContent = entry.content || "";

          body.appendChild(content);

          if (entry.image) {
            var thumb = document.createElement("img");
            thumb.className = "card-thumb";
            thumb.src = entry.image;
            thumb.alt = "";
            body.appendChild(thumb);
          }

          var stars = document.createElement("div");
          stars.className = "card-stars";
          stars.innerHTML = '<i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i>';

          card.appendChild(head);
          card.appendChild(del);
          card.appendChild(body);
          card.appendChild(stars);

          // tap card -> open edit mode
          card.addEventListener("click", function (e) {
            if (e.target === del || del.contains(e.target)) return;
            openSheet(entry);
          });
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            askDelete(entry.id);
          });

          listContainer.appendChild(card);
        });

        if (window.lucide) lucide.createIcons();
      }

      // ---- Mood picker ----
      function buildMoodGrid() {
        moodGrid.innerHTML = "";
        MOODS.forEach(function (m) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mood-btn";
          btn.textContent = m;
          btn.dataset.mood = m;
          btn.addEventListener("click", function () {
            state.selectedMood = m;
            updateMoodSelection();
          });
          moodGrid.appendChild(btn);
        });
      }
      function updateMoodSelection() {
        var btns = moodGrid.querySelectorAll(".mood-btn");
        btns.forEach(function (b) {
          if (b.dataset.mood === state.selectedMood) b.classList.add("selected");
          else b.classList.remove("selected");
        });
      }

      // ---- Sheet ----
      function openSheet(entry) {
        if (entry) {
          state.editingId = entry.id;
          state.selectedMood = entry.mood || "🌸";
          state.currentImage = entry.image || null;
          fDate.value = entry.date || todayStr();
          fTitle.value = entry.title || "";
          fContent.value = entry.content || "";
          sheetTitle.textContent = "编辑日记";
        } else {
          state.editingId = null;
          state.selectedMood = "🌸";
          state.currentImage = null;
          fDate.value = todayStr();
          fTitle.value = "";
          fContent.value = "";
          sheetTitle.textContent = "写梦境日记";
        }
        updateMoodSelection();
        renderImgArea();
        sheetOverlay.classList.add("open");
      }
      function closeSheet() {
        sheetOverlay.classList.remove("open");
      }

      function renderImgArea() {
        var prev = imgArea.querySelector(".img-preview-wrap");
        if (prev) prev.remove();

        if (state.currentImage) {
          var wrap = document.createElement("div");
          wrap.className = "img-preview-wrap";
          var img = document.createElement("img");
          img.src = state.currentImage;
          img.alt = "";
          var rm = document.createElement("button");
          rm.className = "img-remove";
          rm.textContent = "×";
          rm.setAttribute("aria-label", "移除图片");
          rm.addEventListener("click", function () {
            state.currentImage = null;
            renderImgArea();
          });
          wrap.appendChild(img);
          wrap.appendChild(rm);
          imgArea.appendChild(wrap);
          imgUploadBtn.style.display = "none";
        } else {
          imgUploadBtn.style.display = "inline-flex";
        }
      }

      // ---- Image handling (compress via canvas) ----
      function handleImageFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            var maxW = 900;
            var scale = 1;
            if (img.width > maxW) scale = maxW / img.width;
            var canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            try {
              var dataUrl = canvas.toDataURL("image/jpeg", 0.8);
              state.currentImage = dataUrl;
              renderImgArea();
            } catch (err) {
              showToast("图片处理失败");
            }
          };
          img.onerror = function () { showToast("图片加载失败"); };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ---- Save ----
      function saveEntry() {
        var title = fTitle.value.trim();
        var content = fContent.value.trim();
        var date = fDate.value || todayStr();

        if (!title && !content) {
          showToast("请填写标题或内容");
          return;
        }

        var isEdit = !!state.editingId;

        if (isEdit) {
          for (var i = 0; i < state.entries.length; i++) {
            if (String(state.entries[i].id) === String(state.editingId)) {
              state.entries[i].date = date;
              state.entries[i].title = title;
              state.entries[i].mood = state.selectedMood;
              state.entries[i].content = content;
              state.entries[i].image = state.currentImage;
              break;
            }
          }
        } else {
          state.entries.push({
            id: Date.now(),
            date: date,
            title: title,
            mood: state.selectedMood,
            content: content,
            image: state.currentImage
          });
        }

        if (!saveEntries(state.entries)) return;
        renderList();
        closeSheet();
        showToast(isEdit ? "已保存" : "已保存");
      }

      // ---- Delete ----
      function askDelete(id) {
        state.pendingDeleteId = id;
        confirmOverlay.classList.add("open");
      }
      function doDelete() {
        if (state.pendingDeleteId == null) return;
        state.entries = state.entries.filter(function (e) {
          return String(e.id) !== String(state.pendingDeleteId);
        });
        saveEntries(state.entries);
        state.pendingDeleteId = null;
        confirmOverlay.classList.remove("open");
        renderList();
        showToast("已删除");
      }

      // ---- Events ----
      fab.addEventListener("click", function () { openSheet(null); });
      sheetClose.addEventListener("click", closeSheet);
      sheetOverlay.addEventListener("click", function (e) {
        if (e.target === sheetOverlay) closeSheet();
      });
      saveBtn.addEventListener("click", saveEntry);
      imgUploadBtn.addEventListener("click", function () { imgInput.click(); });
      imgInput.addEventListener("change", function () {
        if (imgInput.files && imgInput.files[0]) {
          handleImageFile(imgInput.files[0]);
          imgInput.value = "";
        }
      });
      confirmOk.addEventListener("click", doDelete);
      confirmCancel.addEventListener("click", function () {
        state.pendingDeleteId = null;
        confirmOverlay.classList.remove("open");
      });
      confirmOverlay.addEventListener("click", function (e) {
        if (e.target === confirmOverlay) {
          state.pendingDeleteId = null;
          confirmOverlay.classList.remove("open");
        }
      });

      // prevent background scroll when sheet / confirm open
      document.addEventListener("touchmove", function (e) {
        var inSheetBody = e.target.closest && e.target.closest(".sheet-body");
        if (sheetOverlay.classList.contains("open") && !inSheetBody) {
          e.preventDefault();
        }
      }, { passive: false });

      // ---- Init ----
      buildMoodGrid();
      state.entries = loadEntries();
      renderList();
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
