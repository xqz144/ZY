<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给梦角的信 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --mj-paper-line: hsl(var(--primary) / .14);
      --mj-paper-red: hsl(350 55% 68% / .35);
      --mj-card-bg: hsl(var(--card) / .86);
    }

    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      letter-spacing: var(--tracking-normal);
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
    }
    @media (min-width: 480px) {
      .phone {
        min-height: 860px;
        height: 860px;
        border-radius: 34px;
        box-shadow: var(--shadow-xl);
      }
    }

    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 420px 260px at 15% 5%, hsl(var(--primary) / .16), transparent 60%),
        radial-gradient(ellipse 320px 220px at 95% 12%, hsl(var(--primary) / .12), transparent 55%),
        radial-gradient(ellipse 260px 180px at 80% 92%, hsl(var(--primary) / .10), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), hsl(var(--secondary)));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) { .top-bar { padding-top: 16px; } }

    .back-btn {
      font-size: 15px;
      color: hsl(var(--primary));
      text-decoration: none;
      padding: 8px 10px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
      transition: opacity .15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:active { opacity: .6; }

    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: hsl(var(--foreground));
      text-align: center;
      flex: 1;
    }

    .top-action {
      flex-shrink: 0;
      min-width: 64px;
      display: flex;
      justify-content: flex-end;
    }

    .top-action-btn {
      font-size: 13px;
      padding: 7px 15px;
      border-radius: 999px;
      border: 1.5px solid hsl(var(--primary) / .35);
      background: hsl(var(--card) / .70);
      color: hsl(var(--primary));
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, background .15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .top-action-btn:active { transform: scale(.94); }
    .top-action-btn:disabled { opacity: .55; cursor: not-allowed; }

    .letter-stage {
      flex: 1;
      padding: 6px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* envelope flap header */
    .env-header {
      position: relative;
      height: 118px;
      border-radius: 24px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .env-header-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: hsl(var(--primary) / .92);
    }
    .env-header-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: hsl(var(--primary-foreground));
      padding-bottom: 10px;
    }
    .env-header-icon { margin-bottom: 6px; opacity: .95; }
    .env-header-title { font-size: 17px; font-weight: 700; letter-spacing: 4px; }
    .env-header-subtitle { font-size: 10px; opacity: .75; letter-spacing: 2px; margin-top: 4px; font-style: italic; }

    /* tabs */
    .env-tab-bar {
      display: flex;
      gap: 8px;
      margin: 2px 0 4px;
    }
    .env-tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: hsl(var(--card) / .62);
      border: 1.5px solid hsl(var(--primary) / .18);
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-sans);
      color: hsl(var(--muted-foreground));
      position: relative;
      transition: .2s;
      letter-spacing: .3px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .env-tab-btn.active {
      background: hsl(var(--primary) / .18);
      border-color: hsl(var(--primary) / .55);
      color: hsl(var(--primary));
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .env-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-radius: 8px;
      font-size: 10px;
      padding: 1px 5px;
      min-width: 16px;
      text-align: center;
      border: 2px solid hsl(var(--card));
      font-weight: 700;
    }

    .env-card {
      background: var(--mj-card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 14px 14px 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .env-section {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    .env-section.active { display: flex; }

    .env-empty {
      text-align: center;
      padding: 44px 22px;
      color: hsl(var(--muted-foreground));
      font-size: 13px;
    }
    .env-empty svg { display: block; margin: 0 auto 14px; opacity: .45; }
    .env-empty-title { font-size: 15px; font-weight: 600; color: hsl(var(--foreground)); margin-bottom: 6px; }

    .env-letter-item {
      background: hsl(var(--card) / .78);
      border-radius: 18px;
      border: 1px solid hsl(var(--primary) / .16);
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform .2s cubic-bezier(.25,.8,.25,1), box-shadow .2s, border-color .2s;
      position: relative;
      overflow: hidden;
      animation: fadeUp .35s cubic-bezier(.3,0,0,1) both;
    }
    .env-letter-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: hsl(var(--primary) / .35); }
    .env-letter-item.new { border-color: hsl(var(--primary) / .45); }
    .env-letter-seal {
      position: absolute;
      top: -9px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      border: 2px solid hsl(var(--card));
      z-index: 3;
    }
    .env-letter-seal.replied { background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); }
    .env-letter-header {
      background: hsl(var(--primary) / .88);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .env-letter-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .env-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid hsl(var(--card) / .80);
      background: hsl(var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: hsl(var(--primary));
      overflow: hidden;
    }
    .env-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .env-letter-header-from {
      font-size: 12px;
      font-weight: 700;
      color: hsl(var(--primary-foreground));
      letter-spacing: .3px;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .env-letter-header-from span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .env-stamp {
      width: 30px;
      height: 36px;
      border: 1.5px solid hsl(var(--primary-foreground) / .55);
      border-radius: 3px;
      background: hsl(var(--primary-foreground) / .12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px hsl(var(--primary-foreground) / .08), 1px 1px 0 2px hsl(var(--primary-foreground) / .08), -1px 1px 0 2px hsl(var(--primary-foreground) / .08);
    }
    .env-letter-body { padding: 12px 12px 14px; }
    .env-letter-preview {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: italic;
      color: hsl(var(--foreground));
      font-family: var(--font-serif);
    }
    .env-letter-status {
      font-size: 11px;
      color: hsl(var(--primary));
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .env-letter-delete-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: none;
      border: none;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      font-size: 12px;
      opacity: .45;
      padding: 5px;
      border-radius: 6px;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .env-letter-delete-btn:hover { color: hsl(var(--destructive)); opacity: 1; }

    .env-send-area {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .env-write-btn {
      width: 100%;
      padding: 14px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border: none;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-sans);
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .env-write-btn:active { transform: scale(.98); }
    .env-write-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* compose form */
    .env-compose-form {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    .env-compose-form.active { display: flex; }
    .env-compose-paper {
      background: hsl(var(--card) / .80);
      border-radius: 18px;
      border: 1px solid hsl(var(--primary) / .20);
      padding: 16px 16px 12px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .env-compose-paper::before {
      content: "";
      position: absolute;
      left: 42px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: var(--mj-paper-red);
      pointer-events: none;
    }
    .env-compose-paper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(transparent, transparent 28px, var(--mj-paper-line) 28px, var(--mj-paper-line) 29px);
      pointer-events: none;
      border-radius: 18px;
    }
    .env-compose-heading {
      font-size: 12px;
      color: hsl(var(--primary));
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: .85;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    #letterInput {
      width: 100%;
      resize: none;
      padding-left: 20px;
      min-height: 180px;
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-serif) !important;
      font-size: 15px !important;
      line-height: 2 !important;
      color: hsl(var(--foreground)) !important;
    }
    #letterInput::placeholder { color: hsl(var(--muted-foreground)); opacity: .65; }
    .env-option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 6px;
      font-size: 13px;
      padding: 0 2px;
      color: hsl(var(--muted-foreground));
    }
    .env-option-row input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: hsl(var(--primary));
      flex-shrink: 0;
    }
    .env-option-row label { cursor: pointer; }
    #scheduleTimeWrap { display: none; margin: 4px 0 10px; padding: 0 2px; }
    #scheduleTimeWrap.open { display: block; }
    #scheduleTime {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid hsl(var(--primary) / .22);
      border-radius: 12px;
      background: hsl(var(--card) / .72);
      color: hsl(var(--foreground));
      font-size: 13px;
      outline: none;
      font-family: var(--font-sans);
    }
    .env-send-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      margin-bottom: 12px;
      padding: 10px 12px;
      background: hsl(var(--card) / .62);

      /* ============ 工具：信件编码算法（MJ-Encode v1：移位 + 自定义码表，仪式感编码非加密） ============ */
      var MJ_CODE_TABLE = "梦角传讯时雨星花月云风雪山水❤💕✨🌙🌸🦋🍀🌷☁🌙"; // 自定义标记字符
      function mjStampId(section) {
        // 邮戳编号: MJ-20240615-ABC123
        var d = new Date();
        var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        var code = "";
        for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return { stamp: "MJ-" + ds + "-" + code, short: code, date: ds };
      }
      function mjEncode(text) {
        // 轻量仪式编码：Unicode 码点 +5 偏移，再 base64，前后加标记
        try {
          var shifted = "";
          for (var i = 0; i < text.length; i++) shifted += String.fromCharCode(text.charCodeAt(i) + 5);
          var b64 = "";
          if (typeof btoa !== "undefined") b64 = btoa(unescape(encodeURIComponent(shifted)));
          else b64 = "B64_" + shifted.length;
          var mark = MJ_CODE_TABLE[Math.floor(Math.random() * MJ_CODE_TABLE.length)];
          var tail = MJ_CODE_TABLE[Math.floor(Math.random() * MJ_CODE_TABLE.length)];
          return mark + b64 + tail;
        } catch (e) { return text; }
      }
      function mjDecode(encoded) {
        try {
          if (!encoded || encoded.length < 3) return encoded;
          var core = encoded.substring(1, encoded.length - 1);
          if (core.indexOf("B64_") === 0) {
            // fallback
            return encoded;
          }
          var shifted = decodeURIComponent(escape(atob(core)));
          var out = "";
          for (var i = 0; i < shifted.length; i++) out += String.fromCharCode(shifted.charCodeAt(i) - 5);
          return out;
        } catch (e) { return encoded; }
      }

      /* ============ 关键词匹配 → 返回命中的分类名（优先级按命中数+首次命中位置） ============ */
      function matchLetterCategory(text) {
        if (!text) return null;
        var t = String(text);
        var bestCat = null;
        var bestScore = 0;
        Object.keys(KEYWORD_CATEGORIES).forEach(function (cat) {
          var kws = KEYWORD_CATEGORIES[cat];
          var score = 0;
          kws.forEach(function (kw) {
            var idx = t.indexOf(kw);
            if (idx !== -1) {
              score += 10 + Math.max(0, 5 - Math.floor(idx / 20)); // 靠前出现权重更高
            }
          });
          if (score > bestScore) { bestScore = score; bestCat = cat; }
        });
        return bestScore > 0 ? bestCat : null;
      }

      function saveData() {

      }
      function migrateOldData() {
        if (currentData.outbox.length || currentData.inbox.length || currentData.dream.length) return;
        try {
          var raw = localStorage.getItem(OLD_LETTER_KEY);
          if (!raw) return;
          var old = JSON.parse(raw);
          if (!Array.isArray(old)) return;
          old.forEach(function (item) {
            if (!item || !item.text) return;
            if (item.type === "reply") {
              currentData.inbox.push({ id: genId("inbox"), content: item.text, receivedTime: parseTime(item.time) || Date.now(), isNew: false });
            } else if (item.type === "dream_letter") {
              currentData.dream.push({ id: genId("dream"), content: item.text, receivedTime: parseTime(item.time) || Date.now(), isNew: false });
            } else {
              currentData.outbox.push({ id: genId("outbox"), content: item.text, sentTime: parseTime(item.time) || Date.now(), replyTime: Date.now(), status: "replied" });
            }
          });
          saveData();
        } catch (e) {}
      }

      function shuffleArray(arr) {
        if (!arr || !arr.length) return arr;
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      function getCardReplies() {
        try {
          var raw = localStorage.getItem(CARD_REPLIES_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
        return DEFAULT_CARD_REPLIES.slice();
      }
      function pickReply() {
        var pool = getCardReplies();
        return pool[Math.floor(Math.random() * pool.length)];
      }

      /* 获取时段：morning/noon/evening/night/late */
      function getTimeSlot() {
        var h = new Date().getHours();
        if (h >= 5 && h < 11) return "morning";
        if (h >= 11 && h < 14) return "noon";
        if (h >= 14 && h < 18) return "evening";
        if (h >= 18 && h < 24) return "night";
        return "late";
      }

      /* ============ 生成梦角回信（关键词匹配优先 + 兜底随机）参考 ZY 字卡算法 ============ */
      function generateReplyText(outgoingTextOrMin, maxSentences) {
        var outgoingText = typeof outgoingTextOrMin === "string" ? outgoingTextOrMin : "";
        var minS = typeof outgoingTextOrMin === "number" ? outgoingTextOrMin : 6;
        var maxS = typeof maxSentences === "number" ? maxSentences : 10;

        var cat = matchLetterCategory(outgoingText);
        var primary = [];
        if (cat && CATEGORY_REPLIES[cat] && CATEGORY_REPLIES[cat].length) {
          primary = CATEGORY_REPLIES[cat].slice();
        }
        var pool = getCardReplies();
        if (pool.length === 0) pool = DEFAULT_CARD_REPLIES.slice();

        var parts = [];
        var slot = getTimeSlot();
        var greetings = TIME_GREETINGS[slot] || TIME_GREETINGS.night;

        // 1. 开头时间问候（35%）
        if (Math.random() < 0.45) {
          parts.push(greetings[Math.floor(Math.random() * greetings.length)]);
        }

        // 2. 关键词精准回复（命中时优先 1~2 句）
        if (primary.length) {
          var pk = primary.slice();
          shuffleArray(pk);
          var pn = Math.min(pk.length, Math.floor(Math.random() * 2) + 1);
          for (var i = 0; i < pn; i++) parts.push(pk[i]);
        }

        // 3. 兜底字卡：按字数区间补足
        var remainNeed = Math.max(0, Math.floor(Math.random() * (maxS - minS + 1)) + minS - parts.length);
        var shuffledPool = pool.slice();
        shuffleArray(shuffledPool);
        for (var j = 0; j < remainNeed && j < shuffledPool.length; j++) {
          var line = shuffledPool[j];
          var hasPunc = /[。！？…]$/.test(line);
          parts.push(line + (hasPunc ? "" : (Math.random() < 0.2 ? "！" : (Math.random() < 0.15 ? "……" : "。"))));
        }

        // 4. 结尾祝福语（75%）
        if (Math.random() < 0.8) {
          parts.push(TIME_BLESSINGS[Math.floor(Math.random() * TIME_BLESSINGS.length)]);
        }

        return parts.join("\n").trim() || DEFAULT_CARD_REPLIES[0];
      }

      /* ============ 生成梦角来信（时间感知 + 结构化三段式：称呼→问候→正文→祝福→署名） ============ */
      function generateDreamLetter() {
        var pool = getCardReplies();
        if (pool.length === 0) pool = DEFAULT_CARD_REPLIES.slice();
        var slot = getTimeSlot();
        var greetings = TIME_GREETINGS[slot] || TIME_GREETINGS.night;
        var myName = "";
        try { myName = localStorage.getItem("mengjiao_my_name") || ""; } catch (e) {}

        // 1. 称呼
        var intro = "";
        if (myName) {
          intro = "写给" + myName + "：\n";
        } else {
          var introPool = ["亲爱的小朋友：\n","见信如晤：\n","给我最惦记的你：\n","致读信的你：\n","亲爱的：\n"];
          intro = introPool[Math.floor(Math.random() * introPool.length)];
        }

        // 2. 时间问候段
        var para1 = greetings[Math.floor(Math.random() * greetings.length)];

        // 3. 正文段 2~3 段：每段 3~5 句字卡
        var shuffled = pool.slice();
        shuffleArray(shuffled);
        var paraCount = Math.floor(Math.random() * 2) + 2;
        var paras = [];
        var cursor = 0;
        for (var p = 0; p < paraCount; p++) {
          var segCount = Math.floor(Math.random() * 3) + 3;
          var seg = [];
          for (var s = 0; s < segCount && cursor < shuffled.length; s++, cursor++) {
            var line = shuffled[cursor];
            var hasPunc = /[。！？…]$/.test(line);
            seg.push(line + (hasPunc ? "" : "。"));
          }
          if (seg.length) paras.push(seg.join(""));
        }

        // 4. 祝福语段（1~2 句）
        var blessCount = Math.floor(Math.random() * 2) + 1;
        var shuffledBless = TIME_BLESSINGS.slice();
        shuffleArray(shuffledBless);
        var bless = [];
        for (var b = 0; b < blessCount; b++) bless.push(shuffledBless[b]);
        var blessPara = bless.join("");

        // 5. 署名
        var sign = LETTER_SIGNATURES[Math.floor(Math.random() * LETTER_SIGNATURES.length)];
        var partnerName = "";
        try { partnerName = localStorage.getItem("mengjiao_partner_name") || ""; } catch (e) {}
        if (!partnerName) partnerName = "梦角";
        var d = new Date();
        var dateStr = d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
        var signBlock = "\n\n" + sign + "\n" + partnerName + "\n" + dateStr;

        var result = intro + "\n" + para1 + "\n\n";
        paras.forEach(function (p, i) {
          result += p + (i < paras.length - 1 ? "\n\n" : "\n\n");
        });
        result += blessPara + signBlock;

        return result.trim();
      }

        var pad = function (n) { return String(n).padStart(2, "0"); };

      function handleSend() {
        var text = letterInput.value.trim();
        if (!text) { showToast("先写点什么吧"); return; }

        var scheduleChecked = scheduleSend.checked;
        var scheduleValue = scheduleTime.value;
        var scheduleTs = null;
        if (scheduleChecked && scheduleValue) {
          scheduleTs = new Date(scheduleValue).getTime();
          if (scheduleTs <= Date.now()) { showToast("定时时间必须在未来"); return; }
        }

        sendLetter.disabled = true;

        var stamp = mjStampId("outbox");
        var letter = {
          id: genId("outbox"),
          content: text,
          sentTime: scheduleChecked ? scheduleTs : Date.now(),
          replyTime: Date.now() + replyDelay(),
          status: scheduleChecked ? "scheduled" : "pending",
          sendToChat: sendToChat.checked,
          stamp: stamp.stamp,          // 邮戳编号: MJ-20240615-ABC123
          stampShort: stamp.short,     // 短编号: ABC123
          encodeTag: mjEncode(stamp.stamp + "|" + text.slice(0, 12)) // 仪式感编码标签
        };

        if (!scheduleChecked && sendToChat.checked) {
          addMessageToChat("【寄出的信】\n" + text);
        }

        currentData.outbox.push(letter);
        saveData();

        bumpSparkInteraction();

        if (scheduleChecked) {
          showToast("信件已设定，将在 " + formatShortTime(scheduleTs) + " 寄出 ✉️");
        } else {
          showToast("信件已寄出，正在加急寄给 " + getPartnerName() + " ✉️");
          setTimeout(function () { processReply(letter.id); }, letter.replyTime - Date.now());
        }

        cancelCompose();
        switchTab("outbox");
        sendLetter.disabled = false;
      }

      function processReply(outboxId) {
        loadData();
        var letter = currentData.outbox.find(function (l) { return l.id === outboxId; });
        if (!letter || letter.status !== "pending") return;

        if (letter.replyToSection === "dream" && letter.replyToId && Math.random() >= 0.3) {
          letter.status = "replied";
          saveData();
          renderLists();
          showToast("💌 已将回信送达梦角");
          return;
        }

        letter.status = "replied";
        var stampInbox = mjStampId("inbox");
        var replyContent = generateReplyText(letter.content || "", 8, 12);
        var reply = {
          id: genId("inbox"),
          refId: letter.id,
          originalContent: letter.content,
          content: replyContent,
          receivedTime: Date.now(),
          isNew: true,
          stamp: stampInbox.stamp,
          stampShort: stampInbox.short,
          encodeTag: mjEncode(stampInbox.stamp + "|REPLY")
        };
        currentData.inbox.push(reply);
        saveData();
        renderLists();
        if (currentTab !== "inbox") {
          showReplyPopup(reply);
        } else {
          showToast("💌 收到了 " + getPartnerName() + " 的回信！");
        }
      }

      function receiveDreamLetter() {
        if (receiveLetterBtn.disabled) return;
        receiveLetterBtn.disabled = true;
        showToast("梦角正在写信…");
        setTimeout(function () {
          var stampDream = mjStampId("dream");
          var letter = {
            id: genId("dream"),
            content: generateDreamLetter(),
            receivedTime: Date.now(),
            isNew: true,
            stamp: stampDream.stamp,
            stampShort: stampDream.short,
            encodeTag: mjEncode(stampDream.stamp + "|DREAM")
          };
          currentData.dream.push(letter);
          saveData();
          renderLists();
          showToast("💌 收到一封梦角来信！");
          receiveLetterBtn.disabled = false;
        }, replyDelay());
      }

      function openView(section, id) {
        var arr = currentData[section];
        var letter = arr.find(function (l) { return l.id === id; });
        if (!letter) return;
        if ((section === "inbox" || section === "dream") && letter.isNew) {
          letter.isNew = false;
          saveData();
          renderLists();
        }
        viewing = { section: section, id: id };

        var title = section === "outbox" ? "寄出的信" : section === "inbox" ? "收到的回信" : "梦角来信";
        viewTitle.textContent = title;

        var ts = letter.receivedTime || letter.sentTime || letter.scheduleTime || Date.now();
        // 邮戳编号显示（参考 ZY 信件仪式感）
        var stampLine = formatFullDate(ts);
        if (letter.stamp) stampLine += "　·　📮 邮戳 " + letter.stamp;
        viewDate.textContent = stampLine;

        var partner = getPartnerName();
        var me = getMyName();
        var partnerAvatar = getPartnerAvatar();
        var myAvatar = getMyAvatar();
        var toLine = "", greeting = "", signName = "";
        if (section === "outbox") {
          toLine = "致 " + partner + "：";
          greeting = "见字如面，望君安好。";
          signName = me;
          viewStampAvatar.innerHTML = avatarHtml(myAvatar, me, "46px");
        } else if (section === "dream") {
          toLine = "致 " + me + "：";
          greeting = "见字如面，时空流转。";
          signName = partner;
          viewStampAvatar.innerHTML = avatarHtml(partnerAvatar, partner, "46px");
        } else {
          toLine = "致 " + me + "：";
          greeting = "见字如面，一切皆好。";
          signName = partner;
          viewStampAvatar.innerHTML = avatarHtml(partnerAvatar, partner, "46px");
        }
        viewToLine.textContent = toLine;
        viewGreetingLine.textContent = greeting;
        viewContentText.textContent = letter.content;
        viewSignDate.textContent = formatFullDate(ts);
        viewSignName.textContent = signName;

        // 编码标签追加到内容末尾（小标签展示 MJ-Encode 标记）
        if (letter.encodeTag) {
          var tagExists = document.getElementById("viewEncodeTag");
          if (!tagExists) {
            var tg = document.createElement("div");
            tg.id = "viewEncodeTag";
            tg.style.cssText = "margin-top:14px;padding:6px 10px;border-radius:8px;background:rgba(232,164,184,0.08);color:#b97890;font-size:10.5px;letter-spacing:0.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;line-height:1.6;border:1px dashed rgba(232,164,184,0.25);";
            viewPaper.appendChild(tg);
            tagExists = tg;
          }
          tagExists.textContent = "✦ 梦角编码 MJ-v1　" + letter.encodeTag;
        } else {
          var oldTag = document.getElementById("viewEncodeTag");
          if (oldTag) oldTag.remove();
        }

        var originalContent = "";
        if (section === "inbox" && letter.originalContent) {
          originalContent = letter.originalContent;
          viewOriginalLabel.textContent = "你的原信";
        } else if (section === "outbox" && letter.replyToSection && letter.replyToId) {
          originalContent = getOriginalContent(letter.replyToSection, letter.replyToId);
          viewOriginalLabel.textContent = "原信";
        }
        if (originalContent) {
          viewOriginalCtx.classList.add("open");
          viewOriginalText.textContent = originalContent;
          viewOriginalText.style.maxHeight = "80px";
          viewOriginalExpand.classList.toggle("open", originalContent.length > 120);
          viewOriginalExpand.textContent = "展开查看全文";
        } else {
          viewOriginalCtx.classList.remove("open");
          viewOriginalExpand.classList.remove("open");
        }

        viewEditArea.classList.remove("open");
        editView.style.display = section === "outbox" || section === "dream" ? "inline-flex" : "none";
        replyView.style.display = section === "inbox" || section === "dream" ? "inline-flex" : "none";
        replyView.textContent = "回复";
        replyView.dataset.mode = "";
        replyView.className = "env-btn-primary";
        editView.textContent = "编辑";

        viewModal.classList.add("open");
      }

      function toggleOriginalExpand() {
        var isExpanded = viewOriginalText.style.maxHeight === "none";
        viewOriginalText.style.maxHeight = isExpanded ? "80px" : "none";
        viewOriginalExpand.textContent = isExpanded ? "展开查看全文" : "收起";
      }

      function closeViewModal() {
        viewModal.classList.remove("open");
        viewing = { section: null, id: null };
      }

      function toggleEdit() {
        if (editView.textContent === "编辑") {
          viewEditArea.classList.add("open");
          viewEditInput.value = getOriginalContent(viewing.section, viewing.id);
          editView.textContent = "保存";
        } else {
          var text = viewEditInput.value.trim();
          if (!text) { showToast("内容不能为空"); return; }
          var letter = currentData[viewing.section].find(function (l) { return l.id === viewing.id; });
          if (letter) {
            letter.content = text;
            saveData();
            renderLists();
            openView(viewing.section, viewing.id);
            showToast("已保存");
          }
        }
      }

      function toggleReply() {
        if (replyView.dataset.mode === "sending") {
          var text = viewEditInput.value.trim();
          if (!text) { showToast("回复内容不能为空"); return; }
          var stamp2 = mjStampId("outbox");
          var replyLetter = {
            id: genId("outbox"),
            content: text,
            sentTime: Date.now(),
            replyTime: Date.now() + replyDelay(),
            status: "pending",
            replyToId: viewing.id,
            replyToSection: viewing.section,
            stamp: stamp2.stamp,
            stampShort: stamp2.short,
            encodeTag: mjEncode(stamp2.stamp + "|VR|" + text.slice(0, 10))
          };
          currentData.outbox.push(replyLetter);
          saveData();
          renderLists();
          closeViewModal();
          showToast("回信已寄出 ✉️");
          setTimeout(function () { processReply(replyLetter.id); }, replyLetter.replyTime - Date.now());
          return;
        }
        viewEditArea.classList.add("open");
        viewEditInput.value = "";
        viewEditInput.placeholder = "写下你的回复...";
        replyView.textContent = "发送";
        replyView.dataset.mode = "sending";
        replyView.className = "env-btn-primary";
        editView.style.display = "none";
      }

      function deleteLetter(section, id) {
        if (!confirm("确定要删除这封信吗？")) return;
        currentData[section] = currentData[section].filter(function (l) { return l.id !== id; });
        saveData();
        renderLists();
        if (viewing.section === section && viewing.id === id) closeViewModal();
        showToast("已删除");
      }

      function addMessageToChat(text) {
        try {
          var raw = localStorage.getItem(CHAT_MESSAGES_KEY);
          var msgs = [];
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) msgs = parsed;
          }
          msgs.push({
            id: Date.now(),
            sender: "user",
            text: text,
            timestamp: new Date().toISOString(),
            status: "sent",
            type: "normal"
          });
          localStorage.setItem(CHAT_MESSAGES_KEY, JSON.stringify(msgs));
        } catch (e) {}
      }

      function bumpSparkInteraction() {
        try {
          (function(){
            var K = "mengjiao_spark";
            var D = JSON.parse(localStorage.getItem(K) || "{}");
            var T = new Date();
            var t = T.getFullYear() + "-" + String(T.getMonth()+1).padStart(2,"0") + "-" + String(T.getDate()).padStart(2,"0");
            D.daily = D.daily || {};
            D.daily[t] = D.daily[t] || { chat: 0, cards: 0, moments: 0 };
            if (D.daily[t].chat < 10) {
              D.daily[t].chat++;
              D.totalInteractions = (D.totalInteractions || 0) + 1;
              D.exp = (D.exp || 0) + 3;
              D.totalExp = (D.totalExp || 0) + 3;
              if (t !== D.lastActiveDate) {
                if (D.lastActiveDate === yesterday()) D.streak = (D.streak || 0) + 1;
                else D.streak = 1;
                D.lastActiveDate = t;
              } else if (!D.streak) D.streak = 1;
              var L = [{lv:1,need:50},{lv:2,need:150},{lv:3,need:350},{lv:4,need:700},{lv:5,need:1200},{lv:6,need:2000}];
              while (D.level < 7 && D.exp >= L[D.level-1].need) { D.exp -= L[D.level-1].need; D.level++; }
              localStorage.setItem(K, JSON.stringify(D));
            }
            function yesterday() { var d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
          })();
        } catch (e) {}
      }

      function checkScheduled() {
        loadData();
        var now = Date.now();
        var changed = false;
        currentData.outbox.forEach(function (letter) {
          if (letter.status === "scheduled" && now >= letter.scheduleTime) {
            letter.status = "pending";
            letter.sentTime = now;
            letter.replyTime = now + replyDelay();
            changed = true;
            if (letter.sendToChat) addMessageToChat("【寄出的信】\n" + letter.content);
            showToast("定时信件已寄出 ✉️");
            setTimeout(function () { processReply(letter.id); }, letter.replyTime - now);
          }
        });
        if (changed) saveData();
        renderLists();
      }

      tabBtns.forEach(function (btn) {
        btn.addEventListener("click", function () { switchTab(btn.dataset.tab); });
      });
      writeLetterBtn.addEventListener("click", openCompose);
      cancelCompose.addEventListener("click", cancelCompose);
      sendLetter.addEventListener("click", handleSend);
      scheduleSend.addEventListener("change", function () {
        scheduleTimeWrap.classList.toggle("open", scheduleSend.checked);
      });
      receiveLetterBtn.addEventListener("click", receiveDreamLetter);
      closeView.addEventListener("click", closeViewModal);
      editView.addEventListener("click", toggleEdit);
      replyView.addEventListener("click", toggleReply);
      viewOriginalExpand.addEventListener("click", toggleOriginalExpand);
      replyPopupOverlay.addEventListener("click", function (e) {
        if (e.target === replyPopupOverlay) replyPopupOverlay.classList.remove("open");
      });
      viewModal.addEventListener("click", function (e) {
        if (e.target === viewModal) closeViewModal();
      });

      window._openView = openView;
      window._deleteLetter = deleteLetter;

      loadData();
      switchTab("outbox");
      setInterval(checkScheduled, 3000);
      currentData.outbox.forEach(function (l) {
        if (l.status === "pending" && l.replyTime && l.replyTime > Date.now()) {
          setTimeout(function () { processReply(l.id); }, l.replyTime - Date.now());
        }
      });
    })();
  </script>
</body>
</html>
