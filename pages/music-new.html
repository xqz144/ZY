<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景音乐 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

    <div class="app-bg">

      <div class="starlight" aria-hidden="true">
        <span style="top:6%;left:10%;width:2px;height:2px;animation-delay:0s"></span>
        <span style="top:14%;left:80%;width:3px;height:3px;animation-delay:0.8s"></span>
        <span style="top:28%;left:88%;width:2px;height:2px;animation-delay:1.6s"></span>
        <span style="top:45%;left:6%;width:3px;height:3px;animation-delay:1.2s"></span>
        <span style="top:62%;left:90%;width:2px;height:2px;animation-delay:2s"></span>
        <span style="top:78%;left:15%;width:3px;height:3px;animation-delay:0.4s"></span>
        <span style="top:88%;left:65%;width:2px;height:2px;animation-delay:2.8s"></span>
      </div>

      <header class="top-bar">
        <a href="../index-zy.html" class="back-btn" data-dom-id="back-nav">← 返回</a>
        <span class="top-title">背景音乐</span>
        <span class="top-spacer"></span>
      </header>

      <main class="music-content">

        <section class="player-card" aria-label="唱片机播放器">
          <div class="vinyl-wrap">
            <div class="tonearm" aria-hidden="true"></div>
            <div class="vinyl" id="vinyl" aria-hidden="true"></div>
          </div>

          <div class="music-info">
            <h1 class="music-name" id="musicName">未设置音乐</h1>
            <p class="music-status" id="musicStatus">点击下方按钮添加歌曲</p>
          </div>

          <div class="controls-row">
            <button type="button" class="ctrl-btn" id="prevBtn" aria-label="上一首" data-dom-id="prev-song">
              <i data-lucide="skip-back" class="icon-20"></i>
            </button>
            <button type="button" class="ctrl-btn play-btn" id="playBtn" disabled aria-label="播放/暂停" data-dom-id="play-toggle">
              <i data-lucide="play" id="playIcon" class="icon-28"></i>
            </button>
            <button type="button" class="ctrl-btn" id="nextBtn" aria-label="下一首" data-dom-id="next-song">
              <i data-lucide="skip-forward" class="icon-20"></i>
            </button>
          </div>

          <div class="progress-wrap">
            <div class="progress-bar" id="progressBar" aria-label="播放进度">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-times">
              <span id="currentTime">00:00</span>
              <span id="totalTime">00:00</span>
            </div>
          </div>

          <div class="volume-row">
            <i data-lucide="volume-2" class="icon-18" aria-hidden="true"></i>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.6" aria-label="音量" />
          </div>
        </section>

        <section class="song-section" aria-label="歌曲列表">
          <div class="section-header">
            <h2 class="section-title">我的歌单</h2>
            <span class="song-count" id="songCount">0 首</span>
          </div>
          <p class="section-hint">点击卡片切换歌曲，左滑感按钮删除</p>
          <ul class="song-stack" id="songList">
            <li class="empty-state" id="emptyState">
              <i data-lucide="music" class="empty-icon"></i>
              <span>暂无歌曲，添加一首吧</span>
            </li>
            <li class="song-card" data-slot="0" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="1" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="2" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="3" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="4" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="5" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="6" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
            <li class="song-card" data-slot="7" hidden>
              <div class="note-icon"><i data-lucide="music" class="icon-18"></i></div>
              <div class="song-meta">
                <div class="song-name" data-name></div>
                <div class="song-url" data-url></div>
              </div>
              <button type="button" class="song-delete" data-delete aria-label="删除"><i data-lucide="trash-2" class="icon-18"></i></button>
            </li>
          </ul>
        </section>

        <section class="settings-card" aria-label="添加音乐">
          <h2 class="section-title">添加音乐</h2>
          <p class="section-hint">粘贴音频直链，保存后加入歌单</p>
          <div class="input-row">
            <input type="url" id="urlInput" class="text-input" placeholder="粘贴音频链接…" />
            <button type="button" class="small-btn" id="saveUrlBtn" data-dom-id="add-song">
              <i data-lucide="plus" class="icon-16"></i>
              <span>添加</span>
            </button>
          </div>
          <p class="format-hint">支持 mp3、wav、ogg 等直链，最多 8 首</p>
        </section>

        <section class="settings-card" aria-label="播放设置">
          <h2 class="section-title">播放设置</h2>
          <p class="section-hint">控制进入主页时的自动播放与默认音量</p>
          <div class="setting-row">
            <div>
              <div class="setting-label">进入主页时自动播放</div>
              <div class="setting-desc">开启后，打开主页将自动播放音乐</div>
            </div>
            <label class="toggle">
              <input type="checkbox" class="toggle-input" id="autoplayToggle" />
              <span class="toggle-track">
                <span class="toggle-knob"></span>
              </span>
            </label>
          </div>
          <div class="setting-volume-row">
            <span class="setting-label">默认音量</span>
            <input type="range" id="defaultVolumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.6" aria-label="默认音量" />
            <span class="vol-percent" id="volPercent">60%</span>
          </div>
        </section>

      </main>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <audio class="audio-hidden" id="audio" preload="metadata"></audio>

    </div>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
      letter-spacing: var(--tracking-normal);
    }

    /* Phone frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 30% 22%);
        box-shadow: 0 25px 60px -15px hsl(343 60% 35% / 0.35), 0 0 0 2px hsl(343 30% 18%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 30% 18%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    .app-bg {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 500px 300px at 20% 0%, hsl(343 80% 94% / 0.9), transparent 60%),
        radial-gradient(ellipse 420px 260px at 90% 10%, hsl(343 72% 92% / 0.7), transparent 55%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
      scrollbar-width: none;
    }
    .app-bg::-webkit-scrollbar { display: none; }

    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight span {
      position: absolute; border-radius: 9999px;
      background: hsl(343 72% 68% / 0.35);
      animation: twinkle 5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; transform: scale(0.7); }
      50% { opacity: 0.45; transform: scale(1.1); }
    }

    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) {
      .top-bar { padding-top: 16px; }
    }
    .back-btn {
      font-size: 15px;
      color: var(--accent-color);
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
      transition: opacity 0.15s;
      border-radius: 10px;
    }
    .back-btn:active { opacity: 0.6; }
    .back-btn:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .top-spacer { min-width: 64px; flex-shrink: 0; }

    .music-content {
      flex: 1;
      padding: 8px 16px 28px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Player widget */
    .player-card {
      width: 100%;
      box-sizing: border-box;
      background: hsl(var(--card));
      border: 1.5px solid rgba(232, 164, 184, 0.18);
      border-radius: 26px 30px 28px 32px;
      padding: 22px 20px 20px;
      box-shadow: 0 10px 28px -10px rgba(232, 116, 154, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: cardEnter 0.45s cubic-bezier(.3,0,0,1) both;
      position: relative;
    }

    .vinyl-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }
    .vinyl {
      width: 180px; height: 180px; border-radius: 9999px;
      background:
        radial-gradient(circle at 50% 50%, #4a3f45 0%, #4a3f45 4%, transparent 4%),
        repeating-radial-gradient(circle at 50% 50%, #2a2026 0px, #2a2026 2px, #1f161c 3px, #1f161c 6px);
      position: relative;
      box-shadow: 0 18px 36px -10px rgba(0,0,0,0.25);
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }
    .vinyl.playing { animation-play-state: running; }
    .vinyl::before {
      content: ''; position: absolute; inset: 28%; border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #e8a4b8, #d4869f 60%, #b06a82 100%);
      border: 3px dashed rgba(255,255,255,0.35);
    }
    .vinyl::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; border-radius: 9999px;
      background: #4a3f45; transform: translate(-50%, -50%); z-index: 2;
    }
    .tonearm {
      position: absolute; top: 4px; right: 24px;
      width: 4px; height: 72px; background: #4a3f45; border-radius: 9999px;
      transform: rotate(18deg); transform-origin: top center; z-index: 3;
    }
    .tonearm::after {
      content: ''; position: absolute; bottom: -10px; left: -7px;
      width: 18px; height: 18px; border-radius: 9999px;
      background: #e8a4b8; border: 3px solid #4a3f45;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .music-info { text-align: center; max-width: 280px; }
    .music-name {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;

  </style>

  <script>
    (function () {
      "use strict";

      var MAX_SONGS = 8;
      var KEYS = {
        playlist: "mengjiao_playlist_v2",
        currentIndex: "mengjiao_music_index",
        autoplay: "mengjiao_music_autoplay",
        volume: "mengjiao_music_volume",
        legacyBg: "mengjiao_bg_music"
      };

      function getItem(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          if (v !== null && v !== "") return v;
        } catch (e) {}
        return fallback;
      }
      function setItem(key, val) {
        try { localStorage.setItem(key, val); } catch (e) {}
      }

      function getPlaylist() {
        try {
          var p = JSON.parse(getItem(KEYS.playlist, "[]"));
          if (Array.isArray(p)) return p;
        } catch (e) {}
        return [];
      }
      function setPlaylist(p) { setItem(KEYS.playlist, JSON.stringify(p)); }

      function getCurrentIndex() {
        var p = getPlaylist();
        if (p.length === 0) return -1;
        var i = parseInt(getItem(KEYS.currentIndex, "0"), 10) || 0;
        if (i < 0 || i >= p.length) return 0;
        return i;
      }
      function setCurrentIndex(i) { setItem(KEYS.currentIndex, String(i)); }

      function migrateLegacy() {
        var old = getItem(KEYS.legacyBg, "");
        if (!old) return;
        var p = getPlaylist();
        if (p.length === 0) {
          setPlaylist([{ id: Date.now(), url: old, name: nameFromUrl(old) }]);
          setCurrentIndex(0);
        }
        try { localStorage.removeItem(KEYS.legacyBg); } catch (e) {}
      }

      function nameFromUrl(url) {
        if (!url) return "";
        try {
          var u = new URL(url);
          var last = u.pathname.split("/").filter(Boolean).pop();
          return last ? decodeURIComponent(last) : url;
        } catch (e) { return url; }
      }

      function formatTime(sec) {
        if (!sec || isNaN(sec) || !isFinite(sec)) return "00:00";
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      var audio = document.getElementById("audio");
      var vinyl = document.getElementById("vinyl");
      var musicName = document.getElementById("musicName");
      var musicStatus = document.getElementById("musicStatus");
      var playBtn = document.getElementById("playBtn");
      var playIcon = document.getElementById("playIcon");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var progressBar = document.getElementById("progressBar");
      var progressFill = document.getElementById("progressFill");
      var currentTimeEl = document.getElementById("currentTime");
      var totalTimeEl = document.getElementById("totalTime");
      var volumeSlider = document.getElementById("volumeSlider");
      var autoplayToggle = document.getElementById("autoplayToggle");
      var defaultVolumeSlider = document.getElementById("defaultVolumeSlider");
      var volPercent = document.getElementById("volPercent");
      var urlInput = document.getElementById("urlInput");
      var saveUrlBtn = document.getElementById("saveUrlBtn");
      var songListEl = document.getElementById("songList");
      var emptyState = document.getElementById("emptyState");
      var songCountEl = document.getElementById("songCount");
      var toast = document.getElementById("toast");
      var toastTimer;
      var slots = Array.from(songListEl.querySelectorAll(".song-card"));

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
      }

      function setStatus(text, active) {
        musicStatus.textContent = text;
        musicStatus.classList.toggle("active", active);
      }

      function syncPlayIcon(playing) {
        playIcon.setAttribute("data-lucide", playing ? "pause" : "play");
        if (window.lucide) lucide.createIcons();
      }

      function loadCurrent() {
        var p = getPlaylist();
        var idx = getCurrentIndex();
        if (p.length === 0 || idx < 0) {
          audio.removeAttribute("src");
          audio.load();
          progressFill.style.width = "0%";
          currentTimeEl.textContent = "00:00";
          totalTimeEl.textContent = "00:00";
          return;
        }
        var song = p[idx];
        if (audio.src !== song.url) {
          audio.src = song.url;
          audio.load();
        }
      }

      function updateMusicDisplay() {
        var p = getPlaylist();
        var idx = getCurrentIndex();
        songCountEl.textContent = p.length + " 首";
        emptyState.hidden = p.length > 0;

        slots.forEach(function (slot, i) {
          var song = p[i];
          if (!song) {
            slot.hidden = true;
            slot.classList.remove("active");
            return;
          }
          slot.hidden = false;
          slot.classList.toggle("active", i === idx);
          slot.setAttribute("data-index", String(i));
          slot.querySelector("[data-name]").textContent = song.name || "未知歌曲";
          slot.querySelector("[data-url]").textContent = song.url;
          var del = slot.querySelector("[data-delete]");
          del.setAttribute("data-delete", String(i));
        });

        if (p.length === 0 || idx < 0) {
          musicName.textContent = "未设置音乐";
          playBtn.disabled = true;
          setStatus("点击下方按钮添加歌曲", false);
          syncPlayIcon(false);
          return;
        }
        musicName.textContent = p[idx].name || "未知歌曲";
        playBtn.disabled = false;
        if (audio.paused) {
          setStatus(audio.src ? "准备播放" : "点击下方按钮添加歌曲", false);
        }
      }

      function syncVolumeUI(val) {
        var v = Math.max(0, Math.min(1, Number(val) || 0));
        volumeSlider.value = v;
        defaultVolumeSlider.value = v;
        volPercent.textContent = Math.round(v * 100) + "%";
        audio.volume = v;
      }

      function togglePlay() {
        var p = getPlaylist();
        var idx = getCurrentIndex();
        if (p.length === 0 || idx < 0) {
          showToast("请先添加歌曲");
          return;
        }
        if (!audio.src) loadCurrent();
        if (audio.paused) {
          var promise = audio.play();
          if (promise && typeof promise.then === "function") {
            promise.catch(function () {
              showToast("无法播放此链接，请检查格式");
              setStatus("播放失败", false);
            });
          }
        } else {
          audio.pause();
        }
      }

      function playIndex(i) {
        var p = getPlaylist();
        if (i < 0 || i >= p.length) return;
        setCurrentIndex(i);
        loadCurrent();
        var promise = audio.play();
        if (promise && typeof promise.then === "function") {
          promise.catch(function () {
            showToast("无法播放此链接，请检查格式");
            setStatus("播放失败", false);
          });
        }
        updateMusicDisplay();
      }

      function prevSong() {
        var p = getPlaylist();
        if (p.length === 0) return;
        var idx = getCurrentIndex();
        playIndex((idx - 1 + p.length) % p.length);
      }

      function nextSong() {
        var p = getPlaylist();
        if (p.length === 0) return;
        var idx = getCurrentIndex();
        playIndex((idx + 1) % p.length);
      }

      function addSong() {
        var val = urlInput.value.trim();
        if (!val) {
          showToast("请输入音频链接");
          return;
        }
        var p = getPlaylist();
        if (p.length >= MAX_SONGS) {
          showToast("歌单最多保存 8 首");
          return;
        }
        p.push({ id: Date.now(), url: val, name: nameFromUrl(val) });
        setPlaylist(p);
        if (p.length === 1) {
          setCurrentIndex(0);
          loadCurrent();
        }
        urlInput.value = "";
        updateMusicDisplay();
        showToast("已加入歌单");
      }

      function deleteSong(i) {
        var p = getPlaylist();
        var idx = getCurrentIndex();
        var wasPlaying = !audio.paused;
        p.splice(i, 1);
        setPlaylist(p);
        if (p.length === 0) {
          setCurrentIndex(-1);
          audio.pause();
          audio.removeAttribute("src");
          audio.load();
        } else {
          if (idx === i) {
            var newIdx = Math.min(i, p.length - 1);
            setCurrentIndex(newIdx);
            loadCurrent();
            if (wasPlaying) {
              var promise = audio.play();
              if (promise && typeof promise.then === "function") promise.catch(function () {});
            }
          } else if (idx > i) {
            setCurrentIndex(idx - 1);
          }
        }
        updateMusicDisplay();
      }

      playBtn.addEventListener("click", togglePlay);
      prevBtn.addEventListener("click", prevSong);
      nextBtn.addEventListener("click", nextSong);
      saveUrlBtn.addEventListener("click", addSong);
      urlInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addSong(); }
      });

      songListEl.addEventListener("click", function (e) {
        var delBtn = e.target.closest("[data-delete]");
        if (delBtn) {
          var i = parseInt(delBtn.getAttribute("data-delete"), 10);
          if (!isNaN(i)) deleteSong(i);
          e.stopPropagation();
          return;
        }
        var card = e.target.closest(".song-card");
        if (card && !card.hidden) {
          var i = parseInt(card.getAttribute("data-index"), 10);
          if (!isNaN(i)) playIndex(i);
        }
      });

      volumeSlider.addEventListener("input", function () {
        syncVolumeUI(volumeSlider.value);
        setItem(KEYS.volume, volumeSlider.value);
      });
      defaultVolumeSlider.addEventListener("input", function () {
        syncVolumeUI(defaultVolumeSlider.value);
        setItem(KEYS.volume, defaultVolumeSlider.value);
      });
      autoplayToggle.addEventListener("change", function () {
        setItem(KEYS.autoplay, autoplayToggle.checked ? "true" : "false");
        showToast(autoplayToggle.checked ? "已开启自动播放" : "已关闭自动播放");
      });

      progressBar.addEventListener("click", function (e) {
        if (!audio.duration || !isFinite(audio.duration)) return;
        var rect = progressBar.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / rect.width;
        ratio = Math.max(0, Math.min(1, ratio));
        audio.currentTime = ratio * audio.duration;
      });

      audio.addEventListener("play", function () {
        vinyl.classList.add("playing");
        syncPlayIcon(true);
        setStatus("播放中…", true);
      });
      audio.addEventListener("pause", function () {
        vinyl.classList.remove("playing");
        syncPlayIcon(false);
        if (!audio.ended) setStatus("已暂停", false);
      });
      audio.addEventListener("ended", function () {
        vinyl.classList.remove("playing");
        syncPlayIcon(false);
        setStatus("播放结束", false);
        progressFill.style.width = "0%";
        currentTimeEl.textContent = "00:00";
        nextSong();
      });
      audio.addEventListener("loadedmetadata", function () {
        totalTimeEl.textContent = formatTime(audio.duration);
      });
      audio.addEventListener("timeupdate", function () {
        if (audio.duration && isFinite(audio.duration)) {
          var pct = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = pct + "%";
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      });
      audio.addEventListener("error", function () {
        if (audio.src) {
          vinyl.classList.remove("playing");
          syncPlayIcon(false);
          showToast("无法播放此链接，请检查格式");
          setStatus("播放失败", false);
        }
      });

      migrateLegacy();
      var savedAutoplay = getItem(KEYS.autoplay, "false") === "true";
      var savedVolume = getItem(KEYS.volume, "0.6");
      autoplayToggle.checked = savedAutoplay;
      syncVolumeUI(savedVolume);
      loadCurrent();
      updateMusicDisplay();
      if (savedAutoplay && getPlaylist().length > 0 && audio.paused) {
        var promise = audio.play();
        if (promise && typeof promise.then === "function") promise.catch(function () {});
      }
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
