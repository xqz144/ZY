<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8a4b8">
    <title>个人资料 · 梦角传讯</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <script>
      if ('serviceWorker' in navigator) {

    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="../assets/image-utils.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <main>
    <div class="phone-frame" id="phoneFrame">
      <div class="dynamic-notch"></div>

      <div class="status-bar">
        <span class="status-time" id="statusTime">09:41</span>
        <div class="status-icons">
          <i data-lucide="signal" class="status-icon"></i>
          <i data-lucide="wifi" class="status-icon"></i>
          <i data-lucide="battery-medium" class="status-icon"></i>
        </div>
      </div>

      <div class="screen" id="screen">
        <!-- Page header -->
        <div class="page-header">
          <a href="../index-zy.html" class="back-btn" data-dom-id="nav-back" aria-label="返回">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>返回</span>
          </a>
          <h1 class="page-title">个人资料</h1>
          <div class="header-spacer"></div>
        </div>

        <!-- Profile / replies tab bar -->
        <nav class="profile-tabs" aria-label="设置分类">
          <a href="customize-profile.html" class="profile-tab active" data-dom-id="tab-profile" aria-current="page">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span>个人资料</span>
          </a>
          <a href="customize-replies.html" class="profile-tab" data-dom-id="tab-replies">
            <i data-lucide="message-square" class="w-4 h-4"></i>
            <span>回复库</span>
          </a>
          <a href="customize-voice.html" class="profile-tab" data-dom-id="tab-voice">
            <i data-lucide="mic" class="w-4 h-4"></i>
            <span>语音库</span>
          </a>
        </nav>

        <!-- Profile preview widget -->
        <section class="profile-preview widget" id="previewCard" aria-label="实时预览">
          <div class="preview-deco">
            <svg class="deco-cloud" viewBox="0 0 48 28" fill="currentColor"><path d="M40 22H10c-4.4 0-8-3.6-8-8s3.6-8 8-8c.4 0 .8 0 1.1.1C12.3 2.5 17.3 0 23 0c6.8 0 12.6 4.2 14.7 10.1C41.3 9.3 44 11.9 44 15c0 3.9-3.1 7-7 7z"/></svg>
            <svg class="deco-heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="preview-row">
            <div class="preview-avatar" id="pvAvatar" aria-label="头像预览"><i data-lucide="user" class="w-7 h-7"></i></div>
            <div class="preview-info">
              <div class="preview-name truncate" id="pvName">@my_profile</div>
              <div class="preview-sig truncate" id="pvSignature">今天也要加油呀</div>
            </div>
          </div>
          <div class="preview-days">
            <span class="days-num" id="pvDays">769</span>
            <span class="days-label">天 · 在一起</span>
          </div>
          <div class="preview-date" id="pvTime">2026.07.30</div>
        </section>

        <!-- Basic info widget -->
        <section class="widget settings-widget" aria-label="基础资料">
          <div class="widget-header">
            <div class="widget-icon" style="background: linear-gradient(145deg, #f4a0bc, #e8749a);">
              <i data-lucide="user" class="w-4 h-4" style="color: #fff;"></i>
            </div>
            <span class="widget-title">基础资料</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="usernameInput">昵称</label>
            <input type="text" id="usernameInput" class="form-input" value="@my_profile" maxlength="20" placeholder="输入你的昵称…" />
          </div>
          <div class="form-group">
            <label class="form-label" for="signatureInput">签名</label>
            <input type="text" id="signatureInput" class="form-input" value="今天也要加油呀" maxlength="30" placeholder="输入你的签名…" />
            <p class="form-hint"><span id="sigCount">7</span>/30</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="togetherDateInput">在一起日期</label>
            <input type="date" id="togetherDateInput" class="form-input" />
            <p class="form-hint">已在一起 <span class="days-highlight" id="togetherDaysDisplay">769</span> 天</p>
          </div>
        </section>

        <!-- Appearance widget -->
        <section class="widget settings-widget" aria-label="外观">
          <div class="widget-header">
            <div class="widget-icon" style="background: linear-gradient(145deg, #f7b6ce, #f091b2);">
              <i data-lucide="palette" class="w-4 h-4" style="color: #fff;"></i>
            </div>
            <span class="widget-title">外观</span>
          </div>
          <div class="form-group">
            <label class="form-label">主题配色</label>
            <div class="theme-grid" id="themeGrid">
              <button type="button" class="theme-chip" data-theme="default" aria-pressed="true">
                <span class="chip-dot" style="background:linear-gradient(135deg,#f4a0bc,#e8749a)"></span>
                <span class="chip-name">默认</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
              <button type="button" class="theme-chip" data-theme="sakura" aria-pressed="false">
                <span class="chip-dot" style="background:linear-gradient(135deg,#e8a0bf,#d98aae)"></span>
                <span class="chip-name">樱花</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
              <button type="button" class="theme-chip" data-theme="ocean" aria-pressed="false">
                <span class="chip-dot" style="background:linear-gradient(135deg,#6ba3c5,#4f8aab)"></span>
                <span class="chip-name">海洋</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
              <button type="button" class="theme-chip" data-theme="forest" aria-pressed="false">
                <span class="chip-dot" style="background:linear-gradient(135deg,#7fa68c,#5f8a6c)"></span>
                <span class="chip-name">森林</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
              <button type="button" class="theme-chip" data-theme="sunset" aria-pressed="false">
                <span class="chip-dot" style="background:linear-gradient(135deg,#d4956b,#b87a52)"></span>
                <span class="chip-name">日落</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
              <button type="button" class="theme-chip" data-theme="night" aria-pressed="false">
                <span class="chip-dot" style="background:linear-gradient(135deg,#4a4570,#343052)"></span>
                <span class="chip-name">暗夜</span>
                <span class="chip-check"><i data-lucide="check" class="w-3 h-3"></i></span>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">页面背景</label>
            <div class="upload-row">
              <button type="button" class="upload-btn" data-action="upload-bg" data-dom-id="upload-bg">
                <i data-lucide="image-plus" class="w-4 h-4"></i>
                <span>上传背景</span>
              </button>
              <button type="button" class="upload-btn ghost" id="clearBg">清除</button>
              <input type="file" id="bgInput" accept="image/*" class="hidden" />
            </div>
            <div id="bgPreviewWrap" class="bg-preview-wrap hidden">
              <img id="bgPreview" src="" alt="" />
            </div>
          </div>
        </section>

        <!-- Avatar widget -->
        <section class="widget settings-widget" aria-label="头像">
          <div class="widget-header">
            <div class="widget-icon" style="background: linear-gradient(145deg, #f5acc6, #ec80a3);">
              <i data-lucide="camera" class="w-4 h-4" style="color: #fff;"></i>
            </div>
            <span class="widget-title">头像</span>
          </div>
          <div class="avatar-row">
            <div class="av-preview av-mine" id="avMinePreview" aria-label="我的头像"><i data-lucide="user" class="w-6 h-6"></i></div>
            <div class="avatar-info">
              <p class="avatar-name">我的头像</p>
              <p class="form-hint">建议圆形头像</p>
            </div>
            <button type="button" class="upload-btn" data-action="upload-avatar" data-dom-id="upload-avatar">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>上传</span>
            </button>
            <input type="file" id="avatarInput" accept="image/*" class="hidden" />
          </div>
          <div class="avatar-row">
            <div class="av-preview av-dream" id="avDreamPreview" aria-label="梦角头像"><i data-lucide="sparkles" class="w-6 h-6"></i></div>
            <div class="avatar-info">
              <p class="avatar-name">梦角头像</p>
              <p class="form-hint">为梦角设置形象</p>
            </div>
            <button type="button" class="upload-btn" data-action="upload-dream" data-dom-id="upload-dream">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>上传</span>
            </button>
            <input type="file" id="dreamInput" accept="image/*" class="hidden" />
          </div>
        </section>

        <!-- Save button -->
        <button type="button" class="save-settings-btn" id="saveBtn" data-dom-id="save-settings">
          <i data-lucide="check" class="w-5 h-5"></i>
          <span>保存设置</span>
        </button>

        <div class="home-indicator"><span></span></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-sans);
      letter-spacing: var(--tracking-normal);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(var(--background));
    }

    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      background: var(--primary-bg);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .phone-frame {
        height: 860px;
        border-radius: 44px;
        border: 10px solid #4a3f45;
        box-shadow: 0 25px 60px -15px hsl(340 12% 28% / 0.25), 0 0 0 2px hsl(340 12% 22%);
      }
      .dynamic-notch {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 30px;
        background: #4a3f45;
        border-radius: 0 0 20px 20px;
        z-index: 100;
      }
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px 6px;
      color: var(--text-primary);
      z-index: 50;
    }
    .status-time {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-icon {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      padding: 0 16px 0;
      scrollbar-width: none;
      background:
        radial-gradient(ellipse 520px 320px at 10% 0%, hsl(343 70% 92% / 0.7), transparent 55%),
        radial-gradient(ellipse 420px 260px at 95% 8%, hsl(343 60% 90% / 0.5), transparent 50%),
        linear-gradient(180deg, var(--primary-bg) 0%, #fdf8fa 100%);
    }
    .screen::-webkit-scrollbar { display: none; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0 6px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 9999px;
      flex-shrink: 0;
      min-width: 72px;
      color: hsl(var(--primary));
      background: hsl(var(--accent));
      text-decoration: none;
      transition: transform 0.15s, background-color 0.15s;
      white-space: nowrap;
    }
    .back-btn:active { transform: scale(0.96); }
    .page-title {
      flex: 1;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }
    .header-spacer {
      width: 72px;
      flex-shrink: 0;
    }

    .profile-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0 14px;
    }
    .profile-tab {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 0;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: hsl(var(--muted));
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, background-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .profile-tab:active { transform: scale(0.98); }
    .profile-tab.active {
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      border-color: transparent;
    }

    .widget {
      background: hsl(var(--card));
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .widget:hover { box-shadow: var(--shadow-md); }

    .profile-preview {
      margin-top: 6px;
      padding: 18px 16px;
      background: linear-gradient(135deg, var(--pv-banner-1, #f4a0bc), var(--pv-banner-2, #e8749a));
      color: #fff;
      border: none;
    }
    .preview-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: hsl(0 0% 100% / 0.22);
    }
    .deco-cloud {
      position: absolute;
      top: 10px;
      right: 18px;
      width: 56px;
      height: 32px;
    }
    .deco-heart {
      position: absolute;
      bottom: 14px;
      right: 52px;
      width: 18px;
      height: 18px;
    }
    .preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .preview-avatar {
      width: 60px;
      height: 60px;
      border-radius: 9999px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      background: linear-gradient(135deg, var(--pv-avatar-1, #fbc8d8), var(--pv-avatar-2, #f4a0bc));
      outline: 3px solid hsl(0 0% 100% / 0.3);
      outline-offset: 1px;
      overflow: hidden;
      transition: background 0.3s cubic-bezier(0.3, 0, 0, 1);
    }
    .preview-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-info {
      min-width: 0;
      flex: 1;
    }
    .preview-name {
      font-size: 17px;
      font-weight: 600;
      color: hsl(0 0% 100%);
    }
    .preview-sig {
      font-size: 12px;
      color: hsl(0 0% 100% / 0.85);
      margin-top: 3px;
    }
    .preview-days {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }
    .days-num {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .days-label {
      font-size: 13px;
      opacity: 0.9;
    }
    .preview-date {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      font-variant-numeric: tabular-nums;
    }

    .settings-widget {
      margin-top: 10px;
      padding: 14px 14px 16px;
    }
    .widget-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .widget-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .widget-title {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .widget-count {
      font-size: 12px;
      color: var(--text-secondary);
      background: hsl(var(--muted));
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: hsl(var(--muted));
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input::placeholder { color: var(--text-secondary); }
    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px hsl(343 55% 78% / 0.2);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-secondary);
      margin: 5px 0 0;
    }
    .days-highlight {
      color: hsl(var(--primary));
      font-weight: 600;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .theme-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 4px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background-color 0.15s, transform 0.15s;
    }
    .theme-chip:hover { border-color: hsl(var(--primary) / 0.5); background: hsl(var(--accent) / 0.35); }
    .theme-chip:active { transform: scale(0.98); }
    .theme-chip[aria-pressed="true"] { border-color: hsl(var(--primary)); background: hsl(var(--accent) / 0.5); }
    .chip-dot {
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      box-shadow: inset 0 0 0 2px hsl(var(--card));
    }
    .chip-name {
      font-size: 11px;
      color: var(--text-primary);
    }
    .chip-check {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.2s cubic-bezier(0.3, 0, 0, 1), transform 0.2s cubic-bezier(0.3, 0, 0, 1);
    }
    .theme-chip[aria-pressed="true"] .chip-check { opacity: 1; transform: scale(1); }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: hsl(var(--muted));
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s, transform 0.15s;
      white-space: nowrap;
    }
    .upload-btn:hover { border-color: hsl(var(--primary) / 0.5); background: hsl(var(--accent) / 0.4); }
    .upload-btn:active { transform: scale(0.98); }
    .upload-btn.ghost { background: transparent; }
    .hidden { display: none !important; }
    .bg-preview-wrap {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .bg-preview-wrap img {
      width: 100%;
      height: 96px;
      object-fit: cover;
      display: block;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
    }
    .avatar-row:first-of-type { border-top: none; padding-top: 0; }
    .avatar-info { flex: 1; min-width: 0; }
    .avatar-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 2px;
    }
    .av-preview {
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .av-preview img { width: 100%; height: 100%; object-fit: cover; }
    .av-mine { background: radial-gradient(circle at 32% 28%, #ffe4ec, #f4a0bc); }
    .av-dream { background: radial-gradient(circle at 32% 28%, #ffeef3, #f7bcd0); }

    .save-settings-btn {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #f4a0bc, #e8749a);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .save-settings-btn:hover { box-shadow: 0 6px 16px -4px hsl(343 55% 60% / 0.35); }
    .save-settings-btn:active { transform: scale(0.98); }

    .home-indicator {
      display: flex;
      justify-content: center;
      padding: 14px 0 10px;
    }
    .home-indicator span {
      width: 130px;
      height: 4px;
      border-radius: 9999px;
      background: hsl(var(--foreground) / 0.2);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .widget, .page-header, .profile-tabs, .save-settings-btn {
      animation: fadeInUp 0.45s cubic-bezier(0.3, 0, 0, 1) both;
    }
    .settings-widget:nth-child(4) { animation-delay: 0.05s; }
    .settings-widget:nth-child(5) { animation-delay: 0.1s; }
    .settings-widget:nth-child(6) { animation-delay: 0.15s; }
    .save-settings-btn { animation-delay: 0.2s; }

    :focus-visible {
      outline: 2px solid hsl(var(--ring));
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    (function () {
      "use strict";

      var themes = {
        default: { banner1:'#f4a0bc', banner2:'#e8749a', av1:'#fbc8d8', av2:'#f4a0bc', tint:'#fff8fa', accent:'#e8749a' },
        sakura:  { banner1:'#e8a0bf', banner2:'#d98aae', av1:'#f3c8d8', av2:'#e8a0bf', tint:'#fdf6f9', accent:'#e8a0bf' },
        ocean:   { banner1:'#6ba3c5', banner2:'#4f8aab', av1:'#a8c8dd', av2:'#6ba3c5', tint:'#f6fafc', accent:'#6ba3c5' },
        forest:  { banner1:'#7fa68c', banner2:'#5f8a6c', av1:'#aecab9', av2:'#7fa68c', tint:'#f6faf7', accent:'#7fa68c' },
        sunset:  { banner1:'#d4956b', banner2:'#b87a52', av1:'#e6bb9b', av2:'#d4956b', tint:'#fcf8f5', accent:'#d4956b' },
        night:   { banner1:'#4a4570', banner2:'#343052', av1:'#7a75a0', av2:'#4a4570', tint:'#f7f7fb', accent:'#4a4570' }
      };

      var previewCard = document.getElementById('previewCard');

      function applyTheme(key) {
        var t = themes[key];
        if (!t) return;
        previewCard.style.setProperty('--pv-banner-1', t.banner1);
        previewCard.style.setProperty('--pv-banner-2', t.banner2);
        previewCard.style.setProperty('--pv-avatar-1', t.av1);
        previewCard.style.setProperty('--pv-avatar-2', t.av2);
      }

      document.getElementById('themeGrid').addEventListener('click', function (e) {
        var chip = e.target.closest('.theme-chip');
        if (!chip) return;
        document.querySelectorAll('.theme-chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
        chip.setAttribute('aria-pressed', 'true');
        applyTheme(chip.dataset.theme);
      });

      var sigInput = document.getElementById('signatureInput');
      var sigOut = document.getElementById('pvSignature');
      var sigCount = document.getElementById('sigCount');
      sigInput.addEventListener('input', function () {
        var val = sigInput.value || '今天也要加油呀';
        sigOut.textContent = val;
        sigCount.textContent = sigInput.value.length;
      });

      var toast = document.getElementById('toast');
      var toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
      }

      var togetherDateInput = document.getElementById('togetherDateInput');
      var togetherDaysDisplay = document.getElementById('togetherDaysDisplay');
      var pvDays = document.getElementById('pvDays');
      var pvTime = document.getElementById('pvTime');

      function calcDays(dateStr) {
        if (!dateStr) return null;
        var start = new Date(dateStr + 'T00:00:00');
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var diff = Math.floor((today - start) / 86400000);
        return diff >= 0 ? diff : null;
      }

      function updateDays() {
        var days = calcDays(togetherDateInput.value);
        var display = days !== null ? String(days) : '—';
        togetherDaysDisplay.textContent = display;
        if (pvDays) pvDays.textContent = display;
        if (pvTime && togetherDateInput.value) {
          var d = new Date(togetherDateInput.value + 'T00:00:00');
          pvTime.textContent = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
        }
      }

      togetherDateInput.addEventListener('change', updateDays);

      try {
        var savedDate = localStorage.getItem('mengjiao_together_date');
        if (savedDate) togetherDateInput.value = savedDate;
      } catch(e) {}
      updateDays();

      var usernameInput = document.getElementById('usernameInput');
      var pvName = document.getElementById('pvName');
      usernameInput.addEventListener('input', function () {
        if (pvName) pvName.textContent = usernameInput.value || '@my_profile';
      });
      try {
        var savedUsername = localStorage.getItem('mengjiao_username');
        if (savedUsername) { usernameInput.value = savedUsername; if (pvName) pvName.textContent = savedUsername; }
      } catch(e) {}

      try {
        var savedSig = localStorage.getItem('mengjiao_signature');
        if (savedSig !== null) {
          sigInput.value = savedSig;
          sigOut.textContent = savedSig || '今天也要加油呀';
          sigCount.textContent = String(savedSig.length);
        }
      } catch(e) {}

      function handleImageUpload(file, cb) {
        if (!file || !file.type.startsWith('image/')) return cb(null);
        var utils = window.MengjiaoImageUtils;
        var check = utils.checkStorageLimit();
        if (!check.ok) {
          utils.showToast(check.message, 4000);
          return cb(null);
        }
        utils.compressImage(file, { maxWidth: 800, maxHeight: 800, quality: 0.8 }).then(function (data) {
          cb(data);
        }).catch(function (err) {
          utils.showToast(err.message || '图片处理失败');
          cb(null);
        });
      }

      var avMinePreview = document.getElementById('avMinePreview');
      var avDreamPreview = document.getElementById('avDreamPreview');
      var pvAvatar = document.getElementById('pvAvatar');
      var bgPreviewWrap = document.getElementById('bgPreviewWrap');
      var bgPreview = document.getElementById('bgPreview');

      var DEFAULT_AVATAR_USER = '../assets/avatar-user.jpg';
      var DEFAULT_AVATAR_DREAM = '../assets/avatar-dream.jpg';

      var tempAvatarImg = '';
      var tempDreamImg = '';
      var tempBgImg = '';

      try {
        var saved = localStorage.getItem('mengjiao_avatar_img');
        tempAvatarImg = saved || DEFAULT_AVATAR_USER;
        setImg(avMinePreview, tempAvatarImg);
        setImg(pvAvatar, tempAvatarImg);
      } catch(e) {}
      try {
        var saved = localStorage.getItem('mengjiao_dream_img');
        tempDreamImg = saved || DEFAULT_AVATAR_DREAM;
        setImg(avDreamPreview, tempDreamImg);
      } catch(e) {}
      try {
        var saved = localStorage.getItem('mengjiao_bg_img');
        if (saved) { tempBgImg = saved; setBgPreview(saved); }
      } catch(e) {}

      function setImg(el, src) {
        if (!src) {
          if (el.id === 'avMinePreview' || el.id === 'pvAvatar') {
            el.innerHTML = '<i data-lucide="user" class="w-6 h-6"></i>';
          } else {
            el.innerHTML = '<i data-lucide="sparkles" class="w-6 h-6"></i>';
          }
          return;
        }
        el.innerHTML = '<img src="' + src + '" alt="" />';
      }
      function setBgPreview(src) {
        if (src) { bgPreview.src = src; bgPreviewWrap.classList.remove('hidden'); }
        else { bgPreview.src = ''; bgPreviewWrap.classList.add('hidden'); }
      }

      document.querySelector('[data-action="upload-avatar"]').addEventListener('click', function () { document.getElementById('avatarInput').click(); });
      document.getElementById('avatarInput').addEventListener('change', function (e) {
        handleImageUpload(e.target.files[0], function (data) {
          if (!data) return;
          tempAvatarImg = data;
          setImg(avMinePreview, data);
          setImg(pvAvatar, data);
          lucide.createIcons();
        });
        e.target.value = '';
      });

      document.querySelector('[data-action="upload-dream"]').addEventListener('click', function () { document.getElementById('dreamInput').click(); });
      document.getElementById('dreamInput').addEventListener('change', function (e) {
        handleImageUpload(e.target.files[0], function (data) {
          if (!data) return;
          tempDreamImg = data;
          setImg(avDreamPreview, data);
        });
        e.target.value = '';
      });

      document.querySelector('[data-action="upload-bg"]').addEventListener('click', function () { document.getElementById('bgInput').click(); });
      document.getElementById('bgInput').addEventListener('change', function (e) {
        handleImageUpload(e.target.files[0], function (data) {
          if (!data) return;
          tempBgImg = data;
          setBgPreview(data);
        });
        e.target.value = '';
      });

      document.getElementById('clearBg').addEventListener('click', function () {
        tempBgImg = '';
        setBgPreview('');
      });

      document.getElementById('saveBtn').addEventListener('click', function () {
        try {
          localStorage.setItem('mengjiao_together_date', togetherDateInput.value);
          localStorage.setItem('mengjiao_username', usernameInput.value);
          localStorage.setItem('mengjiao_signature', sigInput.value);
          if (tempAvatarImg) localStorage.setItem('mengjiao_avatar_img', tempAvatarImg); else localStorage.removeItem('mengjiao_avatar_img');
          if (tempDreamImg) localStorage.setItem('mengjiao_dream_img', tempDreamImg); else localStorage.removeItem('mengjiao_dream_img');
          if (tempBgImg) localStorage.setItem('mengjiao_bg_img', tempBgImg); else localStorage.removeItem('mengjiao_bg_img');
          showToast('设置已保存');
        } catch(e) {
          showToast('保存失败，请重试');
        }
      });

      function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('statusTime').textContent = h + ':' + m;
      }
      updateClock();
      setInterval(updateClock, 1000);

      lucide.createIcons();

      document.body.addEventListener('touchmove', function (e) {
        if (e.target.closest('.screen') || e.target.closest('.toast')) return;
        e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
