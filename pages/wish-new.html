<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心愿 · 梦角传讯</title>
    <style id="theme-vars">
/* 梦角传讯 — 动漫手绘风主题 */
/* 灵感：iOS 桌面小组件 · 柔和粉彩 · 手绘边框 · 可爱装饰 */

@font-face {
  font-family: 'DreamFont';
  src: url('https://image.uglycat.cc/dpl50d.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

:root {
  /* bg — 暖灰白，像素描纸 */
  --background: 30 20% 97%;
  --card: 0 0% 100%;
  --popover: 0 0% 100%;

  /* text — 柔和深灰，不刺眼 */
  --foreground: 340 12% 28%;
  --card-foreground: 340 12% 28%;
  --popover-foreground: 340 12% 28%;
  --muted-foreground: 340 10% 55%;

  /* accent — 柔粉蜡笔色 */
  --primary: 343 55% 78%;
  --primary-foreground: 340 15% 22%;
  --secondary: 340 35% 95%;
  --secondary-foreground: 340 12% 28%;
  --muted: 30 18% 94%;
  --accent: 343 40% 92%;
  --accent-foreground: 340 12% 28%;

  /* status */
  --destructive: 0 70% 65%;
  --destructive-foreground: 0 0% 98%;

  /* border — 手绘感浅粉 */
  --border: 343 45% 78% / 0.25;
  --input: 30 18% 94%;
  --ring: 343 55% 78%;

  /* chart */
  --chart-1: 343 55% 78%;
  --chart-2: 343 45% 85%;
  --chart-3: 340 15% 70%;
  --chart-4: 343 35% 90%;
  --chart-5: 340 12% 60%;

  /* sidebar */
  --sidebar: 30 20% 97%;
  --sidebar-foreground: 340 12% 28%;
  --sidebar-primary: 343 55% 78%;
  --sidebar-primary-foreground: 340 15% 22%;
  --sidebar-accent: 343 40% 92%;
  --sidebar-accent-foreground: 340 12% 28%;
  --sidebar-border: 343 45% 78% / 0.25;
  --sidebar-ring: 343 55% 78%;

  /* typography */
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;

  --radius: 1.25rem;

  /* shadow — 柔和漂浮感 */
  --shadow-color: 343 40% 55%;
  --shadow-2xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-xs: 0 2px 4px 0 hsl(343 30% 40% / 0.04);
  --shadow-sm: 0 3px 6px -1px hsl(343 30% 40% / 0.06), 0 2px 4px -2px hsl(343 30% 40% / 0.04);
  --shadow: 0 4px 10px -1px hsl(343 30% 40% / 0.08), 0 2px 4px -2px hsl(343 30% 40% / 0.05);
  --shadow-md: 0 8px 16px -4px hsl(343 30% 40% / 0.10), 0 4px 8px -4px hsl(343 30% 40% / 0.06);
  --shadow-lg: 0 15px 25px -6px hsl(343 30% 40% / 0.12), 0 8px 12px -6px hsl(343 30% 40% / 0.08);
  --shadow-xl: 0 25px 40px -8px hsl(343 30% 40% / 0.14), 0 12px 20px -8px hsl(343 30% 40% / 0.10);
  --shadow-2xl: 0 35px 60px -12px hsl(343 30% 40% / 0.18);

  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  /* 直景色值 — 供自定义样式直接引用 */
  --primary-bg: #f9f7f4;
  --secondary-bg: #f3f0ec;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #4a3f45;
  --text-secondary: #9a8a92;
  --border-color: rgba(232, 164, 184, 0.35);
  --chat-bg: #fdfbfa;
}

.dark {
  --background: 340 12% 12%;
  --card: 340 10% 16%;
  --popover: 340 10% 16%;
  --foreground: 340 15% 92%;
  --card-foreground: 340 15% 92%;
  --popover-foreground: 340 15% 92%;
  --muted-foreground: 340 10% 65%;
  --primary: 343 45% 72%;
  --primary-foreground: 340 12% 18%;
  --secondary: 340 15% 24%;
  --secondary-foreground: 340 15% 92%;
  --muted: 340 12% 20%;
  --accent: 343 25% 28%;
  --accent-foreground: 340 15% 92%;
  --destructive: 0 60% 58%;
  --destructive-foreground: 0 0% 98%;
  --border: 340 12% 26%;
  --input: 340 12% 22%;
  --ring: 343 45% 72%;
  --chart-1: 343 45% 72%;
  --chart-2: 343 40% 60%;
  --chart-3: 340 12% 60%;
  --chart-4: 343 35% 80%;
  --chart-5: 340 12% 70%;
  --sidebar: 340 12% 12%;
  --sidebar-foreground: 340 15% 92%;
  --sidebar-primary: 343 45% 72%;
  --sidebar-primary-foreground: 340 12% 18%;
  --sidebar-accent: 343 25% 28%;
  --sidebar-accent-foreground: 340 15% 92%;
  --sidebar-border: 340 12% 26%;
  --sidebar-ring: 343 45% 72%;
  --font-sans: "DreamFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DreamFont", "Noto Serif SC", ui-serif, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", monospace;
  --radius: 1.25rem;
  --shadow-color: 343 30% 40%;
  --shadow-2xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-xs: 0 2px 4px 0 hsl(340 12% 5% / 0.25);
  --shadow-sm: 0 3px 6px -1px hsl(340 12% 5% / 0.30), 0 2px 4px -2px hsl(340 12% 5% / 0.25);
  --shadow: 0 4px 10px -1px hsl(340 12% 5% / 0.35), 0 2px 4px -2px hsl(340 12% 5% / 0.28);
  --shadow-md: 0 8px 16px -4px hsl(340 12% 5% / 0.40), 0 4px 8px -4px hsl(340 12% 5% / 0.32);
  --shadow-lg: 0 15px 25px -6px hsl(340 12% 5% / 0.45), 0 8px 12px -6px hsl(340 12% 5% / 0.36);
  --shadow-xl: 0 25px 40px -8px hsl(340 12% 5% / 0.50), 0 12px 20px -8px hsl(340 12% 5% / 0.40);
  --shadow-2xl: 0 35px 60px -12px hsl(340 12% 5% / 0.55);
  --tracking-normal: 0.02em;
  --spacing: 0.3rem;

  --primary-bg: #1a1619;
  --secondary-bg: #242024;
  --accent-color: #e8a4b8;
  --accent-color-rgb: 232, 164, 184;
  --text-primary: #f0e8ec;
  --text-secondary: #a09098;
  --border-color: rgba(232, 164, 184, 0.25);
  --chat-bg: #1a1619;
}

body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-normal);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(232, 164, 184, 0.35); border-radius: 4px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      color: var(--text-primary);
    }

    /* Phone frame */
    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: hsl(var(--background));
    }
    @media (min-width: 480px) {
      .phone {
        height: 860px;
        border-radius: 40px;
        border: 10px solid hsl(343 28% 24%);
        box-shadow: 0 25px 60px -15px hsl(343 40% 35% / 0.30), 0 0 0 2px hsl(343 20% 12%);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 28px;
        background: hsl(343 28% 20%);
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
    }

    .app-bg {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(ellipse 520px 320px at 15% 0%, hsl(343 70% 94% / 0.95), transparent 60%),
        radial-gradient(ellipse 420px 260px at 95% 8%, hsl(343 60% 92% / 0.75), transparent 55%),
        radial-gradient(ellipse 300px 300px at 80% 92%, hsl(43 80% 88% / 0.35), transparent 50%),
        linear-gradient(180deg, var(--primary-bg), var(--secondary-bg));
    }

    /* Hand-drawn starlight */
    .starlight { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .starlight .drawn-star {
      position: absolute;
      fill: none;
      stroke: hsl(343 55% 78% / 0.45);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: starTwinkle 3.6s ease-in-out infinite;
    }
    .starlight .sparkle {
      position: absolute;
      border-radius: 9999px;
      background: hsl(343 72% 68% / 0.35);
      animation: sparkle 3s ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 0.7; transform: scale(1.15) rotate(8deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; transform: scale(0.6); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* Floating hand-drawn clouds */
    .cloud {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    .cloud svg { fill: hsl(0 0% 100% / 0.55); }

    /* Top bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 44px 16px 10px;
      flex-shrink: 0;
    }
    @media (max-width: 479px) { .top-bar { padding-top: 16px; } }
    .back-btn {
      font-size: 15px;
      color: hsl(var(--primary));
      text-decoration: none;
      padding: 6px 8px;
      font-weight: 500;
      flex-shrink: 0;
      min-width: 64px;
      transition: opacity 0.15s;
    }
    .back-btn:active { opacity: 0.6; }
    .top-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }
    .count-badge { flex-shrink: 0; min-width: 64px; display: flex; justify-content: flex-end; }
    .count-badge .pill {
      font-size: 12px; font-weight: 600;
      color: hsl(var(--primary));
      background: hsl(var(--accent) / 0.65);
      border: 1px solid hsl(var(--primary) / 0.22);
      border-radius: 9999px;
      padding: 4px 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Stats candle */
    .stats {
      position: relative;
      z-index: 1;
      margin: 4px 16px 0;
      padding: 14px 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.62);
      border: 1.5px solid rgba(232, 164, 184, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px -4px rgba(232, 164, 184, 0.12);
    }
    .stats-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 10px;
    }
    .stats-text {
      font-size: 13px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .stats-text b {
      color: var(--accent-color);
      font-weight: 600;
      font-family: var(--font-serif);
    }
    .progress-track {
      height: 8px;
      border-radius: 9999px;
      background: rgba(232, 164, 184, 0.15);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #f4c2d4, #e8a4b8);
      transition: width 0.5s cubic-bezier(0.3, 0, 0, 1);
      box-shadow: 0 0 10px -1px rgba(232, 164, 184, 0.45);
    }

    /* Filter row */
    .filter-row {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 8px;
      padding: 12px 16px 4px;
      flex-shrink: 0;
    }
    .filter-pill {
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 9999px;
      border: 1.5px solid rgba(232, 164, 184, 0.20);
      background: rgba(255, 255, 255, 0.55);
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.18s, background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s;
      font-weight: 500;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .filter-pill:active { transform: scale(0.94); }
    .filter-pill.active {
      background: linear-gradient(135deg, #f4c2d4, #e8a4b8);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 10px -3px rgba(232, 164, 184, 0.40);
    }

    /* Category chips */
    .category-row {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 8px;
      padding: 8px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-row::-webkit-scrollbar { display: none; }
    .category-chip {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1.5px solid rgba(232, 164, 184, 0.16);
      background: rgba(255,255,255,0.48);
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.18s, background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .category-chip:active { transform: scale(0.94); }
    .category-chip.active {
      background: rgba(232,164,184,0.14);
      border-color: rgba(232,164,184,0.45);
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Wish wall */
    .wish-wall {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 120px;
      column-count: 2;
      column-gap: 12px;
      position: relative;
      z-index: 1;
      scrollbar-width: none;
    }
    .wish-wall::-webkit-scrollbar { display: none; }

    /* Candle card */
    .wish-card {
      break-inside: avoid;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 18px;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.2s ease;
      animation: candleFloat 4s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    .wish-card:active { transform: scale(0.96); }

    .candle-flame-wrap {
      position: relative;
      width: 28px;
      height: 28px;
      margin-bottom: -10px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .candle-flame {
      width: 14px;
      height: 18px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse at 35% 30%, #fff7e8 0%, #ffd166 35%, #ff9f6b 70%, transparent 90%);
      box-shadow: 0 0 12px 2px rgba(255, 180, 90, 0.45);
      transform-origin: center bottom;
      animation: flameFlicker 1.2s ease-in-out infinite alternate;
      opacity: 0.85;
    }
    .wish-card.fulfilled .candle-flame {
      background: radial-gradient(ellipse at 35% 30%, #fffce8 0%, #ffe066 30%, #ffbf47 65%, #ff8c42 90%);
      box-shadow: 0 0 18px 4px rgba(255, 190, 80, 0.65);
      opacity: 1;
      animation: flameDance 0.9s ease-in-out infinite alternate;
    }
    @keyframes flameFlicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.05) rotate(2deg); }
    }
    @keyframes flameDance {
      0% { transform: scale(1.05) rotate(-4deg); }
      100% { transform: scale(1.15) rotate(4deg); }
    }

    .candle-body {
      width: 100%;
      padding: 13px 13px 11px;
      border-radius: 22px;
      position: relative;
      border: 1.5px solid rgba(232, 164, 184, 0.12);
      box-shadow: 0 4px 14px -4px rgba(232, 164, 184, 0.15), inset 0 1px 0 rgba(255,255,255,0.6);
      background: linear-gradient(180deg, #fffafc 0%, #fff5f8 100%);
    }
    .wish-card:nth-child(4n+1) .candle-body { background: linear-gradient(180deg, #fffafc 0%, #fff0f5 100%); }
    .wish-card:nth-child(4n+2) .candle-body { background: linear-gradient(180deg, #fffbf7 0%, #ffedf3 100%); }
    .wish-card:nth-child(4n+3) .candle-body { background: linear-gradient(180deg, #f8faff 0%, #fff0f7 100%); }
    .wish-card:nth-child(4n+4) .candle-body { background: linear-gradient(180deg, #fff9f7 0%, #ffebf2 100%); }

    .wish-card.fulfilled .candle-body {
      background: linear-gradient(180deg, #fffdf8 0%, #fff4e3 100%);
      box-shadow: 0 4px 18px -3px rgba(255, 190, 90, 0.22), inset 0 1px 0 rgba(255,255,255,0.6);
      border-color: rgba(255, 190, 90, 0.18);
    }

    .wish-card-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
      margin-bottom: 7px;
    }
    .wish-category {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.72);
      color: var(--text-secondary);
      border: 1px solid rgba(232,164,184,0.12);
      white-space: nowrap;
    }
    .wish-priority {
      font-size: 12px;
      line-height: 1;
      opacity: 0.85;
      letter-spacing: -1px;
      color: var(--accent-color);
    }
    .wish-text {
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-primary);
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .wish-text.fulfilled-text {
      text-decoration: line-through;
      opacity: 0.75;
    }
    .wish-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
      gap: 6px;
    }
    .wish-date {
      font-size: 10.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .fulfilled-badge {
      font-size: 10px;
      font-weight: 600;
      color: #c98a1f;
      background: rgba(255, 200, 100, 0.25);
      border: 1px solid rgba(255, 200, 100, 0.35);
      border-radius: 9999px;
      padding: 2px 7px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes candleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 24px 100px;
      position: relative;
      z-index: 1;
    }
    .empty-emoji {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff8e8, #ffe4c8);
      box-shadow: 0 0 22px rgba(255, 190, 90, 0.35);
      animation: emptyGlow 3s ease-in-out infinite;
    }
    .empty-emoji svg {
      width: 48px;
      height: 48px;
      fill: #ffd166;
      filter: drop-shadow(0 0 8px rgba(255, 180, 90, 0.5));
    }
    @keyframes emptyGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 190, 90, 0.30); transform: translateY(0); }
      50% { box-shadow: 0 0 32px rgba(255, 190, 90, 0.55); transform: translateY(-4px); }
    }
    .empty-title {
      margin-top: 16px;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .empty-text {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .empty-templates {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      max-width: 280px;
    }
    .empty-template {
      font-size: 12px;
      padding: 7px 13px;
      border-radius: 9999px;
      border: 1.5px solid rgba(232,164,184,0.2);
      background: rgba(255,255,255,0.6);

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function loadWishes() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed.map(normalizeWish);
          }
        } catch (e) {}
        return null;
      }

      function saveWishes(wishes) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));
        } catch (e) {}
      }

      function normalizeWish(w) {
        return {
          id: w.id || String(Date.now() + Math.random()),
          text: w.text || "",
          date: w.date || isoDate(new Date()),
          fulfilled: !!w.fulfilled,
          category: CATEGORIES.some(function (c) { return c.id === w.category; }) ? w.category : "other",
          priority: typeof w.priority === "number" && w.priority >= 1 && w.priority <= 3 ? w.priority : 2,
          note: w.note || ""
        };
      }

      function ensureSeed() {
        var existing = loadWishes();
        if (existing !== null) return existing;
        var today = new Date();
        var seed = [
          { id: String(today.getTime() - 86400000 * 2), text: "希望有一天能一起看樱花", date: isoDate(new Date(today.getTime() - 86400000 * 2)), fulfilled: false, category: "travel", priority: 3, note: "" },
          { id: String(today.getTime() - 86400000 * 5), text: "想和你在海边看一场日落", date: isoDate(new Date(today.getTime() - 86400000 * 5)), fulfilled: true, category: "travel", priority: 2, note: "那天风很大，但夕阳很美。" },
          { id: String(today.getTime() - 86400000 * 1), text: "愿你每个夜晚都有好梦", date: isoDate(new Date(today.getTime() - 86400000 * 1)), fulfilled: false, category: "dream", priority: 2, note: "" },
          { id: String(today.getTime() - 86400000 * 9), text: "一起养一只橘猫", date: isoDate(new Date(today.getTime() - 86400000 * 9)), fulfilled: false, category: "life", priority: 1, note: "" }
        ];
        saveWishes(seed);
        return seed;
      }

      function isoDate(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return "";
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      function shortDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return "";
        return (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      function delayFor(index) { return ((index % 6) * 0.45).toFixed(2) + "s"; }

      function getCategory(id) {
        return CATEGORIES.find(function (c) { return c.id === id; }) || CATEGORIES[CATEGORIES.length - 1];
      }

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      function getFiltered() {
        var wishes = loadWishes() || [];
        return wishes.filter(function (w) {
          var statusMatch = currentFilter === "all" ||
            (currentFilter === "pending" && !w.fulfilled) ||
            (currentFilter === "fulfilled" && w.fulfilled);
          var catMatch = currentCategory === "all" || w.category === currentCategory;
          return statusMatch && catMatch;
        });
      }

      function render(enteringId) {
        var wishes = loadWishes() || [];
        var list = getFiltered();

        wall.innerHTML = "";
        if (list.length === 0) {
          wall.style.display = "none";
          emptyState.style.display = "flex";
          renderTemplates();
        } else {
          wall.style.display = "block";
          emptyState.style.display = "none";
          var frag = document.createDocumentFragment();
          list.forEach(function (w, i) { frag.appendChild(buildCard(w, i, enteringId)); });
          wall.appendChild(frag);
        }
        renderStats(wishes);
      }

      function buildCard(w, index, enteringId) {
        var cat = getCategory(w.category);
        var card = document.createElement("div");
        card.className = "wish-card" + (w.fulfilled ? " fulfilled" : "") +
          (enteringId && w.id === enteringId ? " entering" : "");
        card.style.setProperty("--delay", delayFor(index));
        card.dataset.id = w.id;
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", (w.fulfilled ? "已实现" : "期待中") + "心愿：" + w.text);

        var hearts = "♥".repeat(w.priority) + "♡".repeat(3 - w.priority);
        var badgeHtml = w.fulfilled ? '<span class="fulfilled-badge">✓ 已实现</span>' : "";

        card.innerHTML =
          '<div class="candle-flame-wrap" aria-hidden="true"><div class="candle-flame"></div></div>' +
          '<div class="candle-body">' +
            '<div class="wish-card-header">' +
              '<span class="wish-category">' + escapeHtml(cat.emoji) + " " + escapeHtml(cat.label) + "</span>" +
              '<span class="wish-priority">' + hearts + "</span>" +
            "</div>" +
            '<div class="wish-text' + (w.fulfilled ? " fulfilled-text" : "") + '">' + escapeHtml(w.text) + "</div>" +
            '<div class="wish-meta">' +
              '<span class="wish-date">' + escapeHtml(shortDate(w.date)) + "</span>" +
              badgeHtml +
            "</div>" +
          "</div>";
        return card;
      }

      function renderStats(wishes) {
        var total = wishes.length;
        var done = wishes.filter(function (w) { return w.fulfilled; }).length;
        statsText.innerHTML = "共 <b>" + total + "</b> 个心愿 · 已实现 <b>" + done + "</b> 个";
        countPill.textContent = String(total);
        progressFill.style.width = total === 0 ? "0%" : Math.round((done / total) * 100) + "%";
      }

      function renderTemplates() {
        var container = document.getElementById("emptyTemplates");
        if (!container) return;
        container.innerHTML = "";
        TEMPLATES.slice(0, 4).forEach(function (t) {
          var btn = document.createElement("button");
          btn.className = "empty-template";
          btn.textContent = t;
          btn.addEventListener("click", function () { openEdit(null, t); });
          container.appendChild(btn);
        });
      }

      function openEdit(id, prefilledText) {
        editingId = id || null;
        var wishes = loadWishes() || [];
        var wish = editingId ? wishes.find(function (w) { return w.id === editingId; }) : null;

        editModalTitle.textContent = wish ? "编辑心愿" : "许下心愿";
        editText.value = prefilledText || (wish ? wish.text : "");
        editNote.value = wish ? wish.note : "";
        selectedCategory = wish ? wish.category : "other";
        selectedPriority = wish ? wish.priority : 2;
        updateCharCount();
        renderCategoryGrid();
        renderPriorityRow();
        editSave.textContent = wish ? "保存修改" : "许下心愿";
        editModal.classList.add("show");
        setTimeout(function () { editText.focus(); }, 50);
      }

      function closeEdit() { editModal.classList.remove("show"); }

      function renderCategoryGrid() {
        editCategoryGrid.innerHTML = "";
        CATEGORIES.forEach(function (c) {
          var btn = document.createElement("button");
          btn.className = "category-option" + (selectedCategory === c.id ? " active" : "");
          btn.innerHTML = '<span class="emoji">' + escapeHtml(c.emoji) + "</span><span>" + escapeHtml(c.label) + "</span>";
          btn.addEventListener("click", function () {
            selectedCategory = c.id;
            renderCategoryGrid();
          });
          editCategoryGrid.appendChild(btn);
        });
      }

      function renderPriorityRow() {
        editPriorityRow.innerHTML = "";
        for (var i = 1; i <= 3; i++) {
          var span = document.createElement("span");
          span.className = "priority-heart" + (i <= selectedPriority ? " active" : "");
          span.textContent = "♥";
          span.dataset.value = i;
          span.addEventListener("click", function () {
            selectedPriority = Number(this.dataset.value);
            renderPriorityRow();
          });
          editPriorityRow.appendChild(span);
        }
      }

      function saveFromEdit() {
        var text = editText.value.trim();
        if (!text) { toast("心愿内容不能为空呀"); return; }
        var wishes = loadWishes() || [];
        var now = new Date();
        var isNew = !editingId;
        var targetId = editingId || String(now.getTime());
        var existing = wishes.find(function (w) { return w.id === targetId; });

        if (existing) {
          existing.text = text;
          existing.category = selectedCategory;
          existing.priority = selectedPriority;
          existing.note = editNote.value.trim();
        } else {
          wishes.unshift({
            id: targetId,
            text: text,
            date: isoDate(now),
            fulfilled: false,
            category: selectedCategory,
            priority: selectedPriority,
            note: editNote.value.trim()
          });
        }
        saveWishes(wishes);
        closeEdit();
        if (currentFilter === "fulfilled" && isNew) setFilter("all");
        if (currentCategory !== "all" && isNew && selectedCategory !== currentCategory) setCategory("all");
        render(targetId);
        toast(isNew ? "心愿已许下 ✨" : "已保存修改");
      }

      function openDetail(id) {
        detailId = id;
        var wishes = loadWishes() || [];
        var w = wishes.find(function (x) { return x.id === id; });
        if (!w) return;
        var cat = getCategory(w.category);
        detailCategoryTitle.textContent = cat.emoji + " " + cat.label;
        detailDate.textContent = formatDate(w.date) + "许下";
        detailText.textContent = w.text;
        detailText.className = "detail-wish-text" + (w.fulfilled ? " fulfilled-text" : "");
        if (w.note) {
          detailNote.style.display = "block";
          detailNote.textContent = w.note;
        } else {
          detailNote.style.display = "none";
        }
        updateFulfillToggle(w.fulfilled);
        if (w.fulfilled) {
          blessingBanner.textContent = randomBlessing(w.id);
          blessingBanner.classList.add("show");
        } else {
          blessingBanner.classList.remove("show");
        }
        detailModal.classList.add("show");
      }

      function closeDetail() { detailModal.classList.remove("show"); detailId = null; }

      function updateFulfillToggle(checked) {
        fulfillToggle.classList.toggle("checked", checked);
        fulfillToggle.querySelector(".label").textContent = checked ? "已实现这个心愿" : "标记为已实现";
      }

      function randomBlessing(seed) {
        var n = 0;
        for (var i = 0; i < seed.length; i++) n = (n * 31 + seed.charCodeAt(i)) >>> 0;
        return BLESSINGS[n % BLESSINGS.length];
      }

      function toggleFulfilledFromDetail() {
        var wishes = loadWishes() || [];
        var w = wishes.find(function (x) { return x.id === detailId; });
        if (!w) return;
        w.fulfilled = !w.fulfilled;
        saveWishes(wishes);
        updateFulfillToggle(w.fulfilled);
        if (w.fulfilled) {
          blessingBanner.textContent = randomBlessing(w.id);
          blessingBanner.classList.add("show");
          spawnConfetti();
          toast("恭喜，心愿已实现 🎉");
        } else {
          blessingBanner.classList.remove("show");
          toast("已重新期待中");
        }
        detailText.className = "detail-wish-text" + (w.fulfilled ? " fulfilled-text" : "");
        render();
      }

      function deleteCurrentWish() {
        if (!detailId) return;
        var wishes = loadWishes() || [];
        wishes = wishes.filter(function (w) { return w.id !== detailId; });
        saveWishes(wishes);
        closeDetail();
        render();
        toast("心愿已收起");
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterBtns.forEach(function (b) { b.classList.toggle("active", b.dataset.filter === filter); });
        render();
      }

      function setCategory(cat) {
        currentCategory = cat;
        categoryChips.forEach(function (c) { c.classList.toggle("active", c.dataset.cat === cat); });
        render();
      }

      function spawnConfetti() {
        var colors = ["#f4c2d4", "#e8a4b8", "#ffd166", "#ff9f6b", "#a8d8ea"];
        var rect = fulfillToggle.getBoundingClientRect();
        var containerRect = appBg.getBoundingClientRect();
        var cx = rect.left + rect.width / 2 - containerRect.left;
        var cy = rect.top + rect.height / 2 - containerRect.top;
        for (var i = 0; i < 24; i++) {
          var piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = cx + "px";
          piece.style.top = cy + "px";
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          var angle = Math.random() * Math.PI * 2;
          var dist = 40 + Math.random() * 80;
          piece.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          piece.style.setProperty("--ty", Math.sin(angle) * dist + 60 + "px");
          piece.style.animation = "confettiPop 0.9s ease-out forwards";
          appBg.appendChild(piece);
          setTimeout(function (p) { p.remove(); }, 950);
        }
      }

      // Confetti keyframes injection
      var style = document.createElement("style");
      style.textContent = "@keyframes confettiPop { 0% { opacity:1; transform: translate(0,0) rotate(0deg) scale(1); } 100% { opacity:0; transform: translate(var(--tx,0), var(--ty,80px)) rotate(720deg) scale(0.6); } }";
      document.head.appendChild(style);

      // Events
      addBtn.addEventListener("click", function () { openEdit(); });
      editCancel.addEventListener("click", closeEdit);
      editSave.addEventListener("click", saveFromEdit);
      editText.addEventListener("input", updateCharCount);
      editModal.addEventListener("click", function (e) { if (e.target === editModal) closeEdit(); });

      detailClose.addEventListener("click", closeDetail);
      detailEdit.addEventListener("click", function () {
        if (!detailId) return;
        closeDetail();
        openEdit(detailId);
      });
      detailDelete.addEventListener("click", deleteCurrentWish);
      fulfillToggle.addEventListener("click", toggleFulfilledFromDetail);
      detailModal.addEventListener("click", function (e) { if (e.target === detailModal) closeDetail(); });

      filterBtns.forEach(function (b) {
        b.addEventListener("click", function () { setFilter(b.dataset.filter); });
      });
      categoryChips.forEach(function (c) {
        c.addEventListener("click", function () { setCategory(c.dataset.cat); });
      });

      wall.addEventListener("click", function (e) {
        var card = e.target.closest(".wish-card");
        if (!card) return;
        openDetail(card.dataset.id);
      });

      wall.addEventListener("keydown", function (e) {
        var card = e.target.closest(".wish-card");
        if (!card) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openDetail(card.dataset.id);
        }
      });

      function updateCharCount() {
        charCount.textContent = String(editText.value.length);
      }

      // Back gesture / ESC
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (editModal.classList.contains("show")) closeEdit();
          if (detailModal.classList.contains("show")) closeDetail();
        }
      });

      document.body.addEventListener('touchmove', function (e) {
        if (e.target.closest('.wish-wall') || e.target.closest('.wish-textarea') || e.target.closest('.modal-note')) return;
        e.preventDefault();
      }, { passive: false });

      // Init
      ensureSeed();
      render();
    })();
  </script>

  <!-- 返回按钮兼容父iframe内嵌SPA模式（postMessage），fallback为跳转回主页 -->
  <script>
    (function () {
      // 从文件名解析 extapp key
      var nameMap = {
        'diary-new':       'diary',
        'wish-new':        'wish',
        'spark-new':       'spark',
        'anniversary-new': 'anniversary',
        'music-new':       'music',
        'call-new':        'call',
        'history-new':     'history'
      };
      var fname = (location.pathname.split('/').pop() || '').replace(/\.html?$/i, '');
      var extKey = nameMap[fname] || fname;

      window.__extAppBack = function (ev) {
        var inIframe = (window.top !== window.self);
        if (inIframe) {
          try {
            window.top.postMessage({ type: 'extapp:back', key: extKey }, '*');
            // 给500ms让父窗口处理，失败fallback跳转
            setTimeout(function(){
              try { window.location.replace('../index-zy.html'); } catch(e){}
            }, 500);
          } catch (e) {
            window.location.href = '../index-zy.html';
          }
        } else {
          window.location.href = '../index-zy.html';
        }
        if (ev && ev.preventDefault) ev.preventDefault();
        return false;
      };

      // 给所有指向 ../index-zy.html 的返回 <a> 替换成 onclick __extAppBack
      document.addEventListener('DOMContentLoaded', function () {
        var links = document.querySelectorAll('a.back-btn, a[data-dom-id="back-home"], a[data-dom-id="nav-back"], a[data-dom-id="back-nav"]');
        links.forEach(function (a) {
          // 只有href是 ../index-zy.html 或 index-new-v2.html 才替换
          if (a.getAttribute('href') && /index-zy\.html|index-new-v2\.html/.test(a.getAttribute('href'))) {
            a.setAttribute('data-href-backup', a.getAttribute('href'));
            a.setAttribute('href', 'javascript:void(0)');
            a.addEventListener('click', function (e) { return window.__extAppBack(e); });
          }
        });
      });
    })();
  </script>
