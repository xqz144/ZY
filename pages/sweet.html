<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜轨迹 · 梦角传讯</title>
    <link rel="stylesheet" href="../css/extapp-unified.css">
    <script>
    /* 从父窗口同步主题色/字体到 iframe 内（配合主站外观设置） */
    (function () {
        try {
            var inIframe = false;
            try { inIframe = (window.top !== window.self); } catch (e) { inIframe = true; }
            function applyColorThemeFromParent() {
                try {
                    var parentRoot = null;
                    var parentDoc = null;
                    try { parentDoc = window.parent.document; parentRoot = parentDoc.documentElement; } catch (e) { parentRoot = null; }
                    if (parentRoot) {
                        var t = parentRoot.getAttribute('data-color-theme');
                        if (t) document.documentElement.setAttribute('data-color-theme', t);
                        var dt = parentRoot.getAttribute('data-theme');
                        if (dt) document.documentElement.setAttribute('data-theme', dt);
                        if (dt === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
                        var fv = parentRoot.style.getPropertyValue('--font-family');
                        if (fv) document.documentElement.style.setProperty('--font-family', fv);
                        var mfv = parentRoot.style.getPropertyValue('--message-font-family');
                        if (mfv) document.documentElement.style.setProperty('--message-font-family', mfv);
                        var fs = parentRoot.style.getPropertyValue('--font-size');
                        if (fs) document.documentElement.style.setProperty('--font-size', fs);
                        // accent 色变量：优先读父窗口“计算后”的值（覆盖自定义主题色），确保 iframe 内 CSS 变量可用
                        var pcs = null;
                        try { pcs = parentDoc.defaultView ? parentDoc.defaultView.getComputedStyle(parentRoot) : null; } catch (e) { pcs = null; }
                        var accent = (pcs && pcs.getPropertyValue('--accent-color')) || parentRoot.style.getPropertyValue('--accent-color') || '';
                        if (accent) document.documentElement.style.setProperty('--accent-color', accent.trim());
                        var accentRgb = (pcs && pcs.getPropertyValue('--accent-color-rgb')) || parentRoot.style.getPropertyValue('--accent-color-rgb') || '';
                        if (accentRgb) document.documentElement.style.setProperty('--accent-color-rgb', accentRgb.trim());
                    }
                } catch (e) { console.warn('sweet theme sync error', e); }
            }
            applyColorThemeFromParent();
            if (inIframe) {
                window.addEventListener('message', function (ev) {
                    var d = ev.data || {};
                    if (d.type === 'theme:sync' || d.colorTheme || d.theme) {
                        if (d.colorTheme) document.documentElement.setAttribute('data-color-theme', d.colorTheme);
                        if (d.theme) {
                            document.documentElement.setAttribute('data-theme', d.theme);
                            if (d.theme === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
                        }
                        if (d.fontFamily) document.documentElement.style.setProperty('--font-family', d.fontFamily);
                        if (d.messageFontFamily) document.documentElement.style.setProperty('--message-font-family', d.messageFontFamily);
                        if (d.fontSize) document.documentElement.style.setProperty('--font-size', d.fontSize);
                        applyColorThemeFromParent();
                    }
                    if (d.type === 'extapp:closed') { /* 关闭时可做清理 */ }
                });
                setInterval(applyColorThemeFromParent, 2500);
            }
        } catch (e) { console.warn('sweet init error', e); }
    })();
    </script>
    <link rel="stylesheet" href="../css/sweet.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sweet-app">
        <div class="sweet-scroll">
            <!-- Hero · 在一起 X 天 -->
            <div class="sweet-hero">
                <div class="sweet-hero-label">我们已经在一起</div>
                <div class="sweet-hero-days"><span id="together-days">0</span><small>天</small></div>
                <div class="sweet-hero-sub" id="together-sub">从今天开始</div>
                <button class="sweet-hero-edit" id="edit-together-date"><i data-lucide="calendar-heart" style="width:13px;height:13px;display:inline;vertical-align:-2px;margin-right:3px;"></i>设置在一起的日子</button>
            </div>

            <!-- 标签栏 -->
            <div class="sweet-tabs">
                <button class="sweet-tab active" data-tab="love-checkin">
                    <i data-lucide="heart"></i><span>恋爱打卡</span>
                </button>
                <button class="sweet-tab" data-tab="anniversary">
                    <i data-lucide="cake"></i><span>纪念日</span>
                </button>
                <button class="sweet-tab" data-tab="diary">
                    <i data-lucide="book-open"></i><span>甜蜜日记</span>
                </button>
                <button class="sweet-tab" data-tab="wish">
                    <i data-lucide="gift"></i><span>愿望清单</span>
                </button>
                <button class="sweet-tab" data-tab="trail-map">
                    <i data-lucide="map"></i><span>轨迹地图</span>
                </button>
            </div>

            <!-- 恋爱打卡 -->
            <div class="sweet-panel active" data-panel="love-checkin">
                <div class="sweet-section-head">
                    <span class="sweet-section-title">今日甜蜜打卡</span>
                    <button class="sweet-add-btn" id="checkin-add"><i data-lucide="plus"></i>新增</button>
                </div>
                <div class="sweet-checkin-stats" id="checkin-stats"></div>
                <div class="sweet-checkin-list" id="checkin-list"></div>
            </div>

            <!-- 纪念日 -->
            <div class="sweet-panel" data-panel="anniversary">
                <div class="sweet-section-head">
                    <span class="sweet-section-title">我们的纪念日</span>
                    <button class="sweet-add-btn" id="anni-add"><i data-lucide="plus"></i>新增</button>
                </div>
                <div class="sweet-anni-list" id="anni-list"></div>
            </div>

            <!-- 甜蜜日记 -->
            <div class="sweet-panel" data-panel="diary">
                <div class="sweet-section-head">
                    <span class="sweet-section-title">甜蜜日记</span>
                    <button class="sweet-add-btn" id="diary-add"><i data-lucide="plus"></i>写一篇</button>
                </div>
                <!-- 子标签：列表 / 心情日历 -->
                <div class="sweet-subtabs" id="diary-subtabs">
                    <button class="sweet-subtab active" data-subtab="diary-list">
                        <i data-lucide="list"></i><span>日记列表</span>
                    </button>
                    <button class="sweet-subtab" data-subtab="diary-calendar">
                        <i data-lucide="calendar-days"></i><span>心情日历</span>
                    </button>
                </div>
                <!-- 列表视图 -->
                <div class="sweet-subpanel active" data-subpanel="diary-list">
                    <div class="sweet-diary-list" id="diary-list"></div>
                </div>
                <!-- 心情日历视图（涂鸦风） -->
                <div class="sweet-subpanel" data-subpanel="diary-calendar">
                    <div class="mood-wrap">
                        <!-- 日历头部：涂鸦装饰 + 年月切换 -->
                        <div class="mood-cal-head">
                            <div class="mood-head-doodle doodle-leaf"></div>
                            <button class="mood-head-btn" id="mood-prev-month" aria-label="上一个月">
                                <i data-lucide="chevron-left"></i>
                            </button>
                            <div class="mood-head-title">
                                <div class="mood-year" id="mood-year">2025年</div>
                                <div class="mood-month" id="mood-month">1月</div>
                            </div>
                            <button class="mood-head-btn" id="mood-next-month" aria-label="下一个月">
                                <i data-lucide="chevron-right"></i>
                            </button>
                            <div class="mood-head-doodle doodle-star"></div>
                        </div>
                        <!-- 星期栏 -->
                        <div class="mood-weekdays">
                            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                        </div>
                        <!-- 日历格子 -->
                        <div class="mood-cal-grid" id="mood-cal-grid"></div>
                        <!-- 底部：涂鸦写日记按钮 -->
                        <div class="mood-write-zone">
                            <button class="mood-write-btn" id="mood-write-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                                    <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>
                                </svg>
                                <span id="mood-write-text">今天还没写日记</span>
                            </button>
                            <div class="mood-write-bubble doodle-bubble"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 愿望清单 -->
            <div class="sweet-panel" data-panel="wish">
                <div class="sweet-section-head">
                    <span class="sweet-section-title">愿望清单</span>
                    <button class="sweet-add-btn" id="wish-add"><i data-lucide="plus"></i>新增</button>
                </div>
                <div class="sweet-wish-list" id="wish-list"></div>
            </div>

            <!-- 轨迹地图 -->
            <div class="sweet-panel" data-panel="trail-map">
                <div class="trailmap-wrap">
                    <!-- 顶栏：世界切换 + 操作 -->
                    <div class="trailmap-toolbar">
                        <div class="trailmap-world-switch">
                            <button class="trailmap-w-btn active" data-world="qiyu"><i data-lucide="sparkles" style="width:14px;height:14px;"></i> 祁煜的世界</button>
                            <button class="trailmap-w-btn" data-world="mine"><i data-lucide="home" style="width:14px;height:14px;"></i> 我的世界</button>
                        </div>
                        <div class="trailmap-actions">
                            <button class="trailmap-act-btn" id="uploadMineMap" title="上传自定义底图"><i data-lucide="upload" style="width:14px;height:14px;"></i><span>上传底图</span></button>
                            <button class="trailmap-act-btn" id="addPinMode" title="添加地点"><i data-lucide="map-pin-plus" style="width:14px;height:14px;"></i><span>添加地点</span></button>
                            <button class="trailmap-act-btn" id="addTrip" title="记录行程"><i data-lucide="route" style="width:14px;height:14px;"></i><span>记录行程</span></button>
                        </div>
                    </div>

                    <!-- 地图容器 -->
                    <div class="trailmap-container" id="trailmapContainer">
                        <img id="trailmapBg" class="trailmap-bg" alt="地图">
                        <svg class="trailmap-svg" id="trailmapSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                        <div class="trailmap-pin-layer" id="trailmapPinLayer"></div>
                        <!-- 我的世界空状态 -->
                        <div class="trailmap-empty" id="trailmapEmpty" style="display:none;">
                            <i data-lucide="image-plus" style="width:40px;height:40px;"></i>
                            <p>上传你真实世界的地图底图</p>
                            <p class="trailmap-empty-sub">支持高德/百度截图、手绘地图等</p>
                            <button class="trailmap-upload-big" id="trailmapUploadBig"><i data-lucide="upload" style="width:18px;height:18px;"></i>选择图片</button>
                        </div>
                    </div>

                    <!-- 底图切换提示 -->
                    <div class="trailmap-hint" id="trailmapHint">点击地图任意位置添加地点标记 · 点击已有标记编辑</div>

                    <!-- 日期 & 行程 -->
                    <div class="trailmap-bottom">
                        <button class="trailmap-nav-btn" id="prevDay"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>
                        <span class="trailmap-date" id="trailmapDate">5月23日</span>
                        <button class="trailmap-nav-btn" id="nextDay"><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
                        <span class="trailmap-legend">
                            <span><span class="trailmap-dot" style="background:#5ba8f5"></span>城市机构</span>
                            <span><span class="trailmap-dot" style="background:#ff6b6b"></span>剧情地点</span>
                            <span><span class="trailmap-dot" style="background:#c388ff"></span>主线遗迹</span>
                            <span><span class="trailmap-dot" style="background:#ffd93d"></span>我的地点</span>
                        </span>
                    </div>

                    <div class="trailmap-trip-list" id="trailmapTripList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/sweet.js"></script>
    <script src="../js/sweet-trailmap.js"></script>
</body>
</html>
