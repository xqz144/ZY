<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>字卡传讯 · 梦角传讯</title>
<meta name="description" content="抽一张字卡，接收梦角此刻想对你说的话。" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="colors_and_type.css" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
        },
        fontFamily: {
          sans: ['"Noto Sans SC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          serif: ['"Noto Serif SC"', 'ui-serif', 'Georgia', 'serif'],
        },
        borderRadius: { xl: '12px', lg: '12px', md: '8px', sm: '4px' },
      }
    }
  }
</script>

<style>
  :root {
    color-scheme: light;
    /* Accessibility-derived shades of the single brand hue (same hue, darker lightness for WCAG AA text). */
    --ink-2: color-mix(in srgb, hsl(var(--muted-foreground)) 80%, black);
    --brand-ink: color-mix(in srgb, hsl(var(--primary)) 72%, black);
    --brand-fill: color-mix(in srgb, hsl(var(--primary)) 78%, black);
    --brand-fill-hover: color-mix(in srgb, hsl(var(--primary)) 72%, black);
    --brand-fill-active: color-mix(in srgb, hsl(var(--primary)) 66%, black);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-sans);
    color: hsl(var(--foreground));
    background:
      radial-gradient(48% 38% at 50% 26%, hsl(263 47% 93% / 0.85), transparent 72%),
      radial-gradient(40% 32% at 84% 12%, hsl(270 25% 95% / 0.7), transparent 70%),
      radial-gradient(38% 30% at 12% 78%, hsl(263 47% 94% / 0.6), transparent 72%),
      hsl(var(--background));
    background-attachment: fixed;
    min-height: 100vh;
    letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Atmospheric layers (fixed, behind content) ---- */
  .atmosphere {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% 32%, hsl(263 47% 92% / 0.5), transparent 70%),
      radial-gradient(45% 40% at 82% 18%, hsl(270 30% 94% / 0.45), transparent 72%);
  }
  .starfield {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 11% 17%, hsl(263 34% 60% / 0.32), transparent 55%),
      radial-gradient(1px 1px at 26% 70%, hsl(263 34% 60% / 0.24), transparent 55%),
      radial-gradient(1.4px 1.4px at 44% 11%, hsl(263 34% 60% / 0.28), transparent 55%),
      radial-gradient(1px 1px at 61% 84%, hsl(263 34% 60% / 0.2), transparent 55%),
      radial-gradient(2px 2px at 79% 27%, hsl(263 34% 60% / 0.3), transparent 55%),
      radial-gradient(1px 1px at 89% 66%, hsl(263 34% 60% / 0.22), transparent 55%),
      radial-gradient(1.5px 1.5px at 7% 54%, hsl(263 34% 60% / 0.26), transparent 55%),
      radial-gradient(1px 1px at 52% 47%, hsl(263 34% 60% / 0.18), transparent 55%),
      radial-gradient(1.4px 1.4px at 34% 39%, hsl(263 34% 60% / 0.22), transparent 55%),
      radial-gradient(1px 1px at 69% 13%, hsl(263 34% 60% / 0.2), transparent 55%),
      radial-gradient(1px 1px at 18% 88%, hsl(263 34% 60% / 0.18), transparent 55%),
      radial-gradient(1.3px 1.3px at 94% 40%, hsl(263 34% 60% / 0.22), transparent 55%);
    background-repeat: no-repeat;
  }
  .twinkle {
    position: fixed; z-index: 0; pointer-events: none;
    color: hsl(263 34% 60% / 0.5);
    animation: twinkle 4.5s ease-in-out infinite;
  }
  .twinkle.t2 { animation-delay: 1.6s; animation-duration: 5.2s; }
  .twinkle.t3 { animation-delay: 2.8s; animation-duration: 6s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.18); }
  }

  /* ---- Top navigation (shared shell) ---- */
  .nav-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px; padding: 0 clamp(16px, 4vw, 40px);
    background: hsl(var(--background) / 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid hsl(var(--border));
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-serif);
    font-size: 20px; font-weight: 600;
    color: hsl(var(--foreground));
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .brand-dot { position: relative; width: 7px; height: 7px; border-radius: 9999px; background: hsl(var(--primary)); }
  .brand-dot::after { content: ""; position: absolute; inset: -3px; border: 1px solid hsl(var(--primary) / 0.3); border-radius: 9999px; }
  .nav-items { display: flex; align-items: center; gap: 4px; }
  .nav-items a {
    padding: 8px 16px; font-size: 15px;
    color: var(--ink-2);
    border-radius: 8px; text-decoration: none;
    transition: color 0.15s cubic-bezier(.2,.8,.2,1), background-color 0.15s cubic-bezier(.2,.8,.2,1);
  }
  .nav-items a:hover { color: hsl(var(--foreground)); background: hsl(var(--muted)); }
  .nav-items a:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; border-radius: 8px; }
  .nav-items a.active {
    color: var(--brand-ink); background: hsl(var(--accent)); font-weight: 500;
  }

  /* ---- Layout container ---- */
  .main-wrap {
    position: relative; z-index: 1;
    max-width: 72rem; margin: 0 auto; padding: 0 24px;
  }

  /* ---- Page intro ---- */
  .page-intro { text-align: center; padding: 72px 0 28px; }
  .eyebrow {
    font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--brand-ink); font-weight: 500; margin-bottom: 14px;
  }
  .page-title {
    font-family: var(--font-serif);
    font-size: clamp(30px, 3.6vw, 42px); font-weight: 600;
    line-height: 1.18; letter-spacing: 0.01em;
    color: hsl(var(--foreground));
    text-wrap: balance; word-break: keep-all;
  }
  .page-subtitle {
    margin-top: 14px; font-size: 18px; line-height: 1.6;
    color: var(--ink-2);
    max-width: 30rem; margin-left: auto; margin-right: auto;
    text-wrap: pretty;
  }

  /* ---- Card stage ---- */
  .card-stage {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    padding: 40px 0 28px;
  }
  .card-glow {
    position: absolute; left: 50%; top: 50%;
    width: 460px; height: 560px; transform: translate(-50%, -50%);
    z-index: 0; pointer-events: none;
    background: radial-gradient(closest-side, hsl(263 34% 63% / 0.20), hsl(263 34% 63% / 0.07) 58%, transparent 76%);
    filter: blur(6px);
    opacity: 0.55; transition: opacity 0.7s ease;
  }
  .card-glow.is-active { opacity: 1; animation: glowPulse 3.6s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  }

  .card-float {
    position: relative; z-index: 1;
    width: min(360px, 84vw);
    aspect-ratio: 3 / 4;
    perspective: 1500px;
    animation: float 6s ease-in-out infinite;
    cursor: pointer; border: 0; background: none; padding: 0;
    border-radius: 12px; display: block;
  }
  .card-float:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 6px; border-radius: 12px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }

  .card-3d {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.3, 0, 0, 1);
  }
  .card-3d.is-flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    border-radius: 12px; overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid hsl(var(--border));
  }

  /* Card back */
  .card-back {
    background:
      radial-gradient(circle at 50% 34%, hsl(263 47% 93%), hsl(263 47% 86%)),
      hsl(var(--secondary));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px;
  }
  .back-inner {
    position: relative; width: 100%; height: 100%;
    border: 1px solid hsl(var(--primary) / 0.22);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    transition: border-color 0.15s cubic-bezier(.2,.8,.2,1);
  }
  .back-inner::before, .back-inner::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 1px solid hsl(var(--primary) / 0.45);
  }
  .back-inner::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
  .back-inner::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

  .back-motif { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .motif-moon { width: 92px; height: 92px; }
  .motif-star { position: absolute; width: 18px; height: 18px; color: hsl(263 34% 56%); }
  .motif-star.s1 { top: 6px; left: 14px; width: 14px; height: 14px; }
  .motif-star.s2 { top: 24px; right: 8px; width: 16px; height: 16px; }
  .motif-star.s3 { bottom: 10px; left: 22px; width: 12px; height: 12px; color: hsl(263 34% 50%); }

  .back-seal { text-align: center; }
  .seal-title {
    font-family: var(--font-serif); font-size: 22px; font-weight: 600;
    color: var(--brand-ink); letter-spacing: 0.06em;
  }
  .seal-hint {
    margin-top: 6px; font-size: 13px; color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  /* Card front */
  .card-front {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 50% 38%, hsl(270 30% 99%), hsl(var(--card))),
      hsl(var(--card));
    display: flex; align-items: center; justify-content: center;
    padding: 32px 28px;
  }
  .front-inner {
    position: relative; width: 100%; height: 100%;
    border: 1px solid hsl(var(--primary) / 0.25);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    transition: border-color 0.15s cubic-bezier(.2,.8,.2,1);
  }
  .card-float:hover .back-inner,
  .card-float:hover .front-inner { border-color: hsl(var(--primary) / 0.5); }
  .front-inner::before, .front-inner::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 1px solid hsl(var(--primary) / 0.5);
  }
  .front-inner::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
  .front-inner::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

  .front-star { width: 22px; height: 22px; color: hsl(var(--primary)); opacity: 0.85; }
  .reply-text {
    font-family: var(--font-serif);
    font-size: clamp(22px, 2.6vw, 27px); font-weight: 500;
    line-height: 1.55; letter-spacing: 0.02em;
    color: hsl(var(--foreground));
    text-wrap: balance; word-break: keep-all;
    max-width: 15em;
  }
  .front-attr {
    font-family: var(--font-serif); font-size: 14px;
    color: hsl(var(--primary) / 0.85); letter-spacing: 0.08em;
  }

  /* ---- Draw controls ---- */
  .draw-controls {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 8px 0 16px;
  }
  .btn-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
    font-family: var(--font-sans); font-size: 15px; font-weight: 600; letter-spacing: 0.03em;
    padding: 12px 32px; border-radius: 8px;
    border: 1px solid hsl(var(--primary));
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(.2,.8,.2,1), background-color 0.15s cubic-bezier(.2,.8,.2,1), box-shadow 0.15s cubic-bezier(.2,.8,.2,1);
  }
  .btn-primary:hover { background: color-mix(in srgb, hsl(var(--primary)) 88%, black); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); background: color-mix(in srgb, hsl(var(--primary)) 80%, black); }
  .btn-primary:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 3px; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-primary svg { width: 16px; height: 16px; transition: transform 0.15s cubic-bezier(.2,.8,.2,1); }
  .btn-primary:hover svg { transform: translateX(2px); }

  .btn-secondary {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: hsl(var(--foreground));
    font-family: var(--font-sans); font-size: 15px; font-weight: 500;
    padding: 12px 26px; border-radius: 8px;
    border: 1px solid hsl(var(--border));
    text-decoration: none;
    transition: color 0.15s cubic-bezier(.2,.8,.2,1), border-color 0.15s cubic-bezier(.2,.8,.2,1), background-color 0.15s cubic-bezier(.2,.8,.2,1);
  }
  .btn-secondary:hover { color: hsl(var(--primary)); border-color: hsl(var(--primary) / 0.5); background: hsl(var(--accent) / 0.5); }
  .btn-secondary:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 3px; }
  .btn-secondary svg { width: 15px; height: 15px; }

  .prob-note {
    font-size: 13px; color: hsl(var(--muted-foreground));
    display: inline-flex; align-items: center; gap: 8px;
  }
  .prob-note .dot { width: 3px; height: 3px; border-radius: 9999px; background: hsl(var(--muted-foreground) / 0.6); }

  /* ---- History ---- */
  .history { padding: 56px 0 24px; }
  .history-inner { max-width: 48rem; margin: 0 auto; }
  .history-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 16px;
  }
  .history-title {
    font-family: var(--font-serif);
    font-size: 22px; font-weight: 600; line-height: 1.2;
    color: hsl(var(--foreground)); letter-spacing: 0.01em;
    text-wrap: balance; word-break: keep-all;
  }
  .history-count {
    font-size: 13px; color: hsl(var(--muted-foreground));
    font-variant-numeric: tabular-nums;
  }
  .history-panel {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: 12px;
    padding: 8px 22px;
  }
  .history-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 16px 0;
    border-bottom: 1px solid hsl(var(--border));
  }
  .history-row:last-child { border-bottom: none; }
  .history-time {
    font-size: 13px; color: hsl(var(--muted-foreground));
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .history-reply {
    font-size: 15px; color: hsl(var(--foreground)); line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .history-index {
    font-size: 12px; color: hsl(var(--primary));
    background: hsl(var(--accent));
    padding: 3px 10px; border-radius: 8px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .history-empty { padding: 44px 16px; text-align: center; }
  .empty-icon { width: 38px; height: 38px; margin: 0 auto 12px; color: hsl(var(--muted-foreground)); opacity: 0.5; }
  .empty-title { font-size: 15px; color: hsl(var(--muted-foreground)); }
  .empty-sub { font-size: 13px; color: hsl(var(--muted-foreground) / 0.85); margin-top: 4px; }

  /* ---- Footer ---- */
  .site-footer {
    position: relative; z-index: 1;
    max-width: 72rem; margin: 0 auto; padding: 40px 24px 56px;
    text-align: center;
  }
  .footer-divider {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: hsl(var(--primary) / 0.6); margin-bottom: 16px;
  }
  .footer-divider .line { width: 56px; height: 1px; background: hsl(var(--border)); }
  .footer-divider svg { width: 14px; height: 14px; }
  .footer-brand { font-family: var(--font-serif); font-size: 15px; color: hsl(var(--muted-foreground)); letter-spacing: 0.04em; }
  .footer-note { font-size: 12px; color: hsl(var(--muted-foreground) / 0.8); margin-top: 6px; }

  /* ---- Entrance reveal ---- */
  .reveal { animation: fadeUp 0.6s cubic-bezier(.3,0,0,1) both; }
  .reveal.r2 { animation-delay: 0.12s; }
  .reveal.r3 { animation-delay: 0.24s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Responsive ---- */
  @media (max-width: 640px) {
    .nav-bar { height: 60px; padding: 0 16px; }
    .brand { font-size: 18px; }
    .nav-items a { padding: 7px 12px; font-size: 14px; }
    .page-intro { padding: 48px 0 20px; }
    .card-stage { padding: 28px 0 20px; }
    .card-glow { width: 340px; height: 460px; }
    .history { padding: 40px 0 16px; }
    .history-row { grid-template-columns: 1fr auto; gap: 12px; }
    .history-time { grid-column: 1 / -1; font-size: 12px; }
    .btn-primary, .btn-secondary { padding: 12px 24px; }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    .card-float { animation: none; }
    .card-3d { transition-duration: 0.01ms; }
    .card-glow.is-active { animation: none; }
    .twinkle { animation: none; opacity: 0.4; }
    .reveal { animation: none; opacity: 1; }
    .btn-primary:hover { transform: none; }
    .btn-primary:hover svg { transform: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="atmosphere" aria-hidden="true"></div>
<div class="starfield" aria-hidden="true"></div>
<svg class="twinkle" style="top:14%; left:22%; width:10px; height:10px;" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
<svg class="twinkle t2" style="top:24%; right:16%; width:8px; height:8px;" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
<svg class="twinkle t3" style="bottom:22%; left:14%; width:9px; height:9px;" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>

<header class="nav-bar">
  <a href="home.html" class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    梦角传讯
  </a>
  <nav class="nav-items" aria-label="主导航">
    <a href="home.html" data-dom-id="nav-home">主页</a>
    <a href="cards.html" data-dom-id="nav-cards" class="active" aria-current="page">字卡</a>
    <a href="chat.html" data-dom-id="nav-chat">对话</a>
    <a href="customize.html" data-dom-id="nav-customize">自定义</a>
  </nav>
</header>

<main class="main-wrap">

  <section class="page-intro reveal" aria-labelledby="page-title">
    <p class="eyebrow">Message Cards</p>
    <h1 class="page-title" id="page-title">字卡传讯</h1>
    <p class="page-subtitle">抽一张字卡，接收梦角此刻想对你说的话。</p>
  </section>

  <section class="card-stage reveal r2" aria-label="字卡展示区">
    <div class="card-glow" id="cardGlow" aria-hidden="true"></div>

    <button type="button" class="card-float" id="cardFloat" aria-label="抽字卡，接收梦角回复">
      <div class="card-3d" id="card3d">

        <!-- Card back -->
        <div class="card-face card-back" aria-hidden="true">
          <div class="back-inner">
            <div class="back-motif">
              <svg class="motif-star s1" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
              <svg class="motif-star s2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
              <svg class="motif-moon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                <defs>
                  <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="hsl(263 34% 70% / 0.45)"/>
                    <stop offset="72%" stop-color="hsl(263 34% 70% / 0)"/>
                  </radialGradient>
                  <mask id="crescentMask">
                    <rect width="80" height="80" fill="black"/>
                    <circle cx="44" cy="40" r="17" fill="white"/>
                    <circle cx="37" cy="35" r="14" fill="black"/>
                  </mask>
                </defs>
                <circle cx="44" cy="40" r="28" fill="url(#moonHalo)"/>
                <rect x="0" y="0" width="80" height="80" fill="hsl(263 34% 50%)" mask="url(#crescentMask)"/>
              </svg>
              <svg class="motif-star s3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
            </div>
            <div class="back-seal">
              <p class="seal-title">梦角 · 字卡</p>
              <p class="seal-hint">点击抽卡</p>
            </div>
          </div>
        </div>

        <!-- Card front -->
        <div class="card-face card-front">
          <div class="front-inner">
            <svg class="front-star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
            <p class="reply-text" id="replyText" aria-live="polite">今天也在想你哦。</p>
            <p class="front-attr">—— 梦角</p>
          </div>
        </div>

      </div>
    </button>
  </section>

  <section class="draw-controls reveal r2" aria-label="抽卡操作">
    <div class="btn-row">
      <button type="button" class="btn-primary" id="drawCard" data-dom-id="draw-card">
        <span id="drawCardLabel">抽字卡</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
      <a href="chat.html" class="btn-secondary" data-dom-id="go-chat">
        去对话
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v8H9l-2 2z"/></svg>
      </a>
    </div>
    <p class="prob-note">
      <span>字卡回复基于概率算法</span>
      <span class="dot" aria-hidden="true"></span>
      <span>共 12 张</span>
    </p>
  </section>

  <section class="history reveal r3" aria-labelledby="history-title">
    <div class="history-inner">
      <div class="history-head">
        <h2 class="history-title" id="history-title">传讯记录</h2>
        <span class="history-count" id="historyCount">暂无记录</span>
      </div>
      <div class="history-panel">
        <ul id="historyList" role="list" style="list-style:none; margin:0; padding:0;">
          <!-- populated by JS -->
        </ul>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-divider" aria-hidden="true">
    <span class="line"></span>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>
    <span class="line"></span>
  </div>
  <p class="footer-brand">梦角传讯</p>
  <p class="footer-note">愿每一次翻卡，都是梦角想对你说的话。</p>
</footer>

<script>
  (function () {
    "use strict";

    var replies = [
      "今天也在想你哦。",
      "别担心，我一直都在。",
      "你今天辛苦了，休息一下吧。",
      "我感觉到了你的心意呢。",
      "今晚来梦里见吧。",
      "你比你自己想象的更勇敢。",
      "我在你身边，从未离开。",
      "今天的你，也很闪耀。",
      "想你了，就现在。",
      "相信自己，我会守护你的。",
      "你的笑容是我最大的动力。",
      "无论多远，我们的心是相连的。"
    ];

    var card3d = document.getElementById("card3d");
    var cardFloat = document.getElementById("cardFloat");
    var replyText = document.getElementById("replyText");
    var drawBtn = document.getElementById("drawCard");
    var drawLabel = document.getElementById("drawCardLabel");
    var glow = document.getElementById("cardGlow");
    var historyList = document.getElementById("historyList");
    var historyCount = document.getElementById("historyCount");

    var history = [];
    var drawCount = 0;
    var lastIdx = -1;
    var animating = false;
    var FLIP_MS = 720;

    function pickReply() {
      var idx;
      if (replies.length <= 1) { idx = 0; }
      else {
        do { idx = Math.floor(Math.random() * replies.length); }
        while (idx === lastIdx);
      }
      lastIdx = idx;
      return { text: replies[idx], index: idx };
    }

    function pad(n) { return n < 10 ? "0" + n : String(n); }
    function formatTime() {
      var d = new Date();
      return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
             pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c];
      });
    }

    function renderHistory() {
      if (history.length === 0) {
        historyCount.textContent = "暂无记录";
        historyList.innerHTML =
          '<li class="history-empty">' +
            '<svg class="empty-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L13.6 9.6 L21 11.4 L13.6 13.2 L12 21 L10.4 13.2 L3 11.4 L10.4 9.6 Z"/></svg>' +
            '<p class="empty-title">尚未抽卡</p>' +
            '<p class="empty-sub">点击上方"抽字卡"，接收梦角此刻的传讯</p>' +
          '</li>';
        return;
      }
      historyCount.textContent = "共 " + history.length + " 条";
      historyList.innerHTML = history.map(function (h) {
        return '<li class="history-row">' +
          '<span class="history-time">' + h.time + '</span>' +
          '<span class="history-reply">' + escapeHtml(h.text) + '</span>' +
          '<span class="history-index">字卡 #' + h.index + '</span>' +
        '</li>';
      }).join("");
    }

    function addHistory(reply) {
      drawCount += 1;
      history.unshift({ time: formatTime(), text: reply.text, index: drawCount });
      if (history.length > 6) history.pop();
      renderHistory();
    }

    function setFront(reply) {
      replyText.textContent = reply.text;
    }

    function afterReveal(reply) {
      addHistory(reply);
      drawLabel.textContent = "再抽一次";
      drawBtn.setAttribute("aria-label", "再抽一次，接收新的梦角回复");
      cardFloat.setAttribute("aria-label", "再抽一次，接收新的梦角回复");
      animating = false;
      drawBtn.disabled = false;
    }

    function drawCard() {
      if (animating) return;
      animating = true;
      drawBtn.disabled = true;

      var reply = pickReply();
      var isFlipped = card3d.classList.contains("is-flipped");

      if (!isFlipped) {
        setFront(reply);
        card3d.classList.add("is-flipped");
        glow.classList.add("is-active");
        window.setTimeout(afterReveal.bind(null, reply), FLIP_MS);
      } else {
        // flip back to back first, then reveal new reply
        card3d.classList.remove("is-flipped");
        glow.classList.remove("is-active");
        window.setTimeout(function () {
          setFront(reply);
          card3d.classList.add("is-flipped");
          glow.classList.add("is-active");
          window.setTimeout(afterReveal.bind(null, reply), FLIP_MS);
        }, FLIP_MS);
      }
    }

    drawBtn.addEventListener("click", drawCard);
    cardFloat.addEventListener("click", drawCard);
    cardFloat.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        drawCard();
      }
    });

    renderHistory();
  })();
</script>

</body>
</html>
