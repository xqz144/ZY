<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/extapp-unified.css">
<link rel="stylesheet" href="css/plan.css">
<style>
body { margin:0; }
.plan-app { max-width: 420px; }
</style>
</head>
<body>
<div class="plan-app">
  <div class="plan-scroll">
    <div class="plan-hero">
        <div class="plan-hero-tag">朝夕计划</div>
        <div class="plan-hero-title">科学四象限</div>
        <div class="plan-hero-sub">让每一件事都井井有条</div>
        <button class="plan-add-btn" id="listFab"><span>新建任务</span></button>
    </div>
    <div class="plan-subtabs">
        <button class="plan-subtab active"><span>清单</span></button>
        <button class="plan-subtab"><span>视图</span></button>
        <button class="plan-subtab"><span>专注</span></button>
        <button class="plan-subtab"><span>统计</span></button>
        <button class="plan-subtab"><span>我的</span></button>
    </div>
    <div class="plan-cal-wrap">
        <div class="plan-cal-head">
            <button class="plan-cal-btn">‹</button>
            <div class="plan-cal-title">
                <div class="plan-cal-year">2026年</div>
                <div class="plan-cal-month">8月</div>
            </div>
            <button class="plan-cal-btn">›</button>
        </div>
        <div class="plan-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="plan-cal-grid">
            <div class="plan-cal-cell"><div class="plan-cal-cell-num">1</div></div>
            <div class="plan-cal-cell"><div class="plan-cal-cell-num">2</div></div>
            <div class="plan-cal-cell today"><div class="plan-cal-cell-num">20</div></div>
        </div>
    </div>
    <div class="plan-quad-title">
        <span>四象限</span>
        <span class="plan-quad-sub">紧急 × 重要</span>
    </div>
    <div class="plan-quadrants">
        <div class="plan-quad plan-q1">
            <div class="plan-quad-head plan-q1-head"><span>🔥</span><span>重要且紧急</span></div>
            <div class="plan-quad-body">
                <div class="plan-qitem"><div class="plan-qcheck"></div><div class="plan-qcontent"><div class="plan-qtext">工作汇报</div><div class="plan-qmeta">工作 · 8/20</div></div></div>
            </div>
        </div>
        <div class="plan-quad plan-q2">
            <div class="plan-quad-head plan-q2-head"><span>🌟</span><span>重要不紧急</span></div>
            <div class="plan-quad-body"></div>
        </div>
        <div class="plan-quad plan-q3">
            <div class="plan-quad-head plan-q3-head"><span>⚡</span><span>紧急不重要</span></div>
            <div class="plan-quad-body"></div>
        </div>
        <div class="plan-quad plan-q4">
            <div class="plan-quad-head plan-q4-head"><span>☁️</span><span>不重要不紧急</span></div>
            <div class="plan-quad-body"></div>
        </div>
    </div>
  </div>
</div>
</body>
</html>
